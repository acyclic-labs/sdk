experimental = ["setup-scripts"]

# These tests require writable ProjFS mounts and a readable local USN journal.
# Missing native capabilities fail their ordinary Windows test entry points.
[test-groups.windows-native-volume]
max-threads = 1

[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'package(=acyclic-fs) & (test(native_mount::projfs::) | test(windows_usn::) | test(writable_projfs_captures_closes_renames_links_and_deletes) | test(projfs_profile::))'
test-group = 'windows-native-volume'

# The transport models execute the packaged TypeScript and WASM implementation.
# Prepare its ignored artifacts once, before any selected model starts.
[scripts.setup.stream-typescript]
command = ["bun", "run", "--filter", "@acyclic-labs/stream", "build"]

[[profile.default.scripts]]
filter = 'package(=acyclic-stream-typescript-models)'
setup = "stream-typescript"

# CI test profile: flags slow tests in the log and records per-test timings
# as JUnit for the job summary (scripts/ci-summary.mjs).
[profile.ci]
# Stalled tests and descendants retaining output must fail independently.
slow-timeout = { period = "30s", terminate-after = 10 }
leak-timeout = { period = "100ms", result = "fail" }

[profile.ci.junit]
path = "junit.xml"
