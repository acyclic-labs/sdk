experimental = ["setup-scripts", "wrapper-scripts"]

# These cases run through the full-cloud qualification entry, which owns a
# fresh service topology per case. Portable runs do not offer that capability.
[profile.default]
default-filter = "not test(::full_cloud::)"

[profile.full-cloud]
default-filter = "test(::full_cloud::)"
inherits = "ci"

[scripts.wrapper.full-cloud]
command = { command-line = "scripts/full-cloud-test.sh", relative-to = "workspace-root" }

[[profile.full-cloud.scripts]]
filter = "test(::full_cloud::)"
run-wrapper = "full-cloud"

# The transport models execute the packaged TypeScript and WASM implementation.
# Prepare its ignored artifacts once, before any selected model starts.
[scripts.setup.stream-typescript]
command = ["bun", "run", "--filter", "@acyclic-labs/stream", "build"]

[[profile.default.scripts]]
filter = 'package(=acyclic-stream-typescript-models)'
setup = "stream-typescript"

[test-groups.macos-nfs]
max-threads = 1

[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'package(=acyclic-fs) & (test(native_mount::darwin_mount::tests::) | test(native_mount::lazy::tests::live_mount::) | test(native_mount::customer::mounted_tests::) | test(=native_mount::adapter::tests::macos_explicit_file_fsync_reaches_mount_source) | test(=native_mount::adapter::tests::independent_mount_start_cases) | test(=native_mount::adapter::tests::exclusive_create_on_a_unix_mount_creates_once_with_real_timestamps) | test(=native_mount::adapter::tests::unix_mounts_in_distinct_processes_remain_independent))'
test-group = "macos-nfs"

# CI test profile: flags slow tests in the log and records per-test timings
# as JUnit for the job summary (scripts/ci-summary.mjs).
[profile.ci]
# Stalled tests and descendants retaining output must fail independently.
slow-timeout = { period = "30s", terminate-after = 10 }
leak-timeout = { period = "100ms", result = "fail" }

[profile.ci.junit]
path = "junit.xml"

# Real Rustdoc receipts share one source closure and memory budget.
[test-groups.rustdoc-corpus]
max-threads = 1

[[profile.default.overrides]]
filter = "test(::rustdoc_corpus::)"
test-group = "rustdoc-corpus"

# Live service cases require a fresh full topology and its endpoints file.
[test-groups.full-cloud]
max-threads = 1

[[profile.default.overrides]]
filter = "test(::full_cloud::)"
test-group = "full-cloud"

# Device counters and syscall traces require their native platform capability.
[test-groups.native-terminal]
max-threads = 1

[test-groups.syscall-trace]
max-threads = 1

[[profile.default.overrides]]
filter = "package(=acyclic-harness-tui) & test(real_terminal_)"
test-group = "native-terminal"

[[profile.default.overrides]]
filter = "package(=acyclic-observability) & test(disabled_operation_has_zero_syscalls_with_real_io_negative_control)"
test-group = "syscall-trace"
