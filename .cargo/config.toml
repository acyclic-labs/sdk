# Every hook starts a fresh process. Linking the C runtime statically spares
# each start loading vcruntime and the UCRT, about 0.4 ms on Windows, and frees
# the executables from the Visual C++ redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# The bundled rust-lld uses lld-link on MSVC for faster edit-build links.
# Cargo's target linker applies to dev, release and dist profiles.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# Use the parallel native linker for GNU Linux edit-build links. Other target
# triples keep their platform linker and flags.
[target.x86_64-unknown-linux-gnu]
linker = "scripts/mold-linker.sh"
