                          or any(part in ('','.','..') or part.rstrip(' .')!=part
                                 or any(ord(char)<32 or char in '\\:' for char in part) for part in parts)):
                      raise ValueError('invalid ZIP path')
                  name='/'.join(parts[1:]).casefold()
                  mode=stat.S_IFMT(entry.external_attr>>16)
                  if name in names or mode not in (0,stat.S_IFREG,stat.S_IFDIR): raise ValueError('invalid ZIP member')
                  names.add(name); bytes_total+=entry.file_size
                  if bytes_total>MAX_BYTES: raise ValueError('oversized extracted inventory')
              destination.mkdir()
              for entry in entries:
                  remaining()
                  target=destination.joinpath(*entry.filename.rstrip('/').split('/')[1:])
                  if entry.is_dir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with payload.open(entry) as source, target.open('xb') as output:
                          while block:=source.read(1024*1024):
                              remaining(); output.write(block)

      base={'revision':1,'source_tree':tree,'job_semantic_sha256':semantic,'toolchain_sha256':file_sha(Path(toolchain)),'lockfile_sha256':file_sha(Path(lockfile)),'runner_os':runner_os,'runner_architecture':runner_arch}
      receipt_path=root/'receipt.json'
      canonical=root.parent/(root.name+'.canonical')
      if mode=='prepare':
          remove_path(root)
          remove_path(canonical)
          root.mkdir(parents=True)
      elif mode=='stage':
          remove_path(canonical)
          output_root=root/'outputs'
          remove_path(output_root)
          outputs=[]
          for index,spec in enumerate(specs):
              payload=output_root/str(index)/'payload'
              replace_copy(spec['actual_path'],payload)
              outputs.append({'index':index,'name':spec['name'],'inventory':inventory(payload)})
          receipt={**base,'outputs':outputs}
          temporary=root/'receipt.json.tmp'
          temporary.write_text(json.dumps(receipt,separators=(',',':'),sort_keys=True)+'\n',encoding='utf-8')
          os.replace(temporary,receipt_path)
      elif mode in ('restore','fetch'):
          try:
              if mode=='fetch' and not fetch(): raise ValueError('no downloaded exact result')
              receipt=json.loads(receipt_path.read_bytes())
              if set(receipt)!=(set(base)|{'outputs'}) or any(receipt.get(name)!=value for name,value in base.items()): raise ValueError('exact reuse receipt identity is invalid')
              outputs=receipt['outputs']
              if not isinstance(outputs,list) or len(outputs)!=len(specs): raise ValueError('exact reuse output inventory is invalid')
              for index,(spec,record) in enumerate(zip(specs,outputs)):
                  if set(record)!={'index','name','inventory'} or record['index']!=index or record['name']!=spec['name']: raise ValueError('exact reuse output identity is invalid')
                  payload=root/'outputs'/str(index)/'payload'
                  restore_file_modes(payload,record['inventory'])
                  if inventory(payload)!=record['inventory']: raise ValueError('exact reuse output digest is invalid')
              remove_path(canonical)
              canonical.mkdir(parents=True)
              (canonical/'receipt.json').write_text(json.dumps(receipt,separators=(',',':'),sort_keys=True)+'\n',encoding='utf-8')
              for index in range(len(specs)):
                  replace_copy(root/'outputs'/str(index)/'payload',canonical/'outputs'/str(index)/'payload')
              remove_path(root)
              os.replace(canonical,root)
              for index,spec in enumerate(specs):
                  replace_copy(root/'outputs'/str(index)/'payload',spec['actual_path'])
              print('##vso[task.setvariable variable=FLEET_QUALIFICATION_RESTORED]true')
          except (Exception,SystemExit) as error:
              print(f'exact reuse unavailable ({type(error).__name__}); executing bounded job',file=sys.stderr)
              for spec in specs:
                  remove_path(spec['actual_path'])
              remove_path(root)
              remove_path(canonical)
              root.mkdir(parents=True)
              print('##vso[task.setvariable variable=FLEET_QUALIFICATION_RESTORED]false')
      else: raise SystemExit('invalid exact reuse mode')
      PY
      mode=stage
      python3 "$helper" 100000 2147483648 "$mode" '$(Pipeline.Workspace)/.qualified/policy' "${FLEET_SOURCE_TREE:?}" 'd380995d2ddc56301f780b74504654524ad7645b59595f769b458c721e0d3071' 'rust-toolchain.toml' 'Cargo.lock' '$(Agent.OS)' '$(Agent.OSArchitecture)'
