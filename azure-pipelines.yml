              outputs=receipt['outputs']
              if not isinstance(outputs,list) or len(outputs)!=len(specs): raise ValueError('exact reuse output inventory is invalid')
              for index,(spec,record) in enumerate(zip(specs,outputs)):
                  if set(record)!={'index','name','inventory'} or record['index']!=index or record['name']!=spec['name']: raise ValueError('exact reuse output identity is invalid')
                  payload=root/'outputs'/str(index)/'payload'
                  restore_file_modes(payload,record['inventory'])
                  if inventory(payload)!=record['inventory']: raise ValueError('exact reuse output digest is invalid')
