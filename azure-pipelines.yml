      specs=[{'name':raw[i],'declared_path':raw[i+1],'actual_path':raw[i+2]} for i in range(0,len(raw),3)]
      root=Path(root)

      def file_sha(path):
          digest=hashlib.sha256()
          with path.open('rb') as stream:
              for block in iter(lambda: stream.read(1024*1024),b''): digest.update(block)
          return digest.hexdigest()

      def inventory(path):
          path=Path(path)
          if not path.exists(): raise SystemExit('reusable output is missing')
          entries=[]; total=0
          def visit(item,relative):
              nonlocal total
              metadata=item.lstat()
              if stat.S_ISLNK(metadata.st_mode): raise SystemExit('reusable output contains a symlink')
              if stat.S_ISDIR(metadata.st_mode):
                  entries.append({'path':relative,'kind':'directory'})
                  for child in sorted(item.iterdir(),key=lambda value:value.name):
                      visit(child,child.name if relative=='.' else relative+'/'+child.name)
              elif stat.S_ISREG(metadata.st_mode):
                  total+=metadata.st_size
                  entries.append({'path':relative,'kind':'file','mode':stat.S_IMODE(metadata.st_mode),'bytes':metadata.st_size,'sha256':file_sha(item)})
              else: raise SystemExit('reusable output contains a special file')
              if len(entries)>MAX_ENTRIES or total>MAX_BYTES: raise SystemExit('reusable output exceeds its bound')
