      import json,os,sys,urllib.parse,urllib.request
      collection,project,definition,current,tree,artifact=sys.argv[1:]
      print('##vso[task.setvariable variable=FLEET_REUSE_FOUND]false')
      token=os.environ.get('SYSTEM_ACCESSTOKEN','')
      if not token or len(token)>8192: raise SystemExit(0)
      headers={'Authorization':f'Bearer {token}'}
      query=urllib.parse.urlencode({'api-version':'7.1','definitions':int(definition),'statusFilter':'completed','resultFilter':'succeeded','tagFilters':f'qualified-tree-{tree}','queryOrder':'finishTimeDescending','$top':16})
      try:
          request=urllib.request.Request(f'{collection}{project}/_apis/build/builds?{query}',headers=headers)
          with urllib.request.urlopen(request,timeout=15) as response: encoded=response.read(262145)
          if len(encoded)>262144: raise ValueError('build result exceeds its bound')
          builds=json.loads(encoded).get('value',[])
          if not isinstance(builds,list) or len(builds)>16: raise ValueError('build result is invalid')
          for build in builds:
              run=build.get('id')
              if not isinstance(run,int) or run==int(current) or build.get('definition',{}).get('id')!=int(definition): continue
              artifact_query=urllib.parse.urlencode({'api-version':'7.1'})
              artifact_request=urllib.request.Request(f'{collection}{project}/_apis/build/builds/{run}/artifacts?{artifact_query}',headers=headers)
              try:
                  with urllib.request.urlopen(artifact_request,timeout=15) as response: artifact_encoded=response.read(262145)
                  if len(artifact_encoded)>262144: continue
                  records=json.loads(artifact_encoded).get('value',[])
                  if not isinstance(records,list) or len(records)>64: continue
                  matches=[record for record in records if record.get('name')==artifact and record.get('resource',{}).get('type')=='PipelineArtifact']
                  if len(matches)!=1: continue
