      def fetch():
          # Optional cache transport only. Release/qualification downloads remain required tasks.
          token=os.environ.get('SYSTEM_ACCESSTOKEN','')
          if not token or len(token)>8192: return False
          collection=os.environ['SYSTEM_COLLECTIONURI']
          project=os.environ['SYSTEM_TEAMPROJECTID']
          definition=int(os.environ['SYSTEM_DEFINITIONID']); current=int(os.environ['BUILD_BUILDID'])
          artifact=os.environ['FLEET_REUSE_ARTIFACT']
          endpoint=urllib.parse.urlsplit(collection)
