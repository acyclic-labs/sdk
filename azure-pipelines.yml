      '@
      $helperPath = Join-Path '$(Agent.TempDirectory)' 'fleet-exact-reuse.py'
      [System.IO.File]::WriteAllText($helperPath, $helper, [System.Text.UTF8Encoding]::new($false))
      $mode = 'stage'
      & python $helperPath 100000 2147483648 $mode '$(Pipeline.Workspace)/.qualified/windows' $env:FLEET_SOURCE_TREE '0902ded05584457b856b9cf830ac6beb785f0622f44e8274140dde8dab4f434f' 'rust-toolchain.toml' 'Cargo.lock' '$(Agent.OS)' '$(Agent.OSArchitecture)' 'packages-windows' '$(Build.ArtifactStagingDirectory)/packages' '$(Build.ArtifactStagingDirectory)/packages'
