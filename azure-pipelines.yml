    displayName: Retain exact successful job receipt and outputs
    condition: and(succeeded(), ne(variables['FLEET_QUALIFICATION_RESTORED'], 'true'))
  - task: PublishPipelineArtifact@1
    displayName: Publish exact reusable job result
    condition: succeeded()
    inputs:
