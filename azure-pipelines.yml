  - bash: |
      set -euo pipefail
      helper='$(Agent.TempDirectory)/fleet-exact-reuse.py'
      cat >"$helper" <<'PY'
      import hashlib,json,os,shutil,stat,struct,sys,tempfile,time,urllib.parse,urllib.request,zipfile
      from pathlib import Path

      MAX_ENTRIES=int(sys.argv[1]); MAX_BYTES=int(sys.argv[2])
      mode,root,tree,semantic,toolchain,lockfile,runner_os,runner_arch=sys.argv[3:11]
      raw=sys.argv[11:]
      if len(raw)%3: raise SystemExit('invalid output specification')
      specs=[{'name':raw[i],'declared_path':raw[i+1],'actual_path':raw[i+2]} for i in range(0,len(raw),3)]
      root=Path(root)

      def file_sha(path):
          digest=hashlib.sha256()
          with path.open('rb') as stream:
              for block in iter(lambda: stream.read(1024*1024),b''): digest.update(block)
          return digest.hexdigest()

      def inventory(path):
          path=Path(path)
          if not path.exists(): raise SystemExit('reusable output is missing')
          entries=[]; total=0
          def visit(item,relative):
              nonlocal total
              metadata=item.lstat()
              if stat.S_ISLNK(metadata.st_mode): raise SystemExit('reusable output contains a symlink')
              if stat.S_ISDIR(metadata.st_mode):
                  entries.append({'path':relative,'kind':'directory'})
                  for child in sorted(item.iterdir(),key=lambda value:value.name):
                      visit(child,child.name if relative=='.' else relative+'/'+child.name)
              elif stat.S_ISREG(metadata.st_mode):
                  total+=metadata.st_size
                  entries.append({'path':relative,'kind':'file','mode':stat.S_IMODE(metadata.st_mode),'bytes':metadata.st_size,'sha256':file_sha(item)})
              else: raise SystemExit('reusable output contains a special file')
              if len(entries)>MAX_ENTRIES or total>MAX_BYTES: raise SystemExit('reusable output exceeds its bound')
          visit(path,'.')
          return {'entries':entries,'entry_count':len(entries),'total_bytes':total}

      def remove_path(path):
          path=Path(path)
          if path.is_symlink():
              path.unlink()
          elif path.is_file():
              os.chmod(path,stat.S_IWRITE)
              path.unlink()
          elif path.is_dir():
              def retry(action,name,_):
                  os.chmod(name,stat.S_IRWXU)
                  action(name)
              shutil.rmtree(path,onerror=retry)

      def replace_copy(source,destination):
          source=Path(source); destination=Path(destination)
          remove_path(destination)
          destination.parent.mkdir(parents=True,exist_ok=True)
          if source.is_dir(): shutil.copytree(source,destination,copy_function=shutil.copy2)
          elif source.is_file(): shutil.copy2(source,destination)
          else: raise SystemExit('reusable output is not a regular file or directory')

      def restore_file_modes(path,expected):
          actual=inventory(path)
          def content_only(value):
              return {**value,'entries':[{name:field for name,field in entry.items() if name!='mode'} for entry in value['entries']]}
          if content_only(actual)!=content_only(expected): raise ValueError('exact reuse output digest is invalid')
          for entry in expected['entries']:
              if entry.get('kind')!='file': continue
              relative=entry.get('path'); file_mode=entry.get('mode')
              if relative=='.':
                  target=Path(path)
              else:
                  parts=relative.split('/') if isinstance(relative,str) else []
                  if not parts or any(part in ('','.','..') for part in parts): raise ValueError('exact reuse output path is invalid')
                  target=Path(path).joinpath(*parts)
              if not isinstance(file_mode,int) or file_mode<0 or file_mode>0o777: raise ValueError('exact reuse output mode is invalid')
              if not stat.S_ISREG(target.lstat().st_mode): raise ValueError('exact reuse output kind is invalid')
              target.chmod(file_mode)

      def fetch():
          # Optional cache transport only. Release/qualification downloads remain required tasks.
          token=os.environ.get('SYSTEM_ACCESSTOKEN','')
          if not token or len(token)>8192: return False
          collection=os.environ['SYSTEM_COLLECTIONURI']
          project=os.environ['SYSTEM_TEAMPROJECTID']
          definition=int(os.environ['SYSTEM_DEFINITIONID']); current=int(os.environ['BUILD_BUILDID'])
          artifact=os.environ['FLEET_REUSE_ARTIFACT']
          endpoint=urllib.parse.urlsplit(collection)
          if (endpoint.scheme!='https' or endpoint.hostname!='dev.azure.com' or endpoint.username
                  or endpoint.password or endpoint.query or endpoint.fragment or not collection.endswith('/')):
              raise ValueError('invalid collection')
          deadline=time.monotonic()+45
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def remaining():
              budget=deadline-time.monotonic()
              if budget<=0: raise TimeoutError('reuse deadline')
              return min(15,budget)
          def metadata(path,query):
              url=collection+urllib.parse.quote(project,safe='')+'/_apis/'+path+'?'+urllib.parse.urlencode(query)
              request=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with opener.open(request,timeout=remaining()) as response: data=response.read(262145)
              if len(data)>262144: raise ValueError('oversized metadata')
              return json.loads(data)
          builds=metadata('build/builds',{'api-version':'7.1','definitions':definition,'statusFilter':'completed','resultFilter':'succeeded','tagFilters':f'qualified-tree-{tree}','queryOrder':'finishTimeDescending','$top':16}).get('value',[])
          if not isinstance(builds,list) or len(builds)>16: raise ValueError('invalid build inventory')
          for build in builds:
              run=build.get('id')
              if (type(run) is not int or run==current or build.get('definition',{}).get('id')!=definition
                      or build.get('status')!='completed' or build.get('result')!='succeeded'): continue
              try:
                  record=metadata(f'pipelines/{definition}/runs/{run}/artifacts',{'api-version':'7.1','artifactName':artifact,'$expand':'signedContent'})
                  if record.get('name')!=artifact: continue
                  url=record['signedContent']['url']; parsed=urllib.parse.urlsplit(url)
                  if (parsed.scheme!='https' or parsed.username or parsed.password or parsed.port not in (None,443)
                          or not parsed.hostname or not parsed.hostname.endswith('.artifacts.visualstudio.com')):
                      raise ValueError('invalid signed download destination')
                  root.parent.mkdir(parents=True,exist_ok=True)
                  with tempfile.TemporaryDirectory(prefix='reuse-',dir=root.parent) as temporary:
                      archive=Path(temporary)/'download.zip'
                      # Never send the job bearer token to the signed-content host or follow redirects.
                      with opener.open(url,timeout=remaining()) as response, archive.open('xb') as target:
                          size=0
                          while True:
                              remaining()
                              block=response.read(min(1024*1024,MAX_BYTES-size+1))
                              if not block: break
                              size+=len(block)
                              if size>MAX_BYTES: raise ValueError('oversized download')
                              target.write(block)
                      unpack(archive,Path(temporary)/'content',artifact,remaining)
                      remove_path(root)
                      os.replace(Path(temporary)/'content',root)
                  return True
              except Exception:
                  # No response URLs, bearer tokens or signed download queries enter logs.
                  remaining()
          return False

      def unpack(archive,destination,artifact,remaining):
          # Bound the central directory before ZipFile allocates its entry inventory. ZIP64
          # caches fall back to ordinary execution; no supported payload requires >2 GiB.
          size=archive.stat().st_size
          with archive.open('rb') as source:
              source.seek(max(0,size-65557)); tail=source.read(65557)
          position=tail.rfind(b'PK\x05\x06')
          if position<0 or len(tail)-position<22: raise ValueError('missing ZIP directory')
          _,disk,central_disk,count,total,central_size,offset,comment=struct.unpack('<4s4H2LH',tail[position:position+22])
          if (disk or central_disk or count!=total or not 0<total<=min(MAX_ENTRIES,65534)
                  or central_size>16*1024*1024 or offset+central_size>size-len(tail)+position
                  or position+22+comment!=len(tail) or tail[max(0,position-20):position].startswith(b'PK\x06\x07')):
              raise ValueError('oversized or unsupported ZIP directory')
          with zipfile.ZipFile(archive) as payload:
              entries=payload.infolist()
              if len(entries)!=total: raise ValueError('ZIP entry count mismatch')
              names=set(); bytes_total=0
              for entry in entries:
                  remaining()
                  parts=entry.filename.rstrip('/').split('/')
                  if (len(parts)>64 or parts[0]!=artifact or (len(parts)==1 and not entry.is_dir())
                          or any(part in ('','.','..') or part.rstrip(' .')!=part
                                 or any(ord(char)<32 or char in '\\:' for char in part) for part in parts)):
                      raise ValueError('invalid ZIP path')
                  name='/'.join(parts[1:]).casefold()
                  mode=stat.S_IFMT(entry.external_attr>>16)
                  if name in names or mode not in (0,stat.S_IFREG,stat.S_IFDIR): raise ValueError('invalid ZIP member')
                  names.add(name); bytes_total+=entry.file_size
                  if bytes_total>MAX_BYTES: raise ValueError('oversized extracted inventory')
              destination.mkdir()
              for entry in entries:
                  remaining()
                  target=destination.joinpath(*entry.filename.rstrip('/').split('/')[1:])
                  if entry.is_dir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with payload.open(entry) as source, target.open('xb') as output:
                          while block:=source.read(1024*1024):
                              remaining(); output.write(block)

      base={'revision':1,'source_tree':tree,'job_semantic_sha256':semantic,'toolchain_sha256':file_sha(Path(toolchain)),'lockfile_sha256':file_sha(Path(lockfile)),'runner_os':runner_os,'runner_architecture':runner_arch}
      receipt_path=root/'receipt.json'
      canonical=root.parent/(root.name+'.canonical')
      if mode=='prepare':
          remove_path(root)
          remove_path(canonical)
          root.mkdir(parents=True)
      elif mode=='stage':
          remove_path(canonical)
          output_root=root/'outputs'
          remove_path(output_root)
          outputs=[]
          for index,spec in enumerate(specs):
              payload=output_root/str(index)/'payload'
              replace_copy(spec['actual_path'],payload)
              outputs.append({'index':index,'name':spec['name'],'inventory':inventory(payload)})
          receipt={**base,'outputs':outputs}
          temporary=root/'receipt.json.tmp'
          temporary.write_text(json.dumps(receipt,separators=(',',':'),sort_keys=True)+'\n',encoding='utf-8')
          os.replace(temporary,receipt_path)
      elif mode in ('restore','fetch'):
          try:
              if mode=='fetch' and not fetch(): raise ValueError('no downloaded exact result')
              receipt=json.loads(receipt_path.read_bytes())
              if set(receipt)!=(set(base)|{'outputs'}) or any(receipt.get(name)!=value for name,value in base.items()): raise ValueError('exact reuse receipt identity is invalid')
              outputs=receipt['outputs']
              if not isinstance(outputs,list) or len(outputs)!=len(specs): raise ValueError('exact reuse output inventory is invalid')
              for index,(spec,record) in enumerate(zip(specs,outputs)):
                  if set(record)!={'index','name','inventory'} or record['index']!=index or record['name']!=spec['name']: raise ValueError('exact reuse output identity is invalid')
                  payload=root/'outputs'/str(index)/'payload'
                  restore_file_modes(payload,record['inventory'])
                  if inventory(payload)!=record['inventory']: raise ValueError('exact reuse output digest is invalid')
              remove_path(canonical)
              canonical.mkdir(parents=True)
              (canonical/'receipt.json').write_text(json.dumps(receipt,separators=(',',':'),sort_keys=True)+'\n',encoding='utf-8')
              for index in range(len(specs)):
                  replace_copy(root/'outputs'/str(index)/'payload',canonical/'outputs'/str(index)/'payload')
              remove_path(root)
              os.replace(canonical,root)
              for index,spec in enumerate(specs):
                  replace_copy(root/'outputs'/str(index)/'payload',spec['actual_path'])
              print('##vso[task.setvariable variable=FLEET_QUALIFICATION_RESTORED]true')
          except (Exception,SystemExit) as error:
              print(f'exact reuse unavailable ({type(error).__name__}); executing bounded job',file=sys.stderr)
              for spec in specs:
                  remove_path(spec['actual_path'])
              remove_path(root)
              remove_path(canonical)
              root.mkdir(parents=True)
              print('##vso[task.setvariable variable=FLEET_QUALIFICATION_RESTORED]false')
      else: raise SystemExit('invalid exact reuse mode')
      PY
      mode=stage
      python3 "$helper" 100000 2147483648 "$mode" '$(Pipeline.Workspace)/.qualified/linux-arm64' "${FLEET_SOURCE_TREE:?}" '4cd2b6e13b93afa3cf7930a532f7524922527752415ab70b90f30bd1878a06de' 'rust-toolchain.toml' 'Cargo.lock' '$(Agent.OS)' '$(Agent.OSArchitecture)' 'packages-linux-arm64' '$(Build.ArtifactStagingDirectory)/packages' '$(Build.ArtifactStagingDirectory)/packages'
      rm -f -- "$helper"
    displayName: Retain exact successful job receipt and outputs
    condition: and(succeeded(), ne(variables['FLEET_QUALIFICATION_RESTORED'], 'true'))
  - task: PublishPipelineArtifact@1
    displayName: Publish exact reusable job result
    condition: succeeded()
    inputs:
      targetPath: '$(Pipeline.Workspace)/.qualified/linux-arm64'
      artifact: 'qualified-job_linux_2darm64'
      publishLocation: pipeline

- job: job_windows
  displayName: windows
  pool:
    name: graphcoder-ci-windows
  timeoutInMinutes: 15
  cancelTimeoutInMinutes: 1
  condition: not(canceled())
  variables:
    TMPDIR: $(Agent.TempDirectory)
    TMP: $(Agent.TempDirectory)
    TEMP: $(Agent.TempDirectory)
    CARGO_HOME: $(Pipeline.Workspace)/.cargo
    RUSTUP_HOME: $(Pipeline.Workspace)/.rust-runtime/rustup
    RUSTUP_BIN: $(Pipeline.Workspace)/.rust-runtime/cargo/bin
    CARGO_BUILD_JOBS: '2'
    CMAKE_BUILD_PARALLEL_LEVEL: '2'
    RUST_TEST_THREADS: '2'
    RAYON_NUM_THREADS: '2'
    MAKEFLAGS: '-j2'
    npm_config_jobs: '2'
    CARGO_TARGET_DIR: $(Agent.TempDirectory)/target/windows
    BUN_INSTALL_CACHE_DIR: $(Pipeline.Workspace)/.bun/install/cache
    NPM_CONFIG_CACHE: $(Pipeline.Workspace)/.npm
    QUALIFICATION_TOOLS_ROOT: $(Pipeline.Workspace)/qualification-tools
    FORMAL_TOOLS_ROOT: $(Pipeline.Workspace)/formal-tools
    FORMAL_RESULTS_ROOT: $(Pipeline.Workspace)/formal-results
