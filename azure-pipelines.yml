    GRYPE_DB_CACHE_DIR: $(Pipeline.Workspace)/.grype
    SCCACHE_ARCHIVE_DIR: $(Pipeline.Workspace)/.sccache-archive
    SCCACHE_DIR: $(Pipeline.Workspace)/.sccache
    SCCACHE_CACHE_SIZE: '1G'
    SCCACHE_IDLE_TIMEOUT: '900'
    SCCACHE_EXE: $(Agent.TempDirectory)/fleet-sccache/sccache.exe
    RUSTC_WRAPPER: $(SCCACHE_EXE)
    CARGO_INCREMENTAL: '0'
    CARGO_PROFILE_DEV_DEBUG: '0'
    CARGO_PROFILE_TEST_DEBUG: '0'
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: false
