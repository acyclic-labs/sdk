    PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip
    DOCKER_CACHE_DIR: $(Pipeline.Workspace)/.docker/macos
    GRYPE_DB_CACHE_DIR: $(Pipeline.Workspace)/.grype
