<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>acyclic fs multi-tab qualification</title>
    <script type="importmap">
      {"imports":{
        "@bufbuild/protobuf":"/node_modules/@bufbuild/protobuf/dist/esm/index.js",
        "@bufbuild/protobuf/codegenv2":"/node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js",
        "@bufbuild/protobuf/wkt":"/node_modules/@bufbuild/protobuf/dist/esm/wkt/index.js"
      }}
    </script>
  </head>
  <body>
    <pre id="result">running</pre>
    <script type="module">
      const query = new URLSearchParams(location.search);
      const actor = query.get("actor");
      const channel = actor === null ? undefined : new BroadcastChannel(`acyclic-fs-multitab-${query.get("run")}`);
      globalThis.__reportActorFailure = error => {
        const text = String(error.stack ?? error);
        const result = document.querySelector("#result");
        result.dataset.status = "failed";
        result.textContent = text;
        channel?.postMessage({ actor, event: "failed", error: text });
      };
      addEventListener("pagehide", () => {
        if (!globalThis.__actorRetiring) globalThis.__reportActorFailure(new Error("actor document retired before completing its work"));
        channel?.close();
      });
      addEventListener("error", event => globalThis.__reportActorFailure(event.error ?? event.message));
      addEventListener("unhandledrejection", event => globalThis.__reportActorFailure(event.reason));
      import("./browser-multitab.js").catch(globalThis.__reportActorFailure);
    </script>
  </body>
</html>
