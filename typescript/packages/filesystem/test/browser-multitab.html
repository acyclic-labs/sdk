<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>acyclic fs multi-tab qualification</title>
    <script type="importmap">{"imports":{"@bufbuild/protobuf":"/node_modules/@bufbuild/protobuf/dist/esm/index.js","@bufbuild/protobuf/codegenv2":"/node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js"}}</script>
  </head>
  <body>
    <pre id="result">running</pre>
    <script type="module">
      const query = new URLSearchParams(location.search);
      const runId = query.get("run");
      const actor = query.get("actor");
      const startupChannel = runId !== null && actor !== null
        ? new BroadcastChannel(`acyclic-fs-multitab-${runId}`)
        : null;
      import("./browser-multitab.js").then(() => startupChannel?.close()).catch((error) => {
        const result = document.querySelector("#result");
        result.dataset.status = "failed";
        result.textContent = String(error.stack ?? error);
        startupChannel?.postMessage({
          actor,
          event: "failed",
          error: String(error.stack ?? error),
        });
        startupChannel?.close();
      });
    </script>
  </body>
</html>
