[package]
license.workspace = true
autotests = false
name = "acyclic-stream-typescript-models"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata.bazel.test-tools.main]
bun = "@bunjs//:bun_tool"

[lints]
workspace = true

[dependencies]
loom = "0.7.3"
serde_json = "1.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[dev-dependencies]
acyclic-test-support = { path = "../../../../rust/crates/test-support" }

[[test]]
name = "main"
path = "tests/main.rs"
