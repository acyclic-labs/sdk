<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Stream browser contract smoke</title>
<script type="importmap">
{
  "imports": {
    "@bufbuild/protobuf": "/node_modules/@bufbuild/protobuf/dist/esm/index.js",
    "@bufbuild/protobuf/codegenv2": "/node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js",
    "@bufbuild/protobuf/wkt": "/node_modules/@bufbuild/protobuf/dist/esm/wkt/index.js"
  }
}
</script>
<body data-result="pending">
<script type="module">
import { StreamClient } from "../dist/index.js";
import { validateWireRequest } from "../dist/contract.js";

try {
  const client = StreamClient.memory();
  const stream = client.bytes("browser/events");
  const appended = await stream.append(new Uint8Array([1]));
  if (!appended.ok || appended.tail !== 1n) throw new Error("browser append failed");
  if (await stream.tail() !== 1n) throw new Error("browser tail validation failed");
  await client.provider.fork("browser/same", "browser/same").then(
    () => { throw new Error("same-path browser fork accepted"); },
    error => { if (error.code !== "invalid_argument") throw error; },
  );
  const committed = await client.commit({
    conditions: [{ path: "browser/next", ifAbsent: true }],
    mutations: [{ append: { stream: client.bytes("browser/next"), values: [new Uint8Array([2])] } }],
  }, { idempotencyKey: new Uint8Array([3]) });
  if (!committed.ok || committed.tails["browser/next"] !== 1n) throw new Error("browser commit failed");
  await validateWireRequest({ kind: "fork", source: "browser/events", destination: "browser/copy", options: { atTail: 0n, idempotencyKey: new Uint8Array([4]) } });
  await validateWireRequest({ kind: "trim", path: "browser/events", before: 0n, key: new Uint8Array([5]) });
  await validateWireRequest({ kind: "delete", path: "browser/events", key: new Uint8Array([6]) });
  await validateWireRequest({ kind: "read", path: "browser/events", from: 0n, limit: 1 });
  await validateWireRequest({ kind: "follow", path: "browser/events", from: 0n });
  await validateWireRequest({ kind: "children", parent: "browser", limit: 1 });
  await stream.appendBatch(Array(17).fill(new Uint8Array(65_536))).then(
    () => { throw new Error("oversized browser append accepted"); },
    error => { if (error.code !== "limit_exceeded") throw error; },
  );
  document.body.dataset.result = "passed";
} catch (error) {
  document.body.dataset.result = `failed: ${error.message}`;
}
</script>
</body>
</html>
