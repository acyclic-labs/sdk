<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ordinary Harness task runtime on IndexedDB</title>
<body>
<pre id="result" data-status="pending">initializing</pre>
<script type="module">
import { qualifyBrowserTask, taskFixture } from "./browser-task-fixture.mjs";
import { WasmTaskRuntime } from "../generated/wasm/acyclic_harness_wasm.js";
await qualifyBrowserTask(async phase => {
  const describe = value => JSON.stringify(value, (_, item) => typeof item === "bigint" ? `${item}n` : item);
  const { exerciseBrowserRecursiveSource } = await import("./browser-recursive-source.mjs");
  await exerciseBrowserRecursiveSource();
  const id = crypto.randomUUID();
  const fixture = await taskFixture(id, "test.browser", (registry, register, registration) => {
    const inert = () => { throw new Error("registration invoked a callback"); };
    const rejectRegistration = definition => {
      let rejected = false;
      try { registry.registerMachine(definition, inert, inert); } catch { rejected = true; }
      if (!rejected) throw new Error("invalid or duplicate registration accepted");
    };
    rejectRegistration({ ...registration, state_schema: { type: "invalid" } });
    register();
    rejectRegistration({ ...registration, digest: new Array(32).fill(42) });
    rejectRegistration({ ...registration, digest: new Array(32).fill(43), state_schema: { type: "invalid" } });
  }, ["timer:wait"]);
  const { owner, registry, options, scope } = fixture;
  phase("reject obsolete filesystem storage without losing its original exception");
  const obsoleteName = `harness-task-obsolete-fs-${id}`;
  const sentinel = Uint8Array.of(0, 4, 18, 255, 91);
  const requestResult = request => new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  let ownsObsolete = false;
  let obsolete;
  try {
    const create = indexedDB.open(obsoleteName, 4);
    create.onupgradeneeded = event => {
      if (event.oldVersion !== 0) {
        create.transaction.abort();
        return;
      }
      create.result.createObjectStore("sentinel");
      ownsObsolete = true;
    };
    obsolete = await requestResult(create);
    if (!ownsObsolete) throw new Error("obsolete-storage fixture did not create its own database");
    const write = obsolete.transaction("sentinel", "readwrite");
    write.objectStore("sentinel").put(sentinel, "marker");
    await new Promise((resolve, reject) => {
      write.oncomplete = resolve;
      write.onabort = () => reject(write.error);
    });
    obsolete.close();
    obsolete = undefined;
    let rejection;
    try {
      const unexpected = await WasmTaskRuntime.open(
        { ...options, filesystem_database: obsoleteName }, owner, registry, scope,
      );
      unexpected.free();
    } catch (error) { rejection = error; }
    if (!(rejection instanceof DOMException) || rejection.name !== "VersionError") {
      throw new Error(`runtime storage rejection lost original VersionError: ${String(rejection)}`);
    }
    const reopen = indexedDB.open(obsoleteName, 4);
    reopen.onupgradeneeded = () => reopen.transaction.abort();
    obsolete = await requestResult(reopen);
    if (obsolete.version !== 4 || obsolete.objectStoreNames.length !== 1
      || !obsolete.objectStoreNames.contains("sentinel")) {
      throw new Error("runtime storage rejection mutated the obsolete database");
    }
    const retained = await requestResult(
      obsolete.transaction("sentinel").objectStore("sentinel").get("marker"),
    );
    if (!(retained instanceof Uint8Array) || retained.length !== sentinel.length
      || !retained.every((byte, index) => byte === sentinel[index])) {
      throw new Error("runtime storage rejection mutated committed sentinel bytes");
    }
  } finally {
    obsolete?.close();
    if (ownsObsolete) await requestResult(indexedDB.deleteDatabase(obsoleteName));
  }
  phase("open ordinary task runtime and real providers");
  let runtime = await WasmTaskRuntime.open(options, owner, registry, scope);
  phase("create authorized journal volume");
  await runtime.initializeVolume();
  const timerOperation = crypto.randomUUID();
  const deadline = Date.now() + 30000;
  phase("stage immutable timer command");
  const file = await runtime.stage(timerOperation, "timer", new TextEncoder().encode(JSON.stringify({ deadline_unix_ms: deadline })));
  const unrelated = "00000000-0000-0000-0000-000000000001";
  const exact = "ffffffff-ffff-ffff-ffff-ffffffffffff";
  for (const [operation, input] of [[unrelated, { file, operation: timerOperation }], [exact, { complete: true }]]) {
    const admitted = await runtime.admit(operation, "test.browser", "1", input);
    if (admitted.kind !== "accepted") throw new Error(`exact-task admission: ${describe(admitted)}`);
  }
  const worker = { id: "browser-actor-a", available: {}, labels: {} };
  const selected = await runtime.runOperation(worker, exact, 2);
  if (selected?.kind !== "completed" || (await runtime.outcome(exact))?.Succeeded !== 7n) {
    throw new Error(`exact-task execution: ${describe(selected)}`);
  }
  if (await runtime.outcome(unrelated) !== null || (await runtime.recoverWork(unrelated)).kind !== "idle") {
    throw new Error("exact-task execution claimed unrelated work");
  }
  if (await runtime.runOperation(worker, exact, 2) !== null) throw new Error("terminal target was redispatched");
  await runtime.cancel(unrelated);
  const operation = crypto.randomUUID();
  phase("admit registered task");
  const admission = await runtime.admit(operation, "test.browser", "1", { file, operation: timerOperation });
  if (admission.kind !== "accepted") throw new Error(`admission: ${describe(admission)}`);
  phase("initial worker tick and durable suspension");
  const first = await runtime.workerTick(worker, null, 1, 2);
  if (first.work?.kind !== "suspended") throw new Error(`initial tick: ${describe(first)}`);
  runtime.free();
  phase("reopen providers under replacement worker");
  runtime = await WasmTaskRuntime.open(options, owner, registry, scope);
  if (await runtime.outcome(admission.task_id) != null) throw new Error("timer completed before durable wake");
  phase("wait for the explicitly retained timer deadline");
  await new Promise(resolve => setTimeout(resolve, Math.max(0, deadline - Date.now()) + 20));
  let cursor = null;
  let completed = false;
  for (let page = 0; page < 100 && !completed; page++) {
    phase(`replacement worker wake page ${page}`);
    const tick = await runtime.workerTick({ ...worker, id: "browser-actor-b" }, cursor, 1, 2);
    cursor = tick.wake.cursor;
    completed = tick.work?.kind === "completed";
    if (tick.work?.kind === "unresolved") throw new Error(describe(tick.work));
    if (!cursor && !completed) throw new Error("durable timer was not woken");
  }
  if (!completed) throw new Error("replacement worker did not complete");
  const outcome = await runtime.outcome(admission.task_id);
  if (outcome?.Succeeded !== 7n) throw new Error("completed outcome differs");
  runtime.free(); fixture.free();
});
</script>
</body>
</html>
