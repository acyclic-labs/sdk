<!doctype html>
<meta charset="utf-8">
<title>Durable browser model reconciliation</title>
<pre id="result" data-status="pending">initializing</pre>
<script type="module">
import { taskFixture } from "./browser-task-fixture.mjs";
const result = document.querySelector("#result");
const describe = value => JSON.stringify(value, (_, item) => typeof item === "bigint" ? `${item}n` : item);
const assert = (condition, message) => { if (!condition) throw new Error(message); };
let fixture;
let runtime;
try {
  fixture = await taskFixture(crypto.randomUUID(), "acyclic.stock_turn");
  fixture.registry.registerStockTurn();
  let duplicateRegistrationRejected = false;
  try { fixture.registry.registerStockTurn(); } catch { duplicateRegistrationRejected = true; }
  assert(duplicateRegistrationRejected, "duplicate stock task registration was accepted");
  let requests = 0;
  let reconciliations = 0;
  let returns = 0;
  let signal;
  let dispatch;
  const model = { provider: "browser-test", name: "pinned", revision: "1", options: {} };
  const prefix = { kind: "content", delta: "committed" };
  const bind = runtime => runtime.configureModel(model, (bytes, metadata, abortSignal) => {
    requests++;
    assert(requests === 1, "uncertain model request was redispatched");
    const request = JSON.parse(new TextDecoder().decode(bytes));
    assert(request.model.revision === "1" && request.model.name === "pinned", "request substituted the selected model");
    assert(!("operation_id" in request) && !("request_digest" in request), "dispatch metadata changed canonical request bytes");
    assert(typeof metadata.operation_id === "string" && Number.isInteger(metadata.step) && metadata.request_digest.length === 32, "fresh dispatch lacks admitted attempt identity");
    dispatch = metadata;
    signal = abortSignal;
    let next = 0;
    return { async next() {
      if (next++ === 0) return { done: false, value: prefix };
      throw new Error("transport lost after model prefix");
    }, return() { returns++; return { done: true }; } };
  }, attempt => {
    reconciliations++;
    assert(attempt.observed.length === 1 && attempt.observed[0].delta === prefix.delta, "reconciliation lost exact observed prefix");
    assert(attempt.request_digest.length === 32, "reconciliation lost canonical request identity");
    assert(attempt.operation_id === dispatch.operation_id && attempt.step === dispatch.step
      && describe(attempt.request_digest) === describe(dispatch.request_digest), "fresh and recovered dispatch identities differ");
    // Reconciliation returns only the unobserved suffix; Rust retains prefix.
    return [{ kind: "completed", metadata: {} }];
  });
  runtime = await fixture.open();
  bind(runtime);
  await runtime.initializeVolume();
  const command = crypto.randomUUID();
  const file = await runtime.stage(command, "model", new TextEncoder().encode(JSON.stringify({ input: "hello", max_steps: 1 })));
  const operation = crypto.randomUUID();
  const input = { payload: file, operation_id: command, kind: "acyclic.model.v1" };
  const admission = await runtime.admit(operation, "acyclic.stock_turn", "1", input);
  assert(admission.kind === "accepted", describe(admission));
  const retry = await runtime.admit(operation, "acyclic.stock_turn", "1", input);
  assert(retry.kind === "accepted" && retry.task_id === admission.task_id, "exact stock admission retry changed task identity");
  let changedAdmissionRejected = false;
  try { await runtime.admit(operation, "acyclic.stock_turn", "1", { ...input, operation_id: crypto.randomUUID() }); }
  catch { changedAdmissionRejected = true; }
  assert(changedAdmissionRejected, "stock admission accepted a changed model command");
  const worker = { id: "model-worker", available: {}, labels: {} };
  result.dataset.waiting = "retain interrupted model prefix";
  const first = await runtime.workerTick(worker, null, 128, 4);
  assert(first.work?.lease != null, `interrupted request lost original lease: ${describe(first)}`);
  assert(requests === 1 && signal.aborted && returns === 1, "dropping interrupted iterator did not abort and close transport");
  const uncertain = await runtime.outcome(admission.task_id);
  assert(uncertain === null || uncertain.Indeterminate != null, "uncertain model claimed terminal completion");
  runtime.free();
  runtime = await fixture.open();
  bind(runtime);
  result.dataset.waiting = "reconcile original model attempt after reopen";
  const recovered = await runtime.resume(first.work.lease, 4);
  assert(recovered.kind === "completed", `model recovery did not complete: ${describe(recovered)}`);
  assert(requests === 1 && reconciliations === 1, "recovery repeated model generation or reconciliation");
  const output = (await runtime.outcome(admission.task_id))?.Succeeded;
  assert(output?.text === "committed" && output.steps === 1n, `durable stock model result differs: ${describe(output)}`);
  const duplicate = await runtime.workerTick(worker, null, 128, 4);
  assert(duplicate.work === null && requests === 1 && reconciliations === 1, "duplicate wake repeated model dispatch");
  result.dataset.status = "passed";
  result.textContent = "canonical request, observed prefix, abort, reopen and exact model reconciliation passed";
} catch (error) {
  result.dataset.status = "failed";
  result.textContent = String(error.stack ?? error);
} finally {
  runtime?.free();
  fixture?.free();
}
</script>
