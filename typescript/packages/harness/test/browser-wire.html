<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Harness browser wire validation smoke</title>
<script type="importmap">
{
  "imports": {
    "@bufbuild/protobuf": "../node_modules/@bufbuild/protobuf/dist/esm/index.js",
    "@bufbuild/protobuf/codegenv2": "../node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js",
    "@bufbuild/protobuf/wkt": "../node_modules/@bufbuild/protobuf/dist/esm/wkt/index.js"
  }
}
</script>
<body data-result="pending">
<script type="module">
import { DEFAULT_LIMITS, Harness, NativeContracts, ClientQuery, TaskVolume, WasmStream,
  initializeClientQueries } from "../dist/index.js";

try {
  const options = {
    authority: { kind: "task", id: "browser" },
    issuerId: "browser",
    issuerKey: new Uint8Array(32).fill(7),
  };
  const harness = await Harness.create(options);
  const contracts = await NativeContracts.create();
  for (const value of ["replacement \ufffd", "paired \ud83d\ude00", "\u0000"]) {
    const nativeRoundTrip = contracts.decodeModelJson(new TextEncoder().encode(JSON.stringify({ value })));
    if (nativeRoundTrip.value !== value) throw new Error("native JSON parser changed a valid Unicode string");
    const roundTrip = JSON.parse(new TextDecoder().decode(contracts.encodeCanonicalJson({ [value]: value })));
    if (roundTrip[value] !== value) throw new Error("canonical JSON changed a valid Unicode string or key");
  }
  for (const invalid of ["\ud800", "\udc00", "\ud800x", "x\udc00"]) {
    let nativeRejected = false;
    try { contracts.decodeModelJson(new TextEncoder().encode(JSON.stringify({ value: invalid }))); }
    catch { nativeRejected = true; }
    if (!nativeRejected) throw new Error("native JSON parser accepted an unpaired surrogate");
    for (const value of [{ value: invalid }, { [invalid]: 1 }, new Map([[invalid, 1]])]) {
      let rejected = false;
      try { contracts.encodeCanonicalJson(value); }
      catch { rejected = true; }
      if (!rejected) throw new Error("canonical JSON normalized an unpaired UTF-16 string or key");
    }
  }
  const { exerciseCheckpoint } = await import("./checkpoint-consumer.mjs");
  await exerciseCheckpoint(Harness, harness, options, contracts);
  const { exerciseBrowserHistory } = await import("./browser-history-consumer.mjs");
  await exerciseBrowserHistory();
  const provider = { namespace: "browser", family: "filesystem", version: "2" };
  const skillSource = {
    root: { volume: { provider, id: "skills", class: "session_shared", owner: { kind: "session", id: "test" } }, directory: "" },
    generation: { kind: "generation", provider, key: [1], version: "pinned" }, path: "inspect/SKILL.md",
  };
  const skill = contracts.parseSkillMetadata(new TextEncoder().encode(
    "---\nname: inspect\ndescription: Inspect files\n---\nSECRET BODY"), skillSource);
  const skillContext = contracts.projectDiscoveredContext({ instructions: [], skills: [skill] },
    { messages: [], metadata: {} }, "prepend", DEFAULT_LIMITS);
  if (skill.description !== "Inspect files" || skillContext.messages.length !== 1
      || JSON.stringify(skillContext).includes("SECRET BODY")) throw new Error("skill metadata projection failed");
  let invalidSkillRejected = false;
  try { contracts.projectDiscoveredContext({ instructions: [], skills: [{ ...skill, name: "Invalid" }] },
    { messages: [], metadata: {} }, "prepend", DEFAULT_LIMITS); }
  catch { invalidSkillRejected = true; }
  if (!invalidSkillRejected) throw new Error("forged skill snapshot accepted");
  const { exerciseDiscovery } = await import("./discovery-consumer.mjs");
  const { openBrowserFs, DEFAULT_OBJECT_CACHE_OPTIONS } = await import("/dist/browser.js");
  const discoveryOptions = {
    databaseName: `harness-discovery-${crypto.randomUUID()}`,
    maximumObjectBytes: 1024 * 1024, objectAcceleration: "opfs",
    objectCache: DEFAULT_OBJECT_CACHE_OPTIONS,
  };
  let discoveryEngine = await openBrowserFs(discoveryOptions);
  try { await exerciseDiscovery(discoveryEngine, "browser", async previous => {
    previous.close();
    discoveryEngine = await openBrowserFs(discoveryOptions);
    return discoveryEngine;
  }); }
  finally { discoveryEngine.close(); }
  const role = new URL(location.href).searchParams.get("role") ?? "browser";
  const selection = { source: { kind: "attribute", attribute: {
    type_name: "example.role", type_revision: "1", state_revision: "2",
    schema: { type: "string" }, value: role,
  } }, extent: { kind: "whole" }, representation: "full" };
  contracts.validateContextSelection(selection, DEFAULT_LIMITS);
  const base = { messages: [{ role: "user", content: "task" }], metadata: {} };
  const rendered = [{ role: "system", content: role }];
  const rebuilt = contracts.applyContextProjection(base, rendered, "prompt", "prepend", DEFAULT_LIMITS);
  const update = contracts.applyContextProjection(base, rendered, "update", "prepend", DEFAULT_LIMITS);
  if (rebuilt.messages[0].content !== role || update.messages[1].content !== role
      || base.messages.length !== 1) throw new Error("context projection/state isolation failed");
  let rejected = false;
  try { contracts.applyContextProjection(base, rendered, "prompt", "prepend", { ...DEFAULT_LIMITS, render_bytes: 1 }); }
  catch { rejected = true; }
  if (!rejected) throw new Error("oversized mandatory context accepted");
  await initializeClientQueries();
  const stream = new WasmStream();
  const files = await TaskVolume.create(stream, "browser/files");
  const query = await ClientQuery.open(files, "Root", null, { files: 4n, segments: 4n, bytes: 4096n });
  const views = query.views();
  const before = views.cursor();
  const stop = Promise.withResolvers();
  let publications = 0;
  const followed = query.follow(delivery => {
    if (views.cursor().position !== before.position) throw new Error("cursor advanced before output");
    if (new TextDecoder().decode(delivery.file.bytes) !== "browser query") throw new Error("changed file bytes");
    publications++;
  }, () => stop.resolve(), stop.promise);
  await files.write(await files.head(), "Goal", new TextEncoder().encode("browser query"), null);
  await followed;
  if (publications !== 1 || views.cursor().position !== before.position + 1n
      || new TextDecoder().decode(views.segments("Goal")[0]) !== "browser query") {
    throw new Error("published query and view disagree");
  }
  views.free(); query.free(); files.free(); stream.free();
  harness.free();
  document.body.dataset.result = "passed";
} catch (error) {
  document.body.dataset.result = `failed: ${error?.stack ?? String(error)}`;
}
</script>
</body>
</html>
