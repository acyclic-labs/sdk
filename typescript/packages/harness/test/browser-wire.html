<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Harness browser wire validation smoke</title>
<script type="importmap">
{
  "imports": {
    "@bufbuild/protobuf": "../node_modules/@bufbuild/protobuf/dist/esm/index.js",
    "@bufbuild/protobuf/codegenv2": "../node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js",
    "@bufbuild/protobuf/wkt": "../node_modules/@bufbuild/protobuf/dist/esm/wkt/index.js"
  }
}
</script>
<body data-result="pending">
<script type="module">
import { create } from "@bufbuild/protobuf";
import { DEFAULT_LIMITS, EmbeddedWireTransport, Harness, NativeContracts, WireError } from "../dist/index.js";
import { ErrorCode, ResumeRequestSchema } from "../generated/proto/harness/v2/harness_pb.js";
import { HandshakeRequestSchema, HandshakeResponseSchema } from "../generated/proto/protocol/v1/protocol_pb.js";

try {
  const options = {
    authority: { kind: "task", id: "browser" },
    issuerId: "browser",
    issuerKey: new Uint8Array(32).fill(7),
  };
  const harness = await Harness.create(options);
  const contracts = await NativeContracts.create();
  const role = new URL(location.href).searchParams.get("role") ?? "browser";
  const selection = { source: { kind: "attribute", attribute: {
    type_name: "example.role", type_revision: "1", state_revision: "2",
    schema: { type: "string" }, value: role,
  } }, extent: { kind: "whole" }, representation: "full" };
  contracts.validateContextSelection(selection, DEFAULT_LIMITS);
  const base = { messages: [{ role: "user", content: "task" }], metadata: {} };
  const rendered = [{ role: "system", content: role }];
  const rebuilt = contracts.applyContextProjection(base, rendered, "prompt", "prepend", DEFAULT_LIMITS);
  const update = contracts.applyContextProjection(base, rendered, "update", "prepend", DEFAULT_LIMITS);
  if (rebuilt.messages[0].content !== role || update.messages[1].content !== role
      || base.messages.length !== 1) throw new Error("context projection/state isolation failed");
  let rejected = false;
  try { contracts.applyContextProjection(base, rendered, "prompt", "prepend", { ...DEFAULT_LIMITS, render_bytes: 1 }); }
  catch { rejected = true; }
  if (!rejected) throw new Error("oversized mandatory context accepted");
  const protocol = harness.protocolIdentity();
  const api = {
    async handshake(request) {
      return create(HandshakeResponseSchema, { protocol: request.protocol, supported: { capabilities: [] } });
    },
    async *replay() {},
    async submit() {},
    async observe() { throw new Error("unused"); },
    async cancel() { throw new Error("unused"); },
  };
  await new EmbeddedWireTransport(api, create(HandshakeRequestSchema, { protocol }))
    .connect(create(ResumeRequestSchema, {}));
  const foreign = new EmbeddedWireTransport(api, create(HandshakeRequestSchema, {
    protocol: { ...protocol, descriptorDigest: "foreign" },
  }));
  try {
    await foreign.connect(create(ResumeRequestSchema, {}));
    throw new Error("foreign protocol accepted");
  } catch (error) {
    if (!(error instanceof WireError) || error.code !== ErrorCode.UNSUPPORTED) throw error;
  }
  harness.free();
  document.body.dataset.result = "passed";
} catch (error) {
  document.body.dataset.result = `failed: ${error.message}`;
}
</script>
</body>
</html>
