<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Harness agent turn through the guest artifact</title>
<pre id="result" data-status="pending">initializing</pre>
<script type="importmap">{"imports":{"@bufbuild/protobuf":"/node_modules/@bufbuild/protobuf/dist/esm/index.js","@bufbuild/protobuf/codegenv2":"/node_modules/@bufbuild/protobuf/dist/esm/codegenv2/index.js","@bufbuild/protobuf/wkt":"/node_modules/@bufbuild/protobuf/dist/esm/wkt/index.js"}}</script>
<script type="module">
import { agentsFixture, untilRecords, turnText } from "./browser-agents-fixture.mjs";
const result = document.querySelector("#result");
const phase = text => { result.dataset.waiting = text; };
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const describe = value => JSON.stringify(value, (_, item) => typeof item === "bigint" ? `${item}n` : item);
let fixture;
let providers;
let guest;
let agents;
try {
  fixture = await agentsFixture(crypto.randomUUID(), async function* ({ texts }) {
    yield { kind: "content", delta: `guest:${texts.at(-1)}` };
  });
  phase("load the guest artifact's canonical entry over host-injected storage");
  providers = await fixture.providers("indexedDb");
  guest = fixture.guest(providers);
  const { AgentGuest } = await import("../generated/wasm/acyclic_harness_wasm.js");
  assert(AgentGuest.abiVersion() === 1, "guest ABI version differs");
  const manifest = guest.manifest();
  assert(manifest instanceof Uint8Array && manifest.byteLength > 32, "guest manifest is empty");
  let deliveries = 0;
  const counted = { manifest: () => manifest, onRecord: (delivery, signal) => { deliveries += 1; return guest.onRecord(delivery, signal); } };
  agents = fixture.hosting(providers, counted);
  phase("one agent turn runs in the guest; the host publishes it");
  const a = await agents.create("agent-guest", "hello");
  const entries = await untilRecords(fixture, agents, a, "conversation", entries => entries.length === 1);
  assert(await turnText(agents, a, entries[0]) === "guest:hello", "guest turn output differs");
  assert(deliveries >= 1, "the host published a turn without the guest");
  await untilRecords(fixture, agents, a, "status", records => records.at(-1)?.value.phase === "idle");
  assert(fixture.failures.length === 0, describe(fixture.failures));
  result.dataset.status = "passed";
  result.textContent = "one agent turn through the guest facade, published by its host";
} catch (error) {
  result.dataset.status = "failed";
  result.textContent = String(error.stack ?? error);
} finally {
  agents?.free();
  guest?.free();
  providers?.free();
  fixture?.free();
}
</script>
</html>
