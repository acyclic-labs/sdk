<title>Browser role models survive root and child resumes</title>

<script type="module">
import { agentsFixture, untilRecords, turnText } from "./browser-agents-fixture.mjs";
const result = document.querySelector("#result");
let phase = "initialize";
const step = text => { phase = text; result.dataset.waiting = text; };

    let fixture, providers, guest, agents;
    try {

      fixture.options.children = mode !== "solo";
      fixture.configure({ provider: "workers", name: "luna", revision: "1" },

      fixture.configure({ provider: "browser-test", name: "scripted", revision: "1" });
      const open = async () => {
        if (mode !== "guest") return fixture.open();
        providers ??= await fixture.providers("indexedDb");
        guest = fixture.guest(providers);
        return fixture.hosting(providers, guest);

      step(`${mode}: open host`);
      agents = await open();
      step(`${mode}: create root`);

      step(`${mode}: read root adoption`);
      const rootInbox = await untilRecords(fixture, agents, root, "inbox",

      const adopted = rootInbox.find(record => record.value.fork_adopted?.parent === null).value.fork_adopted;
      assert(adopted.profile.model === "browser-test/scripted", `${mode}: root did not retain its configured model`);

        assert(childAdopted.profile.model === "workers/luna", `${mode}: child lost its override`);

        assert(await turnText(agents, child, entries.at(-1)) === "worker:again", `${mode}: reopened child changed model`);

}
