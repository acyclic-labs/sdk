<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Harness agents on IndexedDB</title>
<pre id="result" data-status="pending">initializing</pre>
<script type="module">
import { agentsFixture, until, turnText } from "./browser-agents-fixture.mjs";
const result = document.querySelector("#result");
const phase = text => { result.dataset.waiting = text; };
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const describe = value => JSON.stringify(value, (_, item) => typeof item === "bigint" ? `${item}n` : item);
let fixture;
let agents;
try {
  fixture = await agentsFixture(crypto.randomUUID(), async function* ({ texts }) {
    yield { kind: "content", delta: `echo:${texts.at(-1)}` };
  });
  const conversation = agent => () => agents.read(agent, "conversation", 0n, 16);
  agents = await fixture.open();

  phase("create an agent whose brief is its first turn");
  const a = await agents.create("agent-a", "hello");
  assert(await agents.create("agent-a", "hello") === a, "exact create retry named another agent");
  let entries = await until(conversation(a), entries => entries.length === 1);
  assert(await turnText(agents, a, entries[0]) === "echo:hello", "brief turn output differs");

  phase("prompt the agent; its turn sees the settled history");
  const sent = await agents.send(a, "m1", "again");
  assert(sent.kind === "committed", describe(sent));
  const replay = await agents.send(a, "m1", "again");
  assert(replay.kind === "committed" && replay.inbox === sent.inbox, "exact send retry appended twice");
  entries = await until(conversation(a), entries => entries.length === 2);
  assert(await turnText(agents, a, entries[1]) === "echo:again", "prompt turn output differs");
  assert(fixture.requests.length === 2 && fixture.requests[1].request.messages.length === 3,
    `second turn lacks its history: ${describe(fixture.requests.at(-1)?.request.messages)}`);
  const status = await until(() => agents.read(a, "status", 0n, 64), records => records.at(-1)?.value.phase === "idle");
  assert(status.at(-1).value.cursor > sent.inbox, "status cursor does not cover the consumed prompt");

  phase("list root agents in bounded pages");
  const b = await agents.create("agent-b", null);
  const first = await agents.list(null, null, null, 1);
  assert(first.agents.length === 1 && first.next_after !== null, describe(first));
  const second = await agents.list(null, first.next_after, first.version, 1);
  assert(second.agents.length === 1 && second.next_after === null, describe(second));
  assert(new Set([...first.agents, ...second.agents]).size === 2
    && [a, b].every(agent => [...first.agents, ...second.agents].includes(agent)), "pages differ from created agents");
  assert((await agents.list(a, null, null, 8)).agents.length === 0, "a root agent lists children it never spawned");

  phase("a paused agent consumes nothing, across reopen");
  await agents.pause(a, true);
  assert((await agents.send(a, "m2", "later")).kind === "committed", "send to a paused agent failed");
  await new Promise(resolve => setTimeout(resolve, 200));
  assert((await conversation(a)()).length === 2, "paused agent ran a turn");
  agents.free();
  agents = await fixture.open();
  assert((await conversation(a)()).length === 2, "reopened paused agent ran a turn");
  await agents.pause(a, false);
  entries = await until(conversation(a), entries => entries.length === 3);
  assert(await turnText(agents, a, entries[2]) === "echo:later", "resumed turn output differs");

  phase("cancel keeps the agent open; archive closes it");
  assert((await agents.cancel(a, "c1")).kind === "committed", "cancel was refused");
  assert((await agents.archive(a, "x1")).kind === "committed", "archive was refused");
  assert((await agents.send(a, "m3", "late")).kind === "closed", "archived agent accepted a message");
  await until(() => agents.read(a, "status", 0n, 64),
    records => records.at(-1)?.value.phase?.done?.outcome === "archived");
  assert(fixture.failures.length === 0, describe(fixture.failures));
  result.dataset.status = "passed";
  result.textContent = "create, prompt with history, exact retries, paging, pause across reopen, cancel and archive passed";
} catch (error) {
  result.dataset.status = "failed";
  result.textContent = String(error.stack ?? error);
} finally {
  agents?.free();
  fixture?.free();
}
</script>
</html>
