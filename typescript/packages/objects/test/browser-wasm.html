<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Objects WASM smoke</title>
<script type="importmap">
{
  "imports": {
    "@bufbuild/protobuf": "/deps/protobuf/dist/esm/index.js",
    "@bufbuild/protobuf/codegenv2": "/deps/protobuf/dist/esm/codegenv2/index.js",
    "@bufbuild/protobuf/wkt": "/deps/protobuf/dist/esm/wkt/index.js"
  }
}
</script>
<body data-result="pending">
<script type="module">
  import { MemoryObjectsV1, verified } from "../dist/index.js";

  try {
    const objects = await MemoryObjectsV1.create();
    const body = new Uint8Array([1, 2, 3]);
    const published = verified(await objects.put(body));
    const fetched = await objects.get({ digest: published.digest, range: { start: 1n, end: 3n }, maximumBytes: 2n });
    if (published.length !== 3n || fetched.body.join(",") !== "2,3" || fetched.start !== 1n || fetched.info.length !== 3n) {
      throw new Error("Rust-backed browser blob read differs from its write");
    }
    if ((await objects.put(body)).outcome.case !== "alreadyExists") throw new Error("equal bytes did not name the same blob");
    document.body.dataset.result = "passed";
  } catch (error) {
    document.body.dataset.result = "failed";
    document.body.textContent = String(error);
  }
</script>
</html>
