<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Objects WASM smoke</title>
<script type="importmap">
{
  "imports": {
    "@bufbuild/protobuf": "/deps/protobuf/dist/esm/index.js",
    "@bufbuild/protobuf/codegenv2": "/deps/protobuf/dist/esm/codegenv2/index.js",
    "@bufbuild/protobuf/wkt": "/deps/protobuf/dist/esm/wkt/index.js"
  }
}
</script>
<body data-result="pending">
<script type="module">
  import { create } from "@bufbuild/protobuf";
  import { MemoryObjectsV2, CreateBucketRequestSchema, PutObjectHeaderSchema, GetObjectRequestSchema } from "../dist/index.js";

  try {
    const objects = await MemoryObjectsV2.create();
    const bucket = await objects.createBucket(create(CreateBucketRequestSchema, { name: "browser-objects" }));
    const body = new Uint8Array([1, 2, 3]);
    const header = create(PutObjectHeaderSchema, { bucket: bucket.bucket, objectKey: "artifact" });
    const published = await objects.put(header, body);
    const fetched = await objects.get(create(GetObjectRequestSchema, {
      bucket: bucket.bucket, objectKey: "artifact", range: { selection: { case: "bytes", value: { start: 1n, end: 2n } } },
    }), 2n);
    if (published.size !== 3n || fetched.body.join(",") !== "2,3" || fetched.header.contentRange?.total !== 3n) {
      throw new Error("Rust-backed browser object read differs from its write");
    }
    await objects.put(header, new Uint8Array([4]));
    const replaced = await objects.get(create(GetObjectRequestSchema, { bucket: bucket.bucket, objectKey: "artifact" }), 1n);
    if (replaced.body.join(",") !== "4") throw new Error("current key did not reflect replacement");
    document.body.dataset.result = "passed";
  } catch (error) {
    document.body.dataset.result = "failed";
    document.body.textContent = String(error);
  }
</script>
</html>
