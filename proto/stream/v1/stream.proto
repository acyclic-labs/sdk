syntax = "proto3";
package acyclic.stream.v1;

import "google/api/annotations.proto";
import "harness/v1/harness.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/stream/v1;streamv1";

message StreamRef {
  string stream_id = 1;
  uint64 offset = 2;
}
message Record {
  uint64 offset = 1;
  bytes payload = 2;
}
message AppendRequest {
  acyclic.harness.v1.OperationIdentity operation = 1;
  string stream_id = 2;
  uint64 expected_offset = 3;
  bytes payload = 4;
}
message AppendResponse {
  acyclic.harness.v1.Admission admission = 1;
  Record record = 2;
}
message ReadRequest {
  string stream_id = 1;
  uint64 from_offset = 2;
  acyclic.harness.v1.Cursor cursor = 3;
}
message ReadResponse {
  repeated Record records = 1;
  acyclic.harness.v1.Cursor next_cursor = 2;
}
message FollowRequest {
  string stream_id = 1;
  acyclic.harness.v1.Cursor cursor = 2;
}
message FollowResponse {
  Record record = 1;
  acyclic.harness.v1.Cursor next_cursor = 2;
}

service StreamService {
  rpc Handshake(acyclic.harness.v1.HandshakeRequest) returns (acyclic.harness.v1.HandshakeResponse) {
    option (google.api.http) = {
      post: "/v1/streams:handshake"
      body: "*"
    };
  }
  rpc Append(AppendRequest) returns (AppendResponse) {
    option (google.api.http) = {
      post: "/v1/streams/{stream_id}:append"
      body: "*"
    };
  }
  rpc Read(ReadRequest) returns (ReadResponse) {
    option (google.api.http) = {get: "/v1/streams/{stream_id}/records"};
  }
  rpc Follow(FollowRequest) returns (stream FollowResponse);
  rpc Observe(acyclic.harness.v1.ObserveRequest) returns (acyclic.harness.v1.OperationStatus) {
    option (google.api.http) = {get: "/v1/streams/operations/{operation_id}"};
  }
  rpc Cancel(acyclic.harness.v1.CancelRequest) returns (acyclic.harness.v1.CancelResponse) {
    option (google.api.http) = {
      post: "/v1/streams/operations/{operation_id}:cancel"
      body: "*"
    };
  }
}
