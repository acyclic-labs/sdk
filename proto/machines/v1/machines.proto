syntax = "proto3";
package acyclic.machines.v1;

import "google/api/annotations.proto";
import "harness/v1/harness.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/machines/v1;machinesv1";

message ExecutionRequest {
  acyclic.harness.v1.OperationIdentity operation = 1;
  string program = 2;
  repeated string args = 3;
  repeated string required_capabilities = 4;
}
message ExecutionResult {
  int32 code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
}
message ExecuteResponse {
  acyclic.harness.v1.Admission admission = 1;
  ExecutionResult result = 2;
}

service MachinesService {
  rpc Handshake(acyclic.harness.v1.HandshakeRequest) returns (acyclic.harness.v1.HandshakeResponse) {
    option (google.api.http) = {
      post: "/v1/machines:handshake"
      body: "*"
    };
  }
  rpc Execute(ExecutionRequest) returns (ExecuteResponse) {
    option (google.api.http) = {
      post: "/v1/executions"
      body: "*"
    };
  }
  rpc Observe(acyclic.harness.v1.ObserveRequest) returns (acyclic.harness.v1.OperationStatus) {
    option (google.api.http) = {get: "/v1/executions/{operation_id}"};
  }
  rpc Cancel(acyclic.harness.v1.CancelRequest) returns (acyclic.harness.v1.CancelResponse) {
    option (google.api.http) = {
      post: "/v1/executions/{operation_id}:cancel"
      body: "*"
    };
  }
}
