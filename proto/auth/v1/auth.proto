syntax = "proto3";

package acyclic.auth.v1;

option go_package = "github.com/acyclic-labs/sdk/go/gen/auth/v1;authv1";

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_USER = 1;
  PRINCIPAL_KIND_AGENT = 2;
  PRINCIPAL_KIND_SERVICE = 3;
  PRINCIPAL_KIND_GROUP = 4;
  PRINCIPAL_KIND_ANONYMOUS = 5;
}

message Attribute {
  string name = 1;
  bytes value = 2;
}

message AttributeMatch {
  string name = 1;
  repeated bytes any_of = 2;
  bool subject_id = 3;
  bool subject_lineage = 4;
}

message BillingGrant {
  ResourceGrant grant = 1;
  optional uint64 spend_micros = 2;
}

message Block {
  optional string account_bearer = 1;
  repeated Caveat caveats = 2;
  bytes next_public_key = 3;
}

message Capability {
  repeated SignedBlock blocks = 1;
  oneof proof {
    bytes secret = 2;
    bytes sealed = 3;
  }
}

message Caveat {
  oneof kind {
    GrantSet grants = 1;
    uint64 expires_at = 2;
    uint64 not_before = 3;
    string audience = 4;
    Holder holder = 5;
    Principal subject = 6;
    Filter filter = 7;
    Pin pin = 8;
    Limits limits = 9;
    uint32 max_depth = 10;
  }
}

message ExecutionGrant {
  ResourceGrant grant = 1;
  optional uint64 cpu_millis = 2;
  optional uint64 memory_bytes = 3;
}

message Filter {
  repeated KeyRange keys = 1;
  repeated AttributeMatch attributes = 2;
}

message Grant {
  oneof kind {
    ResourceGrant resource = 1;
    ExecutionGrant execution = 2;
    BillingGrant billing = 3;
    WebsocketConnectGrant websocket_connect = 4;
  }
}

message GrantSet {
  repeated Grant grants = 1;
}

message Holder {
  optional string account = 1;
}

message KeyRange {
  bytes start = 1;
  bytes end = 2;
}

message Limits {
  optional uint64 rps = 1;
  optional uint64 burst = 2;
  optional uint64 bytes_per_s = 3;
  optional uint64 channels = 4;
  optional uint64 concurrency = 5;
  optional uint64 bytes = 6;
  optional uint64 spend_micros = 7;
  optional uint64 tokens = 8;
}

message Pin {
  string name = 1;
  oneof value {
    bytes literal = 2;
    bool subject_id = 3;
    bool subject_lineage = 4;
  }
}

message Principal {
  PrincipalKind kind = 1;
  string id = 2;
  repeated string lineage = 3;
  repeated string groups = 4;
  repeated string roles = 5;
  repeated Attribute attributes = 6;
}

message ResourceGrant {
  ResourcePattern resource = 1;
  repeated string actions = 2;
}

message ResourcePattern {
  string name = 1;
  bool prefix = 2;
}

message SignedBlock {
  bytes payload = 1;
  bytes signature = 2;
}

message SocketHostRule {
  string host = 1;
  repeated SocketPortRange ports = 2;
}

message SocketPortRange {
  uint32 first = 1;
  uint32 last = 2;
}

message WebsocketConnectGrant {
  repeated SocketHostRule rules = 1;
}

