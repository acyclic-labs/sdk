syntax = "proto3";
package acyclic.actors.v1;

option go_package = "github.com/acyclic-labs/sdk/go/gen/actors/v1;actorsv1";

message Binding {
  string name = 1;
  string capability = 2;
  string resource = 3;
}
message ActorLimits {
  uint64 handler_timeout_millis = 1;
  uint64 memory_bytes = 2;
  uint64 checkpoint_bytes = 3;
}
message SubscriptionStart {
  oneof start {
    uint64 cursor = 1;
    bool current_head = 2;
  }
}
message SubscriptionSpec {
  string subscription_id = 1;
  string stream_path = 2;
  SubscriptionStart start = 3;
  bool placement_anchor = 4;
}
enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_PAUSED = 2;
}
message SubscriptionObservation {
  string subscription_id = 1;
  string stream_path = 2;
  SubscriptionState state = 3;
  uint64 delivered_cursor = 4;
  uint64 completed_cursor = 5;
  uint64 recoverable_cursor = 6;
  bool placement_anchor = 7;
  uint32 retry_count = 8;
  string failure_code = 9;
  optional uint64 failed_cursor = 10;
}
enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_ACTIVE = 1;
  ACTOR_STATE_HIBERNATED = 2;
  ACTOR_STATE_PAUSED = 3;
}
message ActorObservation {
  string actor_id = 1;
  bytes code_sha256 = 2;
  string home_region = 3;
  ActorState state = 4;
  repeated SubscriptionObservation subscriptions = 5;
  optional uint64 checkpoint_unix_millis = 6;
  uint64 checkpoint_epoch = 7;
  uint64 configuration_revision = 8;
}
message CreateActorRequest {
  bytes code_sha256 = 1;
  string home_region = 2;
  repeated Binding bindings = 3;
  ActorLimits limits = 4;
  repeated SubscriptionSpec subscriptions = 5;
  string idempotency_key = 6;
}
message CreateActorResponse { ActorObservation actor = 1; }
// Full configuration replacement with CAS. The new code's checkpoint schema
// must be compatible or explicitly migrated before activation; failure keeps
// the previous version active. Paused subscriptions stay paused until resumed.
message UpdateActorRequest {
  string actor_id = 1;
  bytes code_sha256 = 2;
  repeated Binding bindings = 3;
  ActorLimits limits = 4;
  uint64 expected_configuration_revision = 5;
  string idempotency_key = 6;
}
message UpdateActorResponse { ActorObservation actor = 1; }
message InspectActorRequest { string actor_id = 1; }
message InspectActorResponse { ActorObservation actor = 1; }
message AddSubscriptionRequest {
  string actor_id = 1;
  SubscriptionSpec subscription = 2;
  string idempotency_key = 3;
}
message AddSubscriptionResponse { ActorObservation actor = 1; }
message RemoveSubscriptionRequest {
  string actor_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
}
message RemoveSubscriptionResponse { ActorObservation actor = 1; }
// Resumption may replay a previously delivered record and duplicate external effects.
message ResumeSubscriptionRequest {
  string actor_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
}
message ResumeSubscriptionResponse { ActorObservation actor = 1; }
message CheckpointActorRequest {
  string actor_id = 1;
  string idempotency_key = 2;
}
message CheckpointActorResponse { ActorObservation actor = 1; }
message Header {
  string name = 1;
  string value = 2;
}
// Invocation is not an implicit Stream append or persistence guarantee.
message InvokeActorRequest {
  string actor_id = 1;
  string method = 2;
  string url = 3;
  bytes body = 4;
  repeated Header headers = 5;
}
message InvokeActorResponse {
  uint32 status = 1;
  bytes body = 2;
  repeated Header headers = 3;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_CAPABILITY_DENIED = 2;
  ERROR_CODE_CAPABILITY_EXPIRED = 3;
  ERROR_CODE_ACTOR_NOT_FOUND = 4;
  ERROR_CODE_SUBSCRIPTION_NOT_FOUND = 5;
  ERROR_CODE_IDEMPOTENCY_MISMATCH = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_ADMISSION_DENIED = 8;
  ERROR_CODE_CHECKPOINT_FAILED = 9;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 10;
}
message Error {
  ErrorCode code = 1;
  string message = 2;
}

service ActorsService {
  rpc CreateActor(CreateActorRequest) returns (CreateActorResponse);
  rpc UpdateActor(UpdateActorRequest) returns (UpdateActorResponse);
  rpc InspectActor(InspectActorRequest) returns (InspectActorResponse);
  rpc AddSubscription(AddSubscriptionRequest) returns (AddSubscriptionResponse);
  rpc RemoveSubscription(RemoveSubscriptionRequest) returns (RemoveSubscriptionResponse);
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse);
  rpc CheckpointActor(CheckpointActorRequest) returns (CheckpointActorResponse);
  rpc InvokeActor(InvokeActorRequest) returns (InvokeActorResponse);
}
