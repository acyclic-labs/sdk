syntax = "proto3";

package acyclic.actors.v1;

option go_package = "github.com/acyclic-labs/sdk/go/gen/actors/v1;actorsv1";

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_ACTIVE = 1;
  ACTOR_STATE_HIBERNATED = 2;
  ACTOR_STATE_PAUSED = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_CAPABILITY_DENIED = 2;
  ERROR_CODE_CAPABILITY_EXPIRED = 3;
  ERROR_CODE_ACTOR_NOT_FOUND = 4;
  ERROR_CODE_SUBSCRIPTION_NOT_FOUND = 5;
  ERROR_CODE_IDEMPOTENCY_MISMATCH = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_ADMISSION_DENIED = 8;
  ERROR_CODE_CHECKPOINT_FAILED = 9;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 10;
}

enum SocketCloseInitiator {
  SOCKET_CLOSE_INITIATOR_UNSPECIFIED = 0;
  SOCKET_CLOSE_INITIATOR_PEER = 1;
  SOCKET_CLOSE_INITIATOR_ACTOR = 2;
  SOCKET_CLOSE_INITIATOR_RUNTIME = 3;
}

enum SocketReconnectMode {
  SOCKET_RECONNECT_MODE_UNSPECIFIED = 0;
  SOCKET_RECONNECT_MODE_NONE = 1;
  SOCKET_RECONNECT_MODE_BACKOFF = 2;
}

enum SocketTransport {
  SOCKET_TRANSPORT_UNSPECIFIED = 0;
  SOCKET_TRANSPORT_INTERNAL = 1;
  SOCKET_TRANSPORT_EXTERNAL = 2;
}

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_PAUSED = 2;
}

message ActorAddress {
  string actor_id = 1;
  optional string app_channel = 2;
}

message ActorCall {
  string request_id = 1;
  InvokeActorRequest request = 2;
}

message ActorCallResult {
  string request_id = 1;
  InvokeActorResponse response = 2;
}

message ActorLimits {
  uint64 handler_timeout_millis = 1;
  uint64 memory_bytes = 2;
  uint64 checkpoint_bytes = 3;
  SocketConfig sockets = 4;
}

message ActorObservation {
  string actor_id = 1;
  bytes code_sha256 = 2;
  string home_region = 3;
  ActorState state = 4;
  repeated SubscriptionObservation subscriptions = 5;
  optional uint64 checkpoint_unix_millis = 6;
  uint64 checkpoint_epoch = 7;
  uint64 configuration_revision = 8;
}

message AddSubscriptionRequest {
  string actor_id = 1;
  SubscriptionSpec subscription = 2;
  string idempotency_key = 3;
}

message AddSubscriptionResponse {
  ActorObservation actor = 1;
}

message Binding {
  string name = 1;
  string capability = 2;
  string resource = 3;
  SocketConnectCapability websocket_connect = 4;
}

message Broadcast {
  EffectId effect_id = 1;
  SocketBroadcastTarget target = 2;
  repeated string except = 3;
  SocketPayload payload = 4;
}

message CheckpointActorRequest {
  string actor_id = 1;
  string idempotency_key = 2;
}

message CheckpointActorResponse {
  ActorObservation actor = 1;
}

message Close {
  EffectId effect_id = 1;
  string connection_id = 2;
  uint32 code = 3;
  string reason = 4;
}

message Connect {
  EffectId effect_id = 1;
  string binding = 2;
  oneof target {
    string url = 3;
    ActorAddress actor_address = 6;
  }
  repeated string subprotocols = 4;
  SocketReconnect reconnect = 5;
  SocketKeepalive keepalive = 7;
}

message CreateActorRequest {
  bytes code_sha256 = 1;
  string home_region = 2;
  repeated Binding bindings = 3;
  ActorLimits limits = 4;
  repeated SubscriptionSpec subscriptions = 5;
  string idempotency_key = 6;
}

message CreateActorResponse {
  ActorObservation actor = 1;
}

message DeleteActorRequest {
  string actor_id = 1;
  string idempotency_key = 2;
}

message DeleteActorResponse {}

message EffectId {
  string actor_id = 1;
  uint64 checkpoint_sequence = 2;
  uint32 index_in_outbox = 3;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message Header {
  string name = 1;
  string value = 2;
}

message InspectActorRequest {
  string actor_id = 1;
}

message InspectActorResponse {
  ActorObservation actor = 1;
}

message InvokeActorRequest {
  string actor_id = 1;
  string method = 2;
  string url = 3;
  bytes body = 4;
  repeated Header headers = 5;
}

message InvokeActorResponse {
  uint32 status = 1;
  bytes body = 2;
  repeated Header headers = 3;
}

message RemoveSubscriptionRequest {
  string actor_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
}

message RemoveSubscriptionResponse {
  ActorObservation actor = 1;
}

message ResumeSubscriptionRequest {
  string actor_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
}

message ResumeSubscriptionResponse {
  ActorObservation actor = 1;
}

message Send {
  EffectId effect_id = 1;
  string connection_id = 2;
  oneof payload {
    string text = 3;
    bytes binary = 4;
  }
}

message SetAttachment {
  EffectId effect_id = 1;
  string connection_id = 2;
  bytes attachment = 3;
}

message SetAutoResponse {
  EffectId effect_id = 1;
  SocketScope scope = 2;
  SocketAutoResponseUpdate setting = 3;
}

message SetTags {
  EffectId effect_id = 1;
  string connection_id = 2;
  repeated string tags = 3;
}

message SocketAccept {
  optional string subprotocol = 1;
  bytes attachment = 2;
  repeated string tags = 3;
}

message SocketAutoResponse {
  string request = 1;
  string response = 2;
}

message SocketAutoResponseUpdate {
  oneof value {
    SocketAutoResponse pair = 1;
    bool clear = 2;
  }
}

message SocketBroadcastTarget {
  oneof value {
    string tag = 1;
    SocketConnectionSet connections = 2;
  }
}

message SocketCheckpoint {
  uint64 checkpoint_sequence = 1;
  bytes state = 2;
  repeated SocketConnection connections = 3;
  repeated SocketEffect effects = 4;
  SocketAutoResponse auto_response = 5;
}

message SocketClose {
  uint64 offset = 1;
  uint32 code = 2;
  string reason = 3;
  SocketCloseInitiator initiator = 4;
}

message SocketConfig {
  uint32 max_frame_bytes = 1;
  uint32 max_connections = 2;
  uint32 inbound_buffer_bytes = 3;
  uint32 inbound_buffer_frames = 4;
  uint32 actor_buffer_bytes = 5;
}

message SocketConnectCapability {
  string binding = 1;
  repeated SocketHostRule rules = 2;
  repeated SocketSecretHeader headers = 3;
}

message SocketConnection {
  string connection_id = 1;
  bytes attachment = 2;
  repeated string tags = 3;
  uint64 delivered_offset = 4;
  bool outbound = 5;
  SocketAutoResponse auto_response = 6;
  optional uint64 last_auto_response_at = 7;
  SocketTransport transport = 8;
}

message SocketConnectionSet {
  repeated string connection_ids = 1;
}

message SocketDecision {
  oneof value {
    SocketAccept accept = 1;
    SocketReject reject = 2;
  }
}

message SocketEffect {
  oneof value {
    Send send = 1;
    Close close = 2;
    Broadcast broadcast = 3;
    SetAutoResponse set_auto_response = 4;
    SetTags set_tags = 5;
    SetAttachment set_attachment = 6;
    Connect connect = 7;
  }
}

message SocketError {
  uint64 offset = 1;
  string code = 2;
  string message = 3;
}

message SocketEvent {
  oneof value {
    SocketOpen open = 1;
    SocketMessage message = 2;
    SocketClose close = 3;
    SocketError error = 4;
    SocketReconnecting reconnecting = 5;
  }
}

message SocketHostRule {
  string host = 1;
  repeated SocketPortRange ports = 2;
}

message SocketKeepalive {
  SocketPayload frame = 1;
  uint64 interval_ms = 2;
}

message SocketMessage {
  uint64 offset = 1;
  oneof payload {
    string text = 2;
    bytes binary = 3;
  }
}

message SocketMetering {
  string actor_id = 1;
  optional string connection_id = 2;
  uint64 wakes = 3;
  uint64 messages_in = 4;
  uint64 messages_out = 5;
  uint64 bytes_in = 6;
  uint64 bytes_out = 7;
  double real_socket_seconds = 8;
  double buffered_byte_seconds = 9;
  uint64 auto_responses = 10;
  uint64 protocol_pings = 11;
}

message SocketOpen {
  string actor_id = 1;
  string connection_id = 2;
  optional string app_channel = 3;
  repeated string subprotocols = 4;
  repeated Header headers = 5;
  uint64 resume_after = 6;
  bool reconnected = 7;
  SocketTransport transport = 9;
}

message SocketPayload {
  oneof value {
    string text = 1;
    bytes binary = 2;
  }
}

message SocketPortRange {
  uint32 first = 1;
  uint32 last = 2;
}

message SocketReconnect {
  SocketReconnectMode mode = 1;
  uint32 initial_ms = 2;
  uint32 max_ms = 3;
  double multiplier = 4;
  double jitter = 5;
  uint32 max_attempts = 6;
}

message SocketReconnecting {
  uint64 attempt = 1;
  uint32 delay_ms = 2;
}

message SocketReject {
  uint32 status = 1;
  string reason = 2;
}

message SocketScope {
  oneof value {
    bool actor = 1;
    string connection_id = 2;
  }
}

message SocketSecretHeader {
  string name = 1;
  string secret_binding = 2;
}

message SubscriptionObservation {
  string subscription_id = 1;
  string stream_path = 2;
  SubscriptionState state = 3;
  uint64 delivered_cursor = 4;
  uint64 completed_cursor = 5;
  uint64 recoverable_cursor = 6;
  bool placement_anchor = 7;
  uint32 retry_count = 8;
  string failure_code = 9;
  optional uint64 failed_cursor = 10;
}

message SubscriptionSpec {
  string subscription_id = 1;
  string stream_path = 2;
  SubscriptionStart start = 3;
  bool placement_anchor = 4;
}

message SubscriptionStart {
  oneof start {
    uint64 cursor = 1;
    bool current_head = 2;
  }
}

message UpdateActorRequest {
  string actor_id = 1;
  bytes code_sha256 = 2;
  repeated Binding bindings = 3;
  ActorLimits limits = 4;
  uint64 expected_configuration_revision = 5;
  string idempotency_key = 6;
}

message UpdateActorResponse {
  ActorObservation actor = 1;
}

service ActorsService {
  rpc CreateActor(CreateActorRequest) returns (CreateActorResponse);
  rpc UpdateActor(UpdateActorRequest) returns (UpdateActorResponse);
  rpc InspectActor(InspectActorRequest) returns (InspectActorResponse);
  rpc AddSubscription(AddSubscriptionRequest) returns (AddSubscriptionResponse);
  rpc RemoveSubscription(RemoveSubscriptionRequest) returns (RemoveSubscriptionResponse);
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse);
  rpc CheckpointActor(CheckpointActorRequest) returns (CheckpointActorResponse);
  rpc InvokeActor(InvokeActorRequest) returns (InvokeActorResponse);
  rpc DeleteActor(DeleteActorRequest) returns (DeleteActorResponse);
}
