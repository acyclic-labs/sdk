syntax = "proto3";
package inference.customer.v1;

import "validation/v1/options.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/inference/v1;inferencev1";

service ModelsService {
  rpc List(ListModelsRequest) returns (ListModelsResponse) {
    option (acyclic.validation.v1.http_path) = "models/list";
  }
}

message ListModelsRequest {}
message ListModelsResponse {
  repeated ModelCapability models = 1 [
    (acyclic.validation.v1.min_items) = 1,
    (acyclic.validation.v1.max_items) = 4096
  ];
}
message ModelCapability {
  string model = 1 [(acyclic.validation.v1.nonempty_max_bytes) = 256];
  bytes execution_profile = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  uint64 maximum_context = 3 [(acyclic.validation.v1.positive_uint64) = true];
  uint64 maximum_output = 4 [(acyclic.validation.v1.positive_uint64) = true];
  repeated string features = 5 [
    (acyclic.validation.v1.min_items) = 1,
    (acyclic.validation.v1.max_items) = 64,
    (acyclic.validation.v1.nonempty_max_item_bytes) = 64
  ];
  repeated RetentionProfile retention_profiles = 6 [(acyclic.validation.v1.max_items) = 64];
  // Paid KV pin policies; duration bounds apply to idle_timeout_ms.
  repeated RetentionProfile idle_kv_profiles = 7 [(acyclic.validation.v1.max_items) = 64];
}

message RetentionProfile {
  bytes profile = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  uint64 minimum_duration_ms = 2 [(acyclic.validation.v1.positive_uint64) = true];
  uint64 maximum_duration_ms = 3;
}

// Immutable canonical content operations. Execution/retention guarantees are
// advertised separately; these methods do not admit a Run or a warm promise.
service ContextsService {
  rpc Create(CreateContextRequest) returns (MutationReceipt) {
    option (acyclic.validation.v1.http_path) = "contexts/create";
  }
  rpc Inspect(InspectContextRequest) returns (ContextView) {
    option (acyclic.validation.v1.http_path) = "contexts/inspect";
  }
  rpc Mutate(MutateContextRequest) returns (MutationReceipt) {
    option (acyclic.validation.v1.http_path) = "contexts/mutate";
  }
}

// Customer warm-retention commitments. Placement, workers, allocations,
// migration, rebalancing, and cleanup mechanics remain private.
service WarmContextsService {
  rpc Retain(RetainWarmRequest) returns (WarmView) {
    option (acyclic.validation.v1.http_path) = "warm/retain";
  }
  rpc Inspect(InspectWarmRequest) returns (WarmView) {
    option (acyclic.validation.v1.http_path) = "warm/inspect";
  }
  rpc Renew(RenewWarmRequest) returns (WarmView) {
    option (acyclic.validation.v1.http_path) = "warm/renew";
  }
  rpc Release(ReleaseWarmRequest) returns (WarmView) {
    option (acyclic.validation.v1.http_path) = "warm/release";
  }
}

message RetainWarmRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  bytes context = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  // Legacy absolute-expiry policy. Mutually exclusive with idle_kv.
  bytes latency_profile = 3;
  uint64 expires_at_ms = 4;
  IdleKvPolicy idle_kv = 5;
}

// Paid retention of verified KV, without capacity, throughput or latency guarantees.
// Only verified actual Run reuse of the pinned revision or descendant prefix
// advances last-use. Fork, edit, admission, inspect and recovery do not move the
// pin or reset its idle window. Retried identities return committed receipts.
message IdleKvPolicy {
  bytes profile = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  uint64 idle_timeout_ms = 2 [(acyclic.validation.v1.positive_uint64) = true];
}

message IdleKvRetention {
  IdleKvPolicy policy = 1 [(acyclic.validation.v1.required_message) = true];
  // Trusted service Unix milliseconds after verified initial KV pin.
  uint64 retained_at_ms = 2 [(acyclic.validation.v1.positive_uint64) = true];
  // Absent until verified actual reuse; never inferred from admission.
  optional uint64 last_used_at_ms = 3 [(acyclic.validation.v1.positive_uint64) = true];
  // The authoritative Run that verified actual reuse of this pinned revision
  // or its descendant prefix, in the same authenticated owner scope.
  optional bytes last_run_id = 4 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
}

message InspectWarmRequest {
  bytes commitment = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

message RenewWarmRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  bytes commitment = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  uint64 expires_at_ms = 3;
  // Changes timeout from last actual use, or retained_at_ms before first use.
  // Does not reset the idle window. Expired/released pins require a new Retain
  // identity; renew/replay cannot resurrect them. Inspect reports current state.
  optional uint64 idle_timeout_ms = 4 [(acyclic.validation.v1.positive_uint64) = true];
}

message ReleaseWarmRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  bytes commitment = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

enum WarmState {
  WARM_STATE_UNSPECIFIED = 0;
  WARM_STATE_ACTIVE = 1;
  WARM_STATE_EXPIRED = 2;
  WARM_STATE_BREACHED = 3;
  WARM_STATE_RELEASED = 4;
}

message WarmView {
  bytes commitment = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes context = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes model_profile = 3 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes latency_profile = 4;
  uint64 expires_at_ms = 5 [(acyclic.validation.v1.positive_uint64) = true];
  WarmState state = 6 [(acyclic.validation.v1.known_nonzero_enum) = true];
  bytes evidence_digest = 7 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes admission_receipt_id = 8 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  uint64 sequence = 9 [(acyclic.validation.v1.positive_uint64) = true];
  // Present only for idle KV pins; latency_profile is then empty. expires_at_ms
  // equals checked (last_used_at_ms or retained_at_ms) + idle_timeout_ms.
  IdleKvRetention idle_kv = 10;
}

// Recoverable logical generation. Distribution, placement, migration, cache,
// and worker identities are intentionally absent.
service RunsService {
  rpc Generate(GenerateRunRequest) returns (GenerateRunResponse) {
    option (acyclic.validation.v1.http_path) = "runs/generate";
  }
  rpc Inspect(InspectRunRequest) returns (RunView) {
    option (acyclic.validation.v1.http_path) = "runs/inspect";
  }
  rpc Watch(WatchRunRequest) returns (stream RunEvent) {
    option (acyclic.validation.v1.http_path) = "runs/watch";
  }
  rpc Cancel(InspectRunRequest) returns (RunView) {
    option (acyclic.validation.v1.http_path) = "runs/cancel";
  }
}

// Immutable, recoverable evaluation admissions. Candidate execution and grader
// placement remain private; the customer contract contains only exact artifacts,
// bounded suite inputs, metric semantics, and content-addressed observations.
service EvaluationsService {
  rpc Create(CreateEvaluationRequest) returns (EvaluationView) {
    option (acyclic.validation.v1.http_path) = "evaluations/create";
  }
  rpc Inspect(InspectEvaluationRequest) returns (EvaluationView) {
    option (acyclic.validation.v1.http_path) = "evaluations/inspect";
  }
}

message EvaluationArtifact {
  bytes digest = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  string media_type = 2 [(acyclic.validation.v1.nonempty_max_bytes) = 256];
  uint64 logical_size = 3 [(acyclic.validation.v1.positive_uint64) = true];
}

message EvaluationCase {
  bytes case_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  bytes input = 2;
  optional bytes input_artifact_digest = 3 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

message EvaluationSuite {
  string identity = 1 [(acyclic.validation.v1.nonempty_max_bytes) = 256];
  bytes digest = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  repeated EvaluationCase cases = 3 [
    (acyclic.validation.v1.min_items) = 1,
    (acyclic.validation.v1.max_items) = 4096
  ];
}

message EvaluationGrader {
  bytes handle = 1 [(acyclic.validation.v1.nonempty_max_bytes) = 4096];
  bytes artifact_digest = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

enum EvaluationAggregation {
  EVALUATION_AGGREGATION_UNSPECIFIED = 0;
  EVALUATION_AGGREGATION_MEAN = 1;
  EVALUATION_AGGREGATION_SUM = 2;
  EVALUATION_AGGREGATION_MINIMUM = 3;
  EVALUATION_AGGREGATION_MAXIMUM = 4;
}

message EvaluationMetric {
  string identity = 1 [(acyclic.validation.v1.nonempty_max_bytes) = 256];
  EvaluationAggregation aggregation = 2 [(acyclic.validation.v1.known_nonzero_enum) = true];
}

message EvaluationSpec {
  repeated EvaluationArtifact candidates = 1 [
    (acyclic.validation.v1.min_items) = 1,
    (acyclic.validation.v1.max_items) = 256
  ];
  EvaluationSuite suite = 2 [(acyclic.validation.v1.required_message) = true];
  EvaluationGrader grader = 3 [(acyclic.validation.v1.required_message) = true];
  repeated EvaluationMetric metrics = 4 [
    (acyclic.validation.v1.min_items) = 1,
    (acyclic.validation.v1.max_items) = 64
  ];
  uint64 maximum_case_results = 5 [
    (acyclic.validation.v1.positive_uint64) = true,
    (acyclic.validation.v1.max_uint64) = 65536
  ];
  bytes spec_digest = 6 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

message CreateEvaluationRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  EvaluationSpec spec = 2 [(acyclic.validation.v1.required_message) = true];
}

message InspectEvaluationRequest {
  bytes evaluation_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
}

message ExactRational {
  sint64 numerator = 1;
  uint64 denominator = 2 [(acyclic.validation.v1.positive_uint64) = true];
}

message EvaluationMetricValue {
  string metric_identity = 1;
  ExactRational value = 2 [(acyclic.validation.v1.required_message) = true];
}

enum EvaluationCaseOutcome {
  EVALUATION_CASE_OUTCOME_UNSPECIFIED = 0;
  EVALUATION_CASE_OUTCOME_SCORED = 1;
  EVALUATION_CASE_OUTCOME_CANDIDATE_FAILED = 2;
  EVALUATION_CASE_OUTCOME_GRADER_FAILED = 3;
}

message EvaluationCaseResult {
  bytes candidate_digest = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes case_id = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  EvaluationGraderObservation observation = 3 [(acyclic.validation.v1.required_message) = true];
  repeated EvaluationMetricValue metrics = 4;
  EvaluationCaseOutcome outcome = 5 [(acyclic.validation.v1.known_nonzero_enum) = true];
}

// The binding is SHA-256("acyclic.inference.grader-observation.v1\0" ||
// native_output_digest || observation_digest). It proves which exact native
// device output the grader observed without exposing either payload.
message EvaluationGraderObservation {
  bytes native_output_digest = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes observation_digest = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes binding_digest = 3 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

message EvaluationAggregate {
  bytes candidate_digest = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  string metric_identity = 2;
  EvaluationAggregation aggregation = 3 [(acyclic.validation.v1.known_nonzero_enum) = true];
  ExactRational value = 4 [(acyclic.validation.v1.required_message) = true];
}

message EvaluationResult {
  bytes spec_digest = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  repeated EvaluationCaseResult case_results = 2;
  repeated EvaluationAggregate aggregates = 3;
  bytes result_digest = 4 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

enum EvaluationState {
  EVALUATION_STATE_UNSPECIFIED = 0;
  EVALUATION_STATE_ADMITTED = 1;
  EVALUATION_STATE_RUNNING = 2;
  EVALUATION_STATE_COMPLETED = 3;
  EVALUATION_STATE_FAILED = 4;
  EVALUATION_STATE_CANCELLED = 5;
}

message EvaluationView {
  bytes evaluation_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  EvaluationSpec spec = 2 [(acyclic.validation.v1.required_message) = true];
  EvaluationState state = 3 [(acyclic.validation.v1.known_nonzero_enum) = true];
  optional EvaluationResult result = 4;
  uint64 sequence = 5 [(acyclic.validation.v1.positive_uint64) = true];
}

message RequestIdentity {
  bytes client_instance = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  bytes request_id = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_INSTRUCTION = 1;
  ITEM_KIND_SYSTEM = 2;
  ITEM_KIND_DEVELOPER = 3;
  ITEM_KIND_USER = 4;
  ITEM_KIND_ASSISTANT = 5;
  ITEM_KIND_TOOL_DEFINITION = 6;
  ITEM_KIND_TOOL_CALL = 7;
  ITEM_KIND_TOOL_RESULT = 8;
  ITEM_KIND_IMAGE = 9;
  ITEM_KIND_AUDIO = 10;
  ITEM_KIND_FILE = 11;
  ITEM_KIND_CONTINUATION = 12;
}

message Item {
  bytes id = 1;
  ItemKind kind = 2;
  bytes payload = 3;
  // Exactly one logical link for tool call/result; absent for all other kinds.
  bytes link = 4;
  // Only a continuation may contain its exact originating execution profile.
  bytes continuation_profile = 5;
}

message CreateContextRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  string model = 2;
  repeated Item items = 3;
}

message InspectContextRequest {
  bytes revision = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}
message Empty {}
message Insert {
  bytes target = 1;
  Item item = 2;
}
message Replace {
  bytes target = 1;
  bytes payload = 2;
}
message Edit {
  oneof action {
    Item append = 1;
    Insert insert_before = 2;
    Insert insert_after = 3;
    Replace replace = 4;
    bytes delete = 5;
  }
}
message Edits {
  repeated Edit edits = 1;
}
message Truncate {
  optional bytes through = 1;
}
message Compact {
  repeated bytes selected = 1;
  repeated Item replacement = 2;
}
message Transfer {
  string model = 1;
}
message MutateContextRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  bytes source = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  oneof action {
    option (acyclic.validation.v1.required_oneof) = true;
    Edits edit = 3;
    Empty fork = 4;
    Truncate truncate = 5;
    Compact compact = 6;
    Empty release = 7;
    Transfer transfer = 8;
  }
}

message MutationReceipt {
  bytes revision = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes command_digest = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  uint64 sequence = 3 [(acyclic.validation.v1.positive_uint64) = true];
  // The recorded command's effect, not a promise of current or warm retention.
  bool retained = 4;
}
message ContextView {
  bytes revision = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  optional bytes parent = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes lineage = 3 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes execution_profile = 4 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes content_digest = 5 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  repeated Item items = 6;
  string model = 7 [(acyclic.validation.v1.nonempty_max_bytes) = 256];
  ContextProvenance provenance = 8 [(acyclic.validation.v1.required_message) = true];
}

message ContextProvenance {
  oneof origin {
    option (acyclic.validation.v1.required_oneof) = true;
    Empty created = 1;
    ProvenanceSource derived = 2;
    ProvenanceSource forked = 3;
    TransferProvenance transferred = 4;
    GenerationProvenance generated = 5;
    RunInputProvenance run_input = 6;
  }
}
message ProvenanceSource {
  bytes source = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}
message TransferProvenance {
  bytes source = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bool reused_compatible_state = 2;
}
message GenerationProvenance {
  bytes run_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  bytes terminal_receipt_digest = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}
message RunInputProvenance {
  bytes source = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes run_id = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  uint64 maximum_output = 3 [(acyclic.validation.v1.positive_uint64) = true];
  optional uint64 seed = 4;
}

message GenerateRunRequest {
  RequestIdentity identity = 1 [(acyclic.validation.v1.required_message) = true];
  bytes context = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  Item input = 3 [(acyclic.validation.v1.required_message) = true];
  uint64 maximum_output = 4 [(acyclic.validation.v1.positive_uint64) = true];
  optional uint64 seed = 5;
}

message GenerateRunResponse {
  RunView run = 1 [(acyclic.validation.v1.required_message) = true];
}
message InspectRunRequest {
  bytes run_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
}
message WatchRunRequest {
  bytes run_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  // Inclusive, zero-based public cursor.
  uint64 from_sequence = 2;
}

enum RunTerminal {
  RUN_TERMINAL_UNSPECIFIED = 0;
  RUN_TERMINAL_COMPLETED = 1;
  RUN_TERMINAL_OUTPUT_LIMITED = 2;
  RUN_TERMINAL_TOOL_CALL = 3;
  RUN_TERMINAL_REFUSAL = 4;
  RUN_TERMINAL_CANCELLED = 5 [(acyclic.validation.v1.partial_terminal) = true];
  RUN_TERMINAL_FAILED = 6 [(acyclic.validation.v1.partial_terminal) = true];
  RUN_TERMINAL_INDETERMINATE = 7 [(acyclic.validation.v1.partial_terminal) = true];
}

message LogicalUsage {
  // Prompt tokens newly computed at this Run's first verified execution.
  // Frozen with effective_context_reads as a partition of the exact rendered
  // prompt-token total, bound by native tokenizer/render/model/runtime/KV proof.
  // Recovery, retry and replay never reclassify or add to this input partition.
  uint64 new_prefill = 1;
  // Uniquely committed native output-token records, counted once. Decoded UTF-8
  // bytes or re-tokenization cannot establish this count. A non-output EOS
  // sentinel is excluded; persisted special/stop output records require explicit
  // meter-revision semantics. Failed/discarded pre-checkpoint device work has no
  // agreed eligibility rule here and must not be inferred as zero eligible work.
  uint64 generated_output = 2;
  // Prompt tokens actually served from verified KV reuse in the same frozen
  // first-execution partition. Together with new_prefill this equals the exact
  // rendered prompt-token total; repeated admission/watch adds no new units.
  uint64 effective_context_reads = 3;
  // Logical Context retention measure. Logical custody identity,
  // interval events, pending-intent eligibility and dedup scope remain unagreed.
  // Neither device/cache allocations nor Objects physical storage establish
  // this measure; absent lifecycle evidence must not imply zero eligible work.
  uint64 retained_byte_millis = 4;
}

message UsageReceipt {
  bytes receipt_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes model_profile = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  bytes meter_revision = 3 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  // Immutable final totals for this receipt, never an incremental charge delta.
  // Meter semantics are independent of pricing or charging authorization.
  LogicalUsage usage = 4 [(acyclic.validation.v1.required_message) = true];
  bytes rate_card_revision = 5 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}

message RunResult {
  bytes output = 1;
  optional ContextView context = 2;
  RunTerminal terminal = 3 [(acyclic.validation.v1.known_nonzero_enum) = true];
  optional UsageReceipt receipt = 4;
}

message RunView {
  bytes run_id = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 16];
  bytes input = 2 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
  string model = 3 [(acyclic.validation.v1.nonempty_max_bytes) = 256];
  uint64 last_sequence = 4;
  bool cancellation_requested = 5;
  optional RunResult result = 6;
}

message RunEvent {
  uint64 sequence = 1;
  oneof event {
    option (acyclic.validation.v1.required_oneof) = true;
    bytes output = 2;
    // Authoritative cumulative snapshot for this Run. Recovered/replayed watch
    // events are snapshots of the same units, never incremental charge deltas.
    LogicalUsage usage = 3;
    RunTerminal terminal = 4 [(acyclic.validation.v1.known_nonzero_enum) = true];
    RunProgress progress = 5;
  }
}

message RunProgress {
  string kind = 1;
}
