syntax = "proto3";

package acyclic.objects.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/objects/v1;objectsv1";

message BucketRef {
  string bucket_id = 1;
  string name = 2;
}

message SnapshotRef {
  string snapshot_id = 1;
  string source_bucket_id = 2;
}

message ReadTarget {
  oneof target {
    BucketRef bucket = 1;
    SnapshotRef snapshot = 2;
  }
}

message ObjectMetadata {
  string content_type = 1;
  map<string, string> user = 2;
  string content_encoding = 3;
  string cache_control = 4;
  string content_disposition = 5;
  string content_language = 6;
  optional int64 expires_unix_seconds = 7;
}

message Preconditions {
  oneof condition {
    bool if_absent = 1;
    string if_match = 2;
    string if_version = 3;
  }
}

message MutationIdentity {
  string idempotency_key = 1;
}

message Bucket {
  BucketRef bucket = 1;
  google.protobuf.Timestamp created_at = 2;
}

message CreateBucketRequest {
  string name = 1;
  MutationIdentity mutation = 2;
}

message HeadBucketRequest {
  BucketRef bucket = 1;
}

message DeleteBucketRequest {
  BucketRef bucket = 1;
  MutationIdentity mutation = 2;
}

message DeleteBucketResponse {
  bool existed = 1;
}

service BucketsService {
  rpc CreateBucket(CreateBucketRequest) returns (Bucket);
  rpc HeadBucket(HeadBucketRequest) returns (Bucket);
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse);
}

message PutObjectHeader {
  BucketRef bucket = 1;
  string object_key = 2;
  ObjectMetadata metadata = 3;
  Preconditions preconditions = 4;
  MutationIdentity mutation = 5;
}

message PutObjectRequest {
  oneof frame {
    PutObjectHeader header = 1;
    bytes body = 2;
  }
}

message ObjectVersion {
  string version_id = 1;
  string etag = 2;
  uint64 size = 3;
  bool delete_marker = 4;
  ObjectMetadata metadata = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetObjectRequest {
  ReadTarget target = 1;
  string object_key = 2;
  string version_id = 3;
  uint64 range_start = 4;
  optional uint64 range_end_inclusive = 5;
  string if_match = 6;
  string if_none_match = 7;
}

message GetObjectResponse {
  oneof frame {
    ObjectVersion version = 1;
    bytes body = 2;
  }
}

message HeadObjectRequest {
  ReadTarget target = 1;
  string object_key = 2;
  string version_id = 3;
  string if_match = 4;
  string if_none_match = 5;
}

message HeadObjectResponse {
  ObjectVersion version = 1;
}

message DeleteObjectRequest {
  BucketRef bucket = 1;
  string object_key = 2;
  string version_id = 3;
  Preconditions preconditions = 4;
  MutationIdentity mutation = 5;
}

message DeleteObjectResponse {
  bool existed = 1;
  ObjectVersion version = 2;
}

enum ListingMode {
  LISTING_MODE_UNSPECIFIED = 0;
  LISTING_MODE_CURRENT = 1;
  LISTING_MODE_VERSIONS = 2;
}

message ListObjectsRequest {
  ReadTarget target = 1;
  string prefix = 2;
  string delimiter = 3;
  ListingMode mode = 4;
  uint32 page_size = 5;
  string continuation_token = 6;
}

message ListEntry {
  string object_key = 1;
  ObjectVersion version = 2;
}

message ListObjectsResponse {
  repeated ListEntry entries = 1;
  repeated string common_prefixes = 2;
  string continuation_token = 3;
}

service ObjectsService {
  rpc PutObject(stream PutObjectRequest) returns (ObjectVersion);
  rpc GetObject(GetObjectRequest) returns (stream GetObjectResponse);
  rpc HeadObject(HeadObjectRequest) returns (HeadObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
}

message CreateMultipartRequest {
  BucketRef bucket = 1;
  string object_key = 2;
  ObjectMetadata metadata = 3;
  Preconditions preconditions = 4;
  MutationIdentity mutation = 5;
}

message MultipartUpload {
  string upload_id = 1;
}

message UploadPartHeader {
  BucketRef bucket = 1;
  string object_key = 2;
  string upload_id = 3;
  uint32 part_number = 4;
  MutationIdentity mutation = 5;
}

message UploadPartRequest {
  oneof frame {
    UploadPartHeader header = 1;
    bytes body = 2;
  }
}

message UploadedPart {
  uint32 part_number = 1;
  string etag = 2;
  uint64 size = 3;
}

message ListPartsRequest {
  BucketRef bucket = 1;
  string object_key = 2;
  string upload_id = 3;
}

message ListPartsResponse {
  repeated UploadedPart parts = 1;
}

message CompleteMultipartRequest {
  BucketRef bucket = 1;
  string object_key = 2;
  string upload_id = 3;
  repeated UploadedPart parts = 4;
  MutationIdentity mutation = 5;
}

message AbortMultipartRequest {
  BucketRef bucket = 1;
  string object_key = 2;
  string upload_id = 3;
  MutationIdentity mutation = 4;
}

message AbortMultipartResponse {
  bool existed = 1;
}

service MultipartService {
  rpc CreateMultipart(CreateMultipartRequest) returns (MultipartUpload);
  rpc UploadPart(stream UploadPartRequest) returns (UploadedPart);
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
  rpc CompleteMultipart(CompleteMultipartRequest) returns (ObjectVersion);
  rpc AbortMultipart(AbortMultipartRequest) returns (AbortMultipartResponse);
}

message Snapshot {
  SnapshotRef snapshot = 1;
  google.protobuf.Timestamp created_at = 2;
}

message CreateSnapshotRequest {
  BucketRef bucket = 1;
  MutationIdentity mutation = 2;
}

message DestroySnapshotRequest {
  SnapshotRef snapshot = 1;
  MutationIdentity mutation = 2;
}

message DestroySnapshotResponse {
  bool existed = 1;
}

message ForkSnapshotRequest {
  SnapshotRef snapshot = 1;
  string destination_name = 2;
  MutationIdentity mutation = 3;
}

message ForkBucketRequest {
  BucketRef source = 1;
  string destination_name = 2;
  MutationIdentity mutation = 3;
}

service SnapshotsService {
  rpc CreateSnapshot(CreateSnapshotRequest) returns (Snapshot);
  rpc DestroySnapshot(DestroySnapshotRequest) returns (DestroySnapshotResponse);
  rpc ForkSnapshot(ForkSnapshotRequest) returns (Bucket);
  rpc ForkBucket(ForkBucketRequest) returns (Bucket);
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_PRECONDITION_FAILED = 4;
  ERROR_CODE_IDEMPOTENCY_MISMATCH = 5;
  ERROR_CODE_TOKEN_EXPIRED = 6;
  ERROR_CODE_QUOTA_EXCEEDED = 7;
  ERROR_CODE_UNSUPPORTED = 8;
  ERROR_CODE_UNAVAILABLE = 9;
}

message ErrorDetail {
  ErrorCode code = 1;
  string request_id = 2;
}
