[package]
name = "rust-metadata-prototypes"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6.0.0", features = ["macros"] }
schemars = { version = "1.2.2", features = ["derive"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
typeshare-core = "1.13.4"
