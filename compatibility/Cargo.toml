[package]
name = "acyclic-proto-build"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
description = "Shared build-time protobuf configuration for Acyclic SDK crates"
include = ["Cargo.toml", "build.rs", "src/**", "proto/**", "descriptors/*.bin"]

[dependencies]
acyclic-auth-action = { version = "=0.2.0", path = "../rust/crates/auth-action" }
prost.workspace = true
prost-reflect.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
tonic-prost-build.workspace = true

[build-dependencies]
protoc-bin-vendored-linux-x86_32 = "=3.3.0"
protoc-bin-vendored-linux-x86_64 = "=3.3.0"
protoc-bin-vendored-linux-aarch_64 = "=3.3.0"
protoc-bin-vendored-linux-ppcle_64 = "=3.3.0"
protoc-bin-vendored-linux-s390_64 = "=3.3.0"
protoc-bin-vendored-macos-x86_64 = "=3.3.0"
protoc-bin-vendored-macos-aarch_64 = "=3.3.0"
protoc-bin-vendored-win32 = "=3.3.0"

# Bazel sets each build-script variable to a vendored file for the configured
# platform, as `package/path`; any other platform fails to configure.
[package.metadata.bazel.build-script-env.linux-x86_64]
PROTOC = "protoc-bin-vendored-linux-x86_64/bin/protoc"
PROTOC_INCLUDE = "protoc-bin-vendored-linux-x86_64/include"

[package.metadata.bazel.build-script-env.macos-aarch64]
PROTOC = "protoc-bin-vendored-macos-aarch_64/bin/protoc"
PROTOC_INCLUDE = "protoc-bin-vendored-macos-aarch_64/include"

[package.metadata.bazel.build-script-env.windows-x86_64]
PROTOC = "protoc-bin-vendored-win32/bin/protoc.exe"
PROTOC_INCLUDE = "protoc-bin-vendored-win32/include"

[lints]
workspace = true

[dev-dependencies]
acyclic-test-support = { path = "../rust/crates/test-support" }
prost-types.workspace = true
proptest.workspace = true
