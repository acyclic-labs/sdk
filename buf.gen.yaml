version: v2
clean: true
plugins:
  - local: [cargo, run, --quiet, --locked, --package, sdk-proto-codegen, --, prost]
    out: generated/rust
    strategy: all
  - local: [cargo, run, --quiet, --locked, --package, sdk-proto-codegen, --, tonic]
    out: generated/rust
    strategy: all
    types:
      - acyclic.filesystem.v2.FilesystemService
      - acyclic.filesystem.daemon.v2.FilesystemDaemonService
  - local: [bun, x, protoc-gen-es]
    out: generated/typescript
    strategy: all
    opt:
      - target=js+dts
      - import_extension=js
