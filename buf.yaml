version: v2
modules:
  - path: proto
  - path: rust/crates/stream/proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  # Peers must agree on the wire, but nothing depends on generated source
  # from earlier releases, so only wire and JSON compatibility is enforced.
  use:
    - WIRE_JSON
