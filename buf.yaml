version: v2
modules:
  - path: proto
  - path: rust/crates/stream/proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  # These established wire contracts use zero for unencoded bytes, a valid
  # codec rather than an unspecified value. Preserve their public names.
  ignore_only:
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/objects/v2/objects.proto
      - rust/crates/stream/proto/stream/v2/stream.proto
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
