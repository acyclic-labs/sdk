version: v2
modules:
  - path: rust/crates/auth/proto
  - path: rust/crates/objects/proto
    excludes:
      - rust/crates/objects/proto/validation
  - path: rust/crates/machines/proto
    excludes:
      - rust/crates/machines/proto/validation
  - path: rust/crates/actors/proto
    excludes:
      - rust/crates/actors/proto/validation
  - path: rust/crates/filesystem-wire/proto
    excludes:
      - rust/crates/filesystem-wire/proto/validation
      - rust/crates/filesystem-wire/proto/protocol
  - path: rust/crates/inference/proto
    excludes:
      - rust/crates/inference/proto/validation
  - path: rust/crates/harness-core/proto
  - path: rust/crates/stream/proto
    excludes:
      - rust/crates/stream/proto/validation
  - path: rust/crates/contract-derive/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
