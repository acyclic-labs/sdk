[workspace]
# Publishable SDK families, private qualification/binding crates, and the
# single product binary are listed explicitly so retired crates cannot return.
members = [
  "rust/crates/conformance",
  "rust/crates/filesystem",
  "rust/crates/filesystem-napi",
  "rust/crates/filesystem-wasm",
  "rust/crates/harness",
  "rust/crates/inference",
  "rust/crates/machines",
  "rust/crates/machines-daytona",
  "rust/crates/native-runtime",
  "rust/crates/objects",
  "rust/crates/proto-codegen",
  "rust/crates/stream",
  "plugin",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/sdk"
publish = true

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.2"
clap = { version = "4", features = ["derive", "env"] }
diffy = "0.4.2"
bytes = "1.10.1"
fs2 = "0.4.3"
futures = "0.3.31"
hex = "0.4.3"
http = "1.4.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
indexed_db_futures = { version = "0.6.4", features = ["tx-done", "typed-arrays"] }
jsonschema = { version = "0.55.0", default-features = false }
js-sys = "0.3.94"
napi = { version = "3.6.1", features = ["async", "napi8", "serde-json"] }
napi-derive = "3.3.3"
# The macOS FSEvents backend links CoreServices, which would load it into every
# process at start; acyclic-fs loads FSEvents itself when a watch starts.
notify = { version = "8.2.0", default-features = false, features = ["macos_kqueue"] }
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "0.16.3", features = ["serde"] }
protoc-bin-vendored = "3.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
s3s = "0.16.1"
schemars = "1"
serde-wasm-bindgen = "0.6.5"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
thiserror = "2.0.17"
subtle = "2.6.1"
sync_wrapper = { version = "=1.0.2", features = ["futures"] }
time = "0.3.55"
toml = "0.8"
tracing = "0.1.44"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-web = "0.14.2"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.25.0", features = ["js", "serde", "v4", "v7"] }
zeroize = "1.8.2"
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4.67"
web-sys = { version = "0.3.94", features = [
  "Blob",
  "DomException",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemHandle",
  "FileSystemWritableFileStream",
  "Navigator",
  "StorageManager",
  "Window",
  "WritableStream",
] }

[workspace.lints.rust]
# Native filesystem and generated FFI crates isolate reviewed platform calls
# with narrow module-level allowances; every other crate inherits denial.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
match_same_arms = "warn"
single_match_else = "warn"
if_not_else = "warn"
cast_possible_truncation = "warn"
string_slice = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
doc_markdown = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
unwrap_in_result = "warn"
fallible_impl_from = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
inefficient_to_string = "warn"
str_to_string = "warn"
map_unwrap_or = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
missing_panics_doc = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

[profile.release]
incremental = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
