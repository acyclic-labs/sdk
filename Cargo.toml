[workspace]
members = ["rust/crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/sdk"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
futures = "0.3.31"
hex = "0.4.3"
hyper-util = { version = "0.1.20", features = ["tokio"] }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5.3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
