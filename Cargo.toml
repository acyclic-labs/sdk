[workspace]
members = ["rust/crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/sdk"
publish = true

[workspace.dependencies]
async-trait = "0.1.89"
blake3 = "1.8.2"
bytes = "1.10.1"
fs2 = "0.4.3"
futures = "0.3.31"
hex = "0.4.3"
http = "1.4.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
indexed_db_futures = { version = "0.6.4", features = ["tx-done", "typed-arrays"] }
js-sys = "0.3.94"
napi = { version = "3.6.1", features = ["async", "napi8", "serde-json"] }
napi-derive = "3.3.3"
notify = "8.2.0"
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3.2.0"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
s3s = "0.13.0"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.9"
thiserror = "2.0.17"
subtle = "2.6.1"
sync_wrapper = { version = "=1.0.2", features = ["futures"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-web = "0.14.2"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.25.0", features = ["js", "serde", "v4", "v7"] }
zeroize = "1.8.2"
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4.67"
web-sys = { version = "0.3.94", features = [
  "Blob",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemHandle",
  "FileSystemWritableFileStream",
  "Navigator",
  "StorageManager",
  "Window",
  "WritableStream",
] }

[workspace.lints.rust]
# Native filesystem and generated FFI crates isolate reviewed platform calls
# with narrow module-level allowances; every other crate inherits denial.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
incremental = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
