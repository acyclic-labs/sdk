name: SDK Qualification

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit SHA to qualify
        required: false
        type: string
        default: ''
      release_tag:
        description: Release tag whose exact source is being qualified
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sdk-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  CI_HEAD_SHA: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
  FORCE: 'true'

jobs:
  plan:
    name: plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'release' &&
            github.event.release.tag_name || github.event.pull_request.head.sha
            || github.sha) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore preflight tools
        id: preflight-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tools
          key: sdk-preflight-tools-v1-gitleaks-8.30.1-${{ runner.os }}-${{ runner.arch }}

      # Signatures and secrets depend on the pushed commit range, not the tree,
      # so they run on every event and fail before any lane is scheduled.
      - name: Verify commit signatures and secrets
        shell: bash
        env:
          SDK_TEMP_DIR: ${{ runner.temp }}/sdk
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          TOOLS_DIR: ${{ runner.temp }}/tools/preflight-${{ runner.arch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_TAG:-}" ]]; then
            release_event="$SDK_TEMP_DIR/release-event.json"
            mkdir -p "$SDK_TEMP_DIR"
            RELEASE_TAG="$RELEASE_TAG" node -e \
              'process.stdout.write(JSON.stringify({release:{tag_name:process.env.RELEASE_TAG}}))' \
              >"$release_event"
            GITHUB_EVENT_NAME=release \
              GITHUB_REF="refs/tags/$RELEASE_TAG" \
              GITHUB_EVENT_PATH="$release_event" \
              bash scripts/qualify-ci.sh preflight
          else
            bash scripts/qualify-ci.sh preflight
          fi

      - name: Select lanes to execute
        id: select
        run: node scripts/plan-qualification.mjs select

      - name: Save preflight tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.preflight-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tools
          key: ${{ steps.preflight-tools.outputs.cache-primary-key }}

  qualification:
    name: ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: ${{ matrix.lane != 'windows-rust' && 'sccache' || '' }}
      SCCACHE_IDLE_TIMEOUT: '0'
      CARGO_BUILD_JOBS: ${{ matrix.workers }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.workers }}
      MAKEFLAGS: -j${{ matrix.workers }}
      RAYON_NUM_THREADS: ${{ matrix.workers }}
      RUST_TEST_THREADS: ${{ matrix.workers }}
    # Complete qualification is governed by bounded operations and resource
    # limits, not a wall-clock cutoff across cold builds and package verification.
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'release' &&
            github.event.release.tag_name || github.event.pull_request.head.sha
            || github.sha) }}
          fetch-depth: ${{ matrix.lane == 'policy' && '0' || '1' }}
          fetch-tags: ${{ matrix.lane == 'policy' }}
          persist-credentials: false

      - name: Run qualification lane
        uses: ./.github/actions/qualification-lane
        with:
          lane: ${{ matrix.lane }}
          cache_size: ${{ matrix.cache_size }}
          artifact: ${{ matrix.artifact }}
          artifact_path: ${{ matrix.artifact_path }}

  gate:
    name: SDK Qualification
    if: always()
    needs: [ plan, qualification ]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require every qualification lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$PLAN_RESULT" = success
          if test "$MATRIX" = '[]'; then
            test "$RESULT" = skipped
          else
            test "$RESULT" = success
          fi
