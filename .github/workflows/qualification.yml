name: SDK Qualification

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full qualification catches drift outside the repository (runner
    # images, registries, browsers) that lane fingerprints cannot observe.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Execute every lane even when its inputs already qualified
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FORCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force) }}

jobs:
  plan:
    name: plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      keys: ${{ steps.fingerprints.outputs.keys }}
      matrix: ${{ steps.select.outputs.matrix }}
      reused: ${{ steps.select.outputs.reused }}
      trusted: ${{ steps.select.outputs.trusted }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore preflight tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tools
          key: sdk-preflight-tools-v1-gitleaks-8.30.1-${{ runner.os }}-${{ runner.arch }}

      # Signatures and secrets depend on the pushed commit range, not the tree,
      # so they run on every event and fail before any lane is scheduled.
      - name: Verify commit signatures and secrets
        shell: bash
        env:
          SDK_TEMP_DIR: ${{ runner.temp }}/sdk
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          TOOLS_DIR: ${{ runner.temp }}/tools/preflight-${{ runner.arch }}
        run: bash scripts/qualify-ci.sh preflight

      - name: Fingerprint lane inputs
        id: fingerprints
        run: node scripts/plan-qualification.mjs fingerprints

      # A marker records the run that qualified a lane's exact inputs.
      - name: Find gate marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/gate.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['gate'] }}
      - name: Find linux marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['linux'] }}
      - name: Find web marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/web.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['web'] }}
      - name: Find linux-arm64 marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux-arm64.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['linux-arm64'] }}
      - name: Find linux-musl marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux-musl.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['linux-musl'] }}
      - name: Find linux-arm64-musl marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux-arm64-musl.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['linux-arm64-musl'] }}
      - name: Find windows marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/windows.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['windows'] }}
      - name: Find macos marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/macos.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['macos'] }}
      - name: Find policy marker
        if: env.FORCE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/policy.json
          key: ${{ fromJSON(steps.fingerprints.outputs.keys)['policy'] }}

      - name: Select lanes to execute
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plan-qualification.mjs select

  qualification:
    name: ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.workers }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.workers }}
      MAKEFLAGS: -j${{ matrix.workers }}
      RAYON_NUM_THREADS: ${{ matrix.workers }}
      RUST_TEST_THREADS: ${{ matrix.workers }}
      # Windows restores the compiler cache at ~70 MB/s rather than from
      # co-located storage, so bound it near one run's working set.
      SCCACHE_CACHE_SIZE: ${{ contains(matrix.runner, 'windows') && '3G' || '8G' }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Configure lane-local compiler cache
        shell: bash
        run: echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache" >> "$GITHUB_ENV"

      # Only compressed crate archives and indexes are cached: Cargo unpacks the
      # sources it needs far faster than a cache can restore them file by file.
      - name: Restore shared dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/bun-install-cache
          key: sdk-deps-v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'bun.lock', 'scripts/ensure-bun.sh', 'scripts/ensure-bun.ps1') }}
          restore-keys: |
            sdk-deps-v8-${{ runner.os }}-${{ runner.arch }}-

      # Windows restores caches and unpacks crates slowly, so it installs the
      # toolchain and unpacks locked crates in a detached process while the
      # compiler cache downloads; "Finish Windows Rust setup" joins it.
      - name: Start Windows Rust setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'rust-setup.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.94.0 --profile minimal --no-self-update --component clippy --component rustfmt
          rustup default 1.94.0
          rustup target add aarch64-pc-windows-msvc --toolchain 1.94.0
          cargo fetch --locked
          '@ | Set-Content -LiteralPath $setup
          $log = Join-Path $env:RUNNER_TEMP 'rust-setup.log'
          $process = Start-Process -FilePath (Get-Process -Id $PID).Path `
            -ArgumentList '-NoProfile', '-NonInteractive', '-File', $setup `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          "RUST_SETUP_PID=$($process.Id)" >> $env:GITHUB_ENV
          "CARGO_INCREMENTAL=0" >> $env:GITHUB_ENV

      - name: Install exact Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: ${{ matrix.lane == 'policy' && 'clippy,rustfmt' || '' }}

      # Every tool is installed under a versioned path or verified by its version
      # before use, so the first saved tools cache stays a safe starting point.
      # Bump the version when a pinned tool changes to refresh it.
      - name: Restore lane tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tools
          key: sdk-tools-v6-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}

      # Exact cache hits are reliable where prefix fallbacks are not, so compiler
      # output is keyed by the dependency graph alone: every run with the same
      # lockfile restores the same warm dependency objects, and workspace crates
      # recompile from source either way. Lane-local caches restore and save
      # once instead of contending on sccache object writes.
      - name: Restore lane build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sdk-build-v4-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            sdk-build-v4-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Find Visual Studio clang
        id: clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $found = $false
          if (Test-Path -LiteralPath $vswhere) {
            $path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
            $found = [bool]$path -and (Test-Path -LiteralPath (Join-Path $path 'VC\Tools\Llvm\x64\bin\clang.exe'))
          }
          "found=$($found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore Windows ARM64 compiler
        id: llvm-cache
        if: runner.os == 'Windows' && steps.clang.outputs.found != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/llvm
          key: sdk-llvm-v1-20.1.8-${{ runner.os }}-${{ runner.arch }}

      - name: Install Windows ARM64 compiler
        if: runner.os == 'Windows' && steps.clang.outputs.found != 'true'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 20.1.8
          directory: ${{ runner.temp }}/llvm
          cached: ${{ steps.llvm-cache.outputs.cache-hit }}
          env: false

      - name: Finish Windows Rust setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Get-Process -Id $env:RUST_SETUP_PID -ErrorAction SilentlyContinue
          if ($process) { $process.WaitForExit() }
          $log = Join-Path $env:RUNNER_TEMP 'rust-setup.log'
          Get-Content -LiteralPath $log, "$log.err" -ErrorAction SilentlyContinue | Write-Host
          rustc --version
          cargo fetch --locked --offline

      - name: Enable Windows ProjFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }

      - name: Run qualification lane
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_TEMP_DIR: ${{ runner.temp }}/sdk
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}-${{ runner.arch }}
        run: bash scripts/qualify-ci.sh "${{ matrix.lane }}"

      - name: Run Windows qualification lane
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_TEMP_DIR: ${{ runner.temp }}/sdk
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}-${{ runner.arch }}
          LLVM_PATH: ${{ runner.temp }}/llvm
        run: .\scripts\qualify-ci.ps1 -Lane windows

      - name: Retain qualified outputs
        if: matrix.artifact != '' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.artifact_path }}
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  record:
    name: record
    needs: [plan, qualification]
    if: always() && needs.plan.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Reused lanes publish the artifact their qualifying run retained, so
      # every successful run carries the complete artifact set under its own id.
      - name: Fetch reused lane outputs
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED: ${{ needs.plan.outputs.reused }}
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          while IFS=$'\t' read -r run artifact; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" \
              --dir "forward/${artifact%-*-*}" &
            pids+=("$!")
          done < <(jq -r 'to_entries[] | select(.value.artifact != "") | [.value.run_id, .value.artifact] | @tsv' <<<"$REUSED")
          for pid in "${pids[@]}"; do wait "$pid"; done

      - name: Forward coverage
        if: hashFiles('forward/coverage/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: forward/coverage
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Forward packages-linux
        if: hashFiles('forward/packages-linux/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: forward/packages-linux
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Forward packages-linux-arm64
        if: hashFiles('forward/packages-linux-arm64/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: forward/packages-linux-arm64
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Forward packages-macos
        if: hashFiles('forward/packages-macos/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: forward/packages-macos
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Record qualified lanes
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED: ${{ needs.plan.outputs.reused }}
          TRUSTED: ${{ needs.plan.outputs.trusted }}
        run: node scripts/plan-qualification.mjs record

      - name: Record gate
        if: contains(fromJSON(steps.record.outputs.recorded), 'gate')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/gate.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['gate'] }}
      - name: Record linux
        if: contains(fromJSON(steps.record.outputs.recorded), 'linux')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['linux'] }}
      - name: Record web
        if: contains(fromJSON(steps.record.outputs.recorded), 'web')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/web.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['web'] }}
      - name: Record linux-arm64
        if: contains(fromJSON(steps.record.outputs.recorded), 'linux-arm64')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux-arm64.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['linux-arm64'] }}
      - name: Record linux-musl
        if: contains(fromJSON(steps.record.outputs.recorded), 'linux-musl')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux-musl.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['linux-musl'] }}
      - name: Record linux-arm64-musl
        if: contains(fromJSON(steps.record.outputs.recorded), 'linux-arm64-musl')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/linux-arm64-musl.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['linux-arm64-musl'] }}
      - name: Record windows
        if: contains(fromJSON(steps.record.outputs.recorded), 'windows')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/windows.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['windows'] }}
      - name: Record macos
        if: contains(fromJSON(steps.record.outputs.recorded), 'macos')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/macos.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['macos'] }}
      - name: Record policy
        if: contains(fromJSON(steps.record.outputs.recorded), 'policy')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qualification/policy.json
          key: ${{ fromJSON(needs.plan.outputs.keys)['policy'] }}

  gate:
    name: SDK Qualification
    if: always()
    needs: [plan, qualification, record]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require every qualification lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RESULT: ${{ needs.qualification.result }}
          RECORD_RESULT: ${{ needs.record.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$RECORD_RESULT" = success
          if test "$MATRIX" = '[]'; then
            test "$RESULT" = skipped
          else
            test "$RESULT" = success
          fi
