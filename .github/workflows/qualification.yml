name: SDK Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  BUILD_SOURCEVERSION: ${{ github.sha }}
  SYSTEM_PULLREQUEST_SOURCECOMMITID: ${{ github.event.pull_request.head.sha || '' }}
  SYSTEM_PULLREQUEST_TARGETBRANCH: ${{ github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || '' }}

jobs:
  qualification:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            runner: blacksmith-32vcpu-ubuntu-2404
            timeout: 30
            history: 0
            artifact: packages-linux
          - lane: policy
            runner: blacksmith-8vcpu-ubuntu-2404
            timeout: 15
            history: 0
            artifact: ''
          - lane: web
            runner: blacksmith-16vcpu-ubuntu-2404
            timeout: 15
            history: 1
            artifact: ''
          - lane: linux-arm64
            runner: blacksmith-32vcpu-ubuntu-2404-arm
            timeout: 15
            history: 1
            artifact: packages-linux-arm64
          - lane: windows
            runner: blacksmith-32vcpu-windows-2025
            timeout: 15
            history: 1
            artifact: packages-windows
          - lane: macos
            runner: blacksmith-12vcpu-macos-15
            timeout: 15
            history: 1
            artifact: packages-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ matrix.history }}
          fetch-tags: false
          persist-credentials: false

      - name: Mount Cargo registry
        if: runner.os == 'Linux'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-cargo-registry-v1
          path: ~/.cargo/registry
      - name: Mount Cargo git database
        if: runner.os == 'Linux'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-cargo-git-v1
          path: ~/.cargo/git
      - name: Mount Rust toolchains
        if: runner.os == 'Linux'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-rustup-v1
          path: ~/.rustup
      - name: Mount build outputs
        if: runner.os == 'Linux'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-target-v1
          path: ${{ github.workspace }}/target
      - name: Mount pinned tools
        if: runner.os == 'Linux' && matrix.lane == 'policy'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-policy-${{ github.event.pull_request.number || 'main' }}-tools-v1
          path: ${{ runner.temp }}/tools

      - name: Restore non-Linux build state
        if: runner.os != 'Linux'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            ${{ github.workspace }}/.ci-tools
            ${{ github.workspace }}/target
          key: sdk-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'bun.lock') }}-v1
          restore-keys: |
            sdk-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Enable Windows Projected File System
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            $feature = Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -NoRestart
          }
          if ($feature.RestartNeeded) {
            throw 'Client-ProjFS requires a runner restart'
          }
          $library = Join-Path $env:SystemRoot 'System32\ProjectedFSLib.dll'
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw 'ProjectedFSLib.dll is unavailable after enabling Client-ProjFS'
          }

      - name: Run qualification lane
        if: runner.os != 'Windows'
        shell: bash
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}/sdk
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/artifacts
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}
        run: bash scripts/qualify-ci.sh "${{ matrix.lane }}"
      - name: Run Windows qualification lane
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}/sdk
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/artifacts
          TOOLS_DIR: ${{ runner.temp }}/tools/windows
        run: .\scripts\qualify-ci.ps1 -Lane windows

      - name: Retain qualified packages
        if: matrix.artifact != '' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  gate:
    name: SDK Qualification
    if: always()
    needs: qualification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require every qualification lane
        env:
          RESULT: ${{ needs.qualification.result }}
        run: test "$RESULT" = success
