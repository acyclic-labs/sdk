name: SDK Qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 8G
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || '' }}

jobs:
  change-scope:
    name: Classify documentation-only PR
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          docs_only=true
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            case "$path" in
              README.md|CONTRIBUTING.md|SECURITY.md|docs/*.md) ;;
              *) docs_only=false ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          if [[ "$count" -eq 0 ]]; then docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  qualification:
    name: ${{ matrix.lane }}
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: gate
            runner: blacksmith-4vcpu-ubuntu-2404
            workers: 4
            artifact: coverage
            artifact_path: coverage
          - lane: linux
            runner: blacksmith-32vcpu-ubuntu-2404
            workers: 32
            artifact: packages-linux
            artifact_path: packages
          - lane: policy
            runner: blacksmith-4vcpu-ubuntu-2404
            workers: 4
            artifact: ''
            artifact_path: ''
          - lane: web
            runner: blacksmith-4vcpu-ubuntu-2404
            workers: 4
            artifact: ''
            artifact_path: ''
          - lane: linux-arm64
            runner: blacksmith-32vcpu-ubuntu-2404-arm
            workers: 32
            artifact: packages-linux-arm64
            artifact_path: packages
          - lane: windows
            runner: blacksmith-32vcpu-windows-2025
            workers: 32
            artifact: ''
            artifact_path: ''
          - lane: macos
            runner: blacksmith-12vcpu-macos-15
            workers: 12
            artifact: packages-macos
            artifact_path: packages
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.workers }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.workers }}
      MAKEFLAGS: -j${{ matrix.workers }}
      RAYON_NUM_THREADS: ${{ matrix.workers }}
      RUST_TEST_THREADS: ${{ matrix.workers }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Configure lane-local compiler cache
        shell: bash
        run: echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache" >> "$GITHUB_ENV"

      - name: Restore shared dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/bun-install-cache
          key: sdk-deps-v7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'bun.lock', 'scripts/ensure-bun.sh', 'scripts/ensure-bun.ps1') }}
          restore-keys: |
            sdk-deps-v7-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore lane tools
        id: lane-tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/tools
            ${{ runner.temp }}/llvm
          key: sdk-tools-v4-llvm20.1.8-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/qualify-ci.sh', 'scripts/qualify-ci.ps1') }}

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: ${{ matrix.lane == 'policy' && 'clippy,rustfmt' || '' }}

      # Blacksmith transparently serves actions/cache from co-located storage. Keep
      # compiler objects lane-local so seven matrix jobs restore/save once instead
      # of contending on hundreds of sccache GHA object writes.
      - name: Restore lane build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/sccache
          key: sdk-build-v3-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clippy.toml', 'rustfmt.toml', 'deny.toml') }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'Cargo.lock', 'rust/**', 'plugin/**', 'generated/rust/**', 'proto/**', 'compatibility/**', 'scripts/qualify-ci.sh', 'scripts/qualify-ci.ps1', '.github/workflows/qualification.yml') }}
          restore-keys: |
            sdk-build-v3-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clippy.toml', 'rustfmt.toml', 'deny.toml') }}-

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Install Windows ARM64 compiler
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 20.1.8
          directory: ${{ runner.temp }}/llvm
          cached: ${{ steps.lane-tools.outputs.cache-hit }}
          env: false

      - name: Run qualification lane
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_TEMP_DIR: ${{ runner.temp }}/sdk
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}-${{ runner.arch }}
        run: bash scripts/qualify-ci.sh "${{ matrix.lane }}"

      - name: Run Windows qualification lane
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_TEMP_DIR: ${{ runner.temp }}/sdk
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}-${{ runner.arch }}
          LLVM_PATH: ${{ runner.temp }}/llvm
        run: .\scripts\qualify-ci.ps1 -Lane windows

      - name: Retain qualified outputs
        if: matrix.artifact != '' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.artifact_path }}
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  gate:
    name: SDK Qualification
    if: always()
    needs: [change-scope, qualification]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require every qualification lane
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if test "$DOCS_ONLY" = true; then
            test "$RESULT" = skipped
          else
            test "$RESULT" = success
          fi
