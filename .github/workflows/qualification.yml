name: SDK Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  BUILD_SOURCEVERSION: ${{ github.sha }}
  SYSTEM_PULLREQUEST_SOURCECOMMITID: ${{ github.event.pull_request.head.sha || '' }}
  SYSTEM_PULLREQUEST_TARGETBRANCH: ${{ github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || '' }}

jobs:
  qualification:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: gate
            runner: blacksmith-16vcpu-ubuntu-2404
            jobs: 12
            timeout: 15
            artifact: coverage
            artifact_path: coverage
          - lane: linux
            runner: blacksmith-16vcpu-ubuntu-2404
            jobs: 12
            timeout: 20
            artifact: packages-linux
            artifact_path: packages
          - lane: policy
            runner: blacksmith-16vcpu-ubuntu-2404
            jobs: 12
            timeout: 15
            artifact: ''
            artifact_path: ''
          - lane: web
            runner: blacksmith-8vcpu-ubuntu-2404
            jobs: 6
            timeout: 15
            artifact: ''
            artifact_path: ''
          - lane: linux-arm64
            runner: blacksmith-16vcpu-ubuntu-2404-arm
            jobs: 12
            timeout: 15
            artifact: packages-linux-arm64
            artifact_path: packages
          - lane: windows
            runner: blacksmith-16vcpu-windows-2025
            jobs: 12
            timeout: 15
            artifact: ''
            artifact_path: ''
          - lane: macos
            runner: blacksmith-12vcpu-macos-15
            jobs: 10
            timeout: 15
            artifact: packages-macos
            artifact_path: packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      RAYON_NUM_THREADS: ${{ matrix.jobs }}
      RUST_TEST_THREADS: ${{ matrix.jobs }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Restore dependency, tool, and incremental build state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/tools
            ${{ github.workspace }}/target
          key: sdk-v3-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            sdk-v3-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'bun.lock') }}-
            sdk-v3-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Install Windows ARM64 compiler
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 20.1.8
          directory: ${{ runner.temp }}/llvm
          env: false

      - name: Run qualification lane
        if: runner.os != 'Windows'
        shell: bash
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}/sdk
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/artifacts
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}-${{ runner.arch }}
        run: bash scripts/qualify-ci.sh "${{ matrix.lane }}"

      - name: Run Windows qualification lane
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}/sdk
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/artifacts
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ matrix.lane }}-${{ runner.arch }}
        run: .\scripts\qualify-ci.ps1 -Lane windows

      - name: Retain qualified outputs
        if: matrix.artifact != '' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.artifact_path }}
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  gate:
    name: SDK Qualification
    if: always()
    needs: qualification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require every qualification lane
        env:
          RESULT: ${{ needs.qualification.result }}
        run: test "$RESULT" = success
