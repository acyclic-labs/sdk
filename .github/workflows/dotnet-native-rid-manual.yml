name: .NET native transport RID qualification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Rust target triple to build, or all for the full RID matrix
        required: true
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
      publish_artifact:
        description: Upload the RID assets and hashes for review
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: Exact Rust source revision to qualify
        required: false
        type: string
      target:
        description: Rust target triple to build, or all for the full RID matrix
        required: false
        default: all
        type: string
      publish_artifact:
        description: Upload the RID assets and hashes for review
        required: false
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: dotnet-native-rid-${{ github.ref }}-${{ github.event.inputs.target || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Keep every matrix entry schedulable; target selection is applied to the
    # build, packaging, and upload steps below because matrix values are not
    # available in a job-level if expression.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            musl_image: rust:1.98.1-alpine3.22@sha256:df2234c615138222413254f45937ae45d284aad971644fe564e4250609abe452
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl_image: rust:1.98.1-alpine3.22@sha256:8c8136ecbaef3c248920e564a832a5217ff95819fa351984b48d39def57db223
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        if: (github.event_name == 'release' || inputs.target == 'all' || inputs.target == matrix.target) && !startsWith(matrix.target, 'x86_64-unknown-linux-musl') && !startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        with:
          targets: ${{ matrix.target }}
      - name: Build dynamic musl RID asset in pinned Alpine
        if: (github.event_name == 'release' || inputs.target == 'all' || inputs.target == matrix.target) && (startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl'))
        shell: bash
        env:
          ALPINE_IMAGE: ${{ matrix.musl_image }}
        run: |
          mkdir -p "${RUNNER_TEMP}/dotnet-native"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}/dotnet-native:/out" \
            -w /workspace \
            "$ALPINE_IMAGE" \
            sh -ec "apk add --no-cache bash build-base ca-certificates git musl-dev; sh scripts/build-dotnet-native-transport-musl.sh '${{ matrix.target }}' /out"
      - name: Build RID asset
        if: (github.event_name == 'release' || inputs.target == 'all' || inputs.target == matrix.target) && !startsWith(matrix.target, 'x86_64-unknown-linux-musl') && !startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        shell: pwsh
        run: ./scripts/build-dotnet-native-transport.ps1 -Target '${{ matrix.target }}' -Output '${{ runner.temp }}/dotnet-native'
      - name: Upload RID asset and hash
        if: (github.event_name == 'release' || inputs.publish_artifact) && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == matrix.target)
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-native-${{ matrix.target }}
          path: ${{ runner.temp }}/dotnet-native
