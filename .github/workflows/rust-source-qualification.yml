name: Rust Source Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/rust-source-qualification.yml'
      - '.github/actions/rust-toolchain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rust/crates/**/Cargo.toml'
      - 'rust/crates/**/build.rs'
      - 'scripts/**'
      - 'research/acceptance/**'
      - 'rust/crates/sdk-generation/**'
      - 'rust/crates/sdk-contract-wire/**'
      - 'rust/crates/sdk-contract-validation/**'
      - 'rust/crates/sdk-openapi-prototype/**'
      - 'rust/crates/sdk-contract-options/**'
      - 'rust/crates/sdk-docs/**'
      - 'rust/crates/sdk-examples/**'
      - 'rust/crates/sdk-embedded-filesystem/**'
      - 'rust/crates/sdk-embedded-prototype/**'
      - 'rust/crates/sdk-python/**'
      - 'rust/crates/sdk-typescript/**'
      - 'rust/crates/**/src/**'
      - 'docs/**'
      - 'typescript/**'
      - 'cpp/**'
      - 'swift/**'
      - 'languages/**'
      - 'compatibility/**'
      - 'proto/**'
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to qualify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-source-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-policy:
    name: Fast qualification policy
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify qualification policy
        # Measured locally at 2.7 seconds; no downstream runtimes or packages.
        run: |
          node scripts/test-plan-qualification.mjs
          node --test scripts/test-platform-qualification.mjs
          node scripts/test-rust-sdk-generation-source-closure.mjs

  qualify:
    # Full source and downstream qualification runs on releases or explicit requests.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - platform: macos
            runner: blacksmith-6vcpu-macos-15
          - platform: windows
            runner: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Configure per-run Rust target directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/rust-source-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Preflight locked Rust metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/rust-workspace-metadata.json"
          cargo metadata --locked --format-version 1 > "$metadata"
          python - "$metadata" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          assert metadata["packages"], "locked metadata returned no packages"
          assert metadata["workspace_members"], "locked metadata returned no workspace members"
          PY

      - name: Verify pinned platform toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)" = '1.98.1'
          rustc --version --verbose
          cargo --version
          rustfmt --edition 2024 --check rust/crates/sdk-generation/src/main.rs

      - name: Test generation and contract validators
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/crates/sdk-contract-options/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-generation/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-contract-wire/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-contract-validation/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-openapi-prototype/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-docs/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-examples/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-embedded-filesystem/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-embedded-prototype/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-python/Cargo.toml --locked
          cargo test --manifest-path rust/crates/sdk-typescript/Cargo.toml --locked

      - name: Verify Rust wire export and drift
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rust-authority"
          cargo run --manifest-path rust/crates/sdk-contract-wire/Cargo.toml --locked --bin sdk-contract-wire -- generate --out "$out"
          cargo run --manifest-path rust/crates/sdk-contract-wire/Cargo.toml --locked --bin sdk-contract-wire -- check --out "$out"
          test -s "$out/rust-authority.json"

      - name: Run unified source generation and exact drift check
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rust-source-generation"
          cargo run --manifest-path rust/crates/sdk-generation/Cargo.toml --locked -- \
            generate --source-root "$GITHUB_WORKSPACE" --output "$out"
          cargo run --manifest-path rust/crates/sdk-generation/Cargo.toml --locked -- \
            drift --source-root "$GITHUB_WORKSPACE" --output "$out"
          test -s "$out/sdk-generation-manifest.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert p["status"] == "generated", p["status"]; assert not [t for t in p["tools"] if t["required"] and t["status"] != "passed"], p["tools"]' "$out/sdk-generation-manifest.json"

      - name: Upload unified generation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: rust-source-qualification-${{ matrix.platform }}
          path: ${{ runner.temp }}/rust-source-generation
          if-no-files-found: error
          retention-days: 7

      - name: Verify source-bound docs profile graph
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rust-source-generation"
          test -s "$out/docs.json"
          test -s "$out/website.json"
          test -s "$out/sdk-examples-manifest.json"
          test -s "$out/source-authority.json"
          node scripts/validate-rustdoc-graphs.mjs --bundle "$out/docs.json" --profiles docs/rustdoc-profiles.json
          python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); names={x["profile"]["name"] for x in p["profiles"]}; assert names == {"host-default","native-bindings","host-capabilities","wasm-bindings"}, names; assert len(p["profiles"]) == 4; assert all({"complete","missing_packages","unresolved_packages"} <= set(x) for x in p["profiles"]); assert all(x["complete"] and not x["missing_packages"] and not x["unresolved_packages"] for x in p["profiles"])' "$out/docs.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert p["schema"] == "acyclic.sdk.examples.source-authority.v1"; assert p["source_revision"] and p["source_sha256"].startswith("sha256:"); assert p["source_files"] and set(p["source_files"]) == set(p["source_file_hashes"]); assert all(v.startswith("sha256:") for v in p["source_file_hashes"].values())' "$out/source-authority.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); json.dump({"schema":"acyclic.sdk.docs.profile-receipt.v1","source_revision":p["source_revision"],"profiles":[{"name":x["profile"]["name"],"complete":x["complete"],"missing_packages":x["missing_packages"],"unresolved_packages":x["unresolved_packages"]} for x in p["profiles"]]},open(sys.argv[2],"w",encoding="utf-8"),indent=2)' "$out/docs.json" "$out/profile-receipt.json"
          test -s "$out/profile-receipt.json"

      - name: Generate and check Rust-owned TypeScript stage
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rust-typescript"
          cargo run --manifest-path rust/crates/sdk-typescript/Cargo.toml --locked -- write "$out"
          cargo run --manifest-path rust/crates/sdk-typescript/Cargo.toml --locked -- check "$out"
          test -s "$out/manifest.json"

  platform-package-verification:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    needs: qualify
    name: ${{ matrix.package }} pinned platform scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cpp
            runner: blacksmith-4vcpu-ubuntu-2404
          - package: swift
            runner: blacksmith-4vcpu-ubuntu-2404
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install native package prerequisites
        if: matrix.package == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl unzip cmake ninja-build python3

      - name: Install pinned Swift toolchain
        if: matrix.package == 'swift'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: '6.2.1'

      - name: Verify pinned Swift host tools
        if: matrix.package == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          command -v swift
          command -v curl
          command -v unzip
          command -v cmake
          command -v ninja
          command -v python3
          swift --version

      - name: Configure per-run Rust target directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/platform-receipt-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Download Rust-owned generation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-source-qualification-linux
          path: ${{ runner.temp }}/rust-source-generation

      - name: Provision official pinned package toolchain
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: bash scripts/provision-native-toolchains.sh '${{ matrix.package }}'

      - name: Verify pinned package lane and run the generated consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/platform-package/${{ matrix.package }}"
          if [[ "${{ matrix.package }}" == cpp ]]; then
            test -f cpp/Generate.ps1
            grep -q 'ExpectedProtoc = "36.2"' cpp/Generate.ps1
            grep -q 'ExpectedGrpc = "1.80.0"' cpp/Generate.ps1
            cp cpp/README.md "$RUNNER_TEMP/platform-package/${{ matrix.package }}/README.md"
            cp cpp/Generate.ps1 "$RUNNER_TEMP/platform-package/${{ matrix.package }}/Generate.ps1"
            : "${SDK_CPP_PROTOC:?SDK_CPP_PROTOC must point at pinned protoc 36.2}"
            : "${SDK_CPP_GRPC_PLUGIN:?SDK_CPP_GRPC_PLUGIN must point at pinned grpc_cpp_plugin 1.80.0}"
            test -x "$SDK_CPP_PROTOC"
            test -x "$SDK_CPP_GRPC_PLUGIN"
            evidence="$RUNNER_TEMP/platform-package/${{ matrix.package }}/evidence"
            mkdir -p "$evidence"
            generation_root="$RUNNER_TEMP/rust-source-generation"
            test -s "$generation_root/sdk-generation-manifest.json"
            test -s "$generation_root/wire/rust-authority.json"
            printf 'downloaded Rust-owned source bundle\n' >"$evidence/generation.stdout"
            : >"$evidence/generation.stderr"
            wire_root="$generation_root/wire"
            cpp_root="$generation_root/cpp"
            pwsh -NoProfile -File cpp/Generate.ps1 \
              -Protoc "$SDK_CPP_PROTOC" \
              -GrpcCppPlugin "$SDK_CPP_GRPC_PLUGIN" \
              -ProtoRoot "$wire_root" \
              -AuthorityManifest "$wire_root/rust-authority.json" \
              -OutputDirectory "$cpp_root" \
              >"$evidence/cpp-generation.stdout" 2>"$evidence/cpp-generation.stderr"
            cmake_args=(-DACYCLIC_GENERATED_ROOT="$cpp_root")
            if [[ -n "${SDK_CPP_PREFIX_PATH:-}" ]]; then
              cmake_args+=("-DCMAKE_PREFIX_PATH=$SDK_CPP_PREFIX_PATH")
            fi
            cmake -S cpp/consumer -B "$RUNNER_TEMP/platform-package/${{ matrix.package }}/build" "${cmake_args[@]}" \
              >"$evidence/configure.stdout" 2>"$evidence/configure.stderr"
            cmake --build "$RUNNER_TEMP/platform-package/${{ matrix.package }}/build" --config Release \
              >"$evidence/build.stdout" 2>"$evidence/build.stderr"
            fixture_log="$evidence/fixture-server.log"
            cargo run --manifest-path rust/crates/sdk-examples/Cargo.toml --locked --bin fixture-server -- \
              --port 0 --grpc-port 0 --max-requests 256 >"$fixture_log" 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
            fixture_address=''
            for _ in $(seq 1 60); do
              fixture_address=$(python -c 'import json,sys; p=sys.argv[1]; rows=open(p,encoding="utf-8",errors="replace").read().splitlines(); print(next((json.loads(row)["grpc_address"] for row in rows if row.lstrip().startswith("{") and "grpc_address" in row), ""))' "$fixture_log" 2>/dev/null || true)
              [[ -n "$fixture_address" ]] && break
              sleep 1
            done
            test -n "$fixture_address"
            fixture_address="${fixture_address#http://}"
            export FIXTURE_GRPC_ADDRESS="$fixture_address"
            ctest --test-dir "$RUNNER_TEMP/platform-package/${{ matrix.package }}/build" --build-config Release --output-on-failure \
              >"$evidence/ctest.stdout" 2>"$evidence/ctest.stderr"
            consumer_bin=$(find "$RUNNER_TEMP/platform-package/${{ matrix.package }}/build" -type f -name acyclic_sdk_cpp_consumer -perm -111 | head -n 1)
            test -n "$consumer_bin"
            export ACYCLIC_GENERATED_ROOT="$cpp_root"
            export ACYCLIC_SCENARIO_OUTPUT="$generation_root"
            export ACYCLIC_SOURCE_REVISION="$GITHUB_SHA"
            "$consumer_bin" >"$evidence/consumer.stdout" 2>"$evidence/consumer.stderr"
            cp "$consumer_bin" "$generation_root/qualification/consumers/acyclic_sdk_cpp_consumer"
            python -c 'import hashlib,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); revision=sys.argv[2]; consumer=root/"qualification/consumers/acyclic_sdk_cpp_consumer"; paths=sorted(root.glob("qualification/consumers/cpp-rpc-*.json")); assert len(paths)==106, len(paths); digest=lambda p:"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(); log={"schema":"acyclic.sdk.rpc-scenario-log.v1","source_revision":revision,"consumer":{"name":"cpp","version":"0.2.0","artifact_path":"qualification/consumers/acyclic_sdk_cpp_consumer","artifact_sha256":digest(consumer)},"scenarios":[{"output_path":p.relative_to(root).as_posix(),"output_sha256":digest(p)} for p in paths]}; (root/"qualification/consumers/cpp-rpc-scenario-log.json").write_text(json.dumps(log,indent=2)+"\n",encoding="utf-8")' "$generation_root" "$GITHUB_SHA"
            python -c 'import hashlib,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); names=["generation","configure","build","ctest","consumer"]; checks=[]; digest=lambda p:"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(); [checks.append({"command":n,"exit_code":0,"stdout_sha256":digest(root/(n+".stdout")),"stderr_sha256":digest(root/(n+".stderr"))}) for n in names]; json.dump({"status":"passed","checks":checks,"rpc_scenario_log":"qualification/consumers/cpp-rpc-scenario-log.json","rpc_scenarios":106},open(sys.argv[2],"w",encoding="utf-8"),indent=2)' "$evidence" "$RUNNER_TEMP/platform-package/${{ matrix.package }}/tests.json"
            cargo run --manifest-path rust/crates/sdk-generation/Cargo.toml --locked -- \
              seal --source-root "$GITHUB_WORKSPACE" --output "$generation_root" \
              >"$evidence/seal.stdout" 2>"$evidence/seal.stderr"
            cargo run --manifest-path rust/crates/sdk-generation/Cargo.toml --locked --bin sdk-qualification-receipt -- \
              --source-root "$GITHUB_WORKSPACE" \
              --output "$generation_root" \
              --scenario-log "$generation_root/qualification/consumers/cpp-rpc-scenario-log.json" \
              --language cpp --tool 'C++ gRPC GenericStub' --suite 'full Rust authority RPC consumer'
          else
            test -f swift/Generate.ps1
            grep -q 'ExpectedProtoc = "36.2"' swift/Generate.ps1
            grep -q 'ExpectedSwiftProtobuf = "1.38.1"' swift/Generate.ps1
            grep -q 'ExpectedGrpcSwift = "2.4.1"' swift/Generate.ps1
            cp swift/README.md "$RUNNER_TEMP/platform-package/${{ matrix.package }}/README.md"
            cp swift/Generate.ps1 "$RUNNER_TEMP/platform-package/${{ matrix.package }}/Generate.ps1"
            cp swift/consumer/main.swift "$RUNNER_TEMP/platform-package/${{ matrix.package }}/consumer.swift"
            : "${SDK_SWIFT_PROTOC:?SDK_SWIFT_PROTOC must point at pinned protoc 36.2}"
            : "${SDK_SWIFT_PLUGIN:?SDK_SWIFT_PLUGIN must point at pinned protoc-gen-swift 1.38.1}"
            : "${SDK_GRPC_SWIFT_PLUGIN:?SDK_GRPC_SWIFT_PLUGIN must point at pinned protoc-gen-grpc-swift 2.4.1}"
            test -x "$SDK_SWIFT_PROTOC"
            test -x "$SDK_SWIFT_PLUGIN"
            test -x "$SDK_GRPC_SWIFT_PLUGIN"
            command -v swift >/dev/null
            evidence="$RUNNER_TEMP/platform-package/${{ matrix.package }}/evidence"
            mkdir -p "$evidence"
            generation_root="$RUNNER_TEMP/rust-source-generation"
            test -s "$generation_root/sdk-generation-manifest.json"
            wire_root="$generation_root/wire"
            printf 'downloaded Rust-owned source bundle\n' >"$evidence/rust-wire.stdout"
            : >"$evidence/rust-wire.stderr"
            pwsh -NoProfile -File swift/Generate.ps1 \
              -Protoc "$SDK_SWIFT_PROTOC" \
              -SwiftPlugin "$SDK_SWIFT_PLUGIN" \
              -GrpcSwiftPlugin "$SDK_GRPC_SWIFT_PLUGIN" \
              -ProtoRoot "$wire_root" \
              -WritePackageManifest \
              -OutputDirectory "$RUNNER_TEMP/platform-package/${{ matrix.package }}/generated" \
              >"$evidence/generation.stdout" 2>"$evidence/generation.stderr"
            python scripts/run-swift-sanitized.py swift build --package-path "$RUNNER_TEMP/platform-package/${{ matrix.package }}/generated" -c release \
              >"$evidence/swiftpm.stdout" 2>"$evidence/swiftpm.stderr"
            fixture_log="$evidence/fixture-server.log"
            cargo run --manifest-path rust/crates/sdk-examples/Cargo.toml --locked --bin fixture-server -- \
              --port 0 --grpc-port 0 --max-requests 32 >"$fixture_log" 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
            fixture_address=''
            for _ in $(seq 1 60); do
              fixture_address=$(python -c 'import json,sys; p=sys.argv[1]; rows=open(p,encoding="utf-8",errors="replace").read().splitlines(); print(next((json.loads(row)["grpc_address"] for row in rows if row.lstrip().startswith("{") and "grpc_address" in row), ""))' "$fixture_log" 2>/dev/null || true)
              [[ -n "$fixture_address" ]] && break
              sleep 1
            done
            test -n "$fixture_address"
            fixture_address=$(printf '%s' "$fixture_address" | sed 's#^http://##')
            export FIXTURE_GRPC_ADDRESS="$fixture_address"
            consumer_bin="$RUNNER_TEMP/platform-package/${{ matrix.package }}/generated/.build/release/AcyclicFixtureConsumer"
            test -x "$consumer_bin"
            "$consumer_bin" >"$evidence/consumer.stdout" 2>"$evidence/consumer.stderr"
            python -c 'import hashlib,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); names=["rust-wire","generation","swiftpm","consumer"]; checks=[]; digest=lambda p:"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(); [checks.append({"command":n,"exit_code":0,"stdout_sha256":digest(root/(n+".stdout")),"stderr_sha256":digest(root/(n+".stderr"))}) for n in names]; json.dump({"status":"passed","checks":checks},open(sys.argv[2],"w",encoding="utf-8"),indent=2)' "$evidence" "$RUNNER_TEMP/platform-package/${{ matrix.package }}/tests.json"
            cargo run --manifest-path rust/crates/sdk-generation/Cargo.toml --locked --bin sdk-platform-receipt -- \
              write --source-root "$GITHUB_WORKSPACE" \
              --generated "$RUNNER_TEMP/platform-package/${{ matrix.package }}/generated" \
              --consumer "$consumer_bin" \
              --tests "$RUNNER_TEMP/platform-package/${{ matrix.package }}/tests.json" \
              --output "$RUNNER_TEMP/platform-package/${{ matrix.package }}/qualification.json" \
              --language swift --toolchain 'protobuf=36.2;swiftProtobuf=1.38.1;swiftProtobufRevision=55d7a1cc5666b85c13464aea1c4b4a90feccb4c8;grpcSwift=2.4.1;grpcSwiftRevision=21fe69ab7ce0e87ac089534733c52f037e74a3eb;grpcSwiftProtobuf=2.4.1;grpcSwiftProtobufRevision=176c5a434fd76f6f479848d1a8f7d44967534168;swiftCollections=1.7.1;swiftCollectionsRevision=98ef3c98609a1e31b7e157b5b619579001a789d6' \
              --tools "$SDK_SWIFT_PROTOC;$SDK_SWIFT_PLUGIN;$SDK_GRPC_SWIFT_PLUGIN"
          fi

      - name: Verify Rust unified qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/platform-package/${{ matrix.package }}/generated/qualification/receipts/${{ matrix.package }}.json"
      - name: Upload internal platform package evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: rust-source-qualification-${{ matrix.package }}
          path: ${{ runner.temp }}/platform-package/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7

  dotnet-embedded-rid:
    name: .NET embedded eight-RID qualification
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    uses: ./.github/workflows/dotnet-embedded-rid-manual.yml
    with:
      target: all
