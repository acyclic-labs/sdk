name: Rust-bound Ruby PHP Dart live consumers

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: gRPC fixture or service endpoint
        required: true
        default: 127.0.0.1:50051
        type: string
      manifest:
        description: Rust-owned typed request manifest
        required: true
        type: string
      source_root:
        description: Frozen Rust authority schema root used for generation
        required: true
        type: string
      authority:
        description: Rust authority manifest for the frozen source revision
        required: true
        type: string
      request:
        description: Rust-bound Ruby/PHP/Dart generation request
        required: true
        type: string
  release:
    types: [published]

jobs:
  release-source-sanity:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Rust-bound consumer source
        run: python3 research/additional-languages/consumers/consumer_manifest_negative.py

  live-consumers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Ruby runtime
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.11'
          bundler-cache: false
      - name: Install pinned Ruby generator
        shell: pwsh
        run: gem install grpc-tools --version 1.82.0 --no-document
      - name: Set up pinned PHP runtime and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.34'
          extensions: grpc-1.82.0, protobuf-5.36.2
          tools: composer, grpc_php_plugin:1.82.0
      - name: Set up pinned Dart runtime
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.8.3'
      - name: Set up pinned protoc compiler
        uses: arduino/setup-protoc@v3
        with:
          version: '25.1'
      - name: Resolve pinned Dart dependencies
        shell: pwsh
        run: dart pub get --directory dart
      - name: Validate live consumer source and fail-closed manifest
        shell: pwsh
        run: python research/additional-languages/consumers/consumer_manifest_negative.py
      - name: Verify PHP generator tool is provisioned
        shell: pwsh
        run: |
          if (-not (Get-Command grpc_php_plugin -ErrorAction SilentlyContinue)) {
            throw 'grpc_php_plugin 1.82.0 is required on PATH; provision the official matching gRPC plugin before running generation'
          }
          grpc_php_plugin --version
      - name: Generate and run installed Rust-bound consumers
        shell: pwsh
        run: |
          $args = @(
            '-Manifest', '${{ inputs.manifest }}',
            '-OutputRoot', './live-consumer-receipts',
            '-Endpoint', '${{ inputs.endpoint }}',
            '-GeneratePackages',
            '-SourceRoot', '${{ inputs.source_root }}',
            '-Authority', '${{ inputs.authority }}',
            '-Request', '${{ inputs.request }}'
          )
          ./research/additional-languages/consumers/run-live-consumers.ps1 @args
      - uses: actions/upload-artifact@v4
        with:
          name: rpd-live-consumer-receipts
          path: live-consumer-receipts

