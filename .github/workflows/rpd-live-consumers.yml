name: Rust-bound Ruby PHP Dart live consumers

permissions:
  contents: read

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  release-source-sanity:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Rust-bound consumer source
        run: python3 research/additional-languages/consumers/consumer_manifest_negative.py

  live-consumers:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned repository action
        with:
          toolchain: 1.98.1
      - name: Set up pinned Ruby runtime
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2.11'
          bundler-cache: false
      - name: Install pinned Ruby generator
        shell: pwsh
        run: gem install grpc-tools --version 1.82.0 --no-document
      - name: Set up pinned PHP runtime and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2.34'
          extensions: grpc-1.82.0, protobuf-5.36.2
          tools: composer, grpc_php_plugin:1.82.0
        env:
          fail-fast: true
      - name: Set up pinned Dart runtime
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.8.3'
      - name: Set up pinned protoc compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '36.2'
      - name: Build Rust RPC observation verifier
        shell: pwsh
        run: cargo build --locked --release --manifest-path rust/crates/sdk-generation/Cargo.toml --target-dir target --bin verify-rpc-observations
      - name: Resolve pinned Dart dependencies
        shell: pwsh
        run: dart pub get --directory dart
      - name: Validate live consumer source and fail-closed manifest
        shell: pwsh
        run: python research/additional-languages/consumers/consumer_manifest_negative.py
      - name: Test forged semantic receipts fail closed
        shell: pwsh
        run: python research/acceptance/ruby-php-dart/qualification/test_validate_live_receipts.py
      - name: Verify PHP generator tool is provisioned
        shell: pwsh
        run: |
          if (-not (Get-Command grpc_php_plugin -ErrorAction SilentlyContinue)) {
            throw 'grpc_php_plugin 1.82.0 is required on PATH; official setup-php provisioning failed'
          }
          grpc_php_plugin --version
          php -r "if (PHP_VERSION_ID !== 80234 || phpversion('grpc') !== '1.82.0' || phpversion('protobuf') !== '5.36.2') { fwrite(STDERR, 'PHP/grpc/protobuf versions do not match the pinned qualification lane'.PHP_EOL); exit(1); }"
      - name: Prepare Rust authority, typed requests, packages, and fixture
        shell: pwsh
        id: prepare
        run: |
          $root = $env:GITHUB_WORKSPACE
          $out = Join-Path $env:RUNNER_TEMP 'rpd-live'
          & "$root/research/acceptance/ruby-php-dart/qualification/prepare-live-fixture.ps1" -Root $root -OutputRoot $out | Set-Content (Join-Path $out 'prepare.stdout.json')
          if ($LASTEXITCODE -ne 0) { throw "Rust live fixture preparation failed with $LASTEXITCODE" }
      - name: Generate and run installed Rust-bound consumers
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'rpd-live'
          $meta = Get-Content (Join-Path $out 'live-fixture.json') -Raw | ConvertFrom-Json
          try {
            & "$env:GITHUB_WORKSPACE/research/additional-languages/consumers/run-live-consumers.ps1" `
              -Manifest $meta.manifest `
              -OutputRoot (Join-Path $out 'consumer-receipts') `
              -Endpoint $meta.endpoint `
              -GeneratePackages `
              -SourceRoot $meta.source_root `
              -Authority $meta.authority `
              -Request $meta.request
            if ($LASTEXITCODE -ne 0) { throw "live consumers exited with $LASTEXITCODE" }
          } finally {
            if ($meta.fixture_pid) { Stop-Process -Id ([int]$meta.fixture_pid) -Force -ErrorAction SilentlyContinue }
          }
      - name: Validate Rust-bound response semantics and ordered frames
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'rpd-live'
          $meta = Get-Content (Join-Path $out 'live-fixture.json') -Raw | ConvertFrom-Json
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'target/release/verify-rpc-observations.exe'
          if (-not (Test-Path $verifier)) { throw "Rust RPC observation verifier was not built" }
          python "$env:GITHUB_WORKSPACE/research/acceptance/ruby-php-dart/qualification/validate-live-receipts.py" `
            --manifest $meta.manifest `
            --receipt "ruby=$(Join-Path $out 'consumer-receipts/ruby-live-receipt.json')" `
            --receipt "php=$(Join-Path $out 'consumer-receipts/php-live-receipt.json')" `
            --receipt "dart=$(Join-Path $out 'consumer-receipts/dart-live-receipt.json')" `
            --strict-rust-oracle `
            --rust-verifier $verifier `
            --output (Join-Path $out 'semantic-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw "semantic validation exited with $LASTEXITCODE" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: rpd-live-consumer-receipts
          path: ${{ runner.temp }}/rpd-live
