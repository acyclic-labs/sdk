name: Publish plugin

# Ships the acyclic CLI plugin from the exact binaries a successful
# qualification run retained (plugin-<lane> artifacts): a GitHub release
# `plugin-v<version>` with build-provenance attestations and per-binary
# dependency lists, then the npm launcher and platform packages staged for
# maintainer approval. Nothing is rebuilt; both jobs verify the retained
# bytes independently. See plugin/packaging/npm/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stage/npm/plugin/<version> tag
        required: true
        type: string
      tag_oid:
        description: Immutable annotated tag object SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-publication
  cancel-in-progress: false

jobs:
  release:
    name: Release qualified plugin binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify and select exact tagged source
        env:
          PLUGIN_STAGE_TAG: ${{ inputs.tag }}
          PLUGIN_STAGE_TAG_OID: ${{ inputs.tag_oid }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLUGIN_STAGE_TAG" =~ ^stage/npm/plugin/[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$PLUGIN_STAGE_TAG_OID" =~ ^[0-9a-f]{40}$ ]]
          ref="refs/tags/$PLUGIN_STAGE_TAG"
          git show-ref --verify --quiet "$ref"
          test "$(git rev-parse "$ref")" = "$PLUGIN_STAGE_TAG_OID"
          test "$(git cat-file -t "$PLUGIN_STAGE_TAG_OID")" = tag
          source_sha=$(git rev-parse "$PLUGIN_STAGE_TAG_OID^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          install -m 0755 scripts/prepare-plugin-publication.sh "$RUNNER_TEMP/prepare-plugin-publication.sh"
          install -m 0755 scripts/prepare-npm-publication.sh "$RUNNER_TEMP/prepare-npm-publication.sh"
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Download and verify exact qualified binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_STAGE_TAG: ${{ inputs.tag }}
          PLUGIN_STAGE_TAG_OID: ${{ inputs.tag_oid }}
        shell: bash
        run: bash "$RUNNER_TEMP/prepare-plugin-publication.sh"

      - name: Dependency list per binary from the locked graph
        shell: bash
        run: |
          set -euo pipefail
          declare -A triple=(
            [darwin-arm64]=aarch64-apple-darwin [darwin-x64]=x86_64-apple-darwin
            [linux-x64]=x86_64-unknown-linux-gnu [linux-arm64]=aarch64-unknown-linux-gnu
            [win32-x64]=x86_64-pc-windows-msvc
          )
          for target in "${!triple[@]}"; do
            cargo tree -p acyclic --locked -e normal --prefix none \
              --target "${triple[$target]}" | sort -u \
              > "$PLUGIN_DIST/$PLUGIN_NAME-$target.deps.txt"
          done
          ls -l "$PLUGIN_DIST"

      - name: Attest build provenance of the qualified binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.PLUGIN_DIST }}/${{ env.PLUGIN_NAME }}-*

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$PLUGIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $PLUGIN_RELEASE_TAG already exists; releases are immutable"
            exit 1
          fi
          gh release create "$PLUGIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "Acyclic plugin $PLUGIN_VERSION" \
            --notes "Qualified by workflow run $QUALIFICATION_RUN at $SOURCE_SHA. Binaries carry build-provenance attestations; verify with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`." \
            "$PLUGIN_DIST"/*

  stage:
    name: Stage qualified npm packages
    needs: release
    environment: npmjs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify and select exact tagged source
        env:
          PLUGIN_STAGE_TAG: ${{ inputs.tag }}
          PLUGIN_STAGE_TAG_OID: ${{ inputs.tag_oid }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLUGIN_STAGE_TAG" =~ ^stage/npm/plugin/[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$PLUGIN_STAGE_TAG_OID" =~ ^[0-9a-f]{40}$ ]]
          ref="refs/tags/$PLUGIN_STAGE_TAG"
          git show-ref --verify --quiet "$ref"
          test "$(git rev-parse "$ref")" = "$PLUGIN_STAGE_TAG_OID"
          test "$(git cat-file -t "$PLUGIN_STAGE_TAG_OID")" = tag
          source_sha=$(git rev-parse "$PLUGIN_STAGE_TAG_OID^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          install -m 0755 scripts/prepare-plugin-publication.sh "$RUNNER_TEMP/prepare-plugin-publication.sh"
          install -m 0755 scripts/prepare-npm-publication.sh "$RUNNER_TEMP/prepare-npm-publication.sh"
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-12.0.2.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://registry.npmjs.org/npm/-/npm-12.0.2.tgz --output "$archive"
          echo 'b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943  '"$archive" | sha512sum --check --strict
          npm install --global --ignore-scripts "$archive"
          npm config set ignore-scripts true
          npm config set fund false
          npm config set audit false

      - name: Download and verify exact qualified binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_STAGE_TAG: ${{ inputs.tag }}
          PLUGIN_STAGE_TAG_OID: ${{ inputs.tag_oid }}
        shell: bash
        run: bash "$RUNNER_TEMP/prepare-plugin-publication.sh"

      - name: Assemble the npm packages from the qualified binaries
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/plugin-npm"
          for t in darwin:arm64 darwin:x64 linux:x64 linux:arm64 win32:x64; do
            os="${t%%:*}"; cpu="${t##*:}"
            exe=""; [ "$os" = "win32" ] && exe=".exe"
            bash plugin/packaging/npm/platform-package.sh "$os" "$cpu" "$PLUGIN_VERSION" \
              "$PLUGIN_DIST/$PLUGIN_NAME-$os-$cpu$exe" "$build"
          done
          bash plugin/packaging/npm/launcher-package.sh "$PLUGIN_VERSION" "$build"
          mkdir -p "$build/tgz"
          for pkg in "$build/$PLUGIN_NPM_PACKAGE"-* "$build/$PLUGIN_NPM_PACKAGE"; do
            (cd "$pkg" && npm pack --pack-destination "$build/tgz" --ignore-scripts)
          done
          ls -l "$build/tgz"
          echo "PLUGIN_TGZ_DIR=$build/tgz" >> "$GITHUB_ENV"

      - name: Stage exact verified packages for maintainer review
        shell: bash
        run: |
          set -euo pipefail
          # Platform packages first, the launcher last: a launcher must never
          # be approved ahead of the platform package it resolves.
          scope="${PLUGIN_NPM_PACKAGE%%/*}"; base="${PLUGIN_NPM_PACKAGE##*/}"
          for tgz in "$PLUGIN_TGZ_DIR"/"${scope#@}"-"$base"-*-"$PLUGIN_VERSION".tgz; do
            npm stage publish "$tgz" --access public --tag latest --provenance
          done
          npm stage publish "$PLUGIN_TGZ_DIR/${scope#@}-$base-$PLUGIN_VERSION.tgz" \
            --access public --tag latest --provenance
