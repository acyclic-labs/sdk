name: Release Acyclic Agent Runtime

on:
  push:
    tags:
      - harness-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.subject.outputs.source-sha }}
      stream-version: ${{ steps.subject.outputs.stream-version }}
      tag-oid: ${{ steps.subject.outputs.tag-oid }}
      version: ${{ steps.subject.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - name: Install pinned build tools and fetch the locked dependency closure
        env:
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ runner.arch }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ensure-bun.sh
          cargo install --locked wasm-bindgen-cli --version 0.2.117
          bun install --frozen-lockfile
          cargo fetch --locked
      - name: Verify tag, contracts, and isolated packages
        id: subject
        env:
          TOOLS_DIR: ${{ runner.temp }}/tools/${{ runner.arch }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ensure-bun.sh
          tag_oid="$(git rev-parse "$GITHUB_REF")"
          source_sha="$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$(git cat-file -t "$tag_oid")" = tag
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$GITHUB_SHA" = "$source_sha"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          version="$(printf '%s' "$metadata" | bun -e 'const m=await Bun.stdin.json(); console.log(m.packages.find(p=>p.name==="acyclic-harness").version)')"
          stream_version="$(printf '%s' "$metadata" | bun -e 'const m=await Bun.stdin.json(); console.log(m.packages.find(p=>p.name==="acyclic-stream").version)')"
          npm_version="$(bun -e 'console.log((await Bun.file("typescript/packages/harness/package.json").json()).version)')"
          manifest_version="$(bun -e 'console.log((await Bun.file("compatibility/manifest.json").json()).families.harness.version)')"
          test "$version" = "$npm_version"
          test "$version" = "$manifest_version"
          test "$GITHUB_REF_NAME" = "harness-v${version}"
          printf 'source-sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'stream-version=%s\n' "$stream_version" >> "$GITHUB_OUTPUT"
          printf 'tag-oid=%s\n' "$tag_oid" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          bun run check:generated
          bun scripts/check-metadata.mjs
          bash scripts/check-harness-package.sh "$GITHUB_WORKSPACE/target/release-assets/harness"
          bun scripts/run-harness-conformance.mjs \
            "$GITHUB_WORKSPACE/target/release-assets/harness" \
            "$GITHUB_WORKSPACE/target/release-assets/harness/runner-report.json" \
            "$GITHUB_WORKSPACE/target/release-assets/harness/qualification-receipt.json"
      - name: Stage and verify the exact release bundle
        env:
          STREAM_VERSION: ${{ steps.subject.outputs.stream-version }}
          VERSION: ${{ steps.subject.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="target/release-assets/harness"
          bundle="target/release-bundle"
          test ! -e "$bundle"
          mkdir "$bundle"
          install -m 0644 \
            "$assets/acyclic-harness.tgz" \
            "$assets/acyclic-harness-${VERSION}.crate" \
            "$assets/acyclic-stream-${STREAM_VERSION}.crate" \
            "$assets/CONFORMANCE-EVIDENCE.json" \
            "$assets/runner-report.json" \
            "$assets/qualification-receipt.json" \
            proto/harness/v1/harness.proto \
            conformance/vectors/core.json \
            compatibility/manifest.json \
            "$bundle/"
          cd "$bundle"
          sha256sum \
            acyclic-harness.tgz \
            "acyclic-harness-${VERSION}.crate" \
            "acyclic-stream-${STREAM_VERSION}.crate" \
            CONFORMANCE-EVIDENCE.json \
            runner-report.json \
            qualification-receipt.json \
            harness.proto \
            core.json \
            manifest.json > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 10
      - name: Upload verified release bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-bundle/
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the exact verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          digest-mismatch: error
          merge-multiple: true
          path: target/release-bundle
      - name: Reverify artifact, tag, and publish immutable assets
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          STREAM_VERSION: ${{ needs.build.outputs.stream-version }}
          TAG_OID: ${{ needs.build.outputs.tag-oid }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "harness-v${VERSION}"
          remote_artifact_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .digest)"
          test "${remote_artifact_digest#sha256:}" = "$ARTIFACT_DIGEST"
          remote_tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)"
          remote_tag_oid="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          test "$remote_tag_type" = tag
          test "$remote_tag_oid" = "$TAG_OID"
          remote_source_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OID" --jq .object.type)"
          remote_source_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OID" --jq .object.sha)"
          test "$remote_source_type" = commit
          test "$remote_source_sha" = "$SOURCE_SHA"
          bundle="target/release-bundle"
          expected=(
            SHA256SUMS
            CONFORMANCE-EVIDENCE.json
            "acyclic-harness-${VERSION}.crate"
            acyclic-harness.tgz
            "acyclic-stream-${STREAM_VERSION}.crate"
            core.json
            harness.proto
            manifest.json
            qualification-receipt.json
            runner-report.json
          )
          test "$(find "$bundle" -mindepth 1 -maxdepth 1 | wc -l)" -eq "${#expected[@]}"
          for name in "${expected[@]}"; do
            test -f "$bundle/$name"
            test ! -L "$bundle/$name"
          done
          mapfile -t checksummed < <(sed -n 's/^[0-9a-f]\{64\}  //p' "$bundle/SHA256SUMS" | sort)
          expected_checksums=("${expected[@]:1}")
          mapfile -t expected_checksums < <(printf '%s\n' "${expected_checksums[@]}" | sort)
          test "${#checksummed[@]}" -eq "${#expected_checksums[@]}"
          for index in "${!expected_checksums[@]}"; do
            test "${checksummed[$index]}" = "${expected_checksums[$index]}"
          done
          (cd "$bundle" && sha256sum --strict --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            "$bundle/acyclic-harness.tgz" \
            "$bundle/acyclic-harness-${VERSION}.crate" \
            "$bundle/acyclic-stream-${STREAM_VERSION}.crate" \
            "$bundle/SHA256SUMS" \
            "$bundle/CONFORMANCE-EVIDENCE.json" \
            "$bundle/runner-report.json" \
            "$bundle/qualification-receipt.json" \
            "$bundle/harness.proto" \
            "$bundle/core.json" \
            "$bundle/manifest.json" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Acyclic Agent Runtime ${VERSION}"
