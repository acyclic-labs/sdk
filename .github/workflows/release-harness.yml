name: Release Acyclic Agent Runtime

on:
  push:
    tags:
      - harness-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ensure-bun.sh
          cargo install --locked wasm-bindgen-cli --version 0.2.117
          bun install --frozen-lockfile
      - name: Verify tag, contracts, and isolated packages
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ensure-bun.sh
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          rust_version="$(cargo metadata --locked --no-deps --format-version 1 | bun -e 'const m=await Bun.stdin.json(); console.log(m.packages.find(p=>p.name==="acyclic-harness").version)')"
          npm_version="$(bun -e 'console.log((await Bun.file("typescript/packages/harness/package.json").json()).version)')"
          manifest_version="$(bun -e 'console.log((await Bun.file("compatibility/manifest.json").json()).families.harness.version)')"
          test "$rust_version" = "$npm_version"
          test "$rust_version" = "$manifest_version"
          test "$GITHUB_REF_NAME" = "harness-v${rust_version}"
          bun run check:generated
          bun scripts/check-metadata.mjs
          bash scripts/check-harness-package.sh "$GITHUB_WORKSPACE/target/release-assets/harness"
          bun scripts/run-harness-conformance.mjs \
            "$GITHUB_WORKSPACE/target/release-assets/harness" \
            "$GITHUB_WORKSPACE/target/release-assets/harness/runner-report.json" \
            "$GITHUB_WORKSPACE/target/release-assets/harness/qualification-receipt.json"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="target/release-assets/harness"
          gh release create "$GITHUB_REF_NAME" \
            "$assets/acyclic-harness.tgz" \
            "$assets/acyclic-harness-"*.crate \
            "$assets/acyclic-stream-"*.crate \
            "$assets/SHA256SUMS" \
            "$assets/CONFORMANCE-EVIDENCE.json" \
            "$assets/runner-report.json" \
            "$assets/qualification-receipt.json" \
            proto/harness/v1/harness.proto \
            conformance/vectors/core.json \
            compatibility/manifest.json \
            --verify-tag \
            --generate-notes \
            --title "Acyclic Agent Runtime ${GITHUB_REF_NAME#harness-v}"
