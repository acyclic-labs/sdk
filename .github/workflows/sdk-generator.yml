name: SDK Generator

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: sdk-generator-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  go:
    name: Generator staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check Go formatting and staging
        working-directory: tools/sdk-generator/backends/go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -p=1 -parallel=1 -count=1 -v ./...
          node --test tests/qualify.test.mjs
      - name: Check backend staging
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          import { languageGeneratorBackends } from './scripts/plan-qualification.mjs';
          const paths = [];
          for (const backend of languageGeneratorBackends.filter(name => name !== 'go')) {
            const root = `tools/sdk-generator/backends/${backend}/tests`;
            const tests = readdirSync(root).filter(name => name.endsWith('.test.mjs')).sort();
            if (!tests.length) throw new Error(`no focused controls for ${backend}`);
            paths.push(...tests.map(name => `${root}/${name}`));
          }
          execFileSync(process.execPath, ['--test', '--test-concurrency=1', ...paths], { stdio: 'inherit' });
          JS
