name: SDK Generator

on:
  pull_request:
    paths:
      - 'tools/sdk-generator/**'
      - '.github/workflows/sdk-generator.yml'
      - 'scripts/archive-utils.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-generator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Generator staging
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select affected generator checks
        id: scope
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const changed = process.env.GITHUB_EVENT_NAME === 'pull_request'
            ? execFileSync('git', ['diff', '--name-only', '-z', 'HEAD^', 'HEAD'], { encoding: 'utf8' }).split('\0')
            : ['.github/workflows/sdk-generator.yml'];
          const workflow = changed.includes('.github/workflows/sdk-generator.yml');
          for (const backend of ['go', 'java', 'dotnet']) {
            const affected = workflow || changed.some(path =>
              (path.startsWith(`tools/sdk-generator/backends/${backend}/`)
                && path !== `tools/sdk-generator/backends/${backend}/README.md`)
              || (backend === 'go' ? path === 'scripts/archive-utils.mjs'
                : path.startsWith('tools/sdk-generator/shared/')));
            appendFileSync(process.env.GITHUB_OUTPUT, `${backend}=${affected}\n`);
          }
          JS
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.scope.outputs.go == 'true'
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check Go formatting and staging
        if: steps.scope.outputs.go == 'true'
        working-directory: tools/sdk-generator/backends/go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -p=1 -parallel=1 -count=1 -v ./...
          node --test tests/qualify.test.mjs
      - name: Check Java and JVM staging
        if: steps.scope.outputs.java == 'true'
        run: node --test --test-concurrency=1 tools/sdk-generator/backends/java/tests/*.test.mjs
      - name: Check .NET staging
        if: steps.scope.outputs.dotnet == 'true'
        run: node --test --test-concurrency=1 tools/sdk-generator/backends/dotnet/tests/*.test.mjs
