name: SDK Generator

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: sdk-generator-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  go:
    name: Generator staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check Go formatting and staging
        working-directory: tools/sdk-generator/backends/go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -p=1 -parallel=1 -count=1 -v ./...
      - name: Check backend staging
        env:
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: |
          source scripts/ensure-bun.sh
          bun install --frozen-lockfile
          node scripts/node-tests.mjs --only tools/sdk-generator
