name: SDK Generator

on:
  pull_request:
    paths:
      - 'tools/sdk-generator/**'
      - '.github/workflows/sdk-generator.yml'
      - 'scripts/archive-utils.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-generator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go producer staging
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check formatting and staging
        working-directory: tools/sdk-generator/backends/go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -p=1 -parallel=1 -count=1 -v ./...
          node --test qualify.test.mjs
