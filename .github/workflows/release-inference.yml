name: Release Inference SDK

on:
  push:
    tags:
      - inference-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - name: Verify tag, package, and registry checksum
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "inference-sdk"))')"
          test "$GITHUB_REF_NAME" = "inference-v${version}"
          bash scripts/check-inference-package.sh target/release-assets
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#inference-v}"
          gh release create "$GITHUB_REF_NAME" \
            "target/release-assets/inference-sdk-${version}.crate" \
            proto/inference/v1/inference.proto \
            rust/crates/inference/inference_descriptor.bin \
            conformance/vectors/inference.json \
            compatibility/manifest.json \
            target/release-assets/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Inference SDK ${version}"
