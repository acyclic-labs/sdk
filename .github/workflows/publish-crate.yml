name: Publish crates.io

on:
  push:
    tags:
      - publish/*/*

permissions:
  contents: read

concurrency:
  group: crates-io-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish qualified crate
    environment: crates-io
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 4
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Download and verify exact release package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/prepare-crate-publication.sh

      - name: Acquire short-lived crates.io token
        id: crates-io-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Resolve crates.io token
        env:
          OIDC_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          BOOTSTRAP_RELEASE: ${{ vars.CRATES_IO_BOOTSTRAP_RELEASE }}
        shell: bash
        run: |
          set -euo pipefail
          release="$PACKAGE@$VERSION"
          if [[ -n "$BOOTSTRAP_TOKEN" && "$BOOTSTRAP_RELEASE" == "$release" ]]; then
            token=$BOOTSTRAP_TOKEN
          elif [[ -n "$OIDC_TOKEN" ]]; then
            token=$OIDC_TOKEN
          else
            echo "No authorized crates.io token for $release" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CARGO_REGISTRY_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Publish exact verified source package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish-crate.py "$PACKAGE" "$VERSION" "$CRATE" "$CRATE_SHA256" "$SOURCE_SHA"
          published=$(mktemp "${RUNNER_TEMP:?}/published-crate.XXXXXX")
          trap 'rm -f "$published"' EXIT
          observed=
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 \
              --max-filesize "$CRATE_SIZE" --output "$published" \
              "https://static.crates.io/crates/$PACKAGE/$PACKAGE-$VERSION.crate"; then
              if [[ "$(stat -c %s "$published")" != "$CRATE_SIZE" ]]; then
                echo "Public crate size differs from the qualified asset ($attempt/12)"
              else
                observed=$(sha256sum "$published" | cut -d ' ' -f 1)
                if [[ "$observed" == "$CRATE_SHA256" ]]; then break; fi
                echo "Public crate checksum differs from the qualified asset ($attempt/12)"
              fi
            else
              curl_status=$?
              if (( curl_status == 63 )); then
                echo "Public crate exceeds the qualified asset size" >&2
                exit 1
              fi
              echo "Public crate bytes are not available yet ($attempt/12)"
            fi
            sleep 5
          done
          test "$observed" = "$CRATE_SHA256"
