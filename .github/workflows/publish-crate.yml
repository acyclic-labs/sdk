name: Publish crates.io

on:
  push:
    tags:
      - publish/*/*

permissions:
  contents: read

concurrency:
  group: crates-io-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish qualified crate
    environment: crates-io
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Mount Cargo registry
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-publish-cargo-registry-v1
          path: ~/.cargo/registry
      - name: Mount Cargo git database
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-publish-cargo-git-v1
          path: ~/.cargo/git
      - name: Mount Rust toolchains
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-publish-rustup-v1
          path: ~/.rustup
      - name: Mount build outputs
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: sdk-publish-target-v1
          path: ${{ github.workspace }}/target

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Verify tag and package without publishing
        shell: bash
        run: bash scripts/prepare-crate-publication.sh

      - name: Acquire short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish exact verified source package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish-crate.py "$PACKAGE" "$CRATE" "$CRATE_SHA256"
          observed=
          for attempt in $(seq 1 12); do
            if response=$(curl --fail --silent --show-error --max-time 30 \
              "https://crates.io/api/v1/crates/$PACKAGE/$VERSION"); then
              observed=$(printf '%s' "$response" | python3 -c \
                'import json,sys; print(json.load(sys.stdin)["version"]["checksum"])')
              if [[ "$observed" == "$CRATE_SHA256" ]]; then
                break
              fi
            fi
            echo "Waiting for crates.io index visibility ($attempt/12)"
            sleep 5
          done
          test "$observed" = "$CRATE_SHA256"
