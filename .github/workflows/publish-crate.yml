name: Publish Cargo release

on:
  push:
    tags:
      - "cargo-v*"

permissions:
  contents: read

concurrency:
  group: cargo-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare qualified Cargo source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - name: Verify release tag and merged source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^cargo-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]
          version=${BASH_REMATCH[1]}
          tag_oid=$(git rev-parse "$GITHUB_REF")
          test "$(git cat-file -t "$tag_oid")" = tag
          source_sha=$(git rev-parse "$tag_oid^{commit}")
          test "$(git rev-parse HEAD)" = "$source_sha"
          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
          node scripts/publish-cargo-crates.mjs check "$source_sha" "$version"
          printf 'version=%s\nsource_sha=%s\n' "$version" "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Require exact successful SDK qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/qualification.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f status=success -f event=push -F per_page=20 \
            --jq '[.workflow_runs[] | select(.head_sha == env.SOURCE_SHA and .conclusion == "success")] | length')
          test "$count" -gt 0
      - name: Bundle exact publication source
        shell: bash
        run: git bundle create "$RUNNER_TEMP/cargo-publication.bundle" "$GITHUB_REF"
      - name: Retain exact publication input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-publication-${{ steps.release.outputs.source_sha }}
          path: ${{ runner.temp }}/cargo-publication.bundle
          if-no-files-found: error

  publish:
    name: Publish qualified Cargo crates
    needs: prepare
    environment: crates-io
    # crates.io trusted publishing requires GitHub's OIDC identity.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-publication-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/cargo-publication
      - name: Restore exact qualified source
        shell: bash
        run: |
          git clone "$RUNNER_TEMP/cargo-publication/cargo-publication.bundle" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" checkout --detach '${{ needs.prepare.outputs.source_sha }}'
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = '${{ needs.prepare.outputs.source_sha }}'
          test -z "$(git -C "$RUNNER_TEMP/source" status --porcelain=v1)"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in validated dependency order
        working-directory: ${{ runner.temp }}/source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          node scripts/publish-cargo-crates.mjs publish
          "${{ needs.prepare.outputs.source_sha }}"
          "${{ needs.prepare.outputs.version }}"
