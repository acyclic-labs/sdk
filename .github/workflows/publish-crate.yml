name: Publish Cargo release

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      qualification_run_id:
        type: string
        required: true
      qualification_run_attempt:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cargo-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare qualified Cargo source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      rust_toolchain: ${{ steps.rust.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Install exact Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
      - name: Use exact coordinated release source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'version=%s\nsource_sha=%s\n' "$VERSION" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
      - name: Qualification is a completed release dependency
        env:
          RUN: ${{ inputs.qualification_run_id }}
          ATTEMPT: ${{ inputs.qualification_run_attempt }}
        shell: bash
        run: |-
          test -n "$RUN" && test -n "$ATTEMPT"
      - name: Bundle exact publication source
        shell: bash
        run: git bundle create "$RUNNER_TEMP/cargo-publication.bundle" HEAD
      - name: Retain exact publication input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cargo-publication-${{ steps.release.outputs.source_sha }}
          path: ${{ runner.temp }}/cargo-publication.bundle
          if-no-files-found: error
      - name: Admit this coordinated qualification graph
        env:
          RUN: ${{ inputs.qualification_run_id }}
          ATTEMPT: ${{ inputs.qualification_run_attempt }}
        run: |-
          test "$RUN" = "$GITHUB_RUN_ID"
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ATTEMPT" -le "$GITHUB_RUN_ATTEMPT"
        shell: bash

  publish:
    name: Publish qualified Cargo crates
    needs: prepare
    environment: crates-io
    # crates.io trusted publishing requires GitHub's OIDC identity.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-publication-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/cargo-publication
      - name: Restore exact qualified source
        shell: bash
        run: |
          git clone "$RUNNER_TEMP/cargo-publication/cargo-publication.bundle" "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" checkout --detach '${{ needs.prepare.outputs.source_sha }}'
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = '${{ needs.prepare.outputs.source_sha }}'
          test -z "$(git -C "$RUNNER_TEMP/source" status --porcelain=v1)"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ needs.prepare.outputs.rust_toolchain }}
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in validated dependency order
        working-directory: ${{ runner.temp }}/source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          node scripts/publish-cargo-crates.mjs publish "${{ needs.prepare.outputs.source_sha }}" "${{ needs.prepare.outputs.version }}"

  verify-install:
    name: Verify crates.io CLI installation
    needs: [ prepare, publish ]
    # Installing compiles the whole dependency graph from the registry.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ needs.prepare.outputs.rust_toolchain }}
      - name: Install the published crate from the registry
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/acyclic-registry-install"
          cargo install --locked --root "$install_root" --version "$RELEASE_VERSION" acyclic-plugin
          test "$("$install_root/bin/acyclic" --version)" = "acyclic $RELEASE_VERSION"
