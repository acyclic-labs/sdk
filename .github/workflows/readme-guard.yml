# README changes must be approved by a human owner who did not open the PR.
# Required on main by the "README guard" ruleset. pull_request_target runs this
# file from main, so a PR can't change the guard it is checked by. The job only
# reads PR metadata through the API and never checks out PR code. There is no
# review trigger (it would run the PR's copy): after approving, the reviewer
# ticks the checkbox, and that edit re-runs the check.
name: README guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: readme-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readme-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const owners = ['ramstar3000', 'Var1377'];
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Any file whose name starts with README, including the old name of a renamed README.
            const isReadme = path => /^readme/i.test(path.split('/').pop()) && path !== '.github/workflows/readme-guard.yml';
            const printable = path => path.replace(/[\x00-\x1f\x7f]/g, '?');
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const readmes = files.flatMap(f => [f.filename, f.previous_filename]).filter(p => p && isReadme(p));
            if (readmes.length === 0) return core.info('No README changes.');
            core.info(`README changes: ${[...new Set(readmes)].map(printable).join(', ')}`);

            if (!/- \[x\] README text written by a human/i.test(pr.body || '')) {
              core.setFailed('Tick "README text written by a human" in the PR description.');
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number });
            const approved = reviews.some(r =>
              r.state === 'APPROVED' &&
              r.commit_id === pr.head.sha &&
              owners.includes(r.user.login) &&
              r.user.login !== pr.user.login);
            if (!approved) {
              core.setFailed(`README changes need an approval on the latest commit from ${owners.join(' or ')}, other than the PR author.`);
            }
