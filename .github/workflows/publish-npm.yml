name: Publish npm release

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      qualification_run_id:
        type: string
        required: true
      qualification_run_attempt:
        type: string
        required: true
      qualification_artifacts:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare qualified npm packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Use exact coordinated release source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'version=%s\nsource_sha=%s\n' "$VERSION" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Install maintained NAPI assembly dependencies
        env:
          TOOLS_DIR: ${{ runner.temp }}/stream-native-tools
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ensure-bun.sh
          bun install --frozen-lockfile
          # Inventory generation uses the maintained Rust generator offline.
          cargo fetch --locked

      - name: Download exact successful qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          TOOLS_DIR: ${{ runner.temp }}/stream-native-tools
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
          QUALIFICATION_ARTIFACTS: ${{ inputs.qualification_artifacts }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$QUALIFICATION_RUN_ID"
          run_attempt="$QUALIFICATION_RUN_ATTEMPT"
          test -n "$run_id" && test -n "$run_attempt"
          artifact="$(jq -er '.["packages-linux"]' <<<"$QUALIFICATION_ARTIFACTS")"
          for lane in packages-linux packages-linux-arm64 packages-macos stream-native-windows filesystem-native-windows-arm64; do
            name="$(jq -er --arg lane "$lane" '.[$lane]' <<<"$QUALIFICATION_ARTIFACTS")"
            [[ "$name" =~ ^$lane-$run_id-[1-9][0-9]*$ ]]
          done
          mkdir -p "$RUNNER_TEMP/qualified"
          gh run download "$run_id" --name "$artifact" --dir "$RUNNER_TEMP/qualified"
          test -f "$RUNNER_TEMP/qualified/typescript/QUALIFICATION.json"
          stage="$RUNNER_TEMP/npm-publication"
          mkdir -p "$stage/scripts" "$stage/release"
          cp -R "$RUNNER_TEMP/qualified/typescript" "$stage/typescript"
          cp scripts/publish-npm-packages.mjs "$stage/scripts/"
          cp scripts/plugin-qualification.mjs "$stage/scripts/"
          cp scripts/typescript-qualification.mjs "$stage/scripts/"
          cp scripts/assemble-{actors,stream,workers,filesystem}-native-package.mjs scripts/build-{actors,stream,workers,filesystem}-native.mjs \
            scripts/assemble-native-family.mjs scripts/build-native-family.mjs \
            scripts/native-family.mjs scripts/archive-utils.mjs "$stage/scripts/"
          mkdir -p "$stage/scripts/generated/native-families"
          cp scripts/generated/native-families/{actors,stream,workers,filesystem}.json "$stage/scripts/generated/native-families/"
          cp release/npm-packages.json "$stage/release/"
          node scripts/assemble-stream-native-package.mjs inventory "$stage/release/stream-native-packages.json" "$SOURCE_SHA"
          node scripts/assemble-actors-native-package.mjs inventory "$stage/release/actors-native-packages.json" "$SOURCE_SHA"
          node scripts/assemble-workers-native-package.mjs inventory "$stage/release/workers-native-packages.json" "$SOURCE_SHA"
          node scripts/assemble-filesystem-native-package.mjs inventory "$stage/release/filesystem-native-packages.json" "$SOURCE_SHA"
          node - "$stage" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const stage = process.argv[2];
          for (const item of JSON.parse(fs.readFileSync('release/npm-packages.json', 'utf8'))) {
            if (item.source !== 'typescript') continue;
            const relative = path.join('typescript', 'packages', item.directory, 'package.json');
            const target = path.join(stage, relative);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(relative, target);
          }
          NODE
          mkdir -p "$stage/plugin"
          cp plugin/package.json "$stage/plugin/"
          native_artifact="$(jq -er '.["stream-native-windows"]' <<<"$QUALIFICATION_ARTIFACTS")"
          native_stage="$RUNNER_TEMP/qualified-stream-native"
          mkdir -p "$native_stage"
          cp -R "$RUNNER_TEMP/qualified/stream-native" "$native_stage/linux"
          gh run download "$run_id" --name "$native_artifact" --dir "$RUNNER_TEMP/qualified-windows-native"
          mkdir -p "$native_stage/windows"
          cp -R "$RUNNER_TEMP/qualified-windows-native/bundle" "$native_stage/windows/bundle"
          cp "$RUNNER_TEMP/qualified-windows-native/producer-receipt.json" "$native_stage/windows/"
          mac_artifact="$(jq -er '.["packages-macos"]' <<<"$QUALIFICATION_ARTIFACTS")"
          gh run download "$run_id" --name "$mac_artifact" --dir "$RUNNER_TEMP/qualified-macos"
          cp -R "$RUNNER_TEMP/qualified-macos/stream-native" "$native_stage/macos"
          node scripts/assemble-stream-native-package.mjs release \
            "$stage/typescript" "$native_stage" "$SOURCE_SHA" "$RUNNER_TEMP/qualified/typescript"
          actors_stage="$RUNNER_TEMP/qualified-actors-native"
          mkdir -p "$actors_stage"
          cp -R "$RUNNER_TEMP/qualified/actors-native" "$actors_stage/linux"
          cp -R "$RUNNER_TEMP/qualified-windows-native/actors-native" "$actors_stage/windows"
          cp -R "$RUNNER_TEMP/qualified-macos/actors-native" "$actors_stage/macos"
          node scripts/assemble-actors-native-package.mjs release \
            "$stage/typescript" "$actors_stage" "$SOURCE_SHA" "$RUNNER_TEMP/qualified/typescript"
          workers_stage="$RUNNER_TEMP/qualified-workers-native"
          mkdir -p "$workers_stage"
          cp -R "$RUNNER_TEMP/qualified/workers-native" "$workers_stage/linux"
          cp -R "$RUNNER_TEMP/qualified-windows-native/workers-native" "$workers_stage/windows"
          cp -R "$RUNNER_TEMP/qualified-macos/workers-native" "$workers_stage/macos"
          node scripts/assemble-workers-native-package.mjs release \
            "$stage/typescript" "$workers_stage" "$SOURCE_SHA" "$RUNNER_TEMP/qualified/typescript"
          filesystem_stage="$RUNNER_TEMP/qualified-filesystem-native"
          mkdir -p "$filesystem_stage"
          cp -R "$RUNNER_TEMP/qualified/filesystem-native" "$filesystem_stage/linux"
          cp -R "$RUNNER_TEMP/qualified-windows-native/filesystem-native" "$filesystem_stage/windows"
          cp -R "$RUNNER_TEMP/qualified-macos/filesystem-native" "$filesystem_stage/macos"
          arm_linux_artifact="$(jq -er '.["packages-linux-arm64"]' <<<"$QUALIFICATION_ARTIFACTS")"
          gh run download "$run_id" --name "$arm_linux_artifact" --dir "$RUNNER_TEMP/qualified-linux-arm64"
          cp -R "$RUNNER_TEMP/qualified-linux-arm64/filesystem-native" "$filesystem_stage/linux-arm64"
          arm_windows_artifact="$(jq -er '.["filesystem-native-windows-arm64"]' <<<"$QUALIFICATION_ARTIFACTS")"
          gh run download "$run_id" --name "$arm_windows_artifact" --dir "$filesystem_stage/windows-arm64"
          node scripts/assemble-filesystem-native-package.mjs release \
            "$stage/typescript" "$filesystem_stage" "$SOURCE_SHA" "$RUNNER_TEMP/qualified/typescript"
          source scripts/ensure-bun.sh
          bun scripts/check-typescript-tarballs.mjs --archives "$stage/typescript"

      - name: Download exact qualified universal plugin
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$QUALIFICATION_RUN_ID"
          run_attempt="$QUALIFICATION_RUN_ATTEMPT"
          test -n "$run_id" && test -n "$run_attempt"
          universal="$RUNNER_TEMP/qualified-plugin"
          mkdir -p "$universal"
          gh run download "$run_id" --name "acyclic-universal-${run_id}-${run_attempt}" --dir "$universal"
          test -f "$universal/acyclic-plugin-npm.tgz"
          test -f "$universal/plugin-qualification.json"
          stage="$RUNNER_TEMP/npm-publication"
          asset="$stage/typescript/acyclic-labs-plugin-$VERSION.tgz"
          cp "$universal/acyclic-plugin-npm.tgz" "$asset"
          cp "$universal/plugin-qualification.json" "$stage/plugin/QUALIFICATION.json"
          node "$stage/scripts/plugin-qualification.mjs" verify \
            "$stage/plugin/QUALIFICATION.json" "$SOURCE_SHA" "$asset" "$VERSION"

      - name: Retain exact publication input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-publication-${{ steps.release.outputs.source_sha }}
          path: ${{ runner.temp }}/npm-publication
          if-no-files-found: error
      - name: Admit this coordinated qualification graph
        env:
          RUN: ${{ inputs.qualification_run_id }}
          ATTEMPT: ${{ inputs.qualification_run_attempt }}
        run: |-
          test "$RUN" = "$GITHUB_RUN_ID"
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ATTEMPT" -le "$GITHUB_RUN_ATTEMPT"
        shell: bash

  publish:
    name: Publish qualified npm packages
    needs: prepare
    environment: npmjs
    # npm trusted publishing currently requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    # Eight sequential packages may each take up to five minutes to appear in npm.
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publication-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/npm-publication
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              throw new Error("npm " + process.argv[1] + " does not support trusted publishing");
            }
          ' "$npm_version"
      - name: Publish exact qualified packages to npm
        shell: bash
        working-directory: ${{ runner.temp }}/npm-publication
        run: >-
          node scripts/publish-npm-packages.mjs typescript "${{ needs.prepare.outputs.source_sha }}" "${{ needs.prepare.outputs.version }}"
