name: Publish npm release

on:
  push:
    tags:
      - "npm-v*"

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish qualified npm packages
    environment: npmjs
    # npm trusted publishing currently requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release tag and merged source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^npm-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]
          version=${BASH_REMATCH[1]}
          tag_oid=$(git rev-parse "$GITHUB_REF")
          test "$(git cat-file -t "$tag_oid")" = tag
          source_sha=$(git rev-parse "$tag_oid^{commit}")
          test "$(git rev-parse HEAD)" = "$source_sha"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            for (const item of JSON.parse(fs.readFileSync("release/npm-packages.json", "utf8"))) {
              const manifest = JSON.parse(fs.readFileSync(`typescript/packages/${item.directory}/package.json`, "utf8"));
              if (manifest.name !== item.name || manifest.version !== version || manifest.private !== false) {
                throw new Error(`release identity mismatch for ${item.directory}`);
              }
            }
          ' "$version"
          printf 'version=%s\nsource_sha=%s\n' "$version" "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-12.0.2.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://registry.npmjs.org/npm/-/npm-12.0.2.tgz --output "$archive"
          echo 'b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943  '"$archive" | sha512sum --check --strict
          npm install --global --ignore-scripts "$archive"

      - name: Download exact successful qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/qualification.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f status=success -f event=push -F per_page=20 \
            --jq '[.workflow_runs[] | select(.head_sha == env.SOURCE_SHA and .conclusion == "success")] | sort_by([.run_number, .run_attempt]) | last | [.id, .run_attempt] | @tsv')
          read -r run_id run_attempt <<<"$run"
          test -n "$run_id" && test -n "$run_attempt"
          artifact="packages-linux-${run_id}-${run_attempt}"
          mkdir -p "$RUNNER_TEMP/qualified"
          gh run download "$run_id" --name "$artifact" --dir "$RUNNER_TEMP/qualified"
          test -f "$RUNNER_TEMP/qualified/typescript/QUALIFICATION.json"
          echo "NPM_ARTIFACT_DIR=$RUNNER_TEMP/qualified/typescript" >> "$GITHUB_ENV"

      - name: Publish exact qualified packages to npm
        shell: bash
        run: >-
          node scripts/publish-npm-packages.mjs
          "$NPM_ARTIFACT_DIR"
          "${{ steps.release.outputs.source_sha }}"
          "${{ steps.release.outputs.version }}"
