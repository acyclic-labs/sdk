name: Stage npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stage/npm/<package>/<version> tag to retry
        required: true
        type: string
      tag_oid:
        description: Immutable annotated tag object SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-staging
  cancel-in-progress: false

jobs:
  stage:
    name: Stage qualified npm package
    environment: npmjs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify and select exact tagged source
        env:
          NPM_STAGE_TAG: ${{ inputs.tag }}
          NPM_STAGE_TAG_OID: ${{ inputs.tag_oid }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NPM_STAGE_TAG" =~ ^stage/npm/(objects|stream|inference|machines|fs|sdk)/[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$NPM_STAGE_TAG_OID" =~ ^[0-9a-f]{40}$ ]]
          ref="refs/tags/$NPM_STAGE_TAG"
          git show-ref --verify --quiet "$ref"
          test "$(git rev-parse "$ref")" = "$NPM_STAGE_TAG_OID"
          test "$(git cat-file -t "$NPM_STAGE_TAG_OID")" = tag
          source_sha=$(git rev-parse "$NPM_STAGE_TAG_OID^{commit}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          install -m 0755 scripts/prepare-npm-publication.sh "$RUNNER_TEMP/prepare-npm-publication.sh"
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-12.0.2.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://registry.npmjs.org/npm/-/npm-12.0.2.tgz --output "$archive"
          echo 'b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943  '"$archive" | sha512sum --check --strict
          npm install --global --ignore-scripts "$archive"

      - name: Download and verify exact qualified package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_STAGE_TAG: ${{ inputs.tag }}
          NPM_STAGE_TAG_OID: ${{ inputs.tag_oid }}
        shell: bash
        run: bash "$RUNNER_TEMP/prepare-npm-publication.sh"

      - name: Stage exact verified package for maintainer review
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish "$NPM_ARCHIVE" --access public --tag next --provenance
