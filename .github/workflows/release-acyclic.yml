name: Release Acyclic plugin

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
    outputs:
      attempt:
        description: Attempt which assembled the exact qualified artifact set
        value: ${{ jobs.assemble.outputs.attempt }}
      artifacts:
        description: Exact package artifacts retained by the successful qualification lanes
        value: ${{ jobs.assemble.outputs.artifacts }}
permissions:
  contents: read

concurrency:
  group: acyclic-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - target: linux-x64-gnu
            cache_size: 1024M
            backend: linux-fuse
            qualifier: native-mount-qualify
            rust_target: x86_64-unknown-linux-gnu
            runner: kaizen-linux
            executable: acyclic
          - target: linux-x64-musl
            cache_size: 384M
            rust_target: x86_64-unknown-linux-musl
            runner: kaizen-linux
            executable: acyclic
          - target: linux-arm64-gnu
            cache_size: 384M
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable: acyclic
          - target: linux-arm64-musl
            cache_size: 384M
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            executable: acyclic
          - target: darwin-x64
            cache_size: 320M
            rust_target: x86_64-apple-darwin
            runner: macos-15
            executable: acyclic
          - target: darwin-arm64
            cache_size: 640M
            backend: macos-nfs
            qualifier: native-mount-qualify
            rust_target: aarch64-apple-darwin
            runner: macos-15
            executable: acyclic
          - target: win32-x64
            cache_size: 1216M
            backend: windows-projfs
            qualifier: native-mount-qualify.exe
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: acyclic.exe
          - target: win32-arm64
            cache_size: 2048M
            rust_target: aarch64-pc-windows-msvc
            runner: windows-2025
            executable: acyclic.exe
    runs-on: ${{ matrix.runner }}
    env:
      # Long uncached links outlast the daemon's default idle timeout and
      # otherwise leave post-job statistics reporting a fresh, empty server.
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.rust_target }}
      - name: Restore Rust build cache
        id: rust-cache
        uses: ./.github/actions/rust-build-cache
        with:
          scope: release-${{ matrix.rust_target }}
          cache_size: ${{ matrix.cache_size }}
      - name: Install Windows ARM64 compiler
        if: matrix.rust_target == 'aarch64-pc-windows-msvc'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 20.1.8
          directory: ${{ runner.temp }}/llvm
          env: false
      - name: Install musl linker
        if: endsWith(matrix.rust_target, '-musl')
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      # The product, the native qualification executable, and the Cargo
      # installation check are independent builds with different flags, so they
      # run side by side in separate target directories.
      - name: Build the unified executable
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.rust_target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.rust_target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
          CC_aarch64_pc_windows_msvc: ${{ matrix.rust_target == 'aarch64-pc-windows-msvc' && format('{0}/llvm/bin/clang.exe', runner.temp) || '' }}
          BUILD_QUALIFIER: ${{ matrix.target == 'linux-x64-gnu' || matrix.target == 'darwin-arm64' || matrix.target == 'win32-x64' }}
          VERIFY_CARGO_INSTALL: ${{ matrix.target == 'linux-x64-gnu' }}
        run: |
          set -euo pipefail
          build_started=$(date +%s)
          # Capture the live daemon before the runner closes this step's processes.
          trap '
            status=$?
            trap - EXIT
            set +e
            build_finished=$(date +%s)
            mkdir -p "$RUNNER_TEMP/native-build-timings"
            sccache --show-stats --stats-format=json >"$RUNNER_TEMP/native-build-timings/sccache.json"
            printf "%s\tNative builds\0%s\tCache snapshot and summary\0" "$build_started" "$build_finished" \
              >"$RUNNER_TEMP/native-build-timings/steps.tsv"
            node scripts/ci-summary.mjs "$RUNNER_TEMP/native-build-timings" "$CARGO_BUILD_TARGET native build"
            exit "$status"
          ' EXIT
          # Complete rust-toolchain.toml components once, before parallel builds
          # race to install them.
          cargo --version
          # Start outside the Node/Cargo child processes so their exit cannot
          # leave the final snapshot querying an absent daemon.
          printf 'Native compiler wrapper: %s (%s)\n' "$RUSTC_WRAPPER" "$(command -v "$RUSTC_WRAPPER")"
          sccache --start-server
          pids=()
          names=()
          if [[ "$BUILD_QUALIFIER" == true ]]; then
            cargo build --timings --locked --release --target "$CARGO_BUILD_TARGET" -p acyclic-conformance \
              --features local-runner --bin native-mount-qualify --target-dir "$RUNNER_TEMP/target-qualifier" \
              >"$RUNNER_TEMP/qualifier.log" 2>&1 &
            pids+=("$!")
            names+=(qualifier)
          fi
          if [[ "$VERIFY_CARGO_INSTALL" == true ]]; then
            (
              install_root=$(mktemp -d)
              env -u CARGO_BUILD_TARGET cargo install --timings --locked --path plugin --root "$install_root" \
                --target-dir "$RUNNER_TEMP/cargo-install-target"
              expected=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "acyclic-plugin") | "acyclic \(.version)"')
              test "$("$install_root/bin/acyclic" --version)" = "$expected"
              "$install_root/bin/acyclic" --help
            ) >"$RUNNER_TEMP/install.log" 2>&1 &
            pids+=("$!")
            names+=(install)
          fi
          # Report every concurrent build even when the product build fails.
          status=0
          node scripts/build-product.mjs || status=$?
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              status=1
              echo "::error::${names[$index]} build failed"
            fi
            echo "::group::${names[$index]}"
            cat "$RUNNER_TEMP/${names[$index]}.log"
            echo "::endgroup::"
          done
          exit "$status"
      - name: Summarize native Cargo unit timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SDK_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node scripts/cargo-timings-summary.mjs "$RUNNER_TEMP/native-build-timings" \
            "product=$GITHUB_WORKSPACE/target" \
            "qualifier=$RUNNER_TEMP/target-qualifier" \
            "install=$RUNNER_TEMP/cargo-install-target"
      - name: Retain native compiler-cache evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: native-build-timings-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-build-timings
          if-no-files-found: ignore
      - name: Verify release architecture and runtime ABI
        shell: bash
        run: node scripts/verify-release-binary.mjs '${{ matrix.target }}' 'target/${{ matrix.rust_target }}/dist/${{ matrix.executable }}'
      - name: Stage normalized executable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release/${{ matrix.target }}"
          cp "target/${{ matrix.rust_target }}/dist/${{ matrix.executable }}" "$RUNNER_TEMP/release/${{ matrix.target }}/${{ matrix.executable }}"
          case "${{ matrix.target }}" in
            linux-x64-gnu|darwin-arm64) cp "$RUNNER_TEMP/target-qualifier/${{ matrix.rust_target }}/release/native-mount-qualify" "$RUNNER_TEMP/release/${{ matrix.target }}/native-mount-qualify" ;;
            win32-x64) cp "$RUNNER_TEMP/target-qualifier/${{ matrix.rust_target }}/release/native-mount-qualify.exe" "$RUNNER_TEMP/release/${{ matrix.target }}/native-mount-qualify.exe" ;;
          esac
      - name: Install Linux native-mount prerequisites
        if: matrix.backend == 'linux-fuse'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev
      - name: Enable Windows ProjFS
        if: matrix.backend == 'windows-projfs'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }
      - name: Qualify Linux or macOS native mount
        timeout-minutes: 20
        if: matrix.backend && runner.os != 'Windows'
        shell: bash
        env:
          ACYCLIC_RELEASE_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.executable }}
          ACYCLIC_QUALIFIER_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.qualifier }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/native-mount-artifacts
        run: bash scripts/qualify-native-mount.sh '${{ matrix.backend }}'
      - name: Qualify Windows native mount
        timeout-minutes: 20
        if: matrix.backend == 'windows-projfs'
        shell: pwsh
        env:
          ACYCLIC_RELEASE_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.executable }}
          ACYCLIC_QUALIFIER_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.qualifier }}
          CARGO_TARGET_DIR: ${{ runner.temp }}\native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}\native-mount-artifacts
        run: .\scripts\qualify-native-mount.ps1 -Backend '${{ matrix.backend }}'
      - name: Retain native-mount qualification
        if: matrix.backend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: native-mount-${{ matrix.backend }}
          path: ${{ runner.temp }}/native-mount-artifacts/${{ matrix.backend }}.json
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: acyclic-${{ matrix.target }}
          # Preserve the target directory: assembly consumes a structural
          # target/name pair rather than guessing artifact flattening rules.
          path: ${{ runner.temp }}/release
          if-no-files-found: error

      - name: Decide native compiler cache save
        id: compiler-cache
        shell: bash
        env:
          PRIMARY_CACHE_KEY: ${{ steps.rust-cache.outputs.compiler-key }}
          MATCHED_CACHE_KEY: ${{ steps.rust-cache.outputs.compiler-matched-key }}
        run: node scripts/cache-save-decision.mjs "$PRIMARY_CACHE_KEY" "$MATCHED_CACHE_KEY" "$RUNNER_TEMP/native-build-timings/sccache.json"
      - name: Save native compiler output
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.rust-cache.outputs.compiler-key != '' && steps.compiler-cache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.rust-cache.outputs.compiler-key }}
      - name: Save native Cargo downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.rust-cache.outputs.downloads-key != '' && steps.rust-cache.outputs.downloads-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.rust-cache.outputs.downloads-key }}

  sdk-qualification:
    name: Full SDK qualification
    uses: ./.github/workflows/qualification.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      source_ref: ${{ inputs.source_sha }}

  agent-host-qualification:
    name: Agent host qualification
    uses: ./.github/workflows/agent-host-qualification.yml
    with:
      source_ref: ${{ inputs.source_sha }}

  installer-recovery:
    name: Transactional installer recovery
    needs: build
    runs-on: kaizen-linux
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acyclic-linux-x64-gnu
          path: ${{ runner.temp }}/installer-binary
      - name: Prepare the shipping installer fixture
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 "$RUNNER_TEMP/installer-binary/linux-x64-gnu/acyclic"
          npm ci --prefix plugin/tests/hosts --no-audit --no-fund
          npm ci --prefix plugin/scripts/fixtures --ignore-scripts --no-audit --no-fund || {
            printf '%s\n' 'step=prepare pinned installer package managers; recovery: npm ci --prefix plugin/scripts/fixtures --ignore-scripts --no-audit --no-fund' >&2
            exit 1
          }
      - name: Exercise transactional installer recovery
        env:
          ACYCLIC_TEST_BINARY: ${{ runner.temp }}/installer-binary/linux-x64-gnu/acyclic
          ACYCLIC_TEST_TEMP_ROOT: ${{ runner.temp }}/installer-fixtures
        run: node --test --test-reporter=tap plugin/scripts/install.test.mjs plugin/scripts/install-certification.test.mjs plugin/scripts/package-certification.test.mjs plugin/scripts/install-durable-rename.test.mjs plugin/scripts/install-custody.test.mjs

  assemble:
    name: Validate and assemble
    needs: [ build, sdk-qualification, agent-host-qualification, installer-recovery ]
    runs-on: kaizen-linux
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - id: qualification
        name: Freeze qualified lane artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-qualification-artifacts.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acyclic-*
          path: release/binaries
          merge-multiple: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-mount-*
          path: release/native-mount
          merge-multiple: true
      - name: Restore executable modes after artifact download
        shell: bash
        run: |
          set -euo pipefail
          # GitHub artifacts preserve bytes, but not executable mode.
          for binary in release/binaries/acyclic-{linux,darwin}-*/*/acyclic; do
            test -f "$binary"
            chmod 755 "$binary"
          done
      - name: Verify native receipts against release artifacts
        run: |
          qualifier=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/native-mount-qualify
          chmod +x "$qualifier"
          version=$(node -p "require('./plugin/package.json').version")
          "$qualifier" --verify-receipt release/native-mount/linux-fuse.json \
            --require-kind linux-fuse --release-version "$version" --release-arch x86_64 \
            --release-executable release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/acyclic
          "$qualifier" --verify-receipt release/native-mount/macos-nfs.json \
            --require-kind macos-nfs --release-version "$version" --release-arch aarch64 \
            --release-executable release/binaries/acyclic-darwin-arm64/darwin-arm64/acyclic
          "$qualifier" --verify-receipt release/native-mount/windows-projfs.json \
            --require-kind windows-projfs --release-version "$version" --release-arch x86_64 \
            --release-executable release/binaries/acyclic-win32-x64/win32-x64/acyclic.exe
      - name: Assemble and smoke release assets
        run: |
          node scripts/assemble-plugin-release.mjs \
            --binary linux-x64-gnu=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/acyclic \
            --binary linux-x64-musl=release/binaries/acyclic-linux-x64-musl/linux-x64-musl/acyclic \
            --binary linux-arm64-gnu=release/binaries/acyclic-linux-arm64-gnu/linux-arm64-gnu/acyclic \
            --binary linux-arm64-musl=release/binaries/acyclic-linux-arm64-musl/linux-arm64-musl/acyclic \
            --binary darwin-x64=release/binaries/acyclic-darwin-x64/darwin-x64/acyclic \
            --binary darwin-arm64=release/binaries/acyclic-darwin-arm64/darwin-arm64/acyclic \
            --binary win32-x64=release/binaries/acyclic-win32-x64/win32-x64/acyclic.exe \
            --binary win32-arm64=release/binaries/acyclic-win32-arm64/win32-arm64/acyclic.exe \
            --out release \
            --certification release/native-mount \
            --require-universal
          node scripts/plugin-qualification.mjs create \
            release/acyclic-plugin-npm.tgz release/plugin-qualification.json \
            "$(git rev-parse HEAD)"
      - name: Generate and verify release evidence
        run: |
          version=$(node -p "require('./plugin/package.json').version")
          node scripts/release-evidence.mjs sbom \
            release/acyclic.spdx.json "$(git rev-parse HEAD)" "$version"
          node scripts/release-evidence.mjs checksums release/SHA256SUMS \
            release/acyclic-plugin.tar.gz \
            release/acyclic-plugin-npm.tgz \
            release/plugin-qualification.json \
            release/platform-binaries.json \
            release/verify.js \
            release/acyclic-linux-x64-gnu \
            release/acyclic-linux-x64-musl \
            release/acyclic-linux-arm64-gnu \
            release/acyclic-linux-arm64-musl \
            release/acyclic-darwin-x64 \
            release/acyclic-darwin-arm64 \
            release/acyclic-win32-x64.exe \
            release/acyclic-win32-arm64.exe \
            release/native-mount/linux-fuse.json \
            release/native-mount/macos-nfs.json \
            release/native-mount/windows-projfs.json \
            release/acyclic.spdx.json
          node scripts/release-evidence.mjs verify release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: acyclic-universal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/SHA256SUMS
            release/acyclic.spdx.json
            release/acyclic-plugin.tar.gz
            release/acyclic-plugin-npm.tgz
            release/plugin-qualification.json
            release/platform-binaries.json
            release/verify.js
            release/acyclic-linux-x64-gnu
            release/acyclic-linux-x64-musl
            release/acyclic-linux-arm64-gnu
            release/acyclic-linux-arm64-musl
            release/acyclic-darwin-x64
            release/acyclic-darwin-arm64
            release/acyclic-win32-x64.exe
            release/acyclic-win32-arm64.exe
            release/native-mount/linux-fuse.json
            release/native-mount/macos-nfs.json
            release/native-mount/windows-projfs.json
          if-no-files-found: error
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: release/acyclic.spdx.json
      - id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    outputs:
      attempt: ${{ steps.identity.outputs.attempt }}
      artifacts: ${{ steps.qualification.outputs.artifacts }}
