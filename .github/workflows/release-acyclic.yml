name: Release Acyclic plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "acyclic-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404
            executable: acyclic
          - target: linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404
            executable: acyclic
          - target: linux-arm64-gnu
            rust_target: aarch64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            executable: acyclic
          - target: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            executable: acyclic
          - target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: blacksmith-12vcpu-macos-15
            executable: acyclic
          - target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: blacksmith-12vcpu-macos-15
            executable: acyclic
          - target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            runner: blacksmith-4vcpu-windows-2025
            executable: acyclic.exe
          - target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: blacksmith-4vcpu-windows-2025
            executable: acyclic.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          scope: release-${{ matrix.rust_target }}
      - name: Install Windows ARM64 compiler
        if: matrix.rust_target == 'aarch64-pc-windows-msvc'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 20.1.8
          directory: ${{ runner.temp }}/llvm
          env: false
      - name: Install musl linker
        if: endsWith(matrix.rust_target, '-musl')
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build the unified executable
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.rust_target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.rust_target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
          CC_aarch64_pc_windows_msvc: ${{ matrix.rust_target == 'aarch64-pc-windows-msvc' && format('{0}/llvm/bin/clang.exe', runner.temp) || '' }}
        run: node scripts/build-product.mjs
      - name: Verify release architecture and runtime ABI
        shell: bash
        run: node scripts/verify-release-binary.mjs '${{ matrix.target }}' 'target/${{ matrix.rust_target }}/release/${{ matrix.executable }}'
      - name: Verify Cargo installation
        if: matrix.target == 'linux-x64-gnu'
        shell: bash
        run: |
          install_root=$(mktemp -d)
          cargo install --locked --path plugin --root "$install_root"
          expected=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "acyclic-plugin") | "acyclic \(.version)"')
          test "$("$install_root/bin/acyclic" --version)" = "$expected"
          "$install_root/bin/acyclic" --help
      - name: Build native qualification executable
        if: matrix.target == 'linux-x64-gnu' || matrix.target == 'darwin-arm64' || matrix.target == 'win32-x64'
        run: cargo build --locked --release --target '${{ matrix.rust_target }}' -p acyclic-conformance --features local-runner --bin native-mount-qualify
      - name: Stage normalized executable
        shell: bash
        run: |
          mkdir -p "release/${{ matrix.target }}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" "release/${{ matrix.target }}/${{ matrix.executable }}"
          case "${{ matrix.target }}" in
            linux-x64-gnu|darwin-arm64) cp "target/${{ matrix.rust_target }}/release/native-mount-qualify" "release/${{ matrix.target }}/native-mount-qualify" ;;
            win32-x64) cp "target/${{ matrix.rust_target }}/release/native-mount-qualify.exe" "release/${{ matrix.target }}/native-mount-qualify.exe" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acyclic-${{ matrix.target }}
          # Preserve the target directory: assembly consumes a structural
          # target/name pair rather than guessing artifact flattening rules.
          path: release
          if-no-files-found: error

  native-mount:
    name: Qualify ${{ matrix.backend }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: linux-fuse
            target: linux-x64-gnu
            executable: linux-x64-gnu/acyclic
            qualifier: linux-x64-gnu/native-mount-qualify
            runner: blacksmith-4vcpu-ubuntu-2404
          - backend: macos-nfs
            target: darwin-arm64
            executable: darwin-arm64/acyclic
            qualifier: darwin-arm64/native-mount-qualify
            runner: blacksmith-12vcpu-macos-15
          - backend: windows-projfs
            target: win32-x64
            executable: win32-x64/acyclic.exe
            qualifier: win32-x64/native-mount-qualify.exe
            runner: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
      - name: Install Linux native-mount prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev
      - name: Enable Windows ProjFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: acyclic-${{ matrix.target }}
          path: ${{ runner.temp }}/release-binary
      - name: Restore executable permission
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x '${{ runner.temp }}/release-binary/${{ matrix.executable }}'
          chmod +x '${{ runner.temp }}/release-binary/${{ matrix.qualifier }}'
      - name: Qualify Linux or macOS native mount
        if: runner.os != 'Windows'
        shell: bash
        env:
          ACYCLIC_RELEASE_EXECUTABLE: ${{ runner.temp }}/release-binary/${{ matrix.executable }}
          ACYCLIC_QUALIFIER_EXECUTABLE: ${{ runner.temp }}/release-binary/${{ matrix.qualifier }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/native-mount-artifacts
        run: bash scripts/qualify-native-mount.sh '${{ matrix.backend }}'
      - name: Qualify Windows native mount
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ACYCLIC_RELEASE_EXECUTABLE: ${{ runner.temp }}/release-binary/${{ matrix.executable }}
          ACYCLIC_QUALIFIER_EXECUTABLE: ${{ runner.temp }}/release-binary/${{ matrix.qualifier }}
          CARGO_TARGET_DIR: ${{ runner.temp }}\native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}\native-mount-artifacts
        run: .\scripts\qualify-native-mount.ps1 -Backend '${{ matrix.backend }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-mount-${{ matrix.backend }}
          path: ${{ runner.temp }}/native-mount-artifacts/${{ matrix.backend }}.json
          if-no-files-found: error

  assemble:
    name: Validate and assemble
    needs: [build, native-mount]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify annotated release tag and merged source
        if: startsWith(github.ref, 'refs/tags/acyclic-v')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^acyclic-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]
          version=${BASH_REMATCH[1]}
          # checkout v4 may replace the local annotated tag with its peeled commit.
          git fetch --no-tags --force origin \
            "$GITHUB_REF:refs/release-tags/$GITHUB_REF_NAME"
          tag_oid=$(git rev-parse "refs/release-tags/$GITHUB_REF_NAME")
          test "$(git cat-file -t "$tag_oid")" = tag
          source_sha=$(git rev-parse "$tag_oid^{commit}")
          test "$(git rev-parse HEAD)" = "$source_sha"
          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
          test "$version" = "$(node -p "require('./plugin/package.json').version")"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: acyclic-*
          path: release/binaries
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-mount-*
          path: release/native-mount
          merge-multiple: true
      - name: Verify native receipts against release artifacts
        run: |
          qualifier=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/native-mount-qualify
          chmod +x "$qualifier"
          version=$(node -p "require('./plugin/package.json').version")
          "$qualifier" --verify-receipt release/native-mount/linux-fuse.json \
            --require-kind linux-fuse --release-version "$version" \
            --release-executable release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/acyclic
          "$qualifier" --verify-receipt release/native-mount/macos-nfs.json \
            --require-kind macos-nfs --release-version "$version" \
            --release-executable release/binaries/acyclic-darwin-arm64/darwin-arm64/acyclic
          "$qualifier" --verify-receipt release/native-mount/windows-projfs.json \
            --require-kind windows-projfs --release-version "$version" \
            --release-executable release/binaries/acyclic-win32-x64/win32-x64/acyclic.exe
      - name: Build and validate the universal plugin
        run: |
          node plugin/scripts/package.mjs \
            --binary linux-x64-gnu=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/acyclic \
            --binary linux-x64-musl=release/binaries/acyclic-linux-x64-musl/linux-x64-musl/acyclic \
            --binary linux-arm64-gnu=release/binaries/acyclic-linux-arm64-gnu/linux-arm64-gnu/acyclic \
            --binary linux-arm64-musl=release/binaries/acyclic-linux-arm64-musl/linux-arm64-musl/acyclic \
            --binary darwin-x64=release/binaries/acyclic-darwin-x64/darwin-x64/acyclic \
            --binary darwin-arm64=release/binaries/acyclic-darwin-arm64/darwin-arm64/acyclic \
            --binary win32-x64=release/binaries/acyclic-win32-x64/win32-x64/acyclic.exe \
            --binary win32-arm64=release/binaries/acyclic-win32-arm64/win32-arm64/acyclic.exe \
            --out release/package
          mkdir -p release/package/plugin/certification
          cp release/native-mount/linux-fuse.json \
            release/package/plugin/certification/native-mount-linux-x64-gnu.json
          cp release/native-mount/macos-nfs.json \
            release/package/plugin/certification/native-mount-darwin-arm64.json
          cp release/native-mount/windows-projfs.json \
            release/package/plugin/certification/native-mount-win32-x64.json
          node plugin/scripts/validate-package.mjs release/package --require-universal
      - name: Smoke the launcher and MCP bridge
        working-directory: release/package/plugin
        run: |
          node bin/verify.js linux-x64-gnu
          bin/linux-x64-gnu/acyclic --help
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | timeout 20 bin/linux-x64-gnu/acyclic __mcp-commandless > /tmp/acyclic-mcp.out
          grep -q '"name":"acyclic"' /tmp/acyclic-mcp.out
          version=$(node -p "require('./package.json').version")
          grep -q "\"version\":\"$version\"" /tmp/acyclic-mcp.out
      - name: Exercise transactional installer recovery
        run: node --test plugin/scripts/install.test.mjs
      - name: Install the npm package into an empty prefix
        run: |
          set -eu
          package=$(cd release/package/plugin && npm pack --silent --pack-destination "$RUNNER_TEMP")
          package="$RUNNER_TEMP/$package"
          cp "$package" release/acyclic-plugin-npm.tgz
          node scripts/plugin-qualification.mjs create \
            release/acyclic-plugin-npm.tgz release/plugin-qualification.json \
            "$(git rev-parse HEAD)"
          echo "ACYCLIC_NPM_PACKAGE=$package" >> "$GITHUB_ENV"
          prefix=$(mktemp -d)
          state=$(mktemp -d)
          XDG_STATE_HOME="$state" npm install --global --prefix "$prefix" "$package"
          "$prefix/bin/acyclic" --help
          test -f "$prefix/lib/node_modules/@acyclic-labs/plugin/plugin.json"
          test -f "$prefix/lib/node_modules/@acyclic-labs/plugin/.agents/plugins/marketplace.json"
          test ! -e "$prefix/lib/node_modules/@acyclic-labs/plugin/src"
          test -f "$state/acyclic/state-v5/certification/native-mount-linux-x64-gnu.json"
      - name: Run packaged Codex lifecycle end to end
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          package="$ACYCLIC_NPM_PACKAGE"
          test -f "$package"
          prefix=$(mktemp -d)
          home=$(mktemp -d)
          export HOME="$home"
          export CODEX_HOME="$home/.codex"
          export XDG_CONFIG_HOME="$home/.config"
          export XDG_STATE_HOME="$home/.state"
          export PATH="$prefix/bin:$PATH"
          codex_version=$(node -p "require('./plugin/tests/hosts/package.json').dependencies['@openai/codex']")
          npm install --global --prefix "$prefix" "$package" "@openai/codex@$codex_version"
          acyclic install codex
          codex plugin list --marketplace acyclic --json | jq -e '.installed[] | select(.pluginId == "acyclic@acyclic" and .enabled == true)'
          timeout 480 codex exec --ephemeral --json --skip-git-repo-check \
            -c 'plugins."acyclic@acyclic".mcp_servers.acyclic.tools.acyclic.approval_mode="approve"' \
            --dangerously-bypass-hook-trust -C "$GITHUB_WORKSPACE" \
            'Call the acyclic MCP tool with arguments ["agents","--json"]. Only after it succeeds, reply exactly ACYCLIC_E2E_OK.' \
            > "$home/fresh-task.jsonl"
          grep -q 'ACYCLIC_E2E_OK' "$home/fresh-task.jsonl"
          acyclic agents --json | jq -e '.schemaVersion == 1'
          test -d "$XDG_STATE_HOME/acyclic/state-v5"
          acyclic uninstall codex
          test -d "$XDG_STATE_HOME/acyclic/state-v5"
      - name: Assemble release assets
        run: |
          cp release/package/plugin/bin/platform-binaries.json release/platform-binaries.json
          cp plugin/bin/verify.js release/verify.js
          for target in linux-x64-gnu linux-x64-musl linux-arm64-gnu linux-arm64-musl darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            name=acyclic
            suffix=
            case "$target" in win32-*) name=acyclic.exe; suffix=.exe ;; esac
            cp "release/binaries/acyclic-$target/$target/$name" "release/acyclic-$target$suffix"
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner --format=ustar -C release/package \
            -czf release/acyclic-plugin.tar.gz .
          ! tar -tzf release/acyclic-plugin.tar.gz | grep -E '\.tgz$'
      - name: Generate and verify release evidence
        run: |
          version=$(node -p "require('./plugin/package.json').version")
          node scripts/release-evidence.mjs sbom \
            release/acyclic.spdx.json "$(git rev-parse HEAD)" "$version"
          node scripts/release-evidence.mjs checksums release/SHA256SUMS \
            release/acyclic-plugin.tar.gz \
            release/acyclic-plugin-npm.tgz \
            release/plugin-qualification.json \
            release/platform-binaries.json \
            release/verify.js \
            release/acyclic-linux-x64-gnu \
            release/acyclic-linux-x64-musl \
            release/acyclic-linux-arm64-gnu \
            release/acyclic-linux-arm64-musl \
            release/acyclic-darwin-x64 \
            release/acyclic-darwin-arm64 \
            release/acyclic-win32-x64.exe \
            release/acyclic-win32-arm64.exe \
            release/native-mount/linux-fuse.json \
            release/native-mount/macos-nfs.json \
            release/native-mount/windows-projfs.json \
            release/acyclic.spdx.json
          node scripts/release-evidence.mjs verify release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acyclic-universal
          path: |
            release/SHA256SUMS
            release/acyclic.spdx.json
            release/acyclic-plugin.tar.gz
            release/acyclic-plugin-npm.tgz
            release/plugin-qualification.json
            release/platform-binaries.json
            release/verify.js
            release/acyclic-linux-x64-gnu
            release/acyclic-linux-x64-musl
            release/acyclic-linux-arm64-gnu
            release/acyclic-linux-arm64-musl
            release/acyclic-darwin-x64
            release/acyclic-darwin-arm64
            release/acyclic-win32-x64.exe
            release/acyclic-win32-arm64.exe
            release/native-mount/linux-fuse.json
            release/native-mount/macos-nfs.json
            release/native-mount/windows-projfs.json
          if-no-files-found: error
      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/acyclic-v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest release SBOM
        if: startsWith(github.ref, 'refs/tags/acyclic-v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: release/acyclic.spdx.json
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/acyclic-v')
        run: |
          version=$(node -p "require('./release/package/plugin/package.json').version")
          test "$GITHUB_REF_NAME" = "acyclic-v$version"
      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/acyclic-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/SHA256SUMS
            release/acyclic.spdx.json
            release/acyclic-plugin.tar.gz
            release/acyclic-plugin-npm.tgz
            release/plugin-qualification.json
            release/platform-binaries.json
            release/verify.js
            release/acyclic-linux-x64-gnu
            release/acyclic-linux-x64-musl
            release/acyclic-linux-arm64-gnu
            release/acyclic-linux-arm64-musl
            release/acyclic-darwin-x64
            release/acyclic-darwin-arm64
            release/acyclic-win32-x64.exe
            release/acyclic-win32-arm64.exe
            release/native-mount/linux-fuse.json
            release/native-mount/macos-nfs.json
            release/native-mount/windows-projfs.json
