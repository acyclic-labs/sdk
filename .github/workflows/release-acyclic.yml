name: Release Acyclic and GraphCoder

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
    outputs:
      attempt:
        description: Attempt which assembled the exact qualified artifact set
        value: ${{ jobs.assemble.outputs.attempt }}
      artifacts:
        description: Exact package artifacts retained by the successful qualification lanes
        value: ${{ jobs.assemble.outputs.artifacts }}
permissions:
  contents: read

concurrency:
  group: acyclic-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - target: linux-x64-gnu
            backend: linux-fuse
            qualifier: native-mount-qualify
            rust_target: x86_64-unknown-linux-gnu
            runner: kaizen-linux
            executable: acyclic
          - target: linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            runner: kaizen-linux
            platform: //:linux_musl
            executable: acyclic
          - target: linux-arm64-gnu
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable: acyclic
          - target: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            executable: acyclic
          - target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15
            executable: acyclic
          - target: darwin-arm64
            backend: macos-nfs
            qualifier: native-mount-qualify
            rust_target: aarch64-apple-darwin
            runner: macos-15
            executable: acyclic
          - target: win32-x64
            backend: windows-projfs
            qualifier: native-mount-qualify.exe
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
            platform: //:windows
            executable: acyclic.exe
          - target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-2025
            platform: //:windows
            executable: acyclic.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Install Bazelisk
        shell: bash
        run: npm install --global @bazel/bazelisk@1.26.0
      - name: Restore Bazel caches
        if: matrix.runner != 'kaizen-linux'
        id: bazel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/tmp/acyclic-bazel-disk
            ~/.cache/bazel-repository-cache
          key: bazel-${{ matrix.target }}-${{ inputs.source_sha }}
          restore-keys: |
            bazel-${{ matrix.target }}-
      - name: Build release targets with Bazel
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          flags=(-c opt --repository_cache="$HOME/.cache/bazel-repository-cache")
          if [[ -n "$PLATFORM" ]]; then flags+=(--platforms="$PLATFORM"); fi
          labels=(//plugin:acyclic //plugin:graphcoder //rust/crates/conformance:native-mount-qualify)
          bazelisk build "${flags[@]}" "${labels[@]}"
          # cquery names outputs relative to the execution root; the workspace keeps no bazel-out link.
          execroot="$(bazelisk info "${flags[@]}" execution_root)"
          output="$RUNNER_TEMP/target/$RUST_TARGET/dist"
          mkdir -p "$output"
          bazelisk cquery "${flags[@]}" --output=files "${labels[@]}" | while IFS= read -r file; do
            cp "$execroot/$file" "$output/$(basename "$file")"
          done
      - name: Verify release architecture and runtime ABI
        shell: bash
        run: |
          node scripts/verify-release-binary.mjs '${{ matrix.target }}' "$RUNNER_TEMP/target/${{ matrix.rust_target }}/dist/${{ matrix.executable }}"
          node scripts/verify-release-binary.mjs '${{ matrix.target }}' "$RUNNER_TEMP/target/${{ matrix.rust_target }}/dist/graphcoder${{ endsWith(matrix.executable, '.exe') && '.exe' || '' }}"
      - name: Stage normalized executable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release/${{ matrix.target }}"
          cp "$RUNNER_TEMP/target/${{ matrix.rust_target }}/dist/${{ matrix.executable }}" "$RUNNER_TEMP/release/${{ matrix.target }}/${{ matrix.executable }}"
          cp "$RUNNER_TEMP/target/${{ matrix.rust_target }}/dist/graphcoder${{ endsWith(matrix.executable, '.exe') && '.exe' || '' }}" "$RUNNER_TEMP/release/${{ matrix.target }}/graphcoder${{ endsWith(matrix.executable, '.exe') && '.exe' || '' }}"
          case "${{ matrix.target }}" in
            linux-x64-gnu|darwin-arm64) cp "$RUNNER_TEMP/target/${{ matrix.rust_target }}/dist/native-mount-qualify" "$RUNNER_TEMP/release/${{ matrix.target }}/native-mount-qualify" ;;
            win32-x64) cp "$RUNNER_TEMP/target/${{ matrix.rust_target }}/dist/native-mount-qualify.exe" "$RUNNER_TEMP/release/${{ matrix.target }}/native-mount-qualify.exe" ;;
          esac
      - name: Install Linux native-mount prerequisites
        if: matrix.backend == 'linux-fuse'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev
      - name: Enable Windows ProjFS
        if: matrix.backend == 'windows-projfs'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }
      - name: Qualify Linux or macOS native mount
        timeout-minutes: 20
        if: matrix.backend && runner.os != 'Windows'
        shell: bash
        env:
          ACYCLIC_RELEASE_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.executable }}
          ACYCLIC_QUALIFIER_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.qualifier }}
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/native-mount-artifacts
        run: bash scripts/qualify-native-mount.sh '${{ matrix.backend }}'
      - name: Qualify Windows native mount
        timeout-minutes: 20
        if: matrix.backend == 'windows-projfs'
        shell: pwsh
        env:
          ACYCLIC_RELEASE_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.executable }}
          ACYCLIC_QUALIFIER_EXECUTABLE: ${{ runner.temp }}/release/${{ matrix.target }}/${{ matrix.qualifier }}
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/native-mount-artifacts
        run: .\scripts\qualify-native-mount.ps1 -Backend '${{ matrix.backend }}'
      - name: Retain native-mount qualification
        if: matrix.backend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: native-mount-${{ matrix.backend }}
          path: ${{ runner.temp }}/native-mount-artifacts/${{ matrix.backend }}.json
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: acyclic-${{ matrix.target }}
          # Preserve the target directory: assembly consumes a structural
          # target/name pair rather than guessing artifact flattening rules.
          path: ${{ runner.temp }}/release
          if-no-files-found: error

      - name: Exercise GraphCoder release installer
        if: matrix.backend
        shell: bash
        env:
          GRAPHCODER_TEST_BINARY: ${{ runner.temp }}/release/${{ matrix.target }}/graphcoder${{ endsWith(matrix.executable, '.exe') && '.exe' || '' }}
        run: node scripts/test-install-release-asset.mjs

      - name: Save Bazel caches
        if: matrix.runner != 'kaizen-linux' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/tmp/acyclic-bazel-disk
            ~/.cache/bazel-repository-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  installer-recovery:
    name: Transactional installer recovery
    needs: build
    runs-on: kaizen-linux
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acyclic-linux-x64-gnu
          path: ${{ runner.temp }}/installer-binary
      - name: Prepare the shipping installer fixture
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 "$RUNNER_TEMP/installer-binary/linux-x64-gnu/acyclic"
          npm ci --prefix plugin/tests/hosts --no-audit --no-fund
          npm ci --prefix plugin/scripts/fixtures --ignore-scripts --no-audit --no-fund || {
            printf '%s\n' 'step=prepare pinned installer package managers; recovery: npm ci --prefix plugin/scripts/fixtures --ignore-scripts --no-audit --no-fund' >&2
            exit 1
          }
      - name: Exercise transactional installer recovery
        env:
          ACYCLIC_TEST_BINARY: ${{ runner.temp }}/installer-binary/linux-x64-gnu/acyclic
          ACYCLIC_TEST_TEMP_ROOT: ${{ runner.temp }}/installer-fixtures
        run: node --test --test-reporter=tap plugin/scripts/install.test.mjs plugin/scripts/install-certification.test.mjs plugin/scripts/package-certification.test.mjs plugin/scripts/install-durable-rename.test.mjs plugin/scripts/install-custody.test.mjs scripts/assemble-plugin-release.test.mjs

  assemble:
    name: Validate and assemble
    needs: [ build, installer-recovery ]
    runs-on: kaizen-linux
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acyclic-*
          path: release/binaries
          merge-multiple: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-mount-*
          path: release/native-mount
          merge-multiple: true
      - name: Restore executable modes after artifact download
        shell: bash
        run: |
          set -euo pipefail
          # GitHub artifacts preserve bytes, but not executable mode.
          for binary in release/binaries/acyclic-{linux,darwin}-*/*/acyclic; do
            test -f "$binary"
            chmod 755 "$binary"
          done
      - name: Verify native receipts against release artifacts
        run: |
          qualifier=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/native-mount-qualify
          chmod +x "$qualifier"
          version=$(node -p "require('./plugin/package.json').version")
          "$qualifier" --verify-receipt release/native-mount/linux-fuse.json \
            --require-kind linux-fuse --release-version "$version" --release-arch x86_64 \
            --release-executable release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/acyclic
          "$qualifier" --verify-receipt release/native-mount/macos-nfs.json \
            --require-kind macos-nfs --release-version "$version" --release-arch aarch64 \
            --release-executable release/binaries/acyclic-darwin-arm64/darwin-arm64/acyclic
          "$qualifier" --verify-receipt release/native-mount/windows-projfs.json \
            --require-kind windows-projfs --release-version "$version" --release-arch x86_64 \
            --release-executable release/binaries/acyclic-win32-x64/win32-x64/acyclic.exe
      - name: Assemble and smoke release assets
        run: |
          node scripts/assemble-plugin-release.mjs \
            --binary linux-x64-gnu=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/acyclic \
            --binary linux-x64-musl=release/binaries/acyclic-linux-x64-musl/linux-x64-musl/acyclic \
            --binary linux-arm64-gnu=release/binaries/acyclic-linux-arm64-gnu/linux-arm64-gnu/acyclic \
            --binary linux-arm64-musl=release/binaries/acyclic-linux-arm64-musl/linux-arm64-musl/acyclic \
            --binary darwin-x64=release/binaries/acyclic-darwin-x64/darwin-x64/acyclic \
            --binary darwin-arm64=release/binaries/acyclic-darwin-arm64/darwin-arm64/acyclic \
            --binary win32-x64=release/binaries/acyclic-win32-x64/win32-x64/acyclic.exe \
            --binary win32-arm64=release/binaries/acyclic-win32-arm64/win32-arm64/acyclic.exe \
            --out release \
            --certification release/native-mount \
            --require-universal
          node scripts/plugin-qualification.mjs create \
            release/acyclic-plugin-npm.tgz release/plugin-qualification.json \
            "$(git rev-parse HEAD)"
          node scripts/assemble-graphcoder-release.mjs \
            --binary linux-x64-gnu=release/binaries/acyclic-linux-x64-gnu/linux-x64-gnu/graphcoder \
            --binary linux-x64-musl=release/binaries/acyclic-linux-x64-musl/linux-x64-musl/graphcoder \
            --binary linux-arm64-gnu=release/binaries/acyclic-linux-arm64-gnu/linux-arm64-gnu/graphcoder \
            --binary linux-arm64-musl=release/binaries/acyclic-linux-arm64-musl/linux-arm64-musl/graphcoder \
            --binary darwin-x64=release/binaries/acyclic-darwin-x64/darwin-x64/graphcoder \
            --binary darwin-arm64=release/binaries/acyclic-darwin-arm64/darwin-arm64/graphcoder \
            --binary win32-x64=release/binaries/acyclic-win32-x64/win32-x64/graphcoder.exe \
            --binary win32-arm64=release/binaries/acyclic-win32-arm64/win32-arm64/graphcoder.exe \
            --out release --require-universal
      - name: Generate and verify release evidence
        run: |
          version=$(node -p "require('./plugin/package.json').version")
          node scripts/release-evidence.mjs sbom \
            release/acyclic.spdx.json "$(git rev-parse HEAD)" "$version"
          node scripts/release-evidence.mjs checksums release/SHA256SUMS \
            release/acyclic-plugin.tar.gz \
            release/acyclic-plugin-npm.tgz \
            release/plugin-qualification.json \
            release/platform-binaries.json \
            release/verify.js \
            release/acyclic-linux-x64-gnu \
            release/acyclic-linux-x64-musl \
            release/acyclic-linux-arm64-gnu \
            release/acyclic-linux-arm64-musl \
            release/acyclic-darwin-x64 \
            release/acyclic-darwin-arm64 \
            release/acyclic-win32-x64.exe \
            release/acyclic-win32-arm64.exe \
            release/native-mount/linux-fuse.json \
            release/native-mount/macos-nfs.json \
            release/native-mount/windows-projfs.json \
            release/acyclic.spdx.json \
            release/graphcoder-* \
            release/install-graphcoder.sh \
            release/install-graphcoder.ps1
          node scripts/release-evidence.mjs verify release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}
          name: acyclic-universal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/SHA256SUMS
            release/acyclic.spdx.json
            release/acyclic-plugin.tar.gz
            release/acyclic-plugin-npm.tgz
            release/plugin-qualification.json
            release/platform-binaries.json
            release/verify.js
            release/acyclic-linux-x64-gnu
            release/acyclic-linux-x64-musl
            release/acyclic-linux-arm64-gnu
            release/acyclic-linux-arm64-musl
            release/acyclic-darwin-x64
            release/acyclic-darwin-arm64
            release/acyclic-win32-x64.exe
            release/acyclic-win32-arm64.exe
            release/graphcoder-*
            release/install-graphcoder.sh
            release/install-graphcoder.ps1
            release/native-mount/linux-fuse.json
            release/native-mount/macos-nfs.json
            release/native-mount/windows-projfs.json
          if-no-files-found: error
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: release/acyclic.spdx.json
      - id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    outputs:
      attempt: ${{ steps.identity.outputs.attempt }}
      artifacts: '{}'
