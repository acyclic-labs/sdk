name: Embedded native packages

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact Rust source revision used for every native asset
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-native-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            rust_target: x86_64-pc-windows-msvc
            runner: blacksmith-4vcpu-windows-2025
          - rid: win-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
          - rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - rid: linux-musl-x64
            rust_target: x86_64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-musl-arm64
            rust_target: aarch64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - rid: osx-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
          - rid: osx-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust target
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.rust_target }}

      - name: Provision musl linker
        if: startsWith(matrix.rid, 'linux-musl-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
            command -v musl-gcc

      - name: Build one Rust-owned native asset
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/embedded-native-target
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $target = '${{ matrix.rust_target }}'
          if ($target -like '*-unknown-linux-musl') {
            $env:RUSTFLAGS = (($env:RUSTFLAGS + ' -C target-feature=-crt-static').Trim())
            $linkerVariable = "CARGO_TARGET_$($target.ToUpperInvariant().Replace('-', '_'))_LINKER"
            [Environment]::SetEnvironmentVariable($linkerVariable, 'musl-gcc', 'Process')
          }
          & "$env:GITHUB_WORKSPACE/scripts/build-dotnet-embedded-package.ps1" `
            -Target $target `
            -Output "$env:RUNNER_TEMP/embedded-native-output" `
            -NativeOnly
          if ($LASTEXITCODE -ne 0) { throw "Native producer failed for $target" }

      - name: Upload one verified RID artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: embedded-native-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-output/native
          if-no-files-found: error
          retention-days: 14

  aggregate-and-package:
    name: Aggregate eight RIDs and package consumers
    needs: native
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download every per RID artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: embedded-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-inputs
          merge-multiple: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d214f3edc00 # v4.3.1
        with:
          dotnet-version: 8.0.425

      - name: Install pinned Rust toolchain for source verification
        uses: ./.github/actions/rust-toolchain

      - name: Install pinned Java toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.14'
          cache: maven

      - name: Install pinned protoc compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '25.1'

      - name: Bootstrap pinned Maven distribution
        shell: pwsh
        env:
          MAVEN_VERSION: '3.9.11'
          MAVEN_SHA512: '03e2d65d4483a3396980629f260e25cac0d8b6f7f2791e4dc20bc83f9514db8d0f05b0479e699a5f34679250c49c8e52e961262ded468a20de0be254d8207076'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP "apache-maven-$env:MAVEN_VERSION-bin.zip"
          $uri = "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$env:MAVEN_VERSION/apache-maven-$env:MAVEN_VERSION-bin.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA512 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:MAVEN_SHA512) { throw "Maven archive checksum mismatch: $actual" }
          $mavenRoot = Join-Path $env:RUNNER_TEMP "apache-maven-$env:MAVEN_VERSION"
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $mavenBin = Join-Path $mavenRoot 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mavenBin 'mvn.cmd') -PathType Leaf)) { throw "Pinned Maven was not unpacked at $mavenRoot" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $mavenBin
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "M2_HOME=$mavenRoot"

      - name: Verify packaging toolchain versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $rustChannel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if ($rustChannel -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'rust-toolchain.toml must pin an exact Rust release.' }
          $rustVersion = (& rustc --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $rustVersion -notmatch [regex]::Escape("rustc $rustChannel")) { throw "Unexpected Rust toolchain: $rustVersion" }
          $dotnetVersion = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $dotnetVersion -ne '8.0.425') { throw "Unexpected .NET SDK: $dotnetVersion" }
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1).ToString()
          if ($LASTEXITCODE -ne 0 -or $javaVersion -notmatch '17\.0\.14') { throw "Unexpected Java runtime: $javaVersion" }
          $maven = Get-Command mvn -ErrorAction Stop
          $mavenVersion = (& $maven.Source '--version' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $mavenVersion -notmatch 'Apache Maven 3\.9\.11') { throw "Unexpected Maven version: $mavenVersion" }
          $protoc = Get-Command protoc -ErrorAction Stop
          $protocVersion = (& $protoc.Source '--version').Trim()
          if ($LASTEXITCODE -ne 0 -or $protocVersion -notmatch '25\.1') { throw "Unexpected protoc version: $protocVersion" }

      - name: Merge and revalidate the eight source-bound assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $inputs = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/embedded-native-inputs" -Directory | Select-Object -ExpandProperty FullName)
          if ($inputs.Count -ne 8) { throw "Expected eight downloaded native artifacts, found $($inputs.Count)" }
          & "$env:GITHUB_WORKSPACE/scripts/merge-embedded-native-manifests.ps1" `
            -InputRoot $inputs `
            -OutputRoot "$env:RUNNER_TEMP/embedded-native-merged"
          if ($LASTEXITCODE -ne 0) { throw 'Strict native manifest merge failed.' }

      - name: Build the .NET package from the aggregate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/scripts/build-dotnet-embedded-package.ps1" `
            -Output "$env:RUNNER_TEMP/dotnet-embedded" `
            -NativeRoot "$env:RUNNER_TEMP/embedded-native-merged" `
            -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw 'The .NET package producer failed.' }

      - name: Build the JVM package from the aggregate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/scripts/build-jvm-embedded-package.ps1" `
            -Root "$env:GITHUB_WORKSPACE" `
            -NativeRoot "$env:RUNNER_TEMP/embedded-native-merged"
          if ($LASTEXITCODE -ne 0) { throw 'The JVM package producer failed.' }

      - name: Upload aggregate and consumer packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: embedded-native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/embedded-native-merged
            ${{ runner.temp }}/dotnet-embedded
            ${{ github.workspace }}/target/jvm-embedded
          if-no-files-found: error
          retention-days: 14
