name: Embedded native packages

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact Rust source revision used for every native asset
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-native-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            rust_target: x86_64-pc-windows-msvc
            runner: blacksmith-4vcpu-windows-2025
          - rid: win-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
          - rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - rid: linux-musl-x64
            rust_target: x86_64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-musl-arm64
            rust_target: aarch64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - rid: osx-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
          - rid: osx-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust target
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.rust_target }}

      - name: Provision musl linker
        if: startsWith(matrix.rid, 'linux-musl-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
            command -v musl-gcc

      - name: Build one Rust-owned native asset
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/embedded-native-target
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $target = '${{ matrix.rust_target }}'
          if ($target -like '*-unknown-linux-musl') {
            $env:RUSTFLAGS = (($env:RUSTFLAGS + ' -C target-feature=-crt-static').Trim())
            $linkerVariable = "CARGO_TARGET_$($target.ToUpperInvariant().Replace('-', '_'))_LINKER"
            [Environment]::SetEnvironmentVariable($linkerVariable, 'musl-gcc', 'Process')
          }
          & "$env:GITHUB_WORKSPACE/scripts/build-dotnet-embedded-package.ps1" `
            -Target $target `
            -Output "$env:RUNNER_TEMP/embedded-native-output" `
            -NativeOnly
          if ($LASTEXITCODE -ne 0) { throw "Native producer failed for $target" }

      - name: Upload one verified RID artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: embedded-native-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-output/native
          if-no-files-found: error
          retention-days: 14

  aggregate-and-package:
    name: Aggregate eight RIDs and package consumers
    needs: native
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download every per RID artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: embedded-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-inputs
          merge-multiple: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.425

      - name: Install pinned Rust toolchain for source verification
        uses: ./.github/actions/rust-toolchain

      - name: Install pinned Java toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.14'
          cache: maven

      - name: Install pinned protoc compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '25.1'

      - name: Bootstrap pinned Maven distribution
        shell: pwsh
        env:
          MAVEN_VERSION: '3.9.11'
          MAVEN_SHA512: '03e2d65d4483a3396980629f260e25cac0d8b6f7f2791e4dc20bc83f9514db8d0f05b0479e699a5f34679250c49c8e52e961262ded468a20de0be254d8207076'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP "apache-maven-$env:MAVEN_VERSION-bin.zip"
          $uri = "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$env:MAVEN_VERSION/apache-maven-$env:MAVEN_VERSION-bin.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA512 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:MAVEN_SHA512) { throw "Maven archive checksum mismatch: $actual" }
          $mavenRoot = Join-Path $env:RUNNER_TEMP "apache-maven-$env:MAVEN_VERSION"
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $mavenBin = Join-Path $mavenRoot 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mavenBin 'mvn.cmd') -PathType Leaf)) { throw "Pinned Maven was not unpacked at $mavenRoot" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $mavenBin
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "M2_HOME=$mavenRoot"

      - name: Verify packaging toolchain versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $rustChannel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if ($rustChannel -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'rust-toolchain.toml must pin an exact Rust release.' }
          $rustVersion = (& rustc --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $rustVersion -notmatch [regex]::Escape("rustc $rustChannel")) { throw "Unexpected Rust toolchain: $rustVersion" }
          $dotnetVersion = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $dotnetVersion -ne '8.0.425') { throw "Unexpected .NET SDK: $dotnetVersion" }
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1).ToString()
          if ($LASTEXITCODE -ne 0 -or $javaVersion -notmatch '17\.0\.14') { throw "Unexpected Java runtime: $javaVersion" }
          $maven = Get-Command mvn -ErrorAction Stop
          $mavenVersion = (& $maven.Source '--version' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $mavenVersion -notmatch 'Apache Maven 3\.9\.11') { throw "Unexpected Maven version: $mavenVersion" }
          $protoc = Get-Command protoc -ErrorAction Stop
          $protocVersion = (& $protoc.Source '--version').Trim()
          if ($LASTEXITCODE -ne 0 -or $protocVersion -notmatch '25\.1') { throw "Unexpected protoc version: $protocVersion" }

      - name: Merge and revalidate the eight source-bound assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $inputs = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/embedded-native-inputs" -Directory | Select-Object -ExpandProperty FullName)
          if ($inputs.Count -ne 8) { throw "Expected eight downloaded native artifacts, found $($inputs.Count)" }
          & "$env:GITHUB_WORKSPACE/scripts/merge-embedded-native-manifests.ps1" `
            -InputRoot $inputs `
            -OutputRoot "$env:RUNNER_TEMP/embedded-native-merged"
          if ($LASTEXITCODE -ne 0) { throw 'Strict native manifest merge failed.' }

      - name: Build the .NET package from the aggregate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/scripts/build-dotnet-embedded-package.ps1" `
            -Output "$env:RUNNER_TEMP/dotnet-embedded" `
            -NativeRoot "$env:RUNNER_TEMP/embedded-native-merged" `
            -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw 'The .NET package producer failed.' }

      - name: Build the JVM package from the aggregate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/scripts/build-jvm-embedded-package.ps1" `
            -Root "$env:GITHUB_WORKSPACE" `
            -NativeRoot "$env:RUNNER_TEMP/embedded-native-merged"
          if ($LASTEXITCODE -ne 0) { throw 'The JVM package producer failed.' }

      - name: Upload aggregate and consumer packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: embedded-native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/embedded-native-merged
            ${{ runner.temp }}/dotnet-embedded
            ${{ github.workspace }}/target/jvm-embedded
          if-no-files-found: error
          retention-days: 14

  dotnet-installed-consumer:
    name: Installed .NET consumer ${{ matrix.rid }}
    needs: aggregate-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: blacksmith-4vcpu-windows-2025
          - rid: win-arm64
            runner: windows-11-vs2026-arm
          - rid: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.425
      - name: Download aggregate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-packages
      - name: Install package and execute Rust-backed consumer
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/embedded-native-packages
          TEST_ROOT: ${{ runner.temp }}/embedded-dotnet-consumer
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Get-ChildItem -LiteralPath $env:PACKAGE_ROOT -Filter '*.nupkg' -File -Recurse | Select-Object -First 1
          if (-not $package) { throw 'Aggregate NuGet package is missing.' }
          dotnet new console --framework net8.0 --output $env:TEST_ROOT --force --no-restore | Out-Host
          dotnet add $env:TEST_ROOT package Acyclic.Sdk.Embedded --version 0.2.0-alpha.1 --source $package.DirectoryName | Out-Host
          $projectFile = Join-Path $env:TEST_ROOT 'embedded-dotnet-consumer.csproj'
          $projectXml = Get-Content -LiteralPath $projectFile -Raw
          $projectXml = $projectXml.Replace('</Project>', "  <PropertyGroup><RuntimeIdentifier>$env:RID</RuntimeIdentifier></PropertyGroup>`n</Project>")
          Set-Content -LiteralPath $projectFile -Value $projectXml -Encoding utf8NoBOM
          dotnet restore $env:TEST_ROOT --force --no-cache | Out-Host
          @'
          using Acyclic.Sdk.Embedded;
          using System;
          using System.Linq;
          using System.Threading.Tasks;
          using var engine = new EmbeddedStreamEngine();
          var value = new byte[] { 0x52, 0x75, 0x73, 0x74, 0x2D, 0x52, 0x49, 0x44 };
          var appended = engine.Append("installed-rid", value);
          var count = 0;
          await foreach (var item in engine.ReadAsync("installed-rid", appended.Start, 1))
          {
              if (!item.Value.SequenceEqual(value)) throw new InvalidOperationException("Rust value did not round-trip.");
              count++;
          }
          if (count != 1) throw new InvalidOperationException($"Expected one record, received {count}.");
          Console.WriteLine("Installed Rust-backed .NET consumer passed.");
          '@ | Set-Content -LiteralPath (Join-Path $env:TEST_ROOT 'Program.cs') -Encoding utf8NoBOM
          dotnet run --project $env:TEST_ROOT --configuration Release

  dotnet-installed-consumer-musl:
    name: Installed musl .NET consumer ${{ matrix.rid }}
    needs: aggregate-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            image: mcr.microsoft.com/dotnet/sdk@sha256:566b0dd501284d96c6e2fef35e1bd23c4f53e6699d1b76b9f7d7da56af723287
          - rid: linux-musl-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            image: mcr.microsoft.com/dotnet/sdk@sha256:566b0dd501284d96c6e2fef35e1bd23c4f53e6699d1b76b9f7d7da56af723287
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download aggregate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-packages
      - name: Install package and execute musl Rust-backed consumer
        shell: bash
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/embedded-native-packages
          RID: ${{ matrix.rid }}
          DOTNET_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --user 0 \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$PACKAGE_ROOT:/pkg" \
            --env RID="$RID" \
            "$DOTNET_IMAGE" sh -euxc '
              apk add --no-cache git
              package="$(find /pkg -name "Acyclic.Sdk.Embedded.0.2.0-alpha.1.nupkg" -type f -print -quit)"
              test -n "$package"
              dotnet new console --framework net8.0 --output /tmp/embedded-dotnet-consumer --force --no-restore
              dotnet add /tmp/embedded-dotnet-consumer package Acyclic.Sdk.Embedded --version 0.2.0-alpha.1 --source "$(dirname "$package")"
              sed -i "s#</Project>#  <PropertyGroup><RuntimeIdentifier>$RID</RuntimeIdentifier></PropertyGroup></Project>#" /tmp/embedded-dotnet-consumer/embedded-dotnet-consumer.csproj
              dotnet restore /tmp/embedded-dotnet-consumer --force --no-cache
              cat >/tmp/embedded-dotnet-consumer/Program.cs <<"CS"
              using Acyclic.Sdk.Embedded;
              using System;
              using System.Linq;
              using var engine = new EmbeddedStreamEngine();
              var value = new byte[] { 0x52, 0x75, 0x73, 0x74, 0x2D, 0x4D, 0x55, 0x53, 0x4C };
              var appended = engine.Append("installed-musl", value);
              var count = 0;
              await foreach (var item in engine.ReadAsync("installed-musl", appended.Start, 1))
              { if (!item.Value.SequenceEqual(value)) throw new InvalidOperationException("Rust value did not round-trip."); count++; }
              if (count != 1) throw new InvalidOperationException("Expected one Rust record.");
              CS
              dotnet run --project /tmp/embedded-dotnet-consumer --configuration Release
            '

  jvm-installed-consumer:
    name: Installed JVM consumer ${{ matrix.rid }}
    needs: aggregate-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: blacksmith-4vcpu-windows-2025
          - rid: win-arm64
            runner: windows-11-vs2026-arm
          - rid: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.14'
          cache: maven
      - name: Download aggregate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-packages
      - name: Load installed JVM package and execute Rust-backed consumer
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/embedded-native-packages
          TEST_ROOT: ${{ runner.temp }}/embedded-jvm-consumer
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $jar = Get-ChildItem -LiteralPath $env:PACKAGE_ROOT -Filter 'acyclic-embedded-jna-0.1.0.jar' -File -Recurse | Select-Object -First 1
          if (-not $jar) { throw 'Aggregate JVM package is missing.' }
          $m2 = Join-Path $env:TEST_ROOT 'm2'
          New-Item -ItemType Directory -Force -Path $env:TEST_ROOT,$m2 | Out-Null
          $cpFile = Join-Path $env:TEST_ROOT 'classpath.txt'
          & mvn -q -f (Join-Path $env:GITHUB_WORKSPACE 'jvm/embedded/pom.xml') "-Dmaven.repo.local=$m2" "-Dmdep.outputFile=$cpFile" dependency:build-classpath
          if ($LASTEXITCODE -ne 0) { throw 'Maven dependency classpath resolution failed.' }
          $cp = (Get-Content -LiteralPath $cpFile -Raw).Trim()
          @'
          import dev.acyclic.embedded.RustEmbedded;
          import java.nio.charset.StandardCharsets;
          public final class InstalledConsumer {
            public static void main(String[] args) throws Exception {
              try (RustEmbedded engine = new RustEmbedded()) {
                if (engine.abiVersion() != RustEmbedded.ABI_VERSION) throw new IllegalStateException("ABI mismatch");
                byte[] value = "rust-jvm-rid".getBytes(StandardCharsets.UTF_8);
                var appended = engine.append("installed-jvm", value);
                try (RustEmbedded.Reader reader = engine.openReader("installed-jvm", appended.start(), 1, false)) {
                  var item = reader.next();
                  if (item.status() != RustEmbedded.OK || !java.util.Arrays.equals(item.value(), value)) throw new IllegalStateException("Rust value did not round-trip");
                }
              }
            }
          }
          '@ | Set-Content -LiteralPath (Join-Path $env:TEST_ROOT 'InstalledConsumer.java') -Encoding utf8NoBOM
          $sep = [IO.Path]::PathSeparator
          & javac '-cp' ("$($jar.FullName)$sep$cp") '-d' $env:TEST_ROOT (Join-Path $env:TEST_ROOT 'InstalledConsumer.java')
          if ($LASTEXITCODE -ne 0) { throw 'JVM installed consumer compilation failed.' }
          & java '-cp' ("$($env:TEST_ROOT)$sep$($jar.FullName)$sep$cp") InstalledConsumer
          if ($LASTEXITCODE -ne 0) { throw 'JVM installed consumer execution failed.' }

  jvm-installed-consumer-musl:
    name: Installed musl JVM consumer ${{ matrix.rid }}
    needs: aggregate-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - rid: linux-musl-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact Rust source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download aggregate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/embedded-native-packages
      - name: Load installed JVM package and execute musl consumer
        shell: bash
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/embedded-native-packages
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          docker run --rm --user 0 \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$PACKAGE_ROOT:/pkg" \
            --env RID="$RID" \
            rust:1.98.1-alpine3.22@sha256:df2234c615138222413254f45937ae45d284aad971644fe564e4250609abe452 sh -euxc '
              apk add --no-cache openjdk17 maven
              jar="$(find /pkg -name "acyclic-embedded-jna-0.1.0.jar" -type f -print -quit)"
              test -n "$jar"
              mkdir -p /tmp/consumer/m2
              mvn -q -f /src/jvm/embedded/pom.xml -Dmaven.repo.local=/tmp/consumer/m2 -Dmdep.outputFile=/tmp/consumer/classpath.txt dependency:build-classpath
              cp="$(cat /tmp/consumer/classpath.txt)"
              cat >/tmp/consumer/InstalledConsumer.java <<"JAVA"
              import dev.acyclic.embedded.RustEmbedded;
              import java.nio.charset.StandardCharsets;
              public final class InstalledConsumer { public static void main(String[] a) throws Exception { try (RustEmbedded e = new RustEmbedded()) { byte[] v = "rust-jvm-musl".getBytes(StandardCharsets.UTF_8); var x=e.append("installed-musl",v); try (var r=e.openReader("installed-musl",x.start(),1,false)) { var i=r.next(); if(i.status()!=RustEmbedded.OK || !java.util.Arrays.equals(i.value(),v)) throw new IllegalStateException("Rust value did not round-trip"); } } } }
              JAVA
              javac -cp "$jar:$cp" -d /tmp/consumer /tmp/consumer/InstalledConsumer.java
              java -cp "/tmp/consumer:$jar:$cp" InstalledConsumer
            '

  platform-runtime-proof:
    name: All embedded package runtime proofs
    if: always()
    needs:
      - dotnet-installed-consumer
      - dotnet-installed-consumer-musl
      - jvm-installed-consumer
      - jvm-installed-consumer-musl
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Require every installed consumer matrix to pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @{
            dotnet = '${{ needs.dotnet-installed-consumer.result }}'
            dotnet_musl = '${{ needs.dotnet-installed-consumer-musl.result }}'
            jvm = '${{ needs.jvm-installed-consumer.result }}'
            jvm_musl = '${{ needs.jvm-installed-consumer-musl.result }}'
          }
          foreach ($entry in $results.GetEnumerator()) {
            if ($entry.Value -ne 'success') { throw "Installed consumer lane $($entry.Key) finished with $($entry.Value)." }
          }
          Write-Output 'All eight RID package runtime proofs passed.'
