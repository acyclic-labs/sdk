name: Agent Host Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/agent-host-qualification.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "plugin/**"
      - "rust/crates/filesystem/**"
      - "rust/crates/native-runtime/**"

permissions:
  contents: read

concurrency:
  group: agent-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        host: [codex, claude]
        platform:
          - name: linux-fuse
            runner: '["self-hosted","native-mount","linux-x64","fuse"]'
            shell: bash
          - name: macos-nfs
            runner: '["self-hosted","native-mount","macos-arm64","loopback-nfs"]'
            shell: bash
          - name: windows-projfs
            runner: '["self-hosted","native-mount","windows-x64","projfs"]'
            shell: pwsh
    name: ${{ matrix.host }} / ${{ matrix.platform.name }}
    runs-on: ${{ fromJSON(matrix.platform.runner) }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Install locked host binary
        id: host
        shell: ${{ matrix.platform.shell }}
        run: |
          npm ci --prefix plugin/tests/hosts --ignore-scripts
          node plugin/scripts/resolve-qualification-host.mjs ${{ matrix.host }}

      - name: Run actual host scenario
        if: runner.os != 'Windows'
        shell: ${{ matrix.platform.shell }}
        env:
          ACYCLIC_E2E_CODEX: ${{ matrix.host == 'codex' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_CLAUDE: ${{ matrix.host == 'claude' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_RECEIPT_DIR: ${{ runner.temp }}/agent-host-receipts
          ACYCLIC_E2E_HOST_PACKAGE: ${{ steps.host.outputs.package }}
          ACYCLIC_E2E_HOST_PACKAGE_VERSION: ${{ steps.host.outputs.package_version }}
          ACYCLIC_E2E_HOST_PACKAGE_INTEGRITY: ${{ steps.host.outputs.package_integrity }}
          ACYCLIC_E2E_HOST_PLATFORM_PACKAGE: ${{ steps.host.outputs.platform_package }}
          ACYCLIC_E2E_HOST_PLATFORM_VERSION: ${{ steps.host.outputs.platform_version }}
          ACYCLIC_E2E_HOST_PLATFORM_INTEGRITY: ${{ steps.host.outputs.platform_integrity }}
          ACYCLIC_E2E_HOST_LOCK_SHA256: ${{ steps.host.outputs.lock_sha256 }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/agent-host-target
          HOST: ${{ matrix.host }}
        run: |
          test_name="actual_${HOST}_binary_executes_the_scripted_scenario"
          if [ "$HOST" = claude ]; then
            test_name=actual_claude_binary_executes_the_scripted_scenario
          fi
          cargo test -p acyclic-labs-plugin --test e2e "$test_name" -- --ignored --exact --nocapture

      - name: Run actual host scenario on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ACYCLIC_E2E_CODEX: ${{ matrix.host == 'codex' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_CLAUDE: ${{ matrix.host == 'claude' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_RECEIPT_DIR: ${{ runner.temp }}\agent-host-receipts
          ACYCLIC_E2E_HOST_PACKAGE: ${{ steps.host.outputs.package }}
          ACYCLIC_E2E_HOST_PACKAGE_VERSION: ${{ steps.host.outputs.package_version }}
          ACYCLIC_E2E_HOST_PACKAGE_INTEGRITY: ${{ steps.host.outputs.package_integrity }}
          ACYCLIC_E2E_HOST_PLATFORM_PACKAGE: ${{ steps.host.outputs.platform_package }}
          ACYCLIC_E2E_HOST_PLATFORM_VERSION: ${{ steps.host.outputs.platform_version }}
          ACYCLIC_E2E_HOST_PLATFORM_INTEGRITY: ${{ steps.host.outputs.platform_integrity }}
          ACYCLIC_E2E_HOST_LOCK_SHA256: ${{ steps.host.outputs.lock_sha256 }}
          CARGO_TARGET_DIR: ${{ runner.temp }}\agent-host-target
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          HOST: ${{ matrix.host }}
        run: |
          $test = if ($env:HOST -eq 'codex') {
            'actual_codex_binary_executes_the_scripted_scenario'
          } else {
            'actual_claude_binary_executes_the_scripted_scenario'
          }
          cargo test -p acyclic-labs-plugin --test e2e $test -- --ignored --exact --nocapture

      - name: Retain qualification receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-host-${{ matrix.host }}-${{ matrix.platform.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-host-receipts
          if-no-files-found: error
          retention-days: 14

  gate:
    if: always()
    needs: qualify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require all six host/platform lanes
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
