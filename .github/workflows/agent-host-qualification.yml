name: Agent Host Qualification

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: agent-host-${{ github.ref }}

jobs:
  # Both hosts drive the same acyclic build on each platform, so one job per
  # platform compiles the scenario once and runs it for each host in turn.
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - name: linux-fuse
            runner: blacksmith-2vcpu-ubuntu-2404
            cache_size: 448M
          - name: macos-nfs
            runner: blacksmith-6vcpu-macos-15
            cache_size: 384M
          - name: windows-projfs
            runner: blacksmith-4vcpu-windows-2025
            cache_size: 576M
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_CACHE_SIZE: ${{ matrix.platform.cache_size }}
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Hosts reuse output within the job. Persisted compiler snapshots did
      # not shorten the release critical path and displaced native caches.
      - name: Configure local tools and compiler cache
        shell: bash
        run: |
          echo "TOOLS_DIR=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.18.0

      - name: Restore Cargo downloads
        id: downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore host npm downloads
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: host-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/tests/hosts/package-lock.json') }}
          restore-keys: |
            host-npm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native-mount prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev

      - name: Enable Windows ProjFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Install pinned Bun on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/ensure-bun.sh
          dirname "$(command -v bun)" >> "$GITHUB_PATH"

      - name: Install pinned Bun on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/ensure-bun.ps1
          Split-Path -Parent (Get-Command bun).Source >> $env:GITHUB_PATH

      - name: Install locked host binaries
        shell: bash
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --prefix plugin/tests/hosts --ignore-scripts

      - name: Resolve codex
        id: codex
        shell: bash
        run: node plugin/scripts/resolve-qualification-host.mjs codex

      - name: Resolve claude
        id: claude
        shell: bash
        run: node plugin/scripts/resolve-qualification-host.mjs claude

      - name: Locate build outputs
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agent-host-target" >> "$GITHUB_ENV"
          echo "ACYCLIC_E2E_RECEIPT_DIR=$RUNNER_TEMP/agent-host-receipts" >> "$GITHUB_ENV"

      - name: Prepare native SDK adapter for Pi controls
        shell: bash
        run: node plugin/tests/hosts/prepare-native.mjs

      - name: Build host scenario
        shell: bash
        run: |
          cargo test -p acyclic-plugin --test e2e --no-run --locked

      - name: Run Pi installed diagnostics and native context qualification
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          export ACYCLIC_BINARY="$CARGO_TARGET_DIR/debug/acyclic$suffix"
          cd plugin/tests/hosts
          bun run test:pi-context
          bun run test:pi-context-mail
          bun run test:pi-bootstrap
          bun run test:pi-session
          bun run test:pi-installation
          bun run test:pi-service
          bun run test:pi-native-recursive
          bun run test:pi-context-fresh
          bun run test:pi-context-pages
          bun run test:pi-builtin-paths

      - name: Run codex scenario
        shell: bash
        env:
          ACYCLIC_E2E_CODEX: ${{ steps.codex.outputs.binary }}
          ACYCLIC_E2E_HOST_PACKAGE: ${{ steps.codex.outputs.package }}
          ACYCLIC_E2E_HOST_PACKAGE_VERSION: ${{ steps.codex.outputs.package_version }}
          ACYCLIC_E2E_HOST_PACKAGE_INTEGRITY: ${{ steps.codex.outputs.package_integrity }}
          ACYCLIC_E2E_HOST_PLATFORM_PACKAGE: ${{ steps.codex.outputs.platform_package }}
          ACYCLIC_E2E_HOST_PLATFORM_VERSION: ${{ steps.codex.outputs.platform_version }}
          ACYCLIC_E2E_HOST_PLATFORM_INTEGRITY: ${{ steps.codex.outputs.platform_integrity }}
          ACYCLIC_E2E_HOST_LOCK_SHA256: ${{ steps.codex.outputs.lock_sha256 }}
        run: |
          cargo test -p acyclic-plugin --test e2e \
            actual_codex_binary_executes_the_scripted_scenario -- --ignored --exact --nocapture

      - name: Run claude scenario
        if: success() || failure()
        shell: bash
        env:
          ACYCLIC_E2E_CLAUDE: ${{ steps.claude.outputs.binary }}
          ACYCLIC_E2E_HOST_PACKAGE: ${{ steps.claude.outputs.package }}
          ACYCLIC_E2E_HOST_PACKAGE_VERSION: ${{ steps.claude.outputs.package_version }}
          ACYCLIC_E2E_HOST_PACKAGE_INTEGRITY: ${{ steps.claude.outputs.package_integrity }}
          ACYCLIC_E2E_HOST_PLATFORM_PACKAGE: ${{ steps.claude.outputs.platform_package }}
          ACYCLIC_E2E_HOST_PLATFORM_VERSION: ${{ steps.claude.outputs.platform_version }}
          ACYCLIC_E2E_HOST_PLATFORM_INTEGRITY: ${{ steps.claude.outputs.platform_integrity }}
          ACYCLIC_E2E_HOST_LOCK_SHA256: ${{ steps.claude.outputs.lock_sha256 }}
        run: |
          cargo test -p acyclic-plugin --test e2e \
            actual_claude_binary_executes_the_scripted_scenario -- --ignored --exact --nocapture

      - name: Retain qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-host-${{ matrix.platform.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-host-receipts
          if-no-files-found: error
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}

      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Save host npm downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  gate:
    if: always()
    needs: qualify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require host qualification on all three platforms
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
