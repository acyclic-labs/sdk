name: Agent Host Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/agent-host-qualification.yml"
      - ".github/actions/rust-build-cache/action.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "plugin/**"
      - "!plugin/**/README.md"
      - "!plugin/**/CHANGELOG.md"
      - "!plugin/scripts/validate-package.mjs"
      - "rust/crates/filesystem/**"
      - "rust/crates/native-runtime/**"

permissions:
  contents: read

concurrency:
  group: agent-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        host: [codex, claude]
        platform:
          - name: linux-fuse
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos-nfs
            runner: blacksmith-12vcpu-macos-15
          - name: windows-projfs
            runner: blacksmith-4vcpu-windows-2025
    name: ${{ matrix.host }} / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Restore Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          scope: host-${{ matrix.platform.name }}

      - name: Restore host npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/npm-cache
          key: host-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/tests/hosts/package-lock.json') }}
          restore-keys: |
            host-npm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native-mount prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev

      - name: Enable Windows ProjFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }

      - name: Install locked host binary
        id: host
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          npm ci --prefix plugin/tests/hosts --ignore-scripts
          node plugin/scripts/resolve-qualification-host.mjs ${{ matrix.host }}

      - name: Run actual host scenario
        if: runner.os != 'Windows'
        env:
          ACYCLIC_E2E_CODEX: ${{ matrix.host == 'codex' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_CLAUDE: ${{ matrix.host == 'claude' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_RECEIPT_DIR: ${{ runner.temp }}/agent-host-receipts
          ACYCLIC_E2E_HOST_PACKAGE: ${{ steps.host.outputs.package }}
          ACYCLIC_E2E_HOST_PACKAGE_VERSION: ${{ steps.host.outputs.package_version }}
          ACYCLIC_E2E_HOST_PACKAGE_INTEGRITY: ${{ steps.host.outputs.package_integrity }}
          ACYCLIC_E2E_HOST_PLATFORM_PACKAGE: ${{ steps.host.outputs.platform_package }}
          ACYCLIC_E2E_HOST_PLATFORM_VERSION: ${{ steps.host.outputs.platform_version }}
          ACYCLIC_E2E_HOST_PLATFORM_INTEGRITY: ${{ steps.host.outputs.platform_integrity }}
          ACYCLIC_E2E_HOST_LOCK_SHA256: ${{ steps.host.outputs.lock_sha256 }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/agent-host-target
          HOST: ${{ matrix.host }}
        run: |
          test_name="actual_${HOST}_binary_executes_the_scripted_scenario"
          if [ "$HOST" = claude ]; then
            test_name=actual_claude_binary_executes_the_scripted_scenario
          fi
          cargo test -p acyclic-labs-plugin --test e2e "$test_name" -- --ignored --exact --nocapture

      - name: Run actual host scenario on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ACYCLIC_E2E_CODEX: ${{ matrix.host == 'codex' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_CLAUDE: ${{ matrix.host == 'claude' && steps.host.outputs.binary || '' }}
          ACYCLIC_E2E_RECEIPT_DIR: ${{ runner.temp }}\agent-host-receipts
          ACYCLIC_E2E_HOST_PACKAGE: ${{ steps.host.outputs.package }}
          ACYCLIC_E2E_HOST_PACKAGE_VERSION: ${{ steps.host.outputs.package_version }}
          ACYCLIC_E2E_HOST_PACKAGE_INTEGRITY: ${{ steps.host.outputs.package_integrity }}
          ACYCLIC_E2E_HOST_PLATFORM_PACKAGE: ${{ steps.host.outputs.platform_package }}
          ACYCLIC_E2E_HOST_PLATFORM_VERSION: ${{ steps.host.outputs.platform_version }}
          ACYCLIC_E2E_HOST_PLATFORM_INTEGRITY: ${{ steps.host.outputs.platform_integrity }}
          ACYCLIC_E2E_HOST_LOCK_SHA256: ${{ steps.host.outputs.lock_sha256 }}
          CARGO_TARGET_DIR: ${{ runner.temp }}\agent-host-target
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          HOST: ${{ matrix.host }}
        run: |
          $test = if ($env:HOST -eq 'codex') {
            'actual_codex_binary_executes_the_scripted_scenario'
          } else {
            'actual_claude_binary_executes_the_scripted_scenario'
          }
          cargo test -p acyclic-labs-plugin --test e2e $test -- --ignored --exact --nocapture

      - name: Retain qualification receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-host-${{ matrix.host }}-${{ matrix.platform.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-host-receipts
          if-no-files-found: error
          retention-days: 14

  gate:
    if: always()
    needs: qualify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require all six host/platform lanes
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
