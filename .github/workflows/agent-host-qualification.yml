name: Agent Host Qualification

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: agent-host-${{ github.ref }}

jobs:
  # All hosts drive the same acyclic build on each platform, so one job per
  # platform compiles the scenario once and runs it for each host in turn.
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - name: linux-fuse
            runner: blacksmith-2vcpu-ubuntu-2404
            cache_size: 448M
          - name: macos-nfs
            runner: blacksmith-6vcpu-macos-15
            cache_size: 384M
          - name: windows-projfs
            runner: blacksmith-4vcpu-windows-2025
            cache_size: 576M
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_CACHE_SIZE: ${{ matrix.platform.cache_size }}
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Hosts reuse output within the job. Persisted compiler snapshots did
      # not shorten the release critical path and displaced native caches.
      - name: Configure local tools and compiler cache
        shell: bash
        run: |
          echo "TOOLS_DIR=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.18.0

      - name: Restore Cargo downloads
        id: downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore host npm downloads
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: host-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/tests/hosts/package-lock.json') }}
          restore-keys: |
            host-npm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native-mount prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev bubblewrap socat

      - name: Enable Windows ProjFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Install pinned Bun on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/ensure-bun.sh
          dirname "$(command -v bun)" >> "$GITHUB_PATH"

      - name: Install pinned Bun on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/ensure-bun.ps1
          Split-Path -Parent (Get-Command bun).Source >> $env:GITHUB_PATH

      - name: Install locked host binaries
        shell: bash
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --prefix plugin/tests/hosts --ignore-scripts

      - name: Resolve codex
        id: codex
        shell: bash
        run: node plugin/scripts/resolve-qualification-host.mjs codex

      - name: Resolve claude
        id: claude
        shell: bash
        run: node plugin/scripts/resolve-qualification-host.mjs claude

      - name: Locate build outputs
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agent-host-target" >> "$GITHUB_ENV"
          echo "ACYCLIC_E2E_RECEIPT_DIR=$RUNNER_TEMP/agent-host-receipts" >> "$GITHUB_ENV"

      # The hosts own their loops and tools. The retained scenarios exercise
      # shared workspace/session APIs; there is no plugin runtime or NAPI host.
      - name: Build shared host scenarios
        shell: bash
        run: cargo test --locked -p acyclic-plugin -p acyclic-harness --all-features --lib --bins --no-run

      - name: Run plugin unit tests
        shell: bash
        run: cargo test --locked -p acyclic-plugin --all-features --bin acyclic -- --test-threads=4

      - name: Run shared native host lifecycle
        shell: bash
        run: |
          cargo test --locked -p acyclic-harness --all-features --lib local::host_owner:: -- --test-threads=4

      - name: Run shared fork and merge recovery
        shell: bash
        run: |
          cargo test --locked -p acyclic-harness --all-features --lib local::tests::merge_recovery:: -- --test-threads=4

      - name: Run host manifest and shim contracts
        shell: bash
        run: bun run --cwd plugin/tests/hosts test:shim

      - name: Build normal host executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$ACYCLIC_E2E_RECEIPT_DIR"
          cargo build --locked -p acyclic-plugin -p graphcoder --bins --message-format=json > "$ACYCLIC_E2E_RECEIPT_DIR/normal-cargo.jsonl"

      - name: Run scripted native sessions in the Codex sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: node plugin/tests/hosts/qualify-scripted.mjs "$ACYCLIC_E2E_RECEIPT_DIR/normal-cargo.jsonl" "$ACYCLIC_E2E_RECEIPT_DIR/managed" "${{ steps.codex.outputs.binary }}" managed

      - name: Build shared resource instrumentation
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --locked -p acyclic-plugin -p graphcoder --bins --features graphcoder/test-support --message-format=json > "$ACYCLIC_E2E_RECEIPT_DIR/scale-cargo.jsonl"

      - name: Run shared mount scale through every host adapter
        if: runner.os == 'Linux'
        shell: bash
        run: node plugin/tests/hosts/qualify-scripted.mjs "$ACYCLIC_E2E_RECEIPT_DIR/scale-cargo.jsonl" "$ACYCLIC_E2E_RECEIPT_DIR/scale" "${{ steps.codex.outputs.binary }}" scale

      - name: Retain qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-host-${{ matrix.platform.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-host-receipts
          if-no-files-found: error
          retention-days: ${{ contains(github.workflow, 'Release') && 30 || 3 }}

      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Save host npm downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  gate:
    if: always()
    needs: qualify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require host qualification on all three platforms
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
