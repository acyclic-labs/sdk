name: SDK Static
# Reject a lockfile Cargo would change, including its serialization, and
# any tracked Rust file rustfmt would change. Neither check compiles.
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: SDK Static
    runs-on: kaizen-linux
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check lockfile and manifests without compiling
        run: node scripts/check-cargo-lock.mjs
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Check Cargo publication inventory without compiling
        run: node scripts/publish-cargo-crates.mjs check
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Check that the Bazel files match the Cargo manifests
        run: node scripts/bazel-build-files.mjs check
      # The repository's own manifests exercise one shape; the generator's test
      # builds the other shapes Cargo accepts (no [workspace.package], for one).
      - name: Test the Bazel file generator
        run: node --test scripts/bazel-build-files.test.mjs
      - name: Check that no tooling file gains a Cargo invocation
        run: node scripts/check-cargo-callers.mjs
      - name: Check that feature-gated Cargo tests explicitly opt in
        run: node scripts/check-test-features.mjs
      # Vendored crates keep their upstream bytes.
      - name: Check that the whole tree has no whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':!managed-agents'
      # Formatting differs between rustfmt releases (macro bodies among
      # them), so it is checked with the pinned toolchain the gate uses.
      - name: Install the pinned rustfmt
        run: rustup toolchain install
      - name: Check formatting of every tracked Rust file without compiling
        run: node scripts/qualify-rustfmt.mjs
