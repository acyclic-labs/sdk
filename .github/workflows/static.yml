name: SDK Static
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: SDK Static
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check lockfile and manifests without compiling
        run: cargo update --workspace --locked
  generated:
    name: SDK Generated Sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TOOLS_DIR: ${{ runner.temp }}/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Install pinned Bun and dependencies
        run: |
          source scripts/ensure-bun.sh
          dirname "$(command -v bun)" >> "$GITHUB_PATH"
          bun install --frozen-lockfile
      - name: Build source generators
        run: |
          cargo fetch --locked
          cargo build --locked -p sdk-proto-codegen
          cargo build --locked -p acyclic-actors --example actors-http-routes
      - name: Check generated sources without rewriting them
        run: |
          cargo test --locked -p sdk-proto-codegen --lib rust_projection::
          node --test scripts/generated-rust.test.mjs
          bun scripts/check-generated.mjs --source-only
