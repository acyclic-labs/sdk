name: SDK Static
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    name: SDK Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check changed paths for lane artifacts
        env:
          ARTIFACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ARTIFACT_HEAD: ${{ github.sha }}
        run: |
          if [[ -n "$ARTIFACT_BASE" && ! "$ARTIFACT_BASE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$ARTIFACT_BASE"
          fi
          node scripts/check-lane-artifacts.mjs "$ARTIFACT_BASE" "$ARTIFACT_HEAD"
      - name: Verify lane artifact gate and its negative control
        run: node --test scripts/lane-artifact-policy.test.mjs scripts/check-lane-artifacts.test.mjs
      - name: Verify the local cloud fixture's guards and verdict
        run: node --test scripts/local-cloud.test.mjs
      - name: Check lockfile and manifests without compiling
        run: cargo update --workspace --locked
  static:
    name: SDK Static
    if: always()
    needs: [static-checks, json-accounting]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require static checks and JSON accounting
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          JSON_RESULT: ${{ needs.json-accounting.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$JSON_RESULT" = success
  json-accounting:
    # Run on every PR: callers outside the codec also rely on these exact
    # charges to fit their original native work budgets.
    name: Harness JSON accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: Verify exact charges, mutation controls and original-budget regressions
        run: >-
          cargo test --locked -p acyclic-harness -p acyclic-harness-providers
          --features acyclic-harness/filesystem --lib --
          executor::json task_runtime::tests runtime::tests::native
          codex_dispatch_tests::stock
  aarch64:
    # Integer widths in libc differ by architecture (for example nlink_t is u32 on
    # aarch64 Linux and u64 on x86_64). Type-check the native host crates on an arm
    # runner so a width-dependent compile break cannot reach main again.
    name: SDK aarch64 Linux check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Type-check native host crates for aarch64 Linux
        run: cargo check --locked -p acyclic-fs --lib --features s3-http
