name: SDK Static
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: SDK Static
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check lockfile and manifests without compiling
        run: cargo update --workspace --locked
