name: Native Mount Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-mount-qualification.yml'
      - 'Cargo.lock'
      - 'rust/crates/conformance/**'
      - 'rust/crates/filesystem/**'
      - 'scripts/qualify-native-mount.*'

permissions:
  contents: read

concurrency:
  group: native-mount-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: linux-fuse
            runner: '["self-hosted","native-mount","linux-x64","fuse"]'
            shell: bash
          - backend: macos-nfs
            runner: '["self-hosted","native-mount","macos-arm64","loopback-nfs"]'
            shell: bash
          - backend: windows-projfs
            runner: '["self-hosted","native-mount","windows-x64","projfs"]'
            shell: pwsh
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Qualify Linux or macOS native mount
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/native-mount-artifacts
        run: bash scripts/qualify-native-mount.sh '${{ matrix.backend }}'

      - name: Qualify Windows native mount
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}\native-mount-artifacts
        run: .\scripts\qualify-native-mount.ps1 -Backend '${{ matrix.backend }}'

      - name: Retain native mount receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-mount-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-mount-artifacts
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Native Mount Qualification
    if: always()
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all native backends
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
