name: Native Mount Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-mount-qualification.yml'
      - '.github/actions/rust-build-cache/action.yml'
      - 'Cargo.lock'
      - 'rust/crates/conformance/**'
      - 'rust/crates/filesystem/**'
      - 'rust/crates/native-runtime/**'
      - 'scripts/qualify-native-mount.*'

permissions:
  contents: read

concurrency:
  group: native-mount-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: linux-fuse
            runner: blacksmith-16vcpu-ubuntu-2404
            shell: bash
          - backend: macos-nfs
            runner: blacksmith-12vcpu-macos-15
            shell: bash
          - backend: windows-projfs
            runner: blacksmith-16vcpu-windows-2025
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Restore Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          scope: native-${{ matrix.backend }}

      - name: Install Linux native-mount prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev

      - name: Enable Windows ProjFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -All -NoRestart
          }
          if ((Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS).State -ne 'Enabled') {
            throw 'Client-ProjFS could not be enabled without a reboot'
          }

      # The qualification scripts accept prebuilt executables; building the
      # release binary and the qualifier side by side halves the critical path.
      - name: Build release and qualification executables
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/native-mount-target"
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          # Complete rust-toolchain.toml components once, before parallel builds
          # race to install them.
          cargo --version
          cargo build --locked -p acyclic-plugin --release --target-dir "$target" &
          release=$!
          cargo build --locked -p acyclic-conformance --features local-runner \
            --bin native-mount-qualify --target-dir "${target}-qualifier"
          wait "$release"
          echo "ACYCLIC_RELEASE_EXECUTABLE=$target/release/acyclic$suffix" >> "$GITHUB_ENV"
          echo "ACYCLIC_QUALIFIER_EXECUTABLE=${target}-qualifier/debug/native-mount-qualify$suffix" >> "$GITHUB_ENV"

      - name: Qualify Linux or macOS native mount
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}/native-mount-artifacts
        run: bash scripts/qualify-native-mount.sh '${{ matrix.backend }}'

      - name: Qualify Windows native mount
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\native-mount-target
          SDK_ARTIFACT_DIR: ${{ runner.temp }}\native-mount-artifacts
        run: .\scripts\qualify-native-mount.ps1 -Backend '${{ matrix.backend }}'

      - name: Retain native mount receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-mount-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-mount-artifacts
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Native Mount Qualification
    if: always()
    needs: qualify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require all native backends
        env:
          RESULT: ${{ needs.qualify.result }}
        run: test "$RESULT" = success
