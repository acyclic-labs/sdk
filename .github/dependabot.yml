version: 2
multi-ecosystem-groups:
  sdk-dependencies:
    schedule: { interval: weekly }
updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-dependencies
    rebase-strategy: disabled
    ignore:
      # fuser 0.17 changes the Filesystem trait and handle/error types. Upgrade
      # it with the Linux adapter port and native mount qualification.
      - dependency-name: fuser
        versions: [">= 0.17, < 0.18"]
  - package-ecosystem: bun
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-dependencies
    rebase-strategy: disabled
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-dependencies
    rebase-strategy: disabled
