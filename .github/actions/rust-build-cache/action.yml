name: Rust build cache
description: Restore dependency downloads and content-addressed compiler output on Blacksmith
inputs:
  scope:
    description: Target and profile boundary for compiler output
    required: true
runs:
  using: composite
  steps:
    - name: Configure compiler cache
      shell: bash
      run: |
        echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - name: Restore Cargo downloads
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        # Cargo unpacks sources from the compressed archives faster than a
        # cache restores thousands of extracted files.
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
        restore-keys: |
          rust-deps-v2-${{ runner.os }}-${{ runner.arch }}-
    # Exact hits are reliable where prefix fallbacks are not, and a fresh cache
    # per commit evicts everything else: key compiler output by what shapes
    # compiler invocations so runs share warm dependency objects; workspace
    # crates recompile from source anyway.
    - name: Restore compiler output
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/sccache
        key: rust-objects-v2-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          rust-objects-v2-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Enable compiler cache
      uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
