name: Rust toolchain
description: Installs the Rust release that rust-toolchain.toml pins, the one place it is named.

inputs:
  components:
    description: Comma-separated rustup components.
    required: false
    default: ''
  targets:
    description: Comma-separated rustup targets.
    required: false
    default: ''

outputs:
  channel:
    description: The pinned Rust release.
    value: ${{ steps.pinned.outputs.channel }}

runs:
  using: composite
  steps:
    - name: Read the pinned Rust release
      id: pinned
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "rust-toolchain.toml pins no exact Rust release" >&2
          exit 1
        }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.pinned.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
