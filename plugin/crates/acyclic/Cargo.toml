[package]
name = "acyclic"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Agent-native state engine: checkpoints, rewind, and blast-radius diff for coding-agent sessions"

[dependencies]
acyclic-engine = { path = "../acyclic-engine" }
acyclic-fs = { version = "=0.2.0-rc.5", path = "../../../rust/crates/filesystem", features = ["local", "native-watch", "native-mount"] }
acyclic-proto = { path = "../acyclic-proto" }
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Handle-inheritance control for the daemon spawn (`client::spawn_daemon`),
# the security descriptor that keeps the daemon's named pipe to this user
# (`ipc::Listener::bind`), and the job object that makes a speculative run's
# timeout reach the child's own children (`spec_runner::RunGroup`).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
