[package]
name = "acyclic-engine"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
description = "Rewind engine: capture pipeline, checkpoint index, rewind, and diff over acyclic-fs"

[dependencies]
acyclic-fs = { version = "=0.2.0-rc.5", path = "../../../rust/crates/filesystem", features = ["local", "native-watch", "native-mount"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
hex.workspace = true
blake3.workspace = true
bytes.workspace = true
diffy.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
