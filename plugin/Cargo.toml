[package]
name = "acyclic-plugin"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native host workspace hook shims and shared harness file client"
homepage = "https://github.com/acyclic-labs/sdk"
documentation = "https://docs.rs/acyclic-plugin"
readme = "README.md"
keywords = ["agents", "filesystem", "mcp", "workspaces"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acyclic"
path = "src/main.rs"

[dependencies]
acyclic-plugin-identity = { path = "identity", version = "=0.2.0" }
acyclic-harness = { path = "../rust/crates/harness", version = "=0.2.0", default-features = false, features = ["filesystem-local", "native-execution"] }
acyclic-native-runtime = { path = "../rust/crates/native-runtime", version = "=0.2.0" }
blake3.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
acyclic-test-support = { path = "../rust/crates/test-support" }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
