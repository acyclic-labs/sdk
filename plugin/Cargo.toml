[package]
name = "acyclic-plugin"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "One Acyclic CLI, service, hook runner, MCP bridge, and installer"
homepage = "https://github.com/acyclic-labs/sdk"
documentation = "https://docs.rs/acyclic-plugin"
readme = "README.md"
keywords = ["agents", "filesystem", "mcp", "workspaces"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acyclic"
path = "src/main.rs"

[dependencies]
acyclic-fs = { path = "../rust/crates/filesystem", version = "=0.1.5", features = ["local", "native-watch", "native-mount"] }
acyclic-native-runtime = { path = "../rust/crates/native-runtime", version = "=0.1.5" }
base64 = "0.22.1"
blake3.workspace = true
fs2.workspace = true
hex.workspace = true
libc = "0.2.177"
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml_edit = "0.22.27"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
bytes.workspace = true
tempfile = "3"

[lints]
workspace = true
