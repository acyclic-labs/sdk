[package]
name = "acyclic-plugin"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native hook clients and manifests over the Acyclic harness"
homepage = "https://github.com/acyclic-labs/sdk"
documentation = "https://docs.rs/acyclic-plugin"
readme = "README.md"
keywords = ["agents", "filesystem", "mcp", "workspaces"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acyclic"
path = "src/main.rs"

[dependencies]
acyclic-harness = { path = "../rust/crates/harness", version = "=0.2.0", default-features = false, features = ["hooks", "filesystem-local", "native-execution"] }
acyclic-native-runtime = { path = "../rust/crates/native-runtime", version = "=0.2.0", default-features = false }
base64 = "0.23.1"
blake3.workspace = true
fs2.workspace = true
libc = "0.2.177"
reqwest.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std"] }
toml_edit = "0.25.15"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }


[dev-dependencies]
acyclic-stream = { path = "../rust/crates/stream", features = ["grpc"] }
hex.workspace = true
proptest.workspace = true
acyclic-fs = { path = "../rust/crates/filesystem", features = ["local", "native-mount"] }
acyclic-harness = { path = "../rust/crates/harness", features = ["terminal", "filesystem-local", "native-execution", "grpc", "test-support"] }
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
futures.workspace = true
tempfile = "3"

[lints]
workspace = true
