[package]
name = "acyclic-agent-workspaces-control"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
acyclic-fs = { path = "../../../rust/crates/filesystem", features = ["local", "native-watch", "native-mount"] }
base64 = "0.22"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[lints.rust]
unsafe_code = "deny"
