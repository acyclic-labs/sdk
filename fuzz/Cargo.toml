[package]
name = "acyclic-guest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
inference_manifest = ["dep:acyclic-conformance"]

[dependencies]
futures = { workspace = true }
libfuzzer-sys = "0.4"
acyclic-actors = { path = "../rust/crates/actors", features = ["test-support"] }
acyclic-conformance = { path = "../rust/crates/conformance", features = ["inference"], optional = true }
serde_json = "1"
acyclic-objects = { path = "../rust/crates/objects", default-features = false }
acyclic-stream = { path = "../rust/crates/stream", default-features = false, features = ["serde"] }
prost = "0.14.4"

[[bin]]
name = "guest_json"
path = "fuzz_targets/guest_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "call_record"
path = "fuzz_targets/call_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "objects_manifest"
path = "fuzz_targets/objects_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invocation_headers"
path = "fuzz_targets/invocation_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_error"
path = "fuzz_targets/stream_error.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inference_manifest"
path = "fuzz_targets/inference_manifest.rs"
required-features = ["inference_manifest"]
test = false
doc = false
bench = false
