[package]
name = "acyclic-guest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
acyclic-actors = { path = "../rust/crates/actors" }
serde_json = "1"
acyclic-objects = { path = "../rust/crates/objects", default-features = false }

[[bin]]
name = "guest_json"
path = "fuzz_targets/guest_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "objects_manifest"
path = "fuzz_targets/objects_manifest.rs"
test = false
doc = false
bench = false
