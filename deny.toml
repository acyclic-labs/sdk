[advisories]
yanked = "deny"
# Loom's latest published release (0.7.2) uses pin-utils in its futures model.
# Keep that proof coverage until Loom publishes its core::pin::pin! replacement:
# https://github.com/tokio-rs/loom/blob/v0.7.2/Cargo.toml#L22-L34
# This also covers synchrony's cfg(loom) dependency in the compio graph.
# The bans rule below refuses every other direct parent.
ignore = [
  { id = "RUSTSEC-2026-0441", reason = "Loom 0.7.2 is the latest published release; its futures model requires pin-utils. Removing it drops concurrency proofs, and the core pin replacement is not released upstream." },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "imbl"
version = "=7.0.2"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "imbl-sized-chunks"
version = "=0.2.0"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "pin-utils", wrappers = ["loom"], reason = "Use core::pin::pin!; only Loom's unreleased upstream replacement prevents removal of its proof dependency." },
]
# Path-only dev-dependencies of publishable crates and path dependencies of
# private crates never reach a published manifest.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
