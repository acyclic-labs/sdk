[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "imbl"
version = "=7.0.2"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "imbl-sized-chunks"
version = "=0.2.0"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
