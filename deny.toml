[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
# LLVM's libFuzzer runtime, retained by the fuzz packages.
allow = ["NCSA"]
name = "libfuzzer-sys"
version = "=0.4.13"

[[licenses.exceptions]]
# Unmodified platform-directory dependency through dirs-sys.
allow = ["MPL-2.0"]
name = "option-ext"
version = "=0.2.0"

[[licenses.exceptions]]
# Snapshot dependency of the public-api contract checker.
allow = ["Unlicense"]
name = "snapshot-testing"
version = "=0.1.8"

[[licenses.exceptions]]
# Hash implementation used by the public S3 conformance server.
allow = ["BSL-1.0"]
name = "xxhash-rust"
version = "=0.8.18"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "pin-utils", reason = "RUSTSEC-2026-0441: unmaintained; use core::pin::pin!." },
]
# Path-only dev-dependencies of publishable crates and path dependencies of
# private crates never reach a published manifest.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
