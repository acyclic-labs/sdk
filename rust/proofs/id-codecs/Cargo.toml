[package]
license = "Apache-2.0"
name = "acyclic-id-codec-proofs"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
acyclic-auth = { path = "../../crates/auth" }
acyclic-fs = { path = "../../crates/filesystem", default-features = false, features = ["test-support"] }
acyclic-log-frame = { path = "../../crates/log-frame" }
acyclic-objects = { path = "../../crates/objects", default-features = false }
acyclic-stream = { path = "../../crates/stream", default-features = false }
acyclic-stream-wire = { path = "../../crates/stream-wire" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
