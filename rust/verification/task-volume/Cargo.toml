[package]
name = "acyclic-query-verification"
version = "0.0.0"
publish = false
edition = "2024"

# Compile the production projection itself without transport/dev-test dependencies.
[lib]
path = "../../crates/harness/src/task_volume/mod.rs"

[[test]]
name = "query-model"
path = "model.rs"

[dependencies]
acyclic-stream = { path = "../../crates/stream", default-features = false, features = ["local", "serde"] }
blake3 = "1.8.2"
futures = "0.3.31"
loom = { version = "0.7.2", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.25", features = ["serde", "v4"] }

[workspace]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = 'warn', check-cfg = ['cfg(acyclic_loom)'] }
