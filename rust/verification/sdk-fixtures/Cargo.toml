[package]
license.workspace = true
name = "sdk-fixture-verification"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "../../crates/sdk-generation/tests/cli_regressions/cache.rs"

[[test]]
name = "fixture-model"
path = "model.rs"
required-features = ["model-checking"]

[dependencies]
loom = { version = "=0.7.3", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
model-checking = ["dep:loom"]
