[package]
name = "sdk-fixture-verification"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "../../crates/sdk-docs/src/sync.rs"

[[test]]
name = "fixture-model"
path = "model.rs"
required-features = ["model-checking"]

[dependencies]
loom = "=0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
model-checking = []
