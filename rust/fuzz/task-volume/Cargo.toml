[package]
name = "task-volume-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
base64 = "=0.22.1"
acyclic-harness = { path = "../../crates/harness", default-features = false }
acyclic-stream = { path = "../../crates/stream", default-features = false, features = ["local"] }
prost = "0.14.4"
serde_json = "1.0"

# Match the canonical debug build: unoptimized serde and base64 make each
# 4 KiB frame cost milliseconds under the sanitizer, starving the fuzzer.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[[bin]]
name = "task_volume"
path = "fuzz_targets/task_volume.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonl_wire"
path = "fuzz_targets/jsonl_wire.rs"
test = false
doc = false
bench = false

[workspace]
