[package]
name = "task-volume-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
acyclic-harness = { path = "../../crates/harness", default-features = false }
acyclic-stream = { path = "../../crates/stream", default-features = false, features = ["local"] }
prost = "0.14.4"
serde_json = "1.0"

[[bin]]
name = "task_volume"
path = "fuzz_targets/task_volume.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonl_wire"
path = "fuzz_targets/jsonl_wire.rs"
test = false
doc = false
bench = false

[workspace]
