doc = false
bench = false

[[bin]]
name = "proto_descriptors"
required-features = ["proto-descriptors"]
path = "fuzz_targets/proto_descriptors.rs"
test = false
doc = false
bench = false

[dev-dependencies]
arrayvec = { version = "0.7.8", default-features = false }
acyclic-test-support = { path = "../crates/test-support" }
proptest.workspace = true

[[test]]
name = "local_hotpath_quantiles"
path = "tests/local_hotpath_quantiles.rs"
required-features = ["local-hotpath-quantiles"]

[[bin]]
name = "inbox_record"
required-features = ["agent"]
path = "fuzz_targets/inbox_record.rs"
