[package]
license.workspace = true
name = "acyclic-sdk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
proto-descriptors = ["dep:acyclic-proto-build", "dep:prost", "dep:prost-reflect"]
process-arguments = ["dep:serde_json"]
local-hotpath-options = ["dep:acyclic-test-support"]
local-hotpath-quantiles = ["dep:serde"]
report-port = ["dep:acyclic-native-runtime", "dep:serde_json", "dep:tokio"]
grpc-codegen = ["dep:acyclic-grpc-observability", "dep:prettyplease", "dep:syn"]
default = ["native"]
agent = ["dep:acyclic-harness-core"]
experiments = ["agent", "dep:serde_json"]
observation = ["dep:acyclic-observability", "dep:serde_json"]
native = ["dep:acyclic-fs", "dep:acyclic-harness", "dep:prost", "dep:serde_json", "owner-record"]
owner-record = ["dep:acyclic-native-runtime"]

[dependencies]
serde = { workspace = true, optional = true }
acyclic-test-support = { path = "../crates/test-support", optional = true }
acyclic-native-runtime = { path = "../crates/native-runtime", optional = true }
acyclic-grpc-observability = { path = "../crates/grpc-observability", default-features = false, features = ["codegen"], optional = true }
prettyplease = { version = "=0.3.0", optional = true }
syn = { version = "=3.0.9", features = ["full", "visit"], optional = true }
acyclic-proto-build = { path = "../../compatibility", optional = true }
acyclic-observability = { path = "../crates/observability", features = ["research"], optional = true }
acyclic-fs = { path = "../crates/filesystem", default-features = false, optional = true }
acyclic-harness-core = { path = "../crates/harness-core", default-features = false, optional = true }
acyclic-harness = { path = "../crates/harness", default-features = false, features = ["filesystem-local", "native-execution", "grpc"], optional = true }
libfuzzer-sys = "0.4"
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros"], optional = true }

[lints]
workspace = true

[[example]]
name = "capture_native_hooks"
required-features = ["native"]

[[bin]]
name = "git_argv"
required-features = ["native"]
path = "fuzz_targets/git_argv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_host_arguments"
required-features = ["process-arguments"]
path = "fuzz_targets/process_host_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "observation_slo"
required-features = ["observation"]
path = "fuzz_targets/observation_slo.rs"
test = false
doc = false
bench = false

[[test]]
name = "observation_slo"
required-features = ["observation"]

[[bin]]
name = "git_path"
required-features = ["native"]
path = "fuzz_targets/git_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_tool_inputs"
required-features = ["native"]
path = "fuzz_targets/file_tool_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_hooks"
required-features = ["native"]
path = "fuzz_targets/native_hooks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "harness_admission"
required-features = ["native"]
path = "fuzz_targets/harness_admission.rs"
