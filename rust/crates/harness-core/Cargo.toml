[package]
include = ["clippy.toml", "Cargo.toml", "build.rs", "src/**", "docs/**", "tests/**", "examples/**"]
autotests = false
autobins = false
autoexamples = false
name = "acyclic-harness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime, contracts and storage behind the acyclic-harness facade"
documentation = "https://docs.rs/acyclic-harness-core"
build = "build.rs"

[[example]]
name = "agent-record-corpus"
path = "examples/agent-record-corpus.rs"

[[example]]
name = "experiment-analysis"
path = "examples/experiment-analysis.rs"

[[example]]
name = "history-codec-corpus"
path = "examples/history-codec-corpus.rs"
required-features = ["test-support"]

[[example]]
name = "config-types"
path = "examples/config-types.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "agent_model"
path = "tests/agent_model.rs"

[[test]]
name = "computed_ui_records"
path = "tests/computed_ui_records.rs"

[[test]]
name = "contract_errors"
path = "tests/contract_error_cases.rs"

[[test]]
name = "conversation_contract"
path = "tests/conversation_contract.rs"

[[test]]
name = "model_usage_cost"
path = "tests/model_usage_cost.rs"

[[test]]
name = "projection_selection"
path = "tests/projection_selection.rs"

[package.metadata.bazel]
# Each group is its own test binary so one group's generic instantiation never
# pays for another's; the library's own unit tests stay the suite's internal case.
linked-unit-tests = [
    "agent_model",
    "computed_ui_records",
    "contract_errors",
    "conversation_contract",
    "model_usage_cost",
    "projection_selection"]
build-script-inputs = []
# These sources are reached only by cfg(test) module declarations.
unit-test-only-sources = [
    "src/executor/tests/**",
    "src/filesystem/memory/tests.rs",
    "src/filesystem/memory/tests/**",
]


[features]
research = ["acyclic-observability/research"]
conformance = ["acyclic-stream/conformance", "acyclic-objects/conformance"]
test-support = ["acyclic-harness-control/test-support", "acyclic-harness-control-checks/repository-checks", "acyclic-harness-sse/test-support", "acyclic-harness-layout/test-support", "acyclic-auth/test-support", "acyclic-machines/test-support", "acyclic-actors/test-support", "acyclic-stream/test-support", "dep:acyclic-differential", "acyclic-native-runtime/test-support", "acyclic-objects/test-support", "acyclic-fs/test-support", "acyclic-fs-work/test-support", "acyclic-fs-format/test-support"]
model-checking = ["acyclic-mcp/model-checking", "dep:loom", "dep:same-file", "acyclic-fs/model-checking"]
browser = ["wasm", "acyclic-fs/browser", "acyclic-model-render/browser"]
wasm = ["acyclic-harness-model-cache/wasm", "acyclic-stream/wasm", "dep:tsify"]

[dependencies]
acyclic-harness-wire = { version = "=0.2.0", path = "../harness-wire" }
acyclic-decimal-u64 = { version = "=0.2.0", path = "../decimal-u64" }
acyclic-fs-merge = { version = "=0.2.0", path = "../filesystem-merge" }
acyclic-fs-format = { version = "=0.2.0", path = "../filesystem-format" }
acyclic-fs-work = { version = "=0.2.0", path = "../filesystem-work" }
acyclic-fs-base = { version = "=0.2.0", path = "../filesystem-base" }
acyclic-harness-control = { version = "=0.2.0", path = "../harness-control" }
acyclic-harness-json = { version = "=0.2.0", path = "../harness-json" }
acyclic-harness-sse = { version = "=0.2.0", path = "../harness-sse" }
acyclic-harness-layout = { version = "=0.2.0", path = "../harness-layout" }
acyclic-harness-model-cache = { version = "=0.2.0", path = "../harness-model-cache" }
memchr = "=2.8.3"
pulldown-cmark.workspace = true
tar = { version = "=0.4.46", default-features = false }
acyclic-mcp = { version = "=0.2.0", path = "../mcp" }
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
acyclic-host-platform = { version = "=0.2.0", path = "../host-platform" }
acyclic-model-render = { version = "=0.2.0", path = "../model-render" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
zeroize.workspace = true
once_cell = "1.21.3"
pin-project-lite = "0.2.17"
acyclic-differential = { version = "=0.2.0", path = "../differential", optional = true }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-collections = { version = "=0.2.0", path = "../collections" }
acyclic-contract-derive = { version = "=0.2.0", path = "../contract-derive" }
arrayvec = { version = "0.7.8", default-features = false }
async-trait.workspace = true
async-stream = "=0.3.6"
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
base64 = "=0.23.1"
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
httpdate = "1.0.3"
humantime = "2.4.0"
serde-wasm-bindgen.workspace = true
jsonschema.workspace = true
rmp-serde = "=1.3.1"
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
regex-lite = { version = "0.1.9" }
js-sys = { workspace = true }
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
schemars = "=1.2.3"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = { workspace = true }
ts-rs = "=12.0.1"
tokio-util = { workspace = true, features = ["codec"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time", "io-util"] }
uuid.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-fs-native-contract = { version = "=0.2.0", path = "../filesystem-native-contract" }
acyclic-harness-modules = { version = "=0.2.0", path = "../harness-modules" }
notify.workspace = true
acyclic-mcp = { version = "=0.2.0", path = "../mcp", features = ["stdio"] }
rmcp = { workspace = true, features = ["auth", "reqwest-tls-no-provider"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures", "parallel"] }
acyclic-observability = { version = "=0.2.0", path = "../observability" }
dirs = { workspace = true }
tempfile = { version = "3.27.0" }
getrandom = { workspace = true }
loom = { version = "=0.7.3", optional = true }
same-file = { version = "1.0.6", optional = true }
acyclic-executable-search = { version = "=0.2.0", path = "../executable-search" }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true }
rustls = { workspace = true }
h2 = { version = "0.4", default-features = false }
hyper = { version = "1", default-features = false }
tokio = { version = "1.48.0", default-features = false, features = ["signal", "io-std", "io-util", "process"] }

[dev-dependencies]
acyclic-machines-conformance = { version = "=0.2.0", path = "../machines-conformance" }
acyclic-harness-control = { version = "=0.2.0", path = "../harness-control", features = ["test-support"] }
acyclic-harness-layout = { version = "=0.2.0", path = "../harness-layout", features = ["test-support"] }
# The engine's unit and integration tests act through a hosted tree, which sits above it.
acyclic-harness-hosting = { version = "=0.2.0", path = "../harness-hosting", features = ["test-support"] }
acyclic-actors = { version = "=0.2.0", path = "../actors", features = ["conformance"] }
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
# Hooks record under cfg(test) too, so lib tests observe them without test-support.
acyclic-differential = { version = "=0.2.0", path = "../differential" }
acyclic-harness-control-checks = { path = "../harness-control-checks" }
proptest.workspace = true
diffy.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["test-support"] }
rcgen = "0.14.10"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["serialize"] }
tracing-subscriber.workspace = true
loom = { version = "0.7.3", features = ["futures"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
tempfile = "3.27.0"
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "process", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["AbortController", "AbortSignal", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "RequestCredentials", "RequestInit", "RequestRedirect", "Response"] }
# Rust SDK execution uses the real browser event loop even without exports.
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true
