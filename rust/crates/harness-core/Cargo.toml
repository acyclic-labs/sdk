[package]
include = ["clippy.toml", "Cargo.toml", "build.rs", "src/**", "proto/**", "docs/**", "tests/**", "examples/**"]
autotests = false
autobins = false
autoexamples = false
name = "acyclic-harness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Runtime, contracts and storage behind the acyclic-harness facade"
documentation = "https://docs.rs/acyclic-harness-core"
build = "build.rs"

[[example]]
name = "agent-record-corpus"
path = "examples/agent-record-corpus.rs"

[[example]]
name = "experiment-analysis"
path = "examples/experiment-analysis.rs"

[[example]]
name = "history-codec-corpus"
path = "examples/history-codec-corpus.rs"
required-features = ["test-support"]

[[test]]
name = "main"
path = "tests/main.rs"

[features]
research = ["acyclic-observability/research"]
provenance-export = ["metrics-export", "dep:oxrdf", "dep:oxttl"]
metrics-export = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:parquet"]
conformance = ["acyclic-stream/conformance", "acyclic-objects/conformance", "acyclic-machines/conformance"]
test-support = ["acyclic-auth/test-support", "acyclic-machines/test-support", "acyclic-actors/test-support", "acyclic-stream/test-support", "dep:acyclic-differential", "acyclic-native-runtime/test-support", "acyclic-objects/test-support", "acyclic-fs/test-support"]
model-checking = ["acyclic-mcp/model-checking", "dep:loom", "dep:same-file", "acyclic-fs/model-checking"]
browser = ["wasm", "acyclic-fs/browser", "acyclic-model-render/browser"]
wasm = ["acyclic-stream/wasm", "dep:tsify"]

[dependencies]
tar = { version = "=0.4.46", default-features = false }
acyclic-mcp = { version = "=0.2.0", path = "../mcp" }
oxrdf = { version = "=0.3.5", default-features = false, optional = true }
oxttl = { version = "=0.2.5", default-features = false, optional = true }
arrow-array = { version = "=60.1.0", optional = true }
arrow-schema = { version = "=60.1.0", optional = true }
arrow-ipc = { version = "=60.1.0", default-features = false, optional = true }
parquet = { version = "=60.1.0", default-features = false, features = ["arrow"], optional = true }
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
acyclic-host-platform = { version = "=0.2.0", path = "../host-platform" }
acyclic-model-render = { version = "=0.2.0", path = "../model-render" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
zeroize.workspace = true
once_cell = "1.21.3"
pin-project-lite = "0.2.17"
acyclic-differential = { version = "=0.2.0", path = "../differential", optional = true }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-collections = { version = "=0.2.0", path = "../collections" }
acyclic-contract-derive = { version = "=0.2.0", path = "../contract-derive" }
arrayvec = { version = "0.7.8", default-features = false }
async-trait.workspace = true
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
base64 = "=0.23.1"
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
httpdate = "1.0.3"
serde-wasm-bindgen.workspace = true
jsonschema.workspace = true
rmp-serde = "=1.3.1"
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
regex-lite = { version = "0.1.9" }
js-sys = { workspace = true }
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
schemars = "=1.2.3"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = { workspace = true }
ts-rs = "=12.0.1"
sse-stream.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time", "io-util"] }
uuid.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
acyclic-host-platform = { version = "=0.2.0", path = "../host-platform" }
dirs.workspace = true
blake3.workspace = true
prost-build.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-mcp = { version = "=0.2.0", path = "../mcp", features = ["stdio"] }
rmcp = { workspace = true, features = ["auth", "reqwest-tls-no-provider"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures", "parallel"] }
oxc_allocator = "=0.156.0"
oxc_codegen = { version = "=0.156.0", default-features = false }
oxc_parser = { version = "=0.156.0", default-features = false }
oxc_semantic = { version = "=0.156.0", default-features = false }
oxc_span = "=0.156.0"
oxc_transformer = { version = "=0.156.0", default-features = false }
acyclic-observability = { version = "=0.2.0", path = "../observability" }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
dirs = { workspace = true }
tempfile = { version = "3.27.0" }
getrandom = { workspace = true }
loom = { version = "=0.7.3", optional = true }
same-file = { version = "1.0.6", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { version = "1.48.0", default-features = false, features = ["signal", "io-std", "io-util", "process"] }

[dev-dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
# Hooks record under cfg(test) too, so lib tests observe them without test-support.
acyclic-differential = { version = "=0.2.0", path = "../differential" }
proc-macro2 = "=1.0.107"
syn = { version = "=3.0.9", features = ["full", "visit"] }
proptest.workspace = true
diffy.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["binary", "test-support"] }
rcgen = "0.14.10"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["serialize"] }
shuttle = "=0.9.8"
tracing-subscriber.workspace = true
loom = { version = "0.7.3", features = ["futures"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
tempfile = "3.27.0"
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "process", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["AbortController", "AbortSignal", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "RequestCredentials", "RequestInit", "RequestRedirect", "Response"] }
# Rust SDK execution uses the real browser event loop even without exports.
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true

