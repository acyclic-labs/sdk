[package]
include = ["clippy.toml", "Cargo.toml", "build.rs", "src/**", "proto/**", "docs/**", "tests/**"]
autotests = false
autobins = false
autoexamples = false
name = "acyclic-harness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Runtime, contracts and storage behind the acyclic-harness facade"
documentation = "https://docs.rs/acyclic-harness-core"
build = "build.rs"

[[test]]
name = "git_executor"
path = "tests/git_executor.rs"
required-features = ["filesystem-local", "native-execution"]

[[test]]
name = "mcp-loom"
path = "tests/mcp_loom.rs"

[[test]]
name = "memory-accounting-model"
path = "tests/memory_accounting_model.rs"
required-features = ["filesystem"]

[features]
tui = []
test-support = ["dep:tempfile", "dep:acyclic-test-support", "acyclic-stream/test-support", "acyclic-native-runtime/test-support", "acyclic-objects/test-support", "acyclic-fs/test-support"]
model-checking = ["dep:loom", "dep:same-file", "dep:tempfile", "acyclic-fs/model-checking"]
browser = ["wasm", "filesystem", "acyclic-fs/browser"]
# Native presentation only; this does not select providers or grant authority.
terminal = []
wasm = ["acyclic-stream/wasm", "dep:js-sys", "dep:tsify", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
# Provider adapters. Each pulls only its own SDK family.
filesystem = ["acyclic-fs/memory", "dep:hex", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
filesystem-local = ["filesystem", "acyclic-fs/local", "acyclic-stream/local", "dep:dirs", "dep:getrandom", "dep:tempfile"]
# Explicit native host composition; portable defaults never select it.
native-execution = ["filesystem", "acyclic-fs/native-mount", "hooks", "mcp-stdio"]
# Native lifecycle commands can also be embedded without filesystem mounts.
hooks = ["dep:regex-lite", "dep:toml"]
# Optional native HTTP I/O. Browser hosts implement the same portable boundary.
mcp-http = ["dep:reqwest", "dep:toml"]
mcp-stdio = ["tokio/process", "tokio/io-util", "dep:toml", "dep:which"]
search-http = ["dep:reqwest", "dep:keyring", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio-rustls", "tokio/net", "tokio/io-util"]
mcp-oauth = ["rmcp/auth", "rmcp/reqwest-tls-no-provider", "dep:rustls"]
objects = ["dep:acyclic-objects"]
machines = ["dep:acyclic-machines"]
grpc = ["acyclic-stream/grpc", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]

[dependencies]
once_cell = "1.21.3"
acyclic-actors = { version = "=0.2.0", path = "../actors" }
arrayvec = { version = "0.7.8", default-features = false }
async-trait.workspace = true
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-machines = { version = "=0.2.0", path = "../machines", optional = true }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, optional = true }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
base64 = "=0.22.1"
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex = { workspace = true, optional = true }
http.workspace = true
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
regex-lite = { version = "0.1.9", optional = true }
js-sys = { workspace = true, optional = true }
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
schemars = "=1.2.2"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = { workspace = true, optional = true }
sse-stream.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[build-dependencies]
dirs.workspace = true
blake3.workspace = true
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-test-support = { path = "../test-support", optional = true }
dirs = { workspace = true, optional = true }
tempfile = { version = "3.27.0", optional = true }
getrandom = { workspace = true, optional = true }
loom = { version = "=0.7.2", optional = true }
same-file = { version = "1.0.6", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true, optional = true }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { version = "0.1.3", optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"], optional = true }
keyring = { version = "3.6.3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
which = { version = "8.0.6", optional = true }
tokio = { version = "1.48.0", default-features = false, features = ["signal", "io-std", "io-util"] }

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
proc-macro2 = "=1.0.107"
syn = { version = "=3.0.6", features = ["full", "visit"] }
proptest.workspace = true
diffy.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-harness-core = { version = "=0.2.0", path = ".", features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["grpc"] }
rcgen = "0.14.10"
tonic.workspace = true
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["serialize"] }
shuttle = "=0.8.1"
tracing-subscriber.workspace = true
loom = "0.7.2"
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["local"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "process"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Rust SDK execution uses the real browser event loop even without exports.
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true

