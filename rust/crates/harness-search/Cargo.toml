[package]
include = ["clippy.toml", "Cargo.toml", "src/**"]
name = "acyclic-harness-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Provider-neutral web search behind the acyclic-harness facade"
documentation = "https://docs.rs/acyclic-harness-search"

[features]
test-support = ["acyclic-harness-core/test-support", "acyclic-fs/test-support", "acyclic-stream/test-support"]

[dependencies]
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
schemars = "=1.2.3"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time", "net", "io-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { workspace = true }
http-body-util = { version = "0.1.3" }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
proptest.workspace = true
jsonschema.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["test-support"] }
acyclic-stream = { version = "=0.2.0", path = "../stream" }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "process", "net", "io-util"] }

[lints]
workspace = true
