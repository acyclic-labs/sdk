[package]
name = "acyclic-fs-darwin-bridge"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Vendored C transport for the macOS filesystem adapter"

[package.metadata.bazel]
target-compatible-with = ["@platforms//os:macos"]
mounts-fuse = true
build-script-inputs = [
    "src/native_mount/darwin_mount_bridge.c",
    "src/native_mount/darwin_mount_owner.c",
    "src/native_mount/darwin_mount_owner.h",
    "src/native_mount/darwin_mount_owner_spawn.c",
    "../darwin-mount-retire/src/retirement.c",
    "vendor/darwinfuse",
]

[dependencies]
acyclic-darwin-mount-retire = { version = "=0.2.0", path = "../darwin-mount-retire" }

[build-dependencies]
cc = "1.2.56"

[features]
test-support = ["acyclic-darwin-mount-retire/test-support"]

[lints]
workspace = true
