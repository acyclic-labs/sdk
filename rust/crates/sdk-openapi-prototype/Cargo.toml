[package]
name = "sdk-openapi-prototype"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prototype OpenAPI projection derived from Rust-owned contract models and routes"

# This keeps the experiment standalone without editing the product workspace.
[workspace]

[dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "sdk-openapi"
path = "src/main.rs"
