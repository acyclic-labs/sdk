[package]
name = "sdk-openapi-prototype"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prototype OpenAPI projection derived from the Rust-owned Actors descriptor and routes"

# This keeps the experiment standalone without editing the product workspace.
[workspace]

[dependencies]
acyclic-actors = { path = "../actors" }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "sdk-openapi"
path = "src/main.rs"
