[package]
name = "acyclic-cloudflare-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Unchanged Stream and AgentHost suites inside workerd"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
acyclic-agent-host-conformance = { path = "../agent-host" }
acyclic-actors = { path = "../../actors" }
acyclic-stream = { path = "../../stream", default-features = false, features = ["wasm-journal", "wasm"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
