[package]
name = "acyclic-cloudflare-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Unchanged Stream and AgentHost suites inside workerd"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
acyclic-agent-host-conformance = { path = "../agent-host" }
acyclic-actors = { path = "../../actors" }
acyclic-auth = { path = "../../auth", features = ["test-support"] }
acyclic-harness-core = { path = "../../harness-core", features = ["filesystem"] }
acyclic-harness-client = { path = "../../harness-client", features = ["wasm"] }
acyclic-fs = { path = "../../filesystem", default-features = false }
acyclic-stream = { path = "../../stream", default-features = false, features = ["wasm-journal", "wasm"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
bytes.workspace = true
futures.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
