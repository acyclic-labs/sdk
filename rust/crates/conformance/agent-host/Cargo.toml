[package]
name = "acyclic-agent-host-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Portable black-box AgentHost conformance vectors"

[features]
local = ["acyclic-stream/local", "dep:tempfile", "dep:reqwest"]
browser = ["acyclic-stream/wasm"]

[dependencies]
acyclic-actors = { path = "../../actors" }
acyclic-harness-core = { path = "../../harness-core", features = ["filesystem", "oidc"] }
acyclic-fs = { path = "../../filesystem", default-features = false, features = ["memory"] }
acyclic-stream = { path = "../../stream", default-features = false }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde_json.workspace = true
base64 = "=0.22.1"
ed25519-dalek = "3.0.0"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
sha2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { version = "3.27.0", optional = true }
reqwest = { workspace = true, optional = true }
acyclic-native-runtime = { path = "../../native-runtime" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
uuid.workspace = true

[lints]
workspace = true

[[bin]]
name = "oidc-qualify"
path = "src/bin/oidc_qualify.rs"
required-features = ["local"]
