[package]
name = "acyclic-agent-host-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Portable black-box AgentHost conformance vectors"

[features]
local = ["acyclic-stream/local", "dep:tempfile"]
browser = ["acyclic-stream/wasm"]

[dependencies]
acyclic-actors = { path = "../../actors" }
acyclic-harness-core = { path = "../../harness-core", features = ["filesystem"] }
acyclic-fs = { path = "../../filesystem", default-features = false, features = ["memory"] }
acyclic-stream = { path = "../../stream", default-features = false }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { version = "3.27.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
uuid.workspace = true

[lints]
workspace = true
