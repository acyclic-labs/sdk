[package]
autotests = false
name = "acyclic-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal black-box conformance suites for Acyclic service providers"
readme = "README.md"

[package.metadata.bazel]
integration-test-shards = 3
test-without-package-binaries = ["main"]

[package.metadata.bazel.test-tools.main]
acyclic = "//plugin:acyclic"
graphcoder-seams = ":graphcoder-seams"
harness-conformance = ":harness-conformance"
qualify = ":qualify"

[features]
local-hotpath = []
local-hotpath-proofs = ["local-hotpath", "acyclic-stream/test-support"]
inference = ["dep:acyclic-harness-providers"]
client-session = ["dep:acyclic-harness-client"]
actors-hosting = ["client-session", "acyclic-harness/conformance", "dep:acyclic-auth"]
storage-backends = ["acyclic-fs/conformance", "dep:acyclic-harness-client", "dep:acyclic-auth", "dep:tempfile", "dep:object_store", "dep:async-trait", "dep:rustls"]
harness-accounting = []
local-runner = ["dep:tempfile", "dep:rusqlite", "dep:notify"]
# Drives a built `graphcoder` binary against the local harness, its
# self-hosted endpoint, and the same server through injected seams
# (`graphcoder-seams`; see tests/graphcoder_backends.rs).
graphcoder-backends = ["dep:acyclic-auth", "dep:axum", "dep:tempfile", "dep:acyclic-plugin", "acyclic-native-runtime/test-support"]

[dependencies]
acyclic-fs-format = { version = "=0.2.0", path = "../filesystem-format" }
acyclic-fs-native-contract = { version = "=0.2.0", path = "../filesystem-native-contract" }
acyclic-fs-work = { version = "=0.2.0", path = "../filesystem-work" }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-agent-host-conformance = { path = "agent-host" }
acyclic-auth = { version = "=0.2.0", path = "../auth", optional = true }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", default-features = false, features = ["conformance"] }
acyclic-harness-providers = { version = "=0.2.0", path = "../harness-providers", features = ["endpoint-presets"], optional = true }
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"], optional = true }
rustls = { workspace = true, optional = true }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", features = ["conformance"] }
acyclic-harness = { version = "=0.2.0", path = "../harness" }
acyclic-harness-client = { version = "=0.2.0", path = "../harness-client", optional = true }
acyclic-machines-conformance = { version = "=0.2.0", path = "../machines-conformance" }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
acyclic-objects = { version = "=0.2.0", path = "../objects", features = ["conformance"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["conformance"] }
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
acyclic-plugin = { path = "../../../plugin", optional = true }
bytes.workspace = true
futures.workspace = true
blake3.workspace = true
hex.workspace = true
prost.workspace = true
sha2.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tempfile = { version = "3.27.0", optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
notify = { workspace = true, optional = true }

[[bin]]
name = "graphcoder-seams"
test = false
path = "src/bin/graphcoder_seams.rs"
required-features = ["graphcoder-backends"]

[[bin]]
name = "harness-conformance"
path = "src/bin/harness_conformance.rs"
test = false

[[bin]]
name = "inference-qualify"
path = "src/bin/inference_qualify.rs"
test = false
required-features = ["inference"]

[[bin]]
name = "qualify"
path = "src/bin/qualify.rs"
test = false
required-features = ["local-runner"]

[[bin]]
name = "storage-conformance"
test = false
required-features = ["storage-backends"]

[[bin]]
name = "native-mount-qualify"
path = "src/bin/native_mount_qualify.rs"
required-features = ["local-runner"]

[[bench]]
name = "write_validation"
harness = false
required-features = ["local-runner"]

[[bench]]
name = "local_hotpath"
harness = false
required-features = ["local-hotpath"]

[[bench]]
name = "native_observation"
harness = false
required-features = ["local-runner"]

[[bin]]
name = "dependency_vectors"
test = false

[[bin]]
name = "targeted_interaction_corpus"
test = false

[[bin]]
name = "workload_corpus"
test = false

[[bin]]
name = "workload_manifest"
test = false

[[bin]]
name = "workload_select"
test = false

[lints]
workspace = true

[[bin]]
name = "client-conformance"
test = false
required-features = ["client-session"]

[dev-dependencies]
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-observability = { version = "=0.2.0", path = "../observability", features = ["research"] }
acyclic-test-support = { path = "../test-support" }
divan.workspace = true
tempfile = "3.27.0"
tracing.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[bin]]
name = "client-fixture-conformance"
test = false
required-features = ["client-session"]

