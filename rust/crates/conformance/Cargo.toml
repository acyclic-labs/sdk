[package]
name = "acyclic-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal black-box conformance suites for Acyclic service providers"
readme = "README.md"

[features]
inference = ["dep:acyclic-harness-providers"]
client-session = ["acyclic-harness-client/grpc", "acyclic-stream/grpc"]
storage-backends = ["acyclic-objects/s3", "acyclic-stream/postgres", "acyclic-fs/conformance", "acyclic-stream/local", "acyclic-harness/serve", "dep:acyclic-harness-client", "dep:acyclic-auth", "dep:tempfile", "dep:object_store", "dep:async-trait", "dep:rustls"]
harness-accounting = ["acyclic-harness/filesystem"]
local-runner = ["acyclic-harness/filesystem-local", "acyclic-harness/native-execution", "acyclic-fs/local", "acyclic-fs/native-mount", "acyclic-objects/local", "acyclic-stream/local", "dep:tempfile", "dep:rusqlite", "dep:notify"]
s3-fixture = ["local-runner", "acyclic-fs/s3-http", "dep:async-trait", "dep:axum", "dep:s3s"]
# Drives a built `graphcoder` binary against the local harness, its
# self-hosted endpoint, and the same server through injected seams
# (`graphcoder-seams`; see tests/graphcoder_backends.rs).
graphcoder-backends = ["dep:acyclic-auth", "dep:axum", "dep:tempfile", "dep:graphcoder", "acyclic-harness/serve", "acyclic-native-runtime/test-support"]

[dependencies]
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-agent-host-conformance = { path = "agent-host" }
acyclic-auth = { version = "=0.2.0", path = "../auth", optional = true }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", default-features = false, features = ["conformance"] }
acyclic-harness-providers = { version = "=0.2.0", path = "../harness-providers", features = ["endpoint-presets"], optional = true }
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"], optional = true }
rustls = { workspace = true, optional = true }
acyclic-fs = { version = "=0.2.0", path = "../filesystem" }
acyclic-harness = { version = "=0.2.0", path = "../harness" }
acyclic-harness-client = { version = "=0.2.0", path = "../harness-client", optional = true }
acyclic-machines = { version = "=0.2.0", path = "../machines", features = ["conformance"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
acyclic-objects = { version = "=0.2.0", path = "../objects", features = ["conformance"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["conformance"] }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
graphcoder = { path = "../harness/src/bin/graphcoder", optional = true }
bytes.workspace = true
futures.workspace = true
blake3.workspace = true
hex.workspace = true
prost.workspace = true
sha2.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tempfile = { version = "3.27.0", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
notify = { workspace = true, optional = true }
s3s = { workspace = true, optional = true }

[[test]]
name = "graphcoder_backends"
path = "tests/graphcoder_backends.rs"
required-features = ["graphcoder-backends"]

[[bin]]
name = "graphcoder-seams"
test = false
path = "src/bin/graphcoder_seams.rs"
required-features = ["graphcoder-backends"]

[[bin]]
name = "inference-qualify"
path = "src/bin/inference_qualify.rs"
required-features = ["inference"]

[[bin]]
name = "qualify"
test = false
path = "src/bin/qualify.rs"
required-features = ["local-runner"]

[[bin]]
name = "storage-conformance"
test = false
required-features = ["storage-backends"]

[[bin]]
name = "native-mount-qualify"
path = "src/bin/native_mount_qualify.rs"
required-features = ["local-runner"]

[[bin]]
name = "bench-fs"
path = "src/bin/bench_fs.rs"
required-features = ["local-runner"]

[[bin]]
name = "bench-objects"
test = false
path = "src/bin/bench_objects.rs"
required-features = ["local-runner"]

[[bench]]
name = "harness"
harness = false
required-features = ["local-runner"]

[[bench]]
name = "client_demand"
harness = false
required-features = ["local-runner"]

[[bench]]
name = "write_validation"
harness = false
required-features = ["local-runner"]

[[bench]]
name = "native_observation"
harness = false
required-features = ["local-runner"]

[[bin]]
name = "s3-fixture"
test = false
path = "src/bin/s3_fixture.rs"
required-features = ["s3-fixture"]

[[bin]]
name = "dependency_vectors"
test = false

[[bin]]
name = "targeted_interaction_corpus"
test = false

[[bin]]
name = "workload_corpus"
test = false

[[bin]]
name = "workload_manifest"
test = false

[[bin]]
name = "workload_select"
test = false

[lints]
workspace = true

[[bin]]
name = "client-conformance"
test = false
required-features = ["client-session"]

[dev-dependencies]
divan.workspace = true
tempfile = "3.27.0"
tracing.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "inference"
path = "tests/inference.rs"
required-features = ["inference"]
