[package]
name = "acyclic-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal black-box conformance suites for Acyclic service providers"
readme = "README.md"

[features]
local-runner = ["acyclic-fs/local", "acyclic-fs/native-mount", "acyclic-objects/local", "acyclic-stream/local", "dep:tempfile", "dep:rusqlite", "dep:notify"]
s3-fixture = ["local-runner", "acyclic-fs/s3-http", "dep:async-trait", "dep:axum", "dep:s3s"]

[dependencies]
acyclic-fs = { version = "=0.1.5", path = "../filesystem" }
acyclic-harness = { version = "=0.1.5", path = "../harness" }
acyclic-machines = { version = "=0.1.5", path = "../machines" }
acyclic-native-runtime = { version = "=0.1.5", path = "../native-runtime" }
acyclic-objects = { version = "=0.1.5", path = "../objects" }
acyclic-stream = { version = "=0.1.5", path = "../stream" }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes.workspace = true
futures.workspace = true
blake3.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tempfile = { version = "3.27.0", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
notify = { workspace = true, optional = true }
s3s = { workspace = true, optional = true }

[[bin]]
name = "qualify"
path = "src/bin/qualify.rs"
required-features = ["local-runner"]

[[bin]]
name = "native-mount-qualify"
path = "src/bin/native_mount_qualify.rs"
required-features = ["local-runner"]

[[bin]]
name = "bench-fs"
path = "src/bin/bench_fs.rs"
required-features = ["local-runner"]

[[bin]]
name = "bench-objects"
path = "src/bin/bench_objects.rs"
required-features = ["local-runner"]

[[bin]]
name = "s3-fixture"
path = "src/bin/s3_fixture.rs"
required-features = ["s3-fixture"]

[lints]
workspace = true
