version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Filesystem workload taxonomy, corpus selection, and conformance vectors"

[dependencies]
acyclic-fs = { version = "=0.2.0", path = "../../filesystem", default-features = false }
