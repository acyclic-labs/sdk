[package]
name = "acyclic-native-runtime"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native file and process primitives shared by Acyclic host consumers"
readme = "README.md"
exclude = ["benches"]
documentation = "https://docs.rs/acyclic-native-runtime"
keywords = ["filesystem", "io", "runtime"]
categories = ["filesystem"]

[[bench]]
name = "native_runtime"
harness = false

[features]
account-holder = ["dep:base64", "dep:ed25519-dalek", "dep:serde", "dep:serde_json", "dep:thiserror"]
customer-custody = ["account-holder", "dep:getrandom", "dep:sha2", "dep:zeroize", "dep:security-framework", "dep:secret-service"]

[dependencies]
bytes.workspace = true
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.12.5", default-features = false, features = ["io-uring"] }
libc = "0.2.175"
secret-service = { version = "=5.0.0", default-features = false, features = ["rt-async-io-crypto-rust"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.175"
rustix.workspace = true
security-framework = { version = "=3.7.0", optional = true }

[target.'cfg(windows)'.dependencies]
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.12.5", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
divan.workspace = true
tempfile = "3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing.workspace = true
getrandom = { version = "=0.3.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
