[package]
name = "acyclic-native-runtime"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native file and process primitives shared by Acyclic host consumers"
documentation = "https://docs.rs/acyclic-native-runtime"
keywords = ["filesystem", "io", "runtime"]
categories = ["filesystem"]

[[bin]]
name = "acyclic-process-host"
path = "src/bin/acyclic-process-host.rs"
test = false
bench = false

[features]
test-support = ["tokio/macros", "tokio/time", "tokio/test-util"]

[dependencies]
acyclic-host-platform = { version = "=0.2.0", path = "../host-platform" }
bytes.workspace = true
blake3.workspace = true
subtle.workspace = true
getrandom = { workspace = true, features = ["std"] }
zeroize.workspace = true
serde.workspace = true
# The owned-task API (`spawn`, `spawn_blocking`) is part of every build.
tokio = { version = "1.48.0", default-features = false, features = ["rt", "sync"] }
tokio-util = { workspace = true, features = ["codec"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = { version = "0.2.5", features = ["std"] }
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.12.5", default-features = false, features = ["io-uring"] }
libc = "0.2.175"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.175"
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.12.5", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
acyclic-test-support = { path = "../test-support", features = ["source-catalog"] }
tempfile = "3.27.0"
loom = "=0.7.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
futures-core = "0.3.31"
pin-project-lite = "0.2.17"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
acyclic-test-support = { path = "../test-support", features = ["source-catalog"] }
proptest.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
