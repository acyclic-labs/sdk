[package]
name = "acyclic-native-runtime"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native file and process primitives shared by Acyclic host consumers"
documentation = "https://docs.rs/acyclic-native-runtime"
keywords = ["filesystem", "io", "runtime"]
categories = ["filesystem"]

[dependencies]
bytes.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.12.5", default-features = false, features = ["io-uring"] }
libc = "0.2.175"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.175"
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.12.5", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-core = "0.3.31"
pin-project-lite = "0.2.17"
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
