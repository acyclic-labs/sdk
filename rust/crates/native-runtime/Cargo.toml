[package]
name = "acyclic-native-runtime"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native file primitives shared by Acyclic local providers"
readme = "README.md"
documentation = "https://docs.rs/acyclic-native-runtime"
keywords = ["filesystem", "io", "runtime"]
categories = ["filesystem"]

[dependencies]
bytes.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.11.1", default-features = false, features = ["io-uring"] }
libc = "0.2.175"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.175"
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
compio-buf = { version = "=0.8.3", features = ["bytes"] }
compio-driver = { version = "=0.11.1", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
