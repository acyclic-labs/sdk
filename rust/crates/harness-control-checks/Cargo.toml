[package]
name = "acyclic-harness-control-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Correspondence of harness production control, solver and trace sources"

[features]
repository-checks = ["dep:acyclic-harness-control", "dep:acyclic-test-support", "dep:syn"]

[dependencies]
acyclic-harness-control = { path = "../harness-control", features = ["test-support"], optional = true }
acyclic-test-support = { path = "../test-support", optional = true }
syn = { version = "=3.0.9", features = ["full", "visit"], optional = true }

[dev-dependencies]
acyclic-harness-control = { path = "../harness-control", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
syn = { version = "=3.0.9", features = ["full", "visit"] }

[lints]
workspace = true
