[package]
name = "acyclic-test-runner"
description = "Runs each libtest case in its own process under a time limit, for Bazel test actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
acyclic-process-resources = { version = "=0.2.0", path = "../process-resources" }

[target.'cfg(target_os = "macos")'.dependencies]
acyclic-darwin-mount-retire = { version = "=0.2.0", path = "../darwin-mount-retire" }

[lints]
workspace = true
