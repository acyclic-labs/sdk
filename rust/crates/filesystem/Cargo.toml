[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
autotests = false
name = "acyclic-fs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and embedded native mounts"
readme = "README.md"
documentation = "https://docs.rs/acyclic-fs"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

# Tests that reach the FUSE mounts run outside Bazel's linux-sandbox.
[package.metadata.bazel]
mounts-fuse = true
share-separate-deps = true
unit-test-only-sources = [
    "src/access/fixtures.rs",
    "src/access/trie/shared/tests.rs",
    "src/async_storage/work/frame/tests.rs",
    "src/collection/tests.rs",
    "src/core_state/group/tests/**",
    "src/core_state/tests/**",
    "src/demand/admissions_tests.rs",
    "src/demand/computed_tests.rs",
    "src/distributed/append/group_tests.rs",
    "src/distributed/composition/append/tests/**",
    "src/distributed/state_tests.rs",
    "src/distributed/tests.rs",
    "src/distributed/tests/**",
    "src/facade/test_fixtures.rs",
    "src/git_compat/stream_store/tests.rs",
    "src/git_compat/tests/**",
    "src/heap_future/frame_tests.rs",
    "src/kernel/rebase/tests/**",
    "src/kernel/tests/**",
    "src/lazy_workspace/hash_tests.rs",
    "src/lazy_workspace/tests/**",
    "src/lineage/tests.rs",
    "src/logical_objects/sealing/tests.rs",
    "src/logical_objects/tests.rs",
    "src/materializer/directory_preparation/tests.rs",
    "src/materializer/window/tests.rs",
