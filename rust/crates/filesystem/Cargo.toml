[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
autotests = false
name = "acyclic-fs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and embedded native mounts"
readme = "README.md"
documentation = "https://docs.rs/acyclic-fs"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

# Tests that reach the FUSE mounts run outside Bazel's linux-sandbox.
[package.metadata.bazel]
integration-test-shards = 16
mounts-fuse = true
share-separate-deps = true
linked-unit-tests = ["acyclic_fs_test_facade_recovery", "acyclic_fs_test_facade_rounds", "acyclic_fs_test_host_fsevents_stress", "fs_concurrency_bench", "accounting", "facade", "checkout", "codec", "engine", "git", "native", "wire", "workspace"]
test-narrow-runfiles = ["acyclic_fs_test_facade_recovery", "acyclic_fs_test_facade_rounds", "acyclic_fs_test_host_fsevents_stress", "fs_concurrency_bench", "accounting", "facade"]
test-without-build-script = ["acyclic_fs_test_facade_recovery", "acyclic_fs_test_facade_rounds", "acyclic_fs_test_host_fsevents_stress", "fs_concurrency_bench", "accounting", "facade"]
unit-test-only-sources = [
    "src/access/trie/shared/tests.rs",
    "src/async_storage/work/frame/tests.rs",
    "src/collection/tests.rs",
    "src/core_state/group/tests/**",
    "src/core_state/tests/**",
    "src/demand/computed_tests.rs",
    "src/distributed/append/group_tests.rs",
    "src/distributed/composition/append/tests/**",
    "src/distributed/state_tests.rs",
    "src/distributed/tests.rs",
    "src/distributed/tests/**",
    "src/facade/test_fixtures.rs",
    "src/git_compat/stream_store/tests.rs",
    "src/git_compat/tests/**",
    "src/heap_future/frame_tests.rs",
    "src/kernel/rebase/tests/**",
    "src/kernel/tests/**",
    "src/lazy_workspace/hash_tests.rs",
    "src/lazy_workspace/tests/**",
    "src/ledger/admissions_tests.rs",
    "src/ledger/window/tests.rs",
    "src/lineage/tests.rs",
    "src/logical_objects/sealing/tests.rs",
    "src/logical_objects/tests.rs",
    "src/materializer/directory_preparation/tests.rs",
    "src/multi_root/tests/**",
    "src/native_mount/adapter/tests/**",
    "src/native_mount/fixture_access.rs",
    "src/native_mount/lazy/tests/**",
    "src/native_mount/materialize/tests/**",
    "src/native_mount/tests/**",
    "src/native_name/encoding/tests.rs",
    "src/operation_window/streams/tests.rs",
    "src/operation_window/tests/**",
    "src/publication_changes/entry/tests.rs",
    "src/s3_http/tests.rs",
    "src/s3/access_tests.rs",
    "src/simulation/native_write_controls.rs",
    "src/speculation/tests/**",
    "src/staged_objects/tests/**",
    "src/tests/**",
    "src/wire_service/access_tests.rs",
    "src/wire_service/errors/tests.rs",
    "src/wire_service/metadata_tests.rs",
    "src/wire_service/mount_fixture.rs",
    "src/wire_service/mount_tests.rs",
    "src/wire_service/tests.rs",
    "src/workspace/access_tests.rs",
    "src/workspace/accounting_tests.rs",
    "src/workspace/read_core/tests.rs",
    "src/workspace/retention_accounting_tests.rs",
    "src/workspace/test_work.rs",
    "tests/support/**",
]
build-script-inputs = []


[package.metadata.bazel.platform-sources]
"@platforms//os:linux" = ["src/native_mount/fuse/**/*.rs"]
"@platforms//os:macos" = ["src/fsevents/**/*.rs", "src/native_mount/darwin_mount/**/*.rs"]
"@platforms//os:windows" = [
    "src/native_mount/projfs/**/*.rs",
    "src/windows_usn.rs",
    "tests/cases/projfs_metadata/metadata/client.rs",
    "tests/projfs_metadata_support.rs",
]

[package.metadata.bazel.test-tools.acyclic_fs_test]
rustc = "@sdk_compilers//:rustc"
rustup = "@sdk_compilers//:rustup"

[package.metadata.bazel.test-data-linux.acyclic_fs_test_internal]
kernel = "//guest:kernel"
initramfs = "//guest:initramfs.gz"
cloud_hypervisor = "//guest:cloud-hypervisor"
provenance = "//guest:provenance.json"

[package.metadata.bazel.test-env-linux.acyclic_fs_test_internal]
ACYCLIC_FS_GUEST_ARTIFACTS = "$(rootpath //guest:provenance.json)"
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[package.metadata.bazel.test-dependencies]
acyclic_fs_test_facade_recovery = ["acyclic_fs", "acyclic_fs_format", "acyclic_fs_test_support", "acyclic_stream", "bytes", "tokio"]
acyclic_fs_test_facade_rounds = ["acyclic_fs", "acyclic_fs_format", "acyclic_fs_test_support", "acyclic_fs_work", "acyclic_stream", "futures", "hex", "tokio"]
acyclic_fs_test_host_fsevents_stress = ["acyclic_fs", "tempfile"]
fs_concurrency_bench = ["acyclic_fs", "acyclic_fs_format", "acyclic_fs_work", "acyclic_objects", "acyclic_stream", "futures", "hex", "serde_json", "tokio"]
accounting = ["acyclic_fs", "acyclic_fs_format", "acyclic_fs_work", "acyclic_native_runtime", "acyclic_objects", "acyclic_stream", "bytes", "futures", "hex", "proptest", "tempfile", "tokio"]
facade = ["acyclic_collections", "acyclic_fs", "acyclic_fs_format", "acyclic_fs_test_support", "acyclic_fs_work", "acyclic_native_runtime", "acyclic_objects", "acyclic_stream", "bytes", "futures", "hex", "proptest", "tempfile", "tokio"]


