[package]
name = "acyclic-fs"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and embedded native mounts"
readme = "README.md"
documentation = "https://docs.rs/acyclic-fs"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

[dependencies]
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
diffy.workspace = true
futures.workspace = true
hex.workspace = true
notify = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
uuid.workspace = true
acyclic-objects = { version = "=0.1.1", path = "../objects", optional = true, default-features = false }
acyclic-stream = { version = "=0.1.1", path = "../stream", optional = true, default-features = false }
base64 = { version = "0.22.1", optional = true }
crc-fast = { version = "1.10.0", optional = true }

[dev-dependencies]
axum.workspace = true
hmac = "0.12.1"
http.workspace = true
rcgen = "0.14.10"
sha2.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-stream.workspace = true
tower = { workspace = true, features = ["util"] }

[build-dependencies]
prost.workspace = true
prost-types.workspace = true
tonic-prost-build.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18.0", default-features = false, optional = true }
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2.56"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-native-runtime = { version = "=0.1.1", path = "../native-runtime" }
cap-primitives = "4.0.3"
cap-fs-ext = "4.0.2"
cap-std = "4.0.3"
fs2 = { workspace = true, optional = true }
prost.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
tonic.workspace = true
tonic-prost.workspace = true
serde_urlencoded = { workspace = true, optional = true }
s3s = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
sync_wrapper = { workspace = true, optional = true }
time = { workspace = true, optional = true }
urlencoding = { version = "2.1.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_Storage_ProjectedFileSystem",
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
] }

[features]
default = ["local", "memory", "native-watch", "native-mount"]
local = ["distributed", "acyclic-objects/local", "acyclic-stream/local", "dep:fs2"]
memory = ["distributed"]
native-watch = ["dep:notify", "dep:tokio"]
native-mount = ["native-watch", "dep:fuser"]
s3-http = ["dep:base64", "dep:crc-fast", "dep:s3s", "dep:serde_urlencoded", "dep:subtle", "dep:sync_wrapper", "dep:time", "dep:urlencoding"]
distributed = ["dep:acyclic-objects", "dep:acyclic-stream"]

[lints]
workspace = true

[[example]]
name = "embedded_workspace"
required-features = ["local"]
