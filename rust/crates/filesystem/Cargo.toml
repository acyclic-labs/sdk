[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
autotests = false
name = "acyclic-fs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and embedded native mounts"
readme = "README.md"
documentation = "https://docs.rs/acyclic-fs"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "browser_commit"
path = "tests/browser_commit.rs"
required-features = ["browser"]

[[test]]
name = "browser_blob_custody"
path = "tests/browser_blob_custody.rs"
required-features = ["browser"]

[[bench]]
name = "lease_paths"
harness = false

[[bench]]
name = "lease_paths_alloc"
harness = false

[[bench]]
name = "filesystem"
harness = false

[[bench]]
name = "filesystem_alloc"
harness = false

[[bench]]
name = "native_capture"
harness = false
[dependencies]
acyclic-collections = { version = "=0.2.0", path = "../collections" }
acyclic-fs-wire = { version = "=0.2.0", path = "../filesystem-wire" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-fs-base = { version = "=0.2.0", path = "../filesystem-base" }
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
ed25519-dalek = "=3.0.0"
hex.workspace = true
parking_lot.workspace = true
pin-project-lite = "0.2.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
prost.workspace = true
unicode-normalization.workspace = true
icu_casemap.workspace = true
writeable.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
base64 = { version = "0.23.1" }
crc-fast = { version = "1.10.0" }

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["test-support"] }
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
divan.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
proptest.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
loom = { version = "=0.7.3", features = ["checkpoint"] }
vhost = { version = "0.18.0", features = ["vhost-user-frontend"] }

[build-dependencies]
icu_casemap.workspace = true
cc = "1.2.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"
loom = { version = "0.7.3", optional = true }
tempfile = { version = "3.27.0" }

[target.'cfg(target_os = "linux")'.dependencies]
indexmap = "=2.14.2"
fuser = { version = "=0.18.0", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["fs", "user", "mount"] }
rustix = { workspace = true, features = ["fs", "net"] }
vhost = { version = "0.18.0", features = ["vhost-user-backend"] }
vmm-sys-util = "0.15.0"
virtio-queue = "0.18.0"
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2.56"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser builds always run shared publication groups on the event-loop executor.
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["wasm"] }
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
indexed_db_futures.workspace = true
js-sys.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }
dirs = { workspace = true }
acyclic-observability = { version = "=0.2.0", path = "../observability" }
loom = { version = "=0.7.3", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
cap-primitives = "4.0.3"
cap-fs-ext = "4.0.2"
cap-std = "4.0.3"
tokio = { workspace = true, features = ["rt", "sync"] }
tonic.workspace = true
tonic-prost.workspace = true
serde_urlencoded = { workspace = true }
s3s = { workspace = true }
subtle = { workspace = true }
sync_wrapper = { workspace = true }
time = { workspace = true }
tracing.workspace = true
urlencoding = { version = "2.1.3" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Storage_FileSystem",
  "Win32_Storage_ProjectedFileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming"] }


[features]
tooling = []
conformance = ["acyclic-stream/conformance", "acyclic-objects/conformance"]
test-support = ["acyclic-auth/test-support", "acyclic-native-runtime/test-support", "acyclic-stream/test-support", "acyclic-objects/test-support", "bytes/serde"]
fuzzing = ["acyclic-native-runtime/test-support"]
model-checking = ["dep:loom", "acyclic-stream/model-checking"]
browser = ["acyclic-stream/wasm", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
typescript = ["dep:tsify", "dep:wasm-bindgen"]
napi-types = ["dep:napi", "dep:napi-derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects" }
loom = "0.7.3"
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
axum.workspace = true
hmac = "0.13.0"
http.workspace = true
rcgen = "0.14.10"
rustls.workspace = true
sha2.workspace = true
tempfile = "3.27.0"
tokio-stream.workspace = true
tower = { workspace = true, features = ["util"] }


[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }

[lints]
workspace = true

[[example]]
name = "embedded_workspace"

[[example]]
name = "capture_merge_directory"

[[example]]
name = "bench-fs"

[[example]]
name = "record_cloud_contract"

[[bench]]
name = "projfs_paths"
path = "benches/projfs_paths.rs"
harness = false

[[bench]]
name = "object_batches"
harness = false

[[bench]]
name = "object_batches_alloc"
harness = false

[[example]]
name = "filesystem-contracts"
required-features = ["tooling"]
