[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
autotests = false
name = "acyclic-fs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and embedded native mounts"
readme = "README.md"
documentation = "https://docs.rs/acyclic-fs"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

[[test]]
name = "main"
path = "tests/main.rs"

[[bench]]
name = "lease_paths"
harness = false
required-features = ["memory"]

[[bench]]
name = "lease_paths_alloc"
harness = false
required-features = ["memory"]

[[test]]
name = "native_binding_model"
path = "tests/native_binding_model.rs"
required-features = ["native-mount"]

[[test]]
name = "native_stage_loom"
path = "tests/native_stage_loom.rs"
required-features = ["native-mount"]

[[bench]]
name = "filesystem"
harness = false
required-features = ["local", "memory", "native-watch"]

[[bench]]
name = "filesystem_alloc"
harness = false
required-features = ["local", "memory", "native-watch"]

[[bench]]
name = "native_capture"
harness = false
required-features = ["memory", "native-watch", "native-mount"]

[dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-fs-base = { version = "=0.2.0", path = "../filesystem-base" }
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
notify = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
prost.workspace = true
unicode-normalization.workspace = true
icu_casemap.workspace = true
writeable.workspace = true
thiserror.workspace = true
uuid.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", optional = true, default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
base64 = { version = "0.23.1", optional = true }
crc-fast = { version = "1.10.0", optional = true }

[dev-dependencies]
divan.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
proptest.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
loom = { version = "=0.7.2", features = ["checkpoint"] }

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
icu_casemap.workspace = true
cc = "1.2.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"
loom = { version = "0.7.2", optional = true }
tempfile = { version = "3.27.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false, optional = true }
nix = { version = "0.31.3", default-features = false, features = ["fs", "user", "mount"], optional = true }
rustix = { workspace = true, features = ["fs", "net"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2.56"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
indexed_db_futures.workspace = true
js-sys.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
loom = { version = "=0.7.2", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
cap-primitives = "4.0.3"
cap-fs-ext = "4.0.2"
cap-std = "4.0.3"
fs2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tonic.workspace = true
tonic-prost.workspace = true
serde_urlencoded = { workspace = true, optional = true }
s3s = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
sync_wrapper = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tracing.workspace = true
urlencoding = { version = "2.1.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Storage_FileSystem",
  "Win32_Storage_ProjectedFileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }


[features]
session = ["distributed", "acyclic-stream/grpc"]
test-support = ["acyclic-native-runtime/test-support", "acyclic-stream/test-support", "acyclic-objects?/test-support"]
fuzzing = []
model-checking = ["dep:loom"]
default = ["local", "memory", "native-watch", "native-mount"]
local = ["distributed", "acyclic-objects/local", "acyclic-stream/local", "dep:fs2", "dep:tempfile"]
memory = ["distributed"]
native-watch = ["dep:notify"]
native-mount = ["dep:dirs", "native-watch", "dep:fs2", "dep:fuser", "dep:nix"]
s3-http = ["distributed", "dep:base64", "dep:crc-fast", "dep:s3s", "dep:serde_urlencoded", "dep:subtle", "dep:sync_wrapper", "dep:time", "dep:urlencoding"]
distributed = ["dep:acyclic-objects"]
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
typescript = ["dep:tsify", "dep:wasm-bindgen"]
napi-types = ["dep:napi", "dep:napi-derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-test-support = { path = "../test-support" }
acyclic-objects = { version = "=0.2.0", path = "../objects" }
loom = "0.7.2"
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
axum.workspace = true
hmac = "0.13.0"
http.workspace = true
rcgen = "0.14.10"
rustls.workspace = true
sha2.workspace = true
tempfile = "3.27.0"
tokio-stream.workspace = true
tower = { workspace = true, features = ["util"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }

[lints]
workspace = true

[[example]]
name = "embedded_workspace"
required-features = ["local"]

[[example]]
name = "record_cloud_contract"
required-features = ["memory"]

[[bench]]
name = "projfs_paths"
path = "benches/projfs_paths.rs"
harness = false
required-features = ["native-mount"]

[[bench]]
name = "object_batches"
harness = false
required-features = ["memory"]

[[bench]]
name = "object_batches_alloc"
harness = false
required-features = ["memory"]

[[test]]
name = "session_fs_model"
path = "tests/session_fs_model.rs"
required-features = ["memory", "session"]
