[package]
name = "acyclic-fs"
version = "0.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and daemon-hosted native mounts"
readme = "../../../README.md"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

[dependencies]
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
notify = { workspace = true, optional = true }
serde.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16.0", default-features = false, features = ["abi-7-31"], optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2.56"
pkg-config = "0.3.32"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-primitives = "4.0.3"
cap-std = "4.0.3"
fs2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
  "Win32_Storage_FileSystem",
  "Win32_Storage_ProjectedFileSystem",
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
] }

[features]
default = ["local", "memory", "native-watch"]
local = ["dep:fs2", "dep:rusqlite", "native-executor"]
memory = []
native-watch = ["dep:notify", "dep:tokio"]
native-executor = ["dep:tokio"]
native-mount = ["native-watch", "native-executor", "dep:fs2", "dep:fuser"]

[lints]
workspace = true

[[example]]
name = "embedded_workspace"
required-features = ["local"]
