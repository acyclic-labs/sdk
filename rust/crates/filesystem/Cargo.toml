[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
autotests = false
name = "acyclic-fs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for versioned workspaces and embedded native mounts"
readme = "README.md"
documentation = "https://docs.rs/acyclic-fs"
keywords = ["filesystem", "copy-on-write", "versioned", "storage"]
categories = ["filesystem", "data-structures"]

# Tests that reach the FUSE mounts run outside Bazel's linux-sandbox.
[package.metadata.bazel]
mounts-fuse = true
share-separate-deps = true
unit-test-only-sources = [
    "src/git_compat/tests/**",
    "src/multi_root/tests/**",
    "src/native_mount/fixture_access.rs",
    "src/tests/**",
    "src/wire_service/access_tests.rs",
    "src/wire_service/errors/tests.rs",
    "src/wire_service/metadata_tests.rs",
    "src/wire_service/mount_fixture.rs",
    "src/wire_service/mount_tests.rs",
    "src/wire_service/tests.rs",
    "tests/support/**",
]
build-script-inputs = [
    "src/native_mount/darwin_mount_bridge.c",
    "src/native_mount/darwin_mount_retirement.c",
    "src/native_mount/darwin_mount/tests/retirement_model.c",
    "vendor/darwinfuse",
]

test-build-script = ["operation_claim_model"]

[package.metadata.bazel.platform-sources]
"@platforms//os:linux" = ["src/native_mount/fuse/**/*.rs"]
"@platforms//os:macos" = ["src/fsevents/**/*.rs", "src/native_mount/darwin_mount/**/*.rs"]
"@platforms//os:windows" = [
    "src/native_mount/projfs/**/*.rs",
    "src/windows_usn.rs",
    "tests/cases/projfs_metadata/metadata/client.rs",
    "tests/projfs_metadata_support.rs",
]

[package.metadata.bazel.unit-test-dependency-variants]
acyclic-fs-work = "observations"

[package.metadata.bazel.test-tools.acyclic_fs_test]
rustc = "//:rustc"

[package.metadata.bazel.test-dependencies]
operation_claim_model = ["acyclic_stream", "loom"]
git_history = ["acyclic_fs", "acyclic_stream", "thiserror", "tokio"]
git_marker_contracts = ["proptest"]
merge_driver_contracts = ["acyclic_fs", "acyclic_fs_base"]
native_root_identity = ["acyclic_fs_native_contract"]
native_view_table = []
native_checkpoint = ["acyclic_auth", "acyclic_fs_native_contract", "thiserror"]
wire_contracts = ["acyclic_fs", "acyclic_fs_wire", "prost", "serde_json"]
wire_error_contracts = ["acyclic_fs", "acyclic_auth", "acyclic_fs_native_contract", "acyclic_fs_wire", "acyclic_fs_work", "acyclic_objects", "acyclic_stream", "bytes", "prost_reflect", "tokio", "tonic"]
wire_rpc = ["acyclic_fs", "acyclic_fs_wire", "acyclic_objects", "acyclic_stream", "async_trait", "futures", "tokio", "tokio_stream", "tonic"]
source_lifecycle = ["acyclic_fs", "acyclic_fs_work", "acyclic_stream", "tempfile", "tokio"]
s3_contracts = ["acyclic_fs", "acyclic_fs_work", "bytes", "tokio"]
workspace_append = ["acyclic_fs", "acyclic_fs_work", "acyclic_stream", "bytes", "futures", "proptest", "tokio"]
workspace_context_contracts = ["acyclic_fs", "tokio"]
workspace_contracts = ["acyclic_fs", "acyclic_fs_work", "acyclic_stream", "sha2", "tokio"]
workspace_creation_race = ["acyclic_fs", "acyclic_fs_work", "acyclic_objects", "acyclic_stream", "async_trait", "futures", "tokio"]
workspace_join_history = ["acyclic_fs", "acyclic_fs_work", "tokio"]
workspace_merge = ["acyclic_fs", "acyclic_fs_work", "acyclic_stream", "tokio"]
workspace_rebase = ["acyclic_fs", "acyclic_fs_work", "acyclic_stream", "bytes", "tokio"]
workspace_restore = ["acyclic_fs", "acyclic_fs_work", "acyclic_stream", "tokio"]

[[test]]
name = "main"
path = "tests/main.rs"

