[package]
license.workspace = true
name = "acyclic-fs-lease-path-proof"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
hex = "=0.4.3"

[lib]
path = "lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# Kani reads these for every run of this package's proofs.
[package.metadata.kani.flags]
cbmc-args = ["--object-bits", "8"]

[package.metadata.kani.unstable]
function-contracts = true
stubbing = true
unstable-options = true
