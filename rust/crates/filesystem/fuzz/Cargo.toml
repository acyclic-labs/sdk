[package]
license.workspace = true
autotests = false
name = "acyclic-fs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
model-checking = []
fuzz-targets = ["dep:libfuzzer-sys"]

[dependencies]
acyclic-stream = { path = "../../stream" }
acyclic-auth = { path = "../../auth" }
prost.workspace = true
acyclic-fs = { path = "..", features = ["model-checking", "fuzzing", "session"] }
acyclic-fs-lease-path-proof = { path = "../proofs/lease-path" }
libfuzzer-sys = { version = "0.4", optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "net"] }

[dev-dependencies]
futures.workspace = true
proptest.workspace = true
loom = "0.7"

[[test]]
name = "model"
path = "tests/model.rs"
required-features = ["model-checking"]

[[test]]
name = "window_state"
path = "tests/window_state.rs"

[[bin]]
name = "access"
required-features = ["fuzz-targets"]
path = "fuzz_targets/access.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuse_reply"
required-features = ["fuzz-targets"]
path = "fuzz_targets/fuse_reply.rs"
test = false
doc = false
bench = false

