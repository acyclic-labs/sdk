[package]
autotests = false
name = "acyclic-fs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
fuzz-targets = ["dep:libfuzzer-sys"]

[dependencies]
acyclic-fs = { path = "..", features = ["model-checking", "fuzzing"] }
libfuzzer-sys = { version = "0.4", optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "net"] }

[dev-dependencies]
proptest.workspace = true
loom = "0.7"

[[test]]
name = "model"
path = "tests/model.rs"

[[bin]]
name = "access"
required-features = ["fuzz-targets"]
path = "fuzz_targets/access.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuse_reply"
required-features = ["fuzz-targets"]
path = "fuzz_targets/fuse_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_markers"
required-features = ["fuzz-targets"]
path = "fuzz_targets/git_markers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_pending"
required-features = ["fuzz-targets"]
path = "fuzz_targets/git_pending.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
required-features = ["fuzz-targets"]
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoder_work"
required-features = ["fuzz-targets"]
path = "fuzz_targets/decoder_work.rs"
test = false
doc = false
bench = false

[lints]
workspace = true

[[bin]]
name = "encoder_work"
required-features = ["fuzz-targets"]
path = "fuzz_targets/encoder_work.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_fs"
path = "fuzz_targets/session_fs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workspace_name"
path = "fuzz_targets/workspace_name.rs"
test = false
doc = false
bench = false
