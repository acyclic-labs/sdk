[package]
name = "acyclic-sdk-luajit-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-owned remote Stream C ABI for LuaJIT FFI"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = true }
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
bytes.workspace = true
futures.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
rcgen = "0.14.10"
tonic.workspace = true
tokio-stream.workspace = true

[lints]
workspace = true

[[bin]]
name = 'luajit-remote-fixture'
path = 'src/bin/remote-fixture.rs'

