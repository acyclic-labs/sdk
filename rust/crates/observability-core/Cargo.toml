[package]
name = "acyclic-observability-core"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operation span, latency distribution and outcome ledger primitives"

[features]
research = []

[dependencies]
serde = { workspace = true, features = ["rc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
# Native semaphore/watch locks must remain inside their admitted owner storage.
# Tokio's std locks otherwise allocate lazily on Darwin, including permit drop.
tokio = { version = "1.48.0", default-features = false, features = ["sync", "io-util", "macros", "parking_lot"] }
futures.workspace = true

[lints]
workspace = true
