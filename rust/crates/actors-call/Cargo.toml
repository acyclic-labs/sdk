[package]
name = "acyclic-actors-call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Caller-owned Actors call journal and spend escrow"

[features]
test-support = ["dep:acyclic-stream-wire", "dep:futures", "dep:prost"]

[dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
bytes.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire", optional = true }
futures = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
acyclic-test-support = { path = "../test-support" }
futures.workspace = true
prost.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
