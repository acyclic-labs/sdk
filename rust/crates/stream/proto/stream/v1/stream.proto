// Canonical provider-independent hierarchical Stream v1 contract.
syntax = "proto3";
package acyclic.stream.v1;

import "validation/v1/options.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/stream/v1;streamv1";

// Canonical bounds shared by Rust and generated TypeScript clients.
enum StreamLimit {
  STREAM_LIMIT_UNSPECIFIED = 0;
  STREAM_LIMIT_MAX_RECORD_BYTES = 65536;
  STREAM_LIMIT_MAX_ITEMS = 1024;
  STREAM_LIMIT_MAX_COMMAND_BYTES = 1056768;
  STREAM_LIMIT_MAX_IDEMPOTENCY_KEY_BYTES = 256;
  STREAM_LIMIT_MAX_PATH_BYTES = 65535;
}

message Record {
  uint64 sequence = 1;
  bytes value = 2;
  bytes commit_id = 3;
  uint64 committed_at_micros = 4;
}

message AppendRequest {
  string path = 1;
  repeated bytes records = 2;
  optional uint64 if_tail = 3;
  optional bytes idempotency_key = 4;
}

message AppendReceipt {
  uint64 start = 1;
  uint64 end = 2;
  uint64 tail = 3;
  bytes commit_id = 4;
}

message TailConflict {
  uint64 actual_tail = 1;
}

message AppendResponse {
  oneof outcome {
    AppendReceipt committed = 1;
    TailConflict conflict = 2;
  }
}

message TailRequest {
  string path = 1;
  // Observe accepted visibility without waiting for persistence. False retains
  // the provider's ordinary tail behavior.
  bool accepted = 2;
}
message TailResponse {
  uint64 tail = 1;
  // Present for an accepted observation: confirmed durable prefix at the same
  // cut, bounded by tail. Absent means the peer does not support that observation.
  optional uint64 durable = 3;
  reserved 2;
  reserved "trim_point";
}

message ForkRequest {
  string source = 1;
  string destination = 2;
  optional uint64 at_tail = 3;
  optional bytes idempotency_key = 4;
}

message ForkReceipt {
  string source = 1;
  string destination = 2;
  uint64 forked_at = 3;
  uint64 tail = 4;
  bytes commit_id = 5;
}

message ReadRequest {
  string path = 1;
  uint64 from = 2;
  uint32 limit = 3;
}

message FollowRequest {
  string path = 1;
  uint64 from = 2;
}

// Encoding of one read frame's data.
enum Codec {
  // A read frame must explicitly select an encoding; unspecified and unknown codecs are invalid.
  CODEC_UNSPECIFIED = 0;
  // data is the encoded RecordBatch itself.
  CODEC_NONE = 2;
  // data is one or more complete Zstandard frames.
  CODEC_ZSTD = 1;
}

// One Stream's consecutive records in ascending sequence order.
message RecordBatch {
  repeated Record records = 1;
}

// One Read or Follow frame. data decodes under codec to exactly decoded_length
// bytes of an encoded RecordBatch whose records continue the previous frame's.
// A client rejects decoded_length above STREAM_LIMIT_MAX_COMMAND_BYTES before it
// allocates or decompresses, rejects any other decoded length, and rejects an
// unknown codec. A server chooses the codec independently for every frame.
message ReadResponse {
  reserved 1;
  reserved "record";
  Codec codec = 2;
  bytes data = 3;
  uint64 decoded_length = 4;
  // Opaque hosted receipt token; absent on local and older servers.
  bytes delivery_token = 5;
}

message AcknowledgeDeliveryRequest {
  // Exactly 32 opaque bytes from the issuing endpoint; transport receipt only.
  bytes delivery_token = 1;
}

message AcknowledgeDeliveryResponse {}

message ChildrenRequest {
  optional string parent = 1;
  uint32 limit = 2;
}

message Child {
  string path = 1;
}
message ChildrenResponse {
  Child child = 1;
}

message ChildrenPageRequest {
  optional string parent = 1;
  optional string after = 2;
  optional bytes hierarchy_version = 3;
  uint32 limit = 4;
}

message ChildrenPageResponse {
  bytes hierarchy_version = 1;
  repeated Child children = 2;
  optional string next_after = 3;
}

message TailCondition {
  string path = 1;
  uint64 expected = 2;
}

message AbsentCondition {
  string path = 1;
}

message CommitCondition {
  oneof condition {
    TailCondition tail = 1;
    AbsentCondition absent = 2;
    HeadCondition head = 3;
  }
}

message HeadCondition {
  string path = 1;
  uint64 expected = 2;
  bytes commit_id = 3;
}

message AppendMutation {
  string path = 1;
  repeated bytes records = 2;
}

// Forks the source's prefix ending at `at_tail` into the new destination,
// then appends `records` to the destination, all at one linearization point.
message ForkMutation {
  string source = 1;
  string destination = 2;
  uint64 at_tail = 3;
  repeated bytes records = 4;
}

message CommitMutation {
  reserved 3, 4;
  reserved "trim", "delete";
  oneof mutation {
    AppendMutation append = 1;
    ForkMutation fork = 2;
  }
}

message CommitRequest {
  repeated CommitCondition conditions = 1;
  repeated CommitMutation mutations = 2;
  bytes idempotency_key = 3;
  optional uint64 deadline_unix_millis = 4;
}

message CommittedAppend {
  string path = 1;
  uint64 start = 2;
  uint64 end = 3;
  uint64 tail = 4;
  repeated Record records = 5;
}

message CommittedFork {
  string source = 1;
  string destination = 2;
  uint64 forked_at = 3;
  uint64 tail = 4;
  repeated Record records = 5;
}

message CommittedMutation {
  reserved 3, 4;
  reserved "trim", "delete";
  oneof mutation {
    CommittedAppend append = 1;
    CommittedFork fork = 2;
  }
}

message CommittedEnvelope {
  bytes commit_id = 1;
  repeated CommittedMutation mutations = 2;
}

message TailCommitConflict {
  string path = 1;
  uint64 expected = 2;
  optional uint64 actual = 3;
}

message ExistsCommitConflict {
  string path = 1;
}
message CommitConflict {
  reserved 3;
  reserved "retired";
  oneof conflict {
    TailCommitConflict tail = 1;
    ExistsCommitConflict exists = 2;
    HeadCommitConflict head = 4;
  }
}

message HeadCommitConflict {
  string path = 1;
  bytes expected = 2;
  bytes actual = 3;
}

message CommitConflicts {
  repeated CommitConflict conflicts = 1;
}

message CommitResponse {
  oneof outcome {
    CommittedEnvelope committed = 1;
    CommitConflicts conflict = 2;
  }
}

message ReadCommitRequest {
  bytes commit_id = 1;
}

message InspectIdempotencyRequest {
  bytes idempotency_key = 1;
}

message IdempotencyObservation {
  bytes idempotency_key = 1;
  bytes request_digest = 2;
  reserved 5, 6;
  reserved "trim", "delete";
  oneof outcome {
    AppendResponse append = 3;
    ForkReceipt fork = 4;
    CommitResponse commit = 7;
  }
}

message InspectIdempotencyResponse {
  optional IdempotencyObservation observation = 1;
}

// Hosted account token creation request.  This uses the same canonical path
// and operation vocabulary as the Stream client, while the hosted adapter
// owns its JSON spelling at the Rust/WASM boundary.
message TokenGrant {
  string path = 1;
  optional bool subtree = 2;
  repeated string operations = 3;
}

message CreateTokenRequest {
  string expires_in = 1;
  repeated TokenGrant allow = 2;
}

service StreamService {
  rpc InspectIdempotency(InspectIdempotencyRequest) returns (InspectIdempotencyResponse) { option (acyclic.validation.v1.auth) = { action: "streams/read" extractor: "streams.idempotency-resources" }; }
  rpc Append(AppendRequest) returns (AppendResponse) { option (acyclic.validation.v1.auth) = { action: "streams/append" resource: "streams:/{path}" }; }
  rpc Tail(TailRequest) returns (TailResponse) { option (acyclic.validation.v1.auth) = { action: "streams/read" resource: "streams:/{path}" }; }
  rpc Fork(ForkRequest) returns (ForkReceipt) { option (acyclic.validation.v1.auth) = { action: "streams/fork" resource: "streams:/{source}" }; option (acyclic.validation.v1.auth) = { action: "streams/create" resource: "streams:/{destination}" }; }
  rpc Read(ReadRequest) returns (stream ReadResponse) { option (acyclic.validation.v1.auth) = { action: "streams/read" resource: "streams:/{path}" }; }
  rpc Follow(FollowRequest) returns (stream ReadResponse) { option (acyclic.validation.v1.auth) = { action: "streams/follow" resource: "streams:/{path}" }; }
  rpc AcknowledgeDelivery(AcknowledgeDeliveryRequest) returns (AcknowledgeDeliveryResponse) { option (acyclic.validation.v1.auth) = { action: "streams/follow" extractor: "streams.delivery-resource" }; }
  rpc Children(ChildrenRequest) returns (stream ChildrenResponse) { option (acyclic.validation.v1.auth) = { action: "streams/list" extractor: "streams.list-visible-children" }; }
  rpc ChildrenPage(ChildrenPageRequest) returns (ChildrenPageResponse) { option (acyclic.validation.v1.auth) = { action: "streams/list" extractor: "streams.list-visible-children" }; }
  rpc Commit(CommitRequest) returns (CommitResponse) { option (acyclic.validation.v1.auth) = { extractor: "streams.transaction" }; }
  rpc ReadCommit(ReadCommitRequest) returns (CommittedEnvelope) { option (acyclic.validation.v1.auth) = { action: "streams/read" extractor: "streams.commit-resources" }; }
}
