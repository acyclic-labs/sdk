// Canonical provider-independent hierarchical Stream v2 contract.
syntax = "proto3";
package acyclic.stream.v2;

option go_package = "github.com/acyclic-labs/sdk/go/gen/stream/v2;streamv2";

// Canonical bounds shared by Rust and generated TypeScript clients.
enum StreamLimit {
  STREAM_LIMIT_UNSPECIFIED = 0;
  STREAM_LIMIT_MAX_RECORD_BYTES = 65536;
  STREAM_LIMIT_MAX_ITEMS = 1024;
  STREAM_LIMIT_MAX_COMMAND_BYTES = 1056768;
  STREAM_LIMIT_MAX_IDEMPOTENCY_KEY_BYTES = 256;
  STREAM_LIMIT_MAX_PATH_BYTES = 65535;
}

message Record {
  uint64 sequence = 1;
  bytes value = 2;
  bytes commit_id = 3;
  uint64 committed_at_micros = 4;
}

message AppendRequest {
  string path = 1;
  repeated bytes records = 2;
  optional uint64 if_tail = 3;
  optional bytes idempotency_key = 4;
}

message AppendReceipt {
  uint64 start = 1;
  uint64 end = 2;
  uint64 tail = 3;
  bytes commit_id = 4;
}

message TailConflict {
  uint64 actual_tail = 1;
}

message AppendResponse {
  oneof outcome {
    AppendReceipt committed = 1;
    TailConflict conflict = 2;
  }
}

message TailRequest {
  string path = 1;
}
message TailResponse {
  uint64 tail = 1;
  reserved 2;
  reserved "trim_point";
}

message ForkRequest {
  string source = 1;
  string destination = 2;
  optional uint64 at_tail = 3;
  optional bytes idempotency_key = 4;
}

message ForkReceipt {
  string source = 1;
  string destination = 2;
  uint64 forked_at = 3;
  uint64 tail = 4;
  bytes commit_id = 5;
}

message ReadRequest {
  string path = 1;
  uint64 from = 2;
  uint32 limit = 3;
}

message FollowRequest {
  string path = 1;
  uint64 from = 2;
}

message ReadResponse {
  Record record = 1;
  // Opaque, one-use token issued by a hosted server for this delivered record.
  // Absent on local and older servers; its presence never changes read results.
  bytes delivery_token = 2;
}

message AcknowledgeDeliveryRequest {
  // Exactly 32 opaque bytes from the issuing endpoint. This acknowledges
  // transport receipt, not application consumption or permission to bill.
  bytes delivery_token = 1;
}

message AcknowledgeDeliveryResponse {}

message ChildrenRequest {
  optional string parent = 1;
  uint32 limit = 2;
}

message Child {
  string path = 1;
}
message ChildrenResponse {
  Child child = 1;
}

message ChildrenPageRequest {
  optional string parent = 1;
  optional string after = 2;
  optional bytes hierarchy_version = 3;
  uint32 limit = 4;
}

message ChildrenPageResponse {
  bytes hierarchy_version = 1;
  repeated Child children = 2;
  optional string next_after = 3;
}

message TailCondition {
  string path = 1;
  uint64 expected = 2;
}

message AbsentCondition {
  string path = 1;
}

message CommitCondition {
  oneof condition {
    TailCondition tail = 1;
    AbsentCondition absent = 2;
  }
}

message AppendMutation {
  string path = 1;
  repeated bytes records = 2;
}

// Forks the source's prefix ending at `at_tail` into the new destination,
// then appends `records` to the destination, all at one linearization point.
message ForkMutation {
  string source = 1;
  string destination = 2;
  uint64 at_tail = 3;
  repeated bytes records = 4;
}

message CommitMutation {
  reserved 3, 4;
  reserved "trim", "delete";
  oneof mutation {
    AppendMutation append = 1;
    ForkMutation fork = 2;
  }
}

message CommitRequest {
  repeated CommitCondition conditions = 1;
  repeated CommitMutation mutations = 2;
  bytes idempotency_key = 3;
  optional uint64 deadline_unix_millis = 4;
}

message CommittedAppend {
  string path = 1;
  uint64 start = 2;
  uint64 end = 3;
  uint64 tail = 4;
  repeated Record records = 5;
}

message CommittedFork {
  string source = 1;
  string destination = 2;
  uint64 forked_at = 3;
  uint64 tail = 4;
  repeated Record records = 5;
}

message CommittedMutation {
  reserved 3, 4;
  reserved "trim", "delete";
  oneof mutation {
    CommittedAppend append = 1;
    CommittedFork fork = 2;
  }
}

message CommittedEnvelope {
  bytes commit_id = 1;
  repeated CommittedMutation mutations = 2;
}

message TailCommitConflict {
  string path = 1;
  uint64 expected = 2;
  optional uint64 actual = 3;
}

message ExistsCommitConflict {
  string path = 1;
}
message CommitConflict {
  reserved 3;
  reserved "retired";
  oneof conflict {
    TailCommitConflict tail = 1;
    ExistsCommitConflict exists = 2;
  }
}

message CommitConflicts {
  repeated CommitConflict conflicts = 1;
}

message CommitResponse {
  oneof outcome {
    CommittedEnvelope committed = 1;
    CommitConflicts conflict = 2;
  }
}

message ReadCommitRequest {
  bytes commit_id = 1;
}

message InspectIdempotencyRequest {
  bytes idempotency_key = 1;
}

message IdempotencyObservation {
  bytes idempotency_key = 1;
  bytes request_digest = 2;
  reserved 5, 6;
  reserved "trim", "delete";
  oneof outcome {
    AppendResponse append = 3;
    ForkReceipt fork = 4;
    CommitResponse commit = 7;
  }
}

message InspectIdempotencyResponse {
  optional IdempotencyObservation observation = 1;
}

// Hosted account token creation request.  This uses the same canonical path
// and operation vocabulary as the Stream client, while the hosted adapter
// owns its JSON spelling at the Rust/WASM boundary.
message TokenGrant {
  string path = 1;
  optional bool subtree = 2;
  repeated string operations = 3;
}

message CreateTokenRequest {
  string expires_in = 1;
  repeated TokenGrant allow = 2;
}

service StreamService {
  rpc InspectIdempotency(InspectIdempotencyRequest) returns (InspectIdempotencyResponse);
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Tail(TailRequest) returns (TailResponse);
  rpc Fork(ForkRequest) returns (ForkReceipt);
  rpc Read(ReadRequest) returns (stream ReadResponse);
  rpc Follow(FollowRequest) returns (stream ReadResponse);
  rpc AcknowledgeDelivery(AcknowledgeDeliveryRequest) returns (AcknowledgeDeliveryResponse);
  rpc Children(ChildrenRequest) returns (stream ChildrenResponse);
  rpc ChildrenPage(ChildrenPageRequest) returns (ChildrenPageResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc ReadCommit(ReadCommitRequest) returns (CommittedEnvelope);
}
