[package]
name = "acyclic-stream-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
acyclic-stream = { path = "..", features = ["test-support"] }
bytes = "1.10.1"
futures = "0.3.31"
libfuzzer-sys = "0.4"
prost = "0.14.4"

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "follow_contract"
path = "fuzz_targets/follow_contract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_text"
path = "fuzz_targets/path_text.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
