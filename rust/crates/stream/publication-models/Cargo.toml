[package]
name = "acyclic-stream-publication-models"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
loom = { version = "0.7.2", features = ["futures"] }
futures = "0.3.31"
thiserror = "2.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[[test]]
name = "publication"
path = "publication.rs"

[workspace]
members = ["."]

[profile.dev]
opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
model-checking = []
