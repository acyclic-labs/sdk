[package]
name = "acyclic-stream"
version = "1.0.0-rc.3"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Hierarchical append-only Streams contract, clients, and local provider"
build = "build.rs"

[features]
default = ["grpc"]
grpc = ["dep:h2", "dep:tonic", "dep:tonic-prost"]
local = ["dep:fs2", "dep:libc", "tokio/rt-multi-thread"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
h2 = { version = "0.4.19", optional = true }
fs2 = { workspace = true, optional = true }
prost.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2.175", optional = true }

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
