[package]
name = "acyclic-stream"
version = "0.2.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Hierarchical append-only Streams contract, clients, and local provider"
readme = "README.md"
documentation = "https://docs.rs/acyclic-stream"
keywords = ["streams", "events", "grpc"]
categories = ["api-bindings", "data-structures"]
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "http-conformance"
required-features = ["http"]

[features]
default = []
# Kept as compatibility feature names for downstream manifests. Transport
# selection is target-owned and no longer requires callers to enable them.
grpc = []
http = []
local = ["dep:fs2", "dep:libc"]
# Kept as a compatibility feature name. Browser bindings are selected by the
# target, so consumers never need to opt into a platform implementation.
wasm = []

[dependencies]
acyclic-sdk-contract-wire = { version = "=0.1.0", path = "../sdk-contract-wire" }
prost-reflect = { workspace = true, features = ["serde"] }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time"] }
uuid.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2.175", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
tsify-next = { version = "0.5.6", features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = { workspace = true, optional = true }
h2 = "0.4.19"
hyper = { version = "1.11.0", default-features = false }
tokio = { version = "1.48.0", default-features = false, features = ["rt-multi-thread"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
acyclic-sdk-contract-wire = { version = "=0.1.0", path = "../sdk-contract-wire" }
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
hyper = { version = "1.11.0", default-features = false, features = ["client", "http2"] }
hyper-util.workspace = true
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "test-util"] }
tokio-stream.workspace = true
tower.workspace = true

[lints]
workspace = true
