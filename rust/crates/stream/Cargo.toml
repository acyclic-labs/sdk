[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
name = "acyclic-stream"
version = "0.2.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Hierarchical append-only Streams contract, clients, and local provider"
readme = "README.md"
documentation = "https://docs.rs/acyclic-stream"
keywords = ["streams", "events", "grpc"]
categories = ["api-bindings", "data-structures"]
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "http-conformance"
required-features = ["http"]

[[example]]
name = "browser-test-host"
required-features = ["grpc"]

[features]
test-support = ["acyclic-native-runtime/test-support"]
default = ["grpc"]
grpc = ["dep:h2", "dep:hyper", "dep:tonic", "dep:tonic-prost", "dep:rustls", "dep:rustls-platform-verifier", "tokio/rt", "tokio/macros"]
http = ["grpc", "dep:reqwest"]
local = ["dep:fs2", "tokio/rt"]
# Shared byte-array encoding; decoding alone never authenticates native custody.
serde = ["dep:serde"]
wasm = ["serde", "dep:serde-wasm-bindgen", "dep:tsify", "dep:wasm-bindgen", "dep:indexed_db_futures", "dep:web-sys", "dep:tonic", "dep:tonic-prost", "dep:tonic-web-wasm-client", "dep:tracing-subscriber", "tokio/macros"]

[dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth" }
async-trait.workspace = true
base64 = "0.23.1"
bytes.workspace = true
futures.workspace = true
pin-project-lite = "0.2.17"
h2 = { version = "0.4.19", optional = true }
hyper = { version = "1.11.0", default-features = false, optional = true }
prost.workspace = true
ruzstd.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time", "rt"] }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
web-sys = { workspace = true, features = ["BroadcastChannel", "MessageEvent", "WorkerGlobalScope", "WebSocket", "BinaryType", "Event", "CloseEvent", "Url"], optional = true }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"], optional = true }
tonic-web-wasm-client = { package = "acyclic-tonic-web-wasm-client", version = "=0.2.0", path = "../../vendor/tonic-web-wasm-client-0.9.2", optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"], optional = true }
indexed_db_futures = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = { workspace = true, optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"], optional = true }
tonic = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }

[target.'cfg(acyclic_stream_loom)'.dependencies]
loom = { version = "0.7.2", features = ["futures"] }

[dev-dependencies]
acyclic-fuzz-support = { path = "../../fuzz/support", features = ["test-input"] }
proptest.workspace = true
tokio = { version = "1.48.0", features = ["macros", "rt", "test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-test-support = { path = "../test-support" }
axum = { workspace = true, features = ["ws"] }
tonic-web.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http2"] }
hyper-util.workspace = true
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-stream.workspace = true
tower.workspace = true
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
tokio = { version = "1.48.0", features = ["net", "io-util", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }
web-sys = { workspace = true, features = ["Performance"] }

[target.'cfg(acyclic_loom)'.dependencies]
loom = { version = "0.7.2", features = ["futures"] }
tempfile = "3.27.0"

[lints]
workspace = true
