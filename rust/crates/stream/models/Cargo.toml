[package]
license.workspace = true
name = "acyclic-stream-models"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata.bazel]
build-script-inputs = []

[dependencies]
acyclic-stream = { path = "..", default-features = false, features = ["model-checking"] }
acyclic-stream-wire = { path = "../../stream-wire" }
futures = "0.3.31"
loom = { version = "0.7.3", features = ["futures"], optional = true }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# Compiles only under the ACYCLIC_LOOM opt-in, which runs it with `--test session_model`;
# plain `cargo test` would hit its compile-time guard.
[[test]]
name = "session_model"
path = "session_model.rs"
test = false
required-features = ["model-checking"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
model-checking = ["dep:loom"]
