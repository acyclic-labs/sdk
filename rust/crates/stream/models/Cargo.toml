[package]
name = "acyclic-stream-models"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
thiserror = "2.0"
futures = "0.3.31"
loom = { version = "0.7.2", features = ["futures"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[[test]]
name = "session_model"
path = "session_model.rs"

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(acyclic_stream_loom)'] }
