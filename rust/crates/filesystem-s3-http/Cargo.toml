[package]
name = "acyclic-fs-s3-http"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "S3 HTTP translation over Acyclic filesystem workspaces"

[package.metadata.bazel]
unit-test-only-sources = ["src/s3_http/access_tests.rs", "src/s3_http/tests.rs"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem" }
acyclic-fs-format = { version = "=0.2.0", path = "../filesystem-format" }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
async-trait.workspace = true
base64 = "0.23.1"
blake3.workspace = true
bytes.workspace = true
crc-fast = "1.10.0"
futures.workspace = true
hex.workspace = true
s3s.workspace = true
subtle.workspace = true
sync_wrapper.workspace = true
urlencoding = "2.1.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", features = ["test-support"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["test-support"] }
axum.workspace = true
hmac = "0.13.0"
http.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
