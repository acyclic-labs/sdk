[package]
name = "acyclic-sdk-embedded-prototype"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/sdk"
description = "Bounded C ABI prototype over the Rust Stream memory provider"
publish = false
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
uniffi = ["dep:uniffi"]

[dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
bytes = "1.10.1"
futures = "0.3.31"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uniffi = { version = "=0.32.2", features = ["tokio"], optional = true }

[build-dependencies]
cbindgen = "=0.29.4"

[workspace]
