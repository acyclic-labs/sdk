[package]
name = "acyclic-stream-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API native remote Stream transport over the canonical Rust client"
publish = false
build = "build.rs"

[package.metadata.napi]
family = "stream"
npm-package = "@acyclic-labs/stream"
package-path = "typescript/packages/stream"
companion-directory = "native"
wasm-package = "acyclic-stream"
wasm-output-name = "acyclic_stream_wasm"
wasm-target-directory = "stream-wasm"
wasm-features = ["wasm"]
wasm-no-default-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["grpc"] }
napi = { workspace = true, features = ["tokio_rt"] }
napi-derive.workspace = true
futures.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "=0.7.19", features = ["rt"] }

[build-dependencies]
napi-build = "2.3.1"

[dev-dependencies]
async-trait.workspace = true
rcgen = "0.14.10"
tonic.workspace = true

[lints]
workspace = true
