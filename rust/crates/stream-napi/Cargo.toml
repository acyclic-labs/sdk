[package]
name = "acyclic-stream-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API native remote Stream transport over the canonical Rust client"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["grpc"] }
napi = { workspace = true, features = ["tokio_rt"] }
napi-derive.workspace = true
bytes.workspace = true
futures.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-util = { version = "=0.7.19", features = ["rt"] }

[build-dependencies]
napi-build = "2.3.1"

[lints]
workspace = true
