[package]
name = "acyclic-machines-daytona"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Protected Daytona adapter for the public Machines provider seam"

[dependencies]
acyclic-auth = { path = "../auth", version = "=0.2.0" }
acyclic-harness-core = { path = "../harness-core", version = "=0.2.0", default-features = false }
acyclic-machines = { path = "../machines", version = "=0.2.0", default-features = false }
acyclic-stream = { path = "../stream", version = "=0.2.0", default-features = false }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2.5.7"
time = { workspace = true, features = ["parsing"] }

[dev-dependencies]
acyclic-harness-core = { path = "../harness-core", version = "=0.2.0", default-features = false }
acyclic-harness-providers = { path = "../harness-providers", version = "=0.2.0", default-features = false }
acyclic-stream = { path = "../stream", version = "=0.2.0", default-features = false }
acyclic-machines = { path = "../machines", version = "=0.2.0", default-features = false, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync"] }

[lints]
workspace = true
