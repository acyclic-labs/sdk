[package]
name = "acyclic-harness-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded client state shared by native and WASM harness adapters"

[features]
agents = ["session", "dep:acyclic-harness-core", "dep:acyclic-actors", "dep:base64", "dep:serde", "dep:serde_json", "dep:thiserror"]
grpc = ["agents", "acyclic-stream/grpc"]
session = ["acyclic-stream/session", "dep:prost"]
wasm = ["acyclic-stream/wasm", "acyclic-harness-core/wasm", "dep:acyclic-actors", "dep:base64", "dep:prost", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tsify", "dep:wasm-bindgen"]

[dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-actors = { version = "=0.2.0", path = "../actors", optional = true }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", optional = true }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
base64 = { version = "=0.22.1", optional = true }
bytes.workspace = true
futures.workspace = true
prost = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
url = "=2.5.8"

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
