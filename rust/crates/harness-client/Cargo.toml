[package]
name = "acyclic-harness-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded client state shared by native and WASM harness adapters"

[features]
wasm = ["acyclic-stream/wasm", "acyclic-harness-core/wasm", "dep:tsify", "dep:wasm-bindgen"]

[dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
base64 = { version = "=0.22.1" }
blake3 = { workspace = true }
bytes.workspace = true
futures.workspace = true
prost = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
url = "=2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-stream = { path = "../stream", default-features = false, features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }

[lints]
workspace = true
