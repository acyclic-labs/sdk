[package]
name = "acyclic-actors-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/sdk"
description = "Rust-owned WebAssembly Actors client boundary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-actors = { path = "../actors", version = "0.2.0", default-features = false }
prost = "0.14.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.94"
tokio-util = { version = "=0.7.19", features = ["rt"] }
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.67"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"


