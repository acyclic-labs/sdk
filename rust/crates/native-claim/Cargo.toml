[package]
name = "acyclic-native-claim"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Exclusive store ownership claims shared by Acyclic host consumers"
documentation = "https://docs.rs/acyclic-native-claim"
keywords = ["filesystem", "io", "runtime"]
categories = ["filesystem"]

[features]
model-checking = ["dep:loom"]
test-support = ["acyclic-native-file/test-support", "acyclic-native-runtime/test-support"]

[dependencies]
acyclic-native-file = { version = "=0.2.0", path = "../native-file" }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
acyclic-process-identity = { version = "=0.2.0", path = "../process-identity" }
loom = { version = "=0.7.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
tempfile = "3.27.0"

[lints]
workspace = true
