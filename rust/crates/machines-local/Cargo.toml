[package]
name = "acyclic-machines-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native process execution over the public Machines output stream"

[dependencies]
acyclic-machines = { path = "../machines", version = "=0.2.0", default-features = false }
acyclic-native-runtime = { path = "../native-runtime", version = "=0.2.0" }
acyclic-stream = { path = "../stream", version = "=0.2.0", default-features = false }
async-trait.workspace = true
futures.workspace = true
rustix = { workspace = true, features = ["fs"] }
tokio = { workspace = true, features = ["sync", "time", "macros"] }

[dev-dependencies]
acyclic-actors = { path = "../actors", version = "=0.2.0", default-features = false }
acyclic-machines-conformance = { path = "../machines-conformance", version = "=0.2.0" }
acyclic-native-runtime = { path = "../native-runtime", version = "=0.2.0", features = ["test-support"] }
acyclic-stream = { path = "../stream", version = "=0.2.0", default-features = false, features = ["test-support"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
