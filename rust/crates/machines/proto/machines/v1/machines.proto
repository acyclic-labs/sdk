syntax = "proto3";
package acyclic.machines.v1;

import "validation/v1/options.proto";
import "harness/v2/resources.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/machines/v1;machinesv1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}
message OperationId {
  bytes value = 1;
}
message IdempotencyKey {
  bytes value = 1;
}
message MachineId {
  bytes value = 1;
}
message CheckpointId {
  bytes value = 1;
}

enum ImageKind {
  IMAGE_KIND_UNSPECIFIED = 0;
  IMAGE_KIND_MANAGED_OCI = 1;
  IMAGE_KIND_CUSTOM = 2;
  IMAGE_KIND_CHECKPOINT = 3;
}
message Image {
  ImageKind kind = 1;
  oneof immutable_reference {
    bytes managed_digest = 2;
    bytes custom_digest = 3;
    CheckpointId checkpoint = 4;
  }
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_ELASTIC_CPU = 1;
  CAPABILITY_ELASTIC_MEMORY = 2;
  CAPABILITY_LIVE_CHECKPOINT = 3;
  CAPABILITY_LIVE_FORK = 4;
  CAPABILITY_SUSPEND_RESUME = 5;
  CAPABILITY_LIVE_MOVEMENT = 6;
  // ForkMachine copies a running machine's persistent disk, but not its memory or processes,
  // into fresh children. Which paths are persistent is provider-defined: a provider whose
  // machines boot from an immutable image may copy only its declared data directory. CAPABILITY_LIVE_FORK is the memory-and-disk form and takes precedence
  // when both are declared.
  CAPABILITY_DISK_FORK = 7;
}
enum CompatibilityMode {
  COMPATIBILITY_MODE_UNSPECIFIED = 0;
  COMPATIBILITY_MODE_BEST_EFFORT = 1;
  COMPATIBILITY_MODE_REQUIRE = 2;
}
message CompatibilityPolicy {
  CompatibilityMode mode = 1;
  repeated Capability required = 2;
}
message ImageQualification {
  Image image = 1;
  repeated Capability capabilities = 2;
  bytes compatibility_revision = 3;
}

message SuspensionPolicy {
  oneof policy {
    bool manual = 1;
    uint64 after_idle_ms = 2;
  }
}
enum ExpirationKind {
  EXPIRATION_KIND_UNSPECIFIED = 0;
  EXPIRATION_KIND_NEVER = 1;
  EXPIRATION_KIND_MAX_AGE = 2;
  EXPIRATION_KIND_AT = 3;
  EXPIRATION_KIND_IDLE = 4;
}
message ExpirationPolicy {
  ExpirationKind kind = 1;
  uint64 value_ms = 2;
}
message Budgets {
  uint64 spend_micros = 1;
  uint32 concurrency = 2;
}

message MachineContract {
  Image image = 1;
  repeated Capability capabilities = 2;
  CompatibilityPolicy compatibility = 3;
  bytes compatibility_revision = 4;
  reserved 5;
  reserved "performance";
  SuspensionPolicy suspension = 6;
  ExpirationPolicy expiration = 7;
  bytes network_policy_digest = 8;
  Budgets budgets = 9;
  // Exact selected volume admitted under the original caller's hosted scope.
  acyclic.harness.v2.VolumeRef selected_volume_ref = 10;
  // Where commands run. The provider declares it; a caller never selects it.
  Platform platform = 11;
  LifecycleClass lifecycle = 12;
}

enum OperatingSystem {
  OPERATING_SYSTEM_UNSPECIFIED = 0;
  OPERATING_SYSTEM_LINUX = 1;
  OPERATING_SYSTEM_MACOS = 2;
  OPERATING_SYSTEM_WINDOWS = 3;
}
enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  ARCHITECTURE_X64 = 1;
  ARCHITECTURE_ARM64 = 2;
}
enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_VIRTUAL_MACHINE = 1;
  DEVICE_KIND_CONTAINER = 2;
  DEVICE_KIND_DESKTOP = 3;
  DEVICE_KIND_SERVER = 4;
}
// The command language a shell caller writes for on this Machine.
enum Shell {
  SHELL_UNSPECIFIED = 0;
  SHELL_BASH = 1;
  SHELL_POWERSHELL = 2;
}
enum PathStyle {
  PATH_STYLE_UNSPECIFIED = 0;
  PATH_STYLE_POSIX = 1;
  PATH_STYLE_WINDOWS = 2;
}
message Platform {
  OperatingSystem os = 1;
  Architecture arch = 2;
  DeviceKind device_kind = 3;
  Shell shell = 4;
  PathStyle path_style = 5;
}
// Who owns a Machine's existence.
enum LifecycleClass {
  LIFECYCLE_CLASS_UNSPECIFIED = 0;
  // The provider creates, suspends, wakes, checkpoints, forks and destroys it.
  LIFECYCLE_CLASS_PROVISIONED = 1;
  // A device its owner attached. Only Exec, guest IO and observation apply:
  // Checkpoint, ForkMachine, Suspend, Wake and SetSuspensionPolicy are
  // UNIMPLEMENTED, and Create never yields one. DestroyMachine detaches it: it
  // stops the commands dispatched through this Machine binding, whose authority
  // ends with the binding, and touches nothing else on the device. Its
  // suspension is manual and it never expires.
  LIFECYCLE_CLASS_ATTACHED = 2;
}
message QualifyImageRequest {
  ProtocolVersion protocol = 1;
  Image image = 2;
}
message CreateMachineRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  Image image = 3;
  CompatibilityPolicy compatibility = 4;
  reserved 5;
  reserved "performance";
  SuspensionPolicy suspension = 6;
  ExpirationPolicy expiration = 7;
  bytes network_policy_digest = 8;
  Budgets budgets = 9;
  // Selects the authenticated host's canonical workspace view. This is a
  // reference, never a capability, filesystem locator or guest mapping fence.
  acyclic.harness.v2.VolumeRef selected_volume_ref = 10;
}
message MachineMutationRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  MachineId machine = 3;
}
// Enrolls the selected workspace on the original Machine incarnation. The
// server retains its existing physical custodian through hosted admission;
// neither the volume reference nor a transport close proves retirement.
message AttachVolumeRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  MachineId machine = 3;
  acyclic.harness.v2.VolumeRef selected_volume_ref = 4;
}
message CheckpointMachineRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  MachineId machine = 3;
}
message ForkCheckpointRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  CheckpointId checkpoint = 3;
  uint32 count = 4;
  reserved 5;
  reserved "performance";
}
// Forks a running machine, without an intermediate checkpoint, into `count` fresh
// children. Admission requires CAPABILITY_LIVE_FORK or CAPABILITY_DISK_FORK in the source
// machine's contract; a provider or machine without either rejects with UNIMPLEMENTED so
// callers fall back to Checkpoint + Fork or a restart. The admitted ForkFidelity states
// what the children inherited. Children inherit the source's exact MachineContract and
// receive fresh MachineIds and endpoints; open network connections are never carried over.
// See the acyclic-machines crate documentation for the complete semantics.
message ForkMachineRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  MachineId machine = 3;
  uint32 count = 4;
}
message SetSuspensionPolicyRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  MachineId machine = 3;
  SuspensionPolicy policy = 4;
}
message CheckpointMutationRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
  CheckpointId checkpoint = 3;
}
message RecoverRequest {
  ProtocolVersion protocol = 1;
  IdempotencyKey idempotency_key = 2;
}
message InspectMachineRequest {
  ProtocolVersion protocol = 1;
  MachineId machine = 2;
}
message InspectCheckpointRequest {
  ProtocolVersion protocol = 1;
  CheckpointId checkpoint = 2;
}
message ListMachinesRequest {
  ProtocolVersion protocol = 1;
  MachineId after = 2;
  uint32 limit = 3;
}
message OperationRequest {
  ProtocolVersion protocol = 1;
  OperationId operation = 2;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_PENDING = 1;
  OPERATION_STATUS_SUCCEEDED = 2;
  OPERATION_STATUS_CANCELLED = 3;
  OPERATION_STATUS_INDETERMINATE = 4;
  OPERATION_STATUS_FAILED = 5;
}
message OperationState {
  OperationId operation = 1;
  OperationStatus status = 2;
  // Original committed result, retained with terminal success. Later mutations
  // of the resource cannot replace this operation's settled observations.
  MutationOutcome outcome = 3;
}
enum MachineStatus {
  MACHINE_STATUS_UNSPECIFIED = 0;
  MACHINE_STATUS_STARTING = 1;
  MACHINE_STATUS_RUNNING = 2;
  MACHINE_STATUS_SUSPENDING = 3;
  MACHINE_STATUS_SUSPENDED = 4;
  MACHINE_STATUS_WAKING = 5;
  MACHINE_STATUS_DESTROYING = 6;
  MACHINE_STATUS_DESTROYED = 7;
  MACHINE_STATUS_FAILED = 8;
  MACHINE_STATUS_INDETERMINATE = 9;
  // Unreachable until its own device or guest reconnects. Unlike SUSPENDED, the
  // provider cannot bring it back: Wake and Exec return UNAVAILABLE.
  MACHINE_STATUS_OFFLINE = 10;
}
message Endpoint {
  string name = 1;
  string uri = 2;
}
message MachineState {
  MachineId machine = 1;
  MachineStatus status = 2;
  MachineContract contract = 3;
  repeated Endpoint endpoints = 4;
  CheckpointId last_checkpoint = 5;
  uint64 created_at_unix_ms = 6;
  uint64 changed_at_unix_ms = 7;
}
message MachinePage {
  repeated MachineState machines = 1;
  MachineId next = 2;
}
message CheckpointState {
  CheckpointId checkpoint = 1;
  MachineId source = 2;
  MachineContract contract = 3;
  bool forkable = 4;
  uint64 created_at_unix_ms = 5;
}
message MachineAdmission {
  MachineId machine = 1;
  OperationId operation = 2;
  MachineContract contract = 3;
}
message CheckpointAdmission {
  CheckpointId checkpoint = 1;
  MachineId source = 2;
  OperationId operation = 3;
  MachineContract contract = 4;
}
message ForkAdmission {
  CheckpointId checkpoint = 1;
  repeated MachineId children = 2;
  OperationId operation = 3;
  MachineContract contract = 4;
}
enum ForkFidelity {
  FORK_FIDELITY_UNSPECIFIED = 0;
  // Children resume from the source's memory, processes, and disk at the fork instant.
  FORK_FIDELITY_MEMORY_AND_DISK = 1;
  // Children boot fresh over a copy of the source's persistent disk (provider-defined; see
  // CAPABILITY_DISK_FORK) taken at one consistent instant; no process state is inherited.
  FORK_FIDELITY_DISK_ONLY = 2;
}
message ForkMachineAdmission {
  MachineId source = 1;
  repeated MachineId children = 2;
  OperationId operation = 3;
  MachineContract contract = 4;
  ForkFidelity fidelity = 5;
}
message PolicyAdmission {
  MachineId machine = 1;
  OperationId operation = 2;
  SuspensionPolicy policy = 3;
}
message MutationAdmission {
  OperationId operation = 1;
  MachineId machine = 2;
  CheckpointId checkpoint = 3;
}
message RecoveredAdmission {
  OperationId operation = 1;
  oneof result {
    MachineAdmission create = 2;
    CheckpointAdmission checkpoint = 3;
    ForkAdmission fork = 4;
    MutationAdmission suspend = 5;
    MutationAdmission wake = 6;
    MutationAdmission destroy_machine = 7;
    PolicyAdmission set_suspension_policy = 8;
    MutationAdmission destroy_checkpoint = 9;
    ForkMachineAdmission fork_machine = 10;
    MachineAdmission attach_volume = 11;
  }
}

// Retained terminal result. Unlike an admission, this contains the checked
// observations produced after the operation has completed.
message ForkedMachines {
  repeated MachineState machines = 1;
}
message ForkedLiveMachines {
  MachineId source = 1;
  ForkFidelity fidelity = 2;
  repeated MachineState children = 3;
}
message PolicySet {
  MachineId machine = 1;
  SuspensionPolicy policy = 2;
}
message MutationOutcome {
  oneof result {
    MachineState created = 1;
    CheckpointState checkpointed = 2;
    ForkedMachines forked = 3;
    MachineId suspended = 4;
    MachineId woken = 5;
    PolicySet suspension_policy_set = 6;
    MachineId machine_destroyed = 7;
    CheckpointId checkpoint_destroyed = 8;
    ForkedLiveMachines machine_forked = 9;
    MachineState volume_attached = 10;
  }
}
message OperationPage {
  repeated OperationState operations = 1;
}

enum PressureKind {
  PRESSURE_KIND_UNSPECIFIED = 0;
  PRESSURE_KIND_CUSTOMER_BUDGET = 1;
  PRESSURE_KIND_MACHINE_LIMIT = 2;
  PRESSURE_KIND_SERVICE_SATURATION = 3;
}
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_STATE = 1;
  EVENT_KIND_PRESSURE = 2;
  EVENT_KIND_CAPACITY = 3;
}
message MachineEvent {
  MachineId machine = 1;
  uint64 sequence = 2;
  uint64 observed_at_unix_ms = 3;
  EventKind kind = 4;
  MachineStatus state = 5;
  PressureKind pressure = 6;
}
message EventsRequest {
  ProtocolVersion protocol = 1;
  MachineId machine = 2;
  uint64 after_sequence = 3;
  uint32 limit = 4;
}
message EventPage {
  repeated MachineEvent events = 1;
  uint64 next_sequence = 2;
}
message UsageRequest {
  ProtocolVersion protocol = 1;
  MachineId machine = 2;
  uint64 start_unix_ms = 3;
  uint64 end_unix_ms = 4;
}
message UsageReceipt {
  MachineId machine = 1;
  uint64 start_unix_ms = 2;
  uint64 end_unix_ms = 3;
  // Guest vCPU time actually run, in nanoseconds. Granted but idle cores add nothing.
  uint64 cpu_ns = 4;
  reserved 5;
  reserved "dedicated_cpu_ns";
  // Proportional set size (Pss) of guest memory integrated over time, in byte-seconds.
  // Pages shared with fork relatives are split between them, so the charges add
  // up to host memory actually used.
  uint64 resident_byte_seconds = 6;
  uint64 durable_private_bytes = 7;
  reserved 8;
  reserved "lineage_shared_bytes";
  bytes lineage_receipt_sha256 = 11;
  uint64 egress_bytes = 9;
  bytes receipt = 10;
}

// Executes once in the current admitted guest. A lost reply, cancellation or
// timeout does not prove the command did not run; clients must not redispatch.
// On a SUSPENDED PROVISIONED Machine whose policy is after_idle_ms, Exec first
// wakes it within this same RPC and deadline; a manual-policy Machine is refused
// with FAILED_PRECONDITION instead. An OFFLINE Machine returns UNAVAILABLE.
message ExecStart {
  ProtocolVersion protocol = 1;
  MachineId machine = 2;
  reserved 3, 8;
  reserved "argv", "stdin";
  // Positive command deadline in milliseconds, covering any implicit wake. The
  // caller authority's expiry remains an independent upper bound, even while no
  // output is produced. A deadline the server cannot represent is rejected,
  // never shortened.
  uint64 timeout_ms = 4;
  optional uint64 expiry_unix_ms = 5;
  // Combined stdout/stderr allowance; absent is unbounded, zero allows no bytes.
  optional uint64 maximum_output_bytes = 6;
  // Guest working directory, never a path on the client host.
  optional string cwd = 7;
}
// One original ordered RPC, without replay or replacement after uncertain delivery.
// Start occurs exactly once, first, and fixes account/incarnation/deadline admission.
// One or more arguments follow, then command_complete permits execution. Native
// OS exec, not a transport envelope, determines the command's argument capacity.
// Incomplete command input can never launch a process. EOF before command_complete
// cancels assembly; input loss afterwards retains uncertainty until original cleanup.
// After command_complete, stdin frames and stdin_eof are distinct process input.
// Pull input only as original guest consumed-input credit permits; transport flow
// control must propagate backpressure, never accumulate a whole-command queue.
message ExecInput {
  oneof input {
    ExecStart start = 1;
    ExecArgument argument = 2;
    ExecMarker command_complete = 3;
    // 1..65536 exact binary bytes, followed by exactly one stdin_eof marker.
    bytes stdin = 4;
    ExecMarker stdin_eof = 5;
  }
}
message ExecArgument {
  // At most 65536 bytes; empty data requires end=true. UTF-8 code points may span
  // frames. Validate the complete
  // argument as NUL-free UTF-8; argv[0] is nonempty. Empty later arguments survive.
  bytes data = 1;
  bool end = 2;
}
message ExecMarker {}
enum ExecStopKind {
  EXEC_STOP_KIND_UNSPECIFIED = 0;
  EXEC_STOP_KIND_TIMEOUT = 1;
  EXEC_STOP_KIND_EXPIRED = 2;
  EXEC_STOP_KIND_OUTPUT_LIMIT = 3;
  EXEC_STOP_KIND_CONTROL_STOPPED = 4;
  EXEC_STOP_KIND_CAPTURE_FAILED = 5;
}
message ExecStop {
  ExecStopKind kind = 1;
  string message = 2;
  // False preserves uncertainty about surviving guest processes.
  bool cleanup_completed = 3;
}
enum ExecStream {
  EXEC_STREAM_UNSPECIFIED = 0;
  EXEC_STREAM_STDOUT = 1;
  EXEC_STREAM_STDERR = 2;
}
message ExecData {
  ExecStream stream = 1;
  // Exact binary channel bytes, 1..65536 per frame.
  bytes bytes = 2;
}
message ExecOutput {
  MachineId machine = 1;
  reserved 2, 4;
  reserved "stderr";
  // Protocol 1.2 tags each Data frame as STDOUT or STDERR and preserves its
  // channel's exact order. Earlier protocol revisions must be refused before
  // execution, not interpreted as tagged channels.
  // Exactly one exit-code or stopped frame terminates the stream.
  oneof output {
    ExecData data = 6;
    int32 exit_code = 3;
    ExecStop stopped = 5;
  }
}
// Reads the live retained guest console, without a lifecycle operation identity.
message ReadOutputRequest {
  ProtocolVersion protocol = 1;
  MachineId machine = 2;
  uint64 offset = 3;
  // Maximum returned bytes, 1..65536.
  uint32 limit = 4;
}
message MachineOutput {
  MachineId machine = 1;
  // At or after the requested offset; a later offset exposes discarded bytes.
  // The next read starts at offset + data length, with overflow rejected.
  uint64 offset = 2;
  // Empty data means no newer bytes now, not permanent EOF.
  bytes data = 3;
}

// Native guest IO; these are not lifecycle mutations or shell commands. The
// server joins the caller's original account/incarnation and file grant before
// touching the guest. One absolute deadline covers admission and completion.
// A file RPC binds its first FileAccess machine/path/deadline for its lifetime;
// later chunks retain that admission and supply their own exact offsets. Each
// request yields one ordered native completion. The producer pulls requests and
// yields replies under transport backpressure, without eagerly collecting either
// side. Dropping either side retires that session; writes are never redispatched.
message FileAccess {
  MachineId machine = 1;
  // Absolute, NUL-free guest path, never a client host path.
  string path = 2;
  uint64 offset = 3;
  uint64 deadline_unix_ms = 4;
}
message ReadFileRequest {
  ProtocolVersion protocol = 1;
  FileAccess access = 2;
  // One chunk, 1..65536 bytes. The file itself has no size limit.
  uint32 limit = 3;
}
message ReadFileResponse {
  MachineId machine = 1;
  uint64 offset = 2;
  oneof result {
    // Empty data is EOF; a short read is preserved exactly.
    bytes data = 3;
    // Nonzero POSIX errno from the native guest operation.
    uint32 errno = 4;
  }
}
message WriteFileRequest {
  ProtocolVersion protocol = 1;
  FileAccess access = 2;
  // At most 65536 bytes. No shell or text encoding is involved.
  bytes data = 3;
  // Create if absent. Truncate first only when true, with offset zero.
  bool truncate = 4;
}
message WriteFileResponse {
  MachineId machine = 1;
  uint64 offset = 2;
  oneof result {
    // A short write is preserved; a lost reply never authorizes redispatch.
    uint32 written = 3;
    uint32 errno = 4;
  }
}

service MachinesService {
  rpc ReadFile(stream ReadFileRequest) returns (stream ReadFileResponse) { option (acyclic.validation.v1.auth) = { action: "machines/read-file" extractor: "machines.read-file" }; }
  rpc WriteFile(stream WriteFileRequest) returns (stream WriteFileResponse) { option (acyclic.validation.v1.auth) = { action: "machines/write-file" extractor: "machines.write-file" }; }
  rpc Exec(stream ExecInput) returns (stream ExecOutput) { option (acyclic.validation.v1.auth) = { action: "machines/exec" extractor: "machines.exec" }; }
  rpc ReadOutput(ReadOutputRequest) returns (MachineOutput) { option (acyclic.validation.v1.auth) = { action: "machines/read-output" extractor: "machines.read-output" }; }
  rpc QualifyImage(QualifyImageRequest) returns (ImageQualification) { option (acyclic.validation.v1.auth) = { action: "machines/qualify" extractor: "machines.qualify-image" }; }
  rpc Create(CreateMachineRequest) returns (MachineAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/create" extractor: "machines.create" }; }
  rpc AttachVolume(AttachVolumeRequest) returns (MachineAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/update" extractor: "machines.update" }; }
  rpc Checkpoint(CheckpointMachineRequest) returns (CheckpointAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/checkpoint" extractor: "machines.checkpoint" }; }
  rpc Fork(ForkCheckpointRequest) returns (ForkAdmission) { option (acyclic.validation.v1.auth) = { extractor: "machines.fork-checkpoint" }; }
  rpc ForkMachine(ForkMachineRequest) returns (ForkMachineAdmission) { option (acyclic.validation.v1.auth) = { extractor: "machines.fork-machine" }; }
  rpc Suspend(MachineMutationRequest) returns (MutationAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/update" extractor: "machines.update" }; }
  rpc Wake(MachineMutationRequest) returns (MutationAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/update" extractor: "machines.update" }; }
  rpc SetSuspensionPolicy(SetSuspensionPolicyRequest) returns (PolicyAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/update" extractor: "machines.update" }; }
  rpc DestroyMachine(MachineMutationRequest) returns (MutationAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/delete" extractor: "machines.delete" }; }
  rpc DestroyCheckpoint(CheckpointMutationRequest) returns (MutationAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/delete-checkpoint" extractor: "machines.delete-checkpoint" }; }
  rpc Recover(RecoverRequest) returns (RecoveredAdmission) { option (acyclic.validation.v1.auth) = { action: "machines/recover" extractor: "machines.recover" }; }
  rpc InspectMachine(InspectMachineRequest) returns (MachineState) { option (acyclic.validation.v1.auth) = { action: "machines/read" extractor: "machines.read" }; }
  rpc InspectCheckpoint(InspectCheckpointRequest) returns (CheckpointState) { option (acyclic.validation.v1.auth) = { action: "machines/read-checkpoint" extractor: "machines.read-checkpoint" }; }
  rpc ListMachines(ListMachinesRequest) returns (MachinePage) { option (acyclic.validation.v1.auth) = { action: "machines/list" extractor: "machines.list-visible" }; }
  rpc Events(EventsRequest) returns (EventPage) { option (acyclic.validation.v1.auth) = { action: "machines/follow" extractor: "machines.follow" }; }
  rpc Usage(UsageRequest) returns (UsageReceipt) { option (acyclic.validation.v1.auth) = { action: "machines/read-usage" extractor: "machines.read-usage" }; }
  rpc Cancel(OperationRequest) returns (OperationState) { option (acyclic.validation.v1.auth) = { action: "machines/cancel" extractor: "machines.cancel-operation" }; }
  rpc InspectOperation(OperationRequest) returns (OperationState) { option (acyclic.validation.v1.auth) = { action: "machines/read" extractor: "machines.read-operation" }; }
  rpc WatchOperation(OperationRequest) returns (stream OperationState) { option (acyclic.validation.v1.auth) = { action: "machines/read" extractor: "machines.read-operation" }; }
}
