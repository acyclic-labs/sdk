[package]
name = "acyclic-machines"
version = "0.2.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Machines contract, authenticated client, and deterministic simulator"
readme = "README.md"
documentation = "https://docs.rs/acyclic-machines"
keywords = ["machines", "compute", "grpc"]
categories = ["api-bindings"]

[features]
default = []
# Compatibility spelling; the build target owns transport availability.
grpc = []

[build-dependencies]
acyclic-sdk-contract-wire = { version = "=0.1.0", path = "../sdk-contract-wire" }
prost.workspace = true
prost-build.workspace = true
prost-types.workspace = true
tonic-prost-build.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
prost.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-sdk-contract-wire = { version = "=0.1.0", path = "../sdk-contract-wire" }
hyper-util = { workspace = true }
rustix = { workspace = true }
tonic = { workspace = true, features = ["codegen", "router"] }
tonic-prost = { workspace = true }
tower = { workspace = true }
tokio = { version = "1.48.0", default-features = false, features = ["fs", "macros", "net", "time", "rt-multi-thread"] }

[dev-dependencies]
tokio-stream.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
rcgen = "0.14.10"

[lints]
workspace = true
