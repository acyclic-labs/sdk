[package]
name = "acyclic-machines"
version = "0.1.5"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Machines contract, authenticated client, and deterministic simulator"
readme = "README.md"
documentation = "https://docs.rs/acyclic-machines"
keywords = ["machines", "compute", "grpc"]
categories = ["api-bindings"]

[features]
default = ["grpc"]
grpc = ["dep:hyper-util", "dep:rustix", "dep:tonic", "dep:tonic-prost", "dep:tower", "tokio/fs", "tokio/macros", "tokio/net", "tokio/time", "tokio/rt-multi-thread"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
hyper-util = { workspace = true, optional = true }
prost.workspace = true
rustix = { workspace = true, optional = true }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tokio-stream.workspace = true

[lints]
workspace = true
