[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
name = "acyclic-machines"
version = "0.2.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Machines contract, authenticated client, and deterministic simulator"
readme = "README.md"
documentation = "https://docs.rs/acyclic-machines"
keywords = ["machines", "compute", "grpc"]
categories = ["api-bindings"]


[features]
conformance = ["acyclic-stream/conformance", "tokio/time"]
default = ["grpc"]

local = ["dep:acyclic-native-runtime", "dep:rustix", "tokio/time", "tokio/macros"]
grpc = ["dep:acyclic-native-runtime", "dep:hyper-util", "dep:rustix", "dep:tonic", "dep:tonic-prost", "dep:tower", "tokio/macros"]

[dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
prost.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"], optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
rcgen = "0.14.10"
tokio-stream.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper-util = { workspace = true, optional = true }
rustix = { workspace = true, optional = true, features = ["fs"] }
tower = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tokio = { version = "1.48.0", default-features = false, features = ["net", "time", "rt-multi-thread"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", optional = true }
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tsify.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["local", "test-support"] }
tempfile = "3.27.0"
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[build-dependencies]
heck = "0.5.0"
prost.workspace = true
prost-types.workspace = true
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
