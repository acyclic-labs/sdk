[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
name = "acyclic-machines"
version = "0.2.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Machines contract, authenticated client, and deterministic simulator"
readme = "README.md"
documentation = "https://docs.rs/acyclic-machines"
keywords = ["machines", "compute", "grpc"]
categories = ["api-bindings"]

[[bin]]
name = "machines-managed-oci-contract"
test = false


[package.metadata.acyclic]
consumer-features = [{ features = [], target = "wasm32-unknown-unknown" }]

[features]
conformance = ["acyclic-stream/conformance", "tokio/time"]
test-support = [
    "acyclic-actors/test-support",
    "acyclic-auth/test-support",
    "acyclic-native-runtime/test-support",
    "acyclic-stream/test-support"]
http-codec = ["dep:acyclic-protobuf-json", "dep:prost-reflect"]

javascript = ["dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
acyclic-protobuf-json = { version = "=0.2.0", path = "../protobuf-json", optional = true }
prost-reflect = { workspace = true, optional = true }
acyclic-actors = { version = "=0.2.0", path = "../actors", default-features = false }
acyclic-observability = { version = "=0.2.0", path = "../observability" }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
prost.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time", "macros"] }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost = { workspace = true }
uuid.workspace = true

[dev-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
acyclic-actors = { version = "=0.2.0", path = "../actors", default-features = false, features = ["conformance"] }
proptest.workspace = true
rcgen = "0.14.10"
tokio-stream.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["grpc-metadata"] }
hyper-util = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
tower = { workspace = true }
tonic = { workspace = true, default-features = true, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1.48.0", default-features = false, features = ["net", "time", "rt-multi-thread", "macros"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
tsify.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-test-support = { path = "../test-support" }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["test-support"] }
tempfile = "3.27.0"
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-grpc-observability = { version = "=0.2.0", path = "../grpc-observability", default-features = false, features = ["test-support"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[build-dependencies]
heck = "0.5.0"
prost.workspace = true
prost-types.workspace = true
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
