[package]
name = "acyclic-actors-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API native remote Actors transport over the canonical Rust client"
publish = false
build = "build.rs"

[package.metadata.napi]
family = "actors"
npm-package = "@acyclic-labs/actors"
package-path = "typescript/packages/actors"
companion-directory = "actors-native"
wasm-package = "acyclic-actors-wasm"
wasm-output-name = "acyclic_actors_wasm"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-actors = { version = "=0.2.0", path = "../actors" }
napi = { workspace = true, features = ["tokio_rt"] }
napi-derive.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "=0.7.19", features = ["rt"] }

[build-dependencies]
napi-build = "2.3.1"

[lints]
workspace = true
