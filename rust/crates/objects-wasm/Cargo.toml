[package]
name = "acyclic-objects-wasm"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the canonical Objects memory provider"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["json"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
prost.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
