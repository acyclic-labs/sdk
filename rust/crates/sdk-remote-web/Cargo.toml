[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[package]
name = "acyclic-sdk-remote-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust-owned browser admission and response-boundary helpers for generated SDK transports"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
url = { version = "2.5.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.94"
wasm-bindgen = "=0.2.117"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

