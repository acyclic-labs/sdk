[package]
name = "acyclic-sdk-remote-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Rust-owned browser admission and response-boundary helpers for generated SDK transports"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
blake3 = "1.8.2"
bytes = "1.10.1"
prost = "0.14.4"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
url = { version = "2.5.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.94"
tonic-web-wasm-client = "=0.9.2"
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4.67"

[build-dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
prost = "0.14.4"
prost-types = "0.14.4"
tonic-prost-build = "0.14.6"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
