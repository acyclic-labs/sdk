[package]
name = "acyclic-harness-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline Arrow, Parquet, Inspect and PROV projections of original harness journals"

[features]
research = ["acyclic-harness-core/research"]

[dependencies]
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
arrayvec = { version = "0.7.8", default-features = false }
arrow-array = "=60.1.0"
arrow-ipc = { version = "=60.1.0", default-features = false }
arrow-schema = "=60.1.0"
base64 = "=0.23.1"
blake3.workspace = true
oxrdf = { version = "=0.3.5", default-features = false }
oxttl = { version = "=0.2.5", default-features = false }
parquet = { version = "=60.1.0", default-features = false, features = ["arrow"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["research", "test-support"] }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
bytes.workspace = true
futures.workspace = true
proptest.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread", "signal"] }
