[package]
name = "acyclic-stream-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated Stream protobuf messages, gRPC services and protocol identity"
include = ["Cargo.toml", "build.rs", "src/**", "proto/**"]

[package.metadata.bazel]
build-script-inputs = ["proto"]

[dependencies]
acyclic-auth-action = { version = "=0.2.0", path = "../auth-action" }
prost.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, default-features = true, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }

[lints]
workspace = true

[[bin]]
name = "stream-http-contract"
test = false
