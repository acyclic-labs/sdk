[package]
name = "acyclic-fs-napi"
publish = false
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API embedded engine for @acyclic-labs/fs"

[package.metadata.napi]
family = "filesystem"
npm-package = "@acyclic-labs/fs"
package-path = "typescript/packages/filesystem"
companion-directory = "filesystem-native"
npm-entrypoint = "browser.js"
wasm-package = "acyclic-fs-wasm"
wasm-output-name = "acyclic_fs_wasm"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", features = ["native-mount", "napi-types"] }
bytes.workspace = true
napi.workspace = true
napi-derive.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build = "2.3.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
