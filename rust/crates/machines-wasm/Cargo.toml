[package]
name = "acyclic-machines-wasm"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the canonical Machines simulator"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
sdk-machines-public = { path = "../sdk-machines-public" }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
futures.workspace = true
hex.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
tsify-next = { version = "0.5.6", features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true

