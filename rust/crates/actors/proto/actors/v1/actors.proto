syntax = "proto3";

package acyclic.actors.v1;

import "validation/v1/options.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/actors/v1;actorsv1";

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_ACTIVE = 1;
  ACTOR_STATE_HIBERNATED = 2;
  ACTOR_STATE_PAUSED = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_CAPABILITY_DENIED = 2;
  ERROR_CODE_CAPABILITY_EXPIRED = 3;
  ERROR_CODE_ACTOR_NOT_FOUND = 4;
  ERROR_CODE_SUBSCRIPTION_NOT_FOUND = 5;
  ERROR_CODE_IDEMPOTENCY_MISMATCH = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_ADMISSION_DENIED = 8;
  ERROR_CODE_CHECKPOINT_FAILED = 9;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 10;
}

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_PAUSED = 2;
}

message ActorLimits {
  uint64 handler_timeout_millis = 1;
  uint64 memory_bytes = 2;
  uint64 checkpoint_bytes = 3;
}

message ActorObservation {
  string actor_id = 1;
  bytes code_sha256 = 2;
  string home_region = 3;
  ActorState state = 4;
  repeated SubscriptionObservation subscriptions = 5;
  optional uint64 checkpoint_unix_millis = 6;
  uint64 checkpoint_epoch = 7;
  uint64 configuration_revision = 8;
  optional string namespace = 90;
  bytes account_id = 91;
  optional string observation_stream_path = 92;
}

message AddSubscriptionRequest {
  string actor_id = 1;
  SubscriptionSpec subscription = 2;
  string idempotency_key = 3;
  optional string namespace = 90;
  bytes account_id = 91;
}

message AddSubscriptionResponse {
  ActorObservation actor = 1;
}

message Binding {
  string name = 1;
  string capability = 2;
  string resource = 3;
  bytes target_account = 4;
  optional string actor_namespace = 5;
  optional string worker_service = 6;
  bool state_transaction = 7;
  optional string guest_admission = 8;
}

message CheckpointActorRequest {
  string actor_id = 1;
  string idempotency_key = 2;
  optional string namespace = 90;
  bytes account_id = 91;
}

message CheckpointActorResponse {
  ActorObservation actor = 1;
}

message DeleteAllRequest {
  string actor_id = 1;
  string idempotency_key = 2;
  optional string namespace = 90;
  bytes account_id = 91;
}

message DeleteAllResponse {
}

message DeleteWorkerRequest {
  string worker_name = 1;
  string idempotency_key = 2;
  bytes account_id = 3;
}

message DeleteWorkerResponse {
}

message DeploymentObservation {
  string name = 1;
  bytes code_sha256 = 2;
  uint64 revision = 3;
  string jurisdiction = 4;
  bytes account_id = 5;
}

message DeploymentRequest {
  bytes code_sha256 = 1;
  repeated Binding bindings = 3;
  ActorLimits limits = 4;
  repeated SubscriptionSpec subscriptions = 5;
  string idempotency_key = 6;
  string name = 7;
  bytes account_id = 8;
  string jurisdiction = 9;
  uint64 expected_revision = 10;
  WorkerLimits worker_limits = 11;
  repeated SecretSelection secrets = 12;
  FetchBinding fetch = 13;
}

message DeploymentResponse {
  DeploymentObservation deployment = 1;
}

message EgressRule {
  string host = 1;
  uint32 port = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message FetchBinding {
  string name = 1;
  repeated EgressRule egress = 2;
}

message Header {
  string name = 1;
  string value = 2;
}

message InspectActorRequest {
  string actor_id = 1;
  optional string namespace = 90;
  bytes account_id = 91;
}

message InspectActorResponse {
  ActorObservation actor = 1;
}

message InvocationOrder {
  string session = 1;
  uint64 sequence = 2;
}

message InvokeActorRequest {
  string actor_id = 1;
  string method = 2;
  string url = 3;
  bytes body = 4;
  repeated Header headers = 5;
  optional string namespace = 90;
  bytes account_id = 91;
  optional string location_hint = 92;
  optional string binding_name = 93;
  optional string rpc_method = 94;
  InvocationOrder invocation_order = 95;
}

message InvokeActorResponse {
  uint32 status = 1;
  bytes body = 2;
  repeated Header headers = 3;
}

message InvokeWorkerRequest {
  string worker_name = 1;
  string method = 2;
  string url = 3;
  bytes body = 4;
  repeated Header headers = 5;
  bytes account_id = 91;
  optional string binding_name = 92;
  optional string rpc_method = 94;
}

message RemoveSubscriptionRequest {
  string actor_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
  optional string namespace = 90;
  bytes account_id = 91;
}

message RemoveSubscriptionResponse {
  ActorObservation actor = 1;
}

message ResumeSubscriptionRequest {
  string actor_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
  optional string namespace = 90;
  bytes account_id = 91;
}

message ResumeSubscriptionResponse {
  ActorObservation actor = 1;
}

message SecretSelection {
  string name = 1;
  string reference = 2;
}

message SubscriptionObservation {
  string subscription_id = 1;
  string stream_path = 2;
  SubscriptionState state = 3;
  uint64 delivered_cursor = 4;
  uint64 completed_cursor = 5;
  uint64 recoverable_cursor = 6;
  bool placement_anchor = 7;
  uint32 retry_count = 8;
  string failure_code = 9;
  optional uint64 failed_cursor = 10;
}

message SubscriptionSpec {
  string subscription_id = 1;
  string stream_path = 2;
  SubscriptionStart start = 3;
  bool placement_anchor = 4;
}

message SubscriptionStart {
  oneof start {
    uint64 cursor = 1;
    bool current_head = 2;
  }
}

message UpdateNamespaceRequest {
  string namespace_id = 1;
  bytes code_sha256 = 2;
  repeated Binding bindings = 3;
  ActorLimits limits = 4;
  uint64 expected_configuration_revision = 5;
  string idempotency_key = 6;
  bytes account_id = 91;
  repeated SecretSelection secrets = 7;
  FetchBinding fetch = 8;
}

message UpdateNamespaceResponse {
  DeploymentObservation deployment = 1;
}

message WorkerLimits {
  uint32 cpu_millis = 1;
  uint32 memory_bytes = 2;
  uint32 timeout_millis = 3;
}

service ActorsService {
  rpc DeleteWorker(DeleteWorkerRequest) returns (DeleteWorkerResponse) {
    option (acyclic.validation.v1.auth) = { action: "workers/delete" extractor: "workers.delete" };
  }
  rpc InvokeWorker(InvokeWorkerRequest) returns (InvokeActorResponse) {
    option (acyclic.validation.v1.auth) = { action: "workers/invoke" extractor: "workers.invoke" };
  }
  rpc DeployNamespace(DeploymentRequest) returns (DeploymentResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/deploy-namespace" extractor: "actors.deploy-with-bindings" };
  }
  rpc DeployWorker(DeploymentRequest) returns (DeploymentResponse) {
    option (acyclic.validation.v1.auth) = { action: "workers/deploy" extractor: "workers.deploy-with-bindings" };
  }
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/update-namespace" extractor: "actors.update-namespace-with-bindings" };
  }
  rpc InspectActor(InspectActorRequest) returns (InspectActorResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/read" extractor: "actors.read" };
  }
  rpc AddSubscription(AddSubscriptionRequest) returns (AddSubscriptionResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/subscribe" extractor: "actors.subscribe" };
  }
  rpc RemoveSubscription(RemoveSubscriptionRequest) returns (RemoveSubscriptionResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/unsubscribe" extractor: "actors.unsubscribe" };
  }
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/resume" extractor: "actors.resume" };
  }
  rpc CheckpointActor(CheckpointActorRequest) returns (CheckpointActorResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/checkpoint" extractor: "actors.checkpoint" };
  }
  rpc InvokeActor(InvokeActorRequest) returns (InvokeActorResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/invoke" extractor: "actors.invoke" };
  }
  rpc DeleteAll(DeleteAllRequest) returns (DeleteAllResponse) {
    option (acyclic.validation.v1.auth) = { action: "actors/delete-all" extractor: "actors.delete" };
  }
}

