# Thresholds for the lints enabled in [workspace.lints.clippy] (Cargo.toml).
too-many-lines-threshold = 100
cognitive-complexity-threshold = 30
# Product and vendor names doc_markdown would otherwise want in backticks.
# `..` keeps clippy's built-in list (GitHub, macOS, JavaScript, ...).
doc-valid-idents = ["OpenAI", "ChatGPT", "MoonshotAI", ".."]
# Tests may unwrap, expect and panic; the workspace denies them elsewhere.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# The working directory belongs to the whole process: changing it moves every
# other thread's relative paths and the directory each later child starts in.
# Give a child its own directory with `Command::current_dir` instead.
# Raw spawns are confined to grpc-observability::task. Tests may deliberately
# construct broken paths; production modules deny disallowed_methods.
disallowed-methods = [
    { path = "std::env::set_current_dir", reason = "process-wide; use Command::current_dir" },
    { path = "tokio::spawn", reason = "use acyclic_grpc_observability::task::spawn" },
    { path = "tokio::task::spawn_blocking", reason = "use acyclic_grpc_observability::task::spawn_blocking" },
    { path = "tokio::task::JoinSet::spawn", reason = "use acyclic_grpc_observability::task::join_set" },
    { path = "tokio::runtime::Handle::spawn", reason = "preserve the caller dispatcher at admission" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "use acyclic_grpc_observability::task::runtime_blocking" },
    { path = "std::thread::spawn", reason = "use acyclic_grpc_observability::task::thread" },
    { path = "std::thread::Builder::spawn", reason = "use acyclic_grpc_observability::task::named_thread" },
    { path = "std::thread::Scope::spawn", reason = "use acyclic_grpc_observability::task::scoped_thread" },
]
