[package]
name = "acyclic-actors-timer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
acyclic-stream = { path = "../../stream", default-features = false, features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ts-rs = "=12.0.1"
thiserror = "2.0.17"
uuid = { version = "1.25.0", features = ["serde"] }

[[bin]]
name = "timer_record"
path = "fuzz_targets/timer_record.rs"
test = false
doc = false
bench = false
