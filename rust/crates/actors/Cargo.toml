[package]
name = "acyclic-actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Public Actors v1 contract and validation"
readme = "README.md"

[features]
default = []
codegen = ["dep:protoc-bin-vendored", "dep:tonic-prost-build"]

[dependencies]
prost.workspace = true
protify = { version = "=0.1.4", default-features = false, features = ["std"] }
prost-reflect = { workspace = true, features = ["serde"] }
serde_json.workspace = true
ts-rs = "=12.0.1"
thiserror.workspace = true
tonic-prost.workspace = true
protoc-bin-vendored = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport", "tls-ring", "tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-workers = { path = "../workers" }
tokio.workspace = true
rcgen = "0.14.10"

[lints]
workspace = true

[[bin]]
name = "actors-tonic-codegen"
path = "src/bin/actors-tonic-codegen.rs"
required-features = ["codegen"]
