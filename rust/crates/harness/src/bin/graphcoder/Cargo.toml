[package]
name = "graphcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autotests = false

[lib]
path = "lib.rs"

[features]
code-mode = ["acyclic-harness/code-mode"]

[[bin]]
name = "graphcoder"
path = "../graphcoder.rs"

[dependencies]
acyclic-harness = { path = "../../..", features = ["filesystem-local", "native-execution", "serve", "terminal", "tui", "search-http"] }
acyclic-harness-providers = { path = "../../../../harness-providers", features = ["local"] }
acyclic-native-runtime = { path = "../../../../native-runtime" }
acyclic-stream = { path = "../../../../stream", default-features = false }
clap.workspace = true
futures.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-std", "io-util", "net", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
acyclic-native-runtime = { path = "../../../../native-runtime", features = ["test-support"] }
acyclic-test-support = { path = "../../../../test-support" }
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }

[[test]]
name = "cli"
path = "tests/cli.rs"
