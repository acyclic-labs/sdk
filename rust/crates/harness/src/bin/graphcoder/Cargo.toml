[package]
name = "graphcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autotests = false

[[bin]]
name = "graphcoder"
path = "../graphcoder.rs"

[[example]]
name = "embedded"
path = "examples/embedded.rs"

[dependencies]
acyclic-plugin = { path = "../../../../../../plugin" }

[lints]
workspace = true

[dev-dependencies]
acyclic-harness = { path = "../../..", features = ["filesystem-local", "native-execution", "serve", "terminal", "tui", "search-http"] }
acyclic-harness-providers = { path = "../../../../harness-providers", features = ["local"] }
acyclic-native-runtime = { path = "../../../../native-runtime", features = ["test-support"] }
acyclic-test-support = { path = "../../../../test-support" }
axum.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-std", "io-util", "net", "signal", "time"] }

[[test]]
name = "cli"
path = "tests/cli.rs"
