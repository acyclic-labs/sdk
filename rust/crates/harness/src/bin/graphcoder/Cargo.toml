[package]
name = "graphcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autotests = false

[[bin]]
name = "graphcoder"
path = "../graphcoder.rs"

[dependencies]
acyclic-harness = { path = "../../..", features = ["filesystem-local", "native-execution", "terminal", "tui"] }
acyclic-harness-providers = { path = "../../../../harness-providers" }
clap.workspace = true
dirs.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util"] }

[lints]
workspace = true

[dev-dependencies]
acyclic-harness = { path = "../../..", features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
acyclic-stream = { path = "../../../../stream", default-features = false }
proptest.workspace = true
acyclic-test-support = { path = "../../../../test-support" }
alacritty_terminal = "0.26"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "tui"
path = "tests/tui.rs"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix-openpty = "0.2"

[dev-dependencies.axum]
workspace = true

[dev-dependencies.tempfile]
version = "3.27.0"
