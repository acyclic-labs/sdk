[package]
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"
build = "build.rs"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["host"]
host = ["dep:acyclic-stream", "dep:bytes", "dep:futures", "dep:tokio"]
wasm = ["dep:serde-wasm-bindgen", "dep:wasm-bindgen"]
filesystem = ["host", "dep:acyclic-fs", "acyclic-fs/memory"]
filesystem-local = ["filesystem", "acyclic-fs/local"]
grpc = ["host", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]
http = ["host", "dep:axum", "dep:prost-reflect"]
machines = ["host", "dep:acyclic-machines"]
models = ["host", "dep:reqwest"]

[dependencies]
acyclic-stream = { version = "=0.1.2", path = "../stream", default-features = false, optional = true }
acyclic-fs = { version = "=0.1.2", path = "../filesystem", default-features = false, optional = true }
acyclic-machines = { version = "=0.1.2", path = "../machines", optional = true }
axum = { workspace = true, optional = true }
blake3.workspace = true
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
jsonschema.workspace = true
prost-reflect = { workspace = true, optional = true }
prost.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tower.workspace = true

[[test]]
name = "openai_compat"
required-features = ["models"]

[lints]
workspace = true
