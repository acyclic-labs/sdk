[package]
include = ["clippy.toml", "Cargo.toml", "README.md", "src/**", "tests/**", "examples/**", "fixtures/**", "conformance/**", "fuzz/corpus/**", "fuzz-context/fuzz_targets/file_guidance_input.rs", "fuzz-context/corpus/file_guidance/**"]
autotests = false
autobins = false
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"

[[test]]
name = "dst"
path = "tests/dst/main.rs"
required-features = ["filesystem-local", "native-execution", "test-support"]

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "e2e-progress-model"
path = "tests/e2e_progress_model.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[[example]]
name = "native-process-approval"
required-features = ["filesystem"]

[[example]]
name = "approved-native-process"
required-features = ["native-execution", "test-support"]
test = true
harness = false

[[example]]
name = "custom_executor"
required-features = ["test-support"]

[[example]]
name = "explicit-image-conversion"
required-features = ["filesystem"]

[features]
tui = ["dep:acyclic-harness-tui", "acyclic-harness-tui/tui", "acyclic-harness-core/tui"]
test-support = ["dep:tempfile", "acyclic-stream/test-support", "acyclic-native-runtime/test-support", "acyclic-objects/test-support", "acyclic-harness-core/test-support", "acyclic-fs/test-support", "acyclic-harness-search/test-support"]
model-checking = ["dep:loom", "dep:same-file", "dep:tempfile", "acyclic-fs/model-checking", "acyclic-harness-core/model-checking"]
browser = ["wasm", "filesystem", "acyclic-fs/browser", "acyclic-harness-core/browser"]
# Native presentation only; this does not select providers or grant authority.
terminal = ["dep:hex", "dep:acyclic-markdown", "dep:ratatui", "acyclic-harness-core/terminal"]
wasm = ["acyclic-stream/wasm", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:tsify", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "acyclic-harness-core/wasm"]
# Provider adapters. Each pulls only its own SDK family.
filesystem = ["acyclic-fs/memory", "dep:hex", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "acyclic-harness-core/filesystem", "acyclic-harness-search/filesystem"]
filesystem-local = ["filesystem", "acyclic-fs/local", "acyclic-stream/local", "dep:dirs", "dep:getrandom", "dep:tempfile", "acyclic-harness-core/filesystem-local"]
# Explicit native host composition; portable defaults never select it.
native-execution = ["filesystem", "acyclic-fs/native-mount", "hooks", "mcp-stdio", "acyclic-harness-core/native-execution"]
# Native lifecycle commands can also be embedded without filesystem mounts.
hooks = ["dep:regex-lite", "dep:toml", "acyclic-harness-core/hooks"]
# Optional native HTTP I/O. Browser hosts implement the same portable boundary.
mcp-http = ["dep:reqwest", "dep:toml", "acyclic-harness-core/mcp-http"]
mcp-stdio = ["tokio/process", "tokio/io-util", "dep:toml", "dep:which", "acyclic-harness-core/mcp-stdio"]
search-http = ["dep:reqwest", "dep:keyring", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio-rustls", "tokio/net", "tokio/io-util", "acyclic-harness-core/search-http", "acyclic-harness-search/search-http"]
mcp-oauth = ["rmcp/auth", "rmcp/reqwest-tls-no-provider", "dep:rustls", "acyclic-harness-core/mcp-oauth"]
objects = ["dep:acyclic-objects", "acyclic-harness-core/objects"]
machines = ["dep:acyclic-machines", "acyclic-harness-core/machines"]
grpc = ["acyclic-stream/grpc", "dep:tonic", "dep:tonic-prost", "acyclic-harness-core/grpc"]

[dependencies]
once_cell = "1.21.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-harness-search = { version = "=0.2.0", path = "../harness-search" }
acyclic-harness-tui = { version = "=0.2.0", path = "../harness-tui", default-features = false, optional = true }
arrayvec = { version = "0.7.8", default-features = false }
async-trait.workspace = true
acyclic-markdown = { version = "=0.2.0", path = "../markdown", optional = true }
ratatui = { version = "=0.30.2", default-features = false, optional = true }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-machines = { version = "=0.2.0", path = "../machines", optional = true }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, optional = true }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
base64 = "=0.22.1"
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex = { workspace = true, optional = true }
http.workspace = true
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
regex-lite = { version = "0.1.9", optional = true }
js-sys = { workspace = true, optional = true }
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
schemars = "=1.2.2"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = { workspace = true, optional = true }
sse-stream.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true, optional = true }
tempfile = { version = "3.27.0", optional = true }
getrandom = { workspace = true, optional = true }
loom = { version = "=0.7.2", optional = true }
same-file = { version = "1.0.6", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true, optional = true }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { version = "0.1.3", optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"], optional = true }
keyring = { version = "3.6.3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
which = { version = "8.0.6", optional = true }
tokio = { version = "1.48.0", default-features = false, features = ["signal", "io-std", "io-util"] }

[dev-dependencies]
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["test-support"] }
acyclic-harness-search = { version = "=0.2.0", path = "../harness-search", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
proc-macro2 = "=1.0.107"
syn = { version = "=3.0.6", features = ["full", "visit"] }
proptest.workspace = true
diffy.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-util = { workspace = true, features = ["rt"] }
rcgen = "0.14.10"
tonic.workspace = true
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["serialize"] }
shuttle = "=0.8.1"
tracing-subscriber.workspace = true
loom = "0.7.2"
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["local", "test-support"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "process"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["grpc", "test-support"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Rust SDK execution uses the real browser event loop even without exports.
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true

[[test]]
name = "skills-context"
path = "tests/skills_context.rs"
required-features = ["filesystem-local", "native-execution", "test-support"]

[[test]]
name = "client-mailbox-model"
path = "tests/client_mailbox_model.rs"
required-features = ["model-checking"]

[[test]]
name = "query-model"
path = "tests/query_model.rs"
required-features = ["model-checking"]
