[package]
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
exclude = ["benches"]
documentation = "https://docs.rs/acyclic-harness"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "graphcoder"
path = "src/bin/graphcoder.rs"
required-features = ["terminal"]

[[example]]
name = "native-process-approval"
required-features = ["filesystem"]

[[example]]
name = "approved-native-process"
required-features = ["native-execution"]
test = true
harness = false

[[bench]]
name = "harness"
harness = false

[features]
# Native presentation only; this does not select providers or grant authority.
terminal = ["dep:hex"]
wasm = ["acyclic-stream/wasm", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:tsify", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
# Provider adapters. Each pulls only its own SDK family.
filesystem = ["dep:acyclic-fs", "acyclic-fs/memory", "dep:hex"]
filesystem-local = ["filesystem", "acyclic-fs/local", "acyclic-stream/local"]
# Explicit native host composition; portable defaults never select it.
native-execution = ["filesystem", "acyclic-fs/native-mount", "dep:acyclic-native-runtime"]
# Optional native HTTP I/O. Browser hosts implement the same portable boundary.
mcp-http = ["dep:reqwest"]
objects = ["dep:acyclic-objects"]
machines = ["dep:acyclic-machines"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]

[dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, optional = true }
acyclic-machines = { version = "=0.2.0", path = "../machines", optional = true }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, optional = true }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex = { workspace = true, optional = true }
http.workspace = true
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
js-sys = { workspace = true, optional = true }
prost.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
sse-stream.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
async-trait.workspace = true
proptest.workspace = true
acyclic-stream = { version = "=0.2.0", path = "../stream" }
tempfile = "3.27.0"
tokio.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", optional = true }
reqwest = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
