[package]
include = ["clippy.toml", "Cargo.toml", "README.md", "docs/**", "src/**", "tests/**", "examples/**", "fixtures/**", "conformance/**", "fuzz/corpus/**"]
autotests = false
autobins = false
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "native_receipt"
path = "tests/native_receipt.rs"

[[bin]]
name = "acyclic-virtiofsd"
path = "src/bin/virtiofsd.rs"

[[example]]
name = "native-process-approval"

[[example]]
name = "custom_executor"
required-features = ["test-support"]

[[example]]
name = "explicit-image-conversion"
# Selections real consumers compile (Cloud's native root, harness-conformance,
# the filesystem-napi N-API generator, and browser Wasm). Explicit targets keep
# each selection on the platform that implements its contract.
[package.metadata.acyclic]
consumer-features = [{ features = ["browser"], target = "wasm32-unknown-unknown" }]

[features]
research = ["acyclic-harness-core/research"]
provenance-export = ["metrics-export", "acyclic-harness-core/provenance-export"]
metrics-export = ["acyclic-harness-core/metrics-export"]
conformance = ["acyclic-fs/conformance", "acyclic-auth/test-support", "acyclic-stream/conformance", "acyclic-stream/test-support", "acyclic-harness-core/test-support", "dep:ed25519-dalek"]
test-support = ["acyclic-auth/test-support", "acyclic-machines/test-support", "acyclic-actors/test-support", "acyclic-stream/test-support", "acyclic-native-runtime/test-support", "acyclic-objects/test-support", "acyclic-harness-core/test-support", "acyclic-fs/test-support", "acyclic-harness-search/test-support"]
model-checking = ["dep:loom", "dep:same-file", "acyclic-fs/model-checking", "acyclic-harness-core/model-checking"]
browser = ["wasm", "acyclic-objects/javascript", "acyclic-fs/browser", "acyclic-harness-core/browser"]
wasm-journal = ["browser", "acyclic-stream/wasm-journal"]
wasm = ["acyclic-stream/wasm", "acyclic-harness-client/wasm", "dep:serde-wasm-bindgen", "dep:tsify", "acyclic-harness-core/wasm"]

[dependencies]
ed25519-dalek = { version = "3.0.0", optional = true }
once_cell = "1.21.3"
notify = { workspace = true }
pulldown-cmark.workspace = true
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-host-platform = { version = "=0.2.0", path = "../host-platform" }
acyclic-harness-client = { version = "=0.2.0", path = "../harness-client" }
acyclic-harness-search = { version = "=0.2.0", path = "../harness-search" }
acyclic-harness-tui = { version = "=0.2.0", path = "../harness-tui", default-features = false }
arrayvec = { version = "0.7.8", default-features = false }
async-trait.workspace = true
async-stream = "=0.3.6"
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-machines-daytona = { version = "=0.2.0", path = "../machines-daytona" }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
base64 = "=0.23.1"
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex = { workspace = true }
http.workspace = true
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
regex-lite = { version = "0.1.9" }
js-sys = { workspace = true }
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
schemars = "=1.2.3"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = { workspace = true }
sse-stream.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time", "io-util"] }
uuid.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "=0.30.2", default-features = false }
rmcp = { workspace = true, features = ["auth", "reqwest-tls-no-provider"] }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
dirs = { workspace = true }
tempfile = { version = "3.27.0" }
getrandom = { workspace = true }
loom = { version = "=0.7.3", optional = true }
same-file = { version = "1.0.6", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { workspace = true }
http-body-util = { version = "0.1.3" }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
tonic = { workspace = true }
tower.workspace = true
x509-parser = { version = "0.18.1" }
which = { version = "8.0.6" }
tokio = { version = "1.48.0", default-features = false, features = ["signal", "io-std", "io-util", "net", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["test-support"] }
acyclic-harness-search = { version = "=0.2.0", path = "../harness-search", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
proc-macro2 = "=1.0.107"
syn = { version = "=3.0.9", features = ["full", "visit"] }
proptest.workspace = true
diffy.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
which = "8.0.6"
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["test-support"] }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, features = ["test-support"] }
tokio-util = { workspace = true, features = ["rt"] }
rcgen = "0.14.10"
tonic.workspace = true
tonic-prost.workspace = true
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["serialize"] }
shuttle = "=0.9.8"
tracing-subscriber.workspace = true
loom = "0.7.3"
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "process", "io-util", "net"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["test-support", "conformance"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false, features = ["javascript"] }
# Rust SDK execution uses the real browser event loop even without exports.
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true
