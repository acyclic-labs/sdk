[package]
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["host"]
host = ["dep:acyclic-stream", "dep:bytes", "dep:futures", "dep:tokio"]
wasm = ["dep:js-sys", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dependencies]
acyclic-stream = { version = "=0.1.0", path = "../stream", default-features = false, optional = true }
blake3.workspace = true
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
jsonschema.workspace = true
js-sys = { workspace = true, optional = true }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
uuid.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[lints]
workspace = true
