[package]
include = ["build.rs", "clippy.toml", "Cargo.toml", "README.md", "docs/**", "src/**", "tests/**", "examples/**", "fixtures/**", "conformance/**", "fuzz/corpus/**"]
autotests = false
autobins = false
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"

[package.metadata.bazel]
integration-test-shards = 4

[package.metadata.bazel.test-data-linux.main_linux-guest]
kernel = "//guest:kernel"
initramfs = "//guest:initramfs.gz"
cloud_hypervisor = "//guest:cloud-hypervisor"
provenance = "//guest:provenance.json"

[package.metadata.bazel.test-env-linux.main_linux-guest]
ACYCLIC_FS_GUEST_ARTIFACTS = "$(rootpath //guest:provenance.json)"
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[[test]]
name = "main"
path = "tests/main.rs"


[[bin]]
name = "acyclic-virtiofsd"
path = "src/bin/virtiofsd.rs"

[[example]]
name = "native-process-approval"

[[example]]
name = "custom_executor"
required-features = ["test-support"]

[[example]]
name = "explicit-image-conversion"
# Selections real consumers compile (Cloud's native root, harness-conformance,
# the filesystem-napi N-API generator, and browser Wasm). Explicit targets keep
# each selection on the platform that implements its contract.
[package.metadata.acyclic]
consumer-features = [{ features = ["browser"], target = "wasm32-unknown-unknown" }]

[features]
research = ["acyclic-harness-core/research"]
conformance = ["dep:acyclic-harness-suite", "acyclic-fs/conformance", "acyclic-auth/test-support", "acyclic-stream/conformance", "acyclic-stream/test-support", "acyclic-harness-core/test-support", "dep:ed25519-dalek"]
test-support = ["acyclic-harness-hosting/test-support", "acyclic-harness-local/test-support", "acyclic-auth/test-support", "acyclic-machines/test-support", "acyclic-actors/test-support", "acyclic-stream/test-support", "acyclic-native-runtime/test-support", "acyclic-objects/test-support", "acyclic-harness-core/test-support", "acyclic-fs/test-support", "acyclic-fs-work/test-support", "acyclic-harness-search/test-support", "acyclic-machines-grpc/test-support"]
model-checking = ["dep:loom", "dep:same-file", "acyclic-fs/model-checking", "acyclic-harness-core/model-checking"]
browser = ["wasm", "acyclic-harness-browser/browser"]
wasm-journal = ["browser", "acyclic-stream/wasm-journal"]
wasm = ["dep:acyclic-harness-browser"]

[dependencies]
acyclic-fs-work = { version = "=0.2.0", path = "../filesystem-work" }
ed25519-dalek = { version = "3.0.0", optional = true }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-harness-hosting = { version = "=0.2.0", path = "../harness-hosting" }
acyclic-harness-local = { version = "=0.2.0", path = "../harness-local", default-features = false }
acyclic-harness-suite = { version = "=0.2.0", path = "../harness-suite", optional = true }
acyclic-harness-client = { version = "=0.2.0", path = "../harness-client" }
acyclic-harness-search = { version = "=0.2.0", path = "../harness-search" }
acyclic-harness-tui = { version = "=0.2.0", path = "../harness-tui", default-features = false }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["serde"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time", "io-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-harness-cli = { version = "=0.2.0", path = "../harness-cli" }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
loom = { version = "=0.7.3", optional = true }
same-file = { version = "1.0.6", optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
tokio = { version = "1.48.0", default-features = false, features = ["signal", "io-std", "io-util", "net", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
acyclic-fs-format = { version = "=0.2.0", path = "../filesystem-format" }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["test-support"] }
acyclic-harness-local = { version = "=0.2.0", path = "../harness-local", features = ["test-support"] }
acyclic-harness-search = { version = "=0.2.0", path = "../harness-search", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
proptest.workspace = true
diffy.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-async-rw", "auth", "reqwest-tls-no-provider"] }
which = "8.0.6"
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core", features = ["test-support"] }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, features = ["test-support"] }
rcgen = "0.14.10"
tonic = { workspace = true, default-features = true, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost.workspace = true
shuttle = "=0.9.8"
tracing-subscriber.workspace = true
loom = "0.7.3"
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "process", "io-util", "net"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["test-support", "conformance"] }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
prost.workspace = true
regex-lite = { version = "0.1.9" }
schemars = "=1.2.3"
sha2.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
acyclic-harness-browser = { version = "=0.2.0", path = "../harness-browser", optional = true }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false }
acyclic-machines-grpc = { version = "=0.2.0", path = "../machines-grpc", features = ["javascript"] }
# Rust SDK execution uses the real browser event loop even without exports.
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["test-support"] }
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true
