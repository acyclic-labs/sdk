[package]
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["acyclic-stream/wasm", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:tsify", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
browser = ["wasm", "filesystem", "acyclic-fs/browser"]
# Provider adapters. Each pulls only its own SDK family.
filesystem = ["dep:acyclic-fs", "acyclic-fs/memory", "dep:hex"]
filesystem-local = ["filesystem", "acyclic-fs/local", "acyclic-stream/local"]
objects = ["dep:acyclic-objects"]
machines = ["dep:acyclic-machines"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]

[dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, optional = true }
acyclic-machines = { version = "=0.2.0", path = "../machines", optional = true }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, optional = true }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex = { workspace = true, optional = true }
jsonschema.workspace = true
js-sys = { workspace = true, optional = true }
prost.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-trait.workspace = true
proptest.workspace = true
acyclic-stream = { version = "=0.2.0", path = "../stream" }
tempfile = "3.27.0"
tracing-subscriber.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[lints]
workspace = true
