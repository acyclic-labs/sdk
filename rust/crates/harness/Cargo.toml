[package]
name = "acyclic-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic durable substrate and fully composable agent runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-harness"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["filesystem-local"]
wasm = [] # Compatibility alias; wasm32 selects these bindings automatically.
# Provider adapters. Each pulls only its own SDK family.
filesystem = ["dep:acyclic-fs", "acyclic-fs/memory", "dep:hex"]
filesystem-local = ["filesystem", "acyclic-fs/local", "acyclic-stream/local"]
objects = ["dep:acyclic-objects"]
machines = ["dep:acyclic-machines"]
grpc = [] # Compatibility alias; native targets include the client automatically.

[target.'cfg(target_arch = "wasm32")'.dependencies]
acyclic-sdk-remote-web = { version = "=0.1.0", path = "../sdk-remote-web" }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
tsify-next = { version = "0.5.6", features = ["js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dependencies]
acyclic-fs = { version = "=0.2.0", path = "../filesystem", default-features = false, optional = true }
acyclic-machines = { version = "=0.2.0", path = "../machines", optional = true }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, optional = true }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hex = { workspace = true, optional = true }
jsonschema.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true }
tonic-prost = { workspace = true }

[dev-dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream" }
tempfile = "3.27.0"
tokio.workspace = true

[build-dependencies]
acyclic-sdk-contract-wire = { version = "=0.1.0", path = "../sdk-contract-wire" }
prost.workspace = true
prost-types.workspace = true
prost-build.workspace = true
tonic-prost-build = { workspace = true }

[lints]
workspace = true
