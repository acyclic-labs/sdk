[package]
name = "acyclic-harness-context-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
# Included harness sources use the including crate's feature namespace.
default = ["filesystem"]
filesystem = ["acyclic-harness/filesystem"]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
serde = "1"
acyclic-harness = { path = "..", features = ["filesystem-local", "native-execution", "terminal", "mcp-http", "test-support"] }

[[bin]]
name = "context_manifest"
path = "fuzz_targets/context_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_guidance"
path = "fuzz_targets/file_guidance.rs"
test = false
doc = false
bench = false
