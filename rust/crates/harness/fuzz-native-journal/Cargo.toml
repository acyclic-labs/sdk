[package]
name = "acyclic-native-journal-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
acyclic-fs = { path = "../../filesystem", default-features = false, features = ["memory", "local", "native-mount"] }
allocation-counter = "=0.8.1"
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"

[[bin]]
name = "native_journal"
path = "fuzz_targets/native_journal.rs"
test = false
doc = false
bench = false
