[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
default = ["runtime"]
runtime = [
    "dep:acyclic-harness", "dep:diffy", "dep:prost", "dep:bytes", "dep:rmcp",
    "dep:serde-saphyr", "dep:futures", "dep:tokio-util", "dep:which",
]
notifications = ["runtime", "acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[dependencies]
acyclic-harness = { path = "..", optional = true }
diffy = { version = "=0.5.2", optional = true }
libfuzzer-sys = "0.4"
prost = { version = "0.14.4", optional = true }
bytes = { version = "1", optional = true }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=1.3.0", features = ["serialize"], optional = true }
futures = { version = "0.3", optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
which = { version = "=8.0.6", optional = true }

[dev-dependencies]
allocation-counter = "0.8.1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[[bench]]
name = "memory_directory_page"
path = "benches/memory_directory_page.rs"

[[bin]]
name = "protocol_identity"
path = "fuzz_targets/protocol_identity.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "hook_output"
path = "fuzz_targets/hook_output.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "goal_parser"
path = "fuzz_targets/goal_parser.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "client_diff"
path = "fuzz_targets/client_diff.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "command_parser"
path = "fuzz_targets/command_parser.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "notification_scenario"
path = "fuzz_targets/notification_scenario.rs"
required-features = ["notifications"]
test = false
doc = false
bench = false

[[bin]]
name = "input_paths"
path = "fuzz_targets/input_paths.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "memory_directory"
path = "fuzz_targets/memory_directory.rs"
test = false
doc = false
bench = false
