[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[profile.dev]
opt-level = 3
debug-assertions = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
notifications = ["acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[dependencies]
libfuzzer-sys = "0.4"
futures = "0.3.32"
acyclic-harness = { path = "..", features = ["filesystem", "search-http", "test-support"] }
acyclic-fs = { path = "../../filesystem", default-features = false, features = ["memory"] }
acyclic-stream = { path = "../../stream" }
prost = "0.14.4"
bytes = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
which = "=8.0.6"

[[bin]]
name = "search_http_codec"
path = "fuzz_targets/search_http_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_request"
path = "fuzz_targets/search_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_identity"
path = "fuzz_targets/protocol_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_output"
path = "fuzz_targets/hook_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "goal_parser"
path = "fuzz_targets/goal_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notification_scenario"
path = "fuzz_targets/notification_scenario.rs"
required-features = ["notifications"]
test = false
doc = false
bench = false

[[bin]]
name = "input_paths"
path = "fuzz_targets/input_paths.rs"
test = false
doc = false
bench = false
