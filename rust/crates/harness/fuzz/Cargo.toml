[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
acyclic-harness = { path = ".." }
libfuzzer-sys = "0.4"
bytes = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde = "1"
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }
which = "=8.0.6"

[[bin]]
name = "goal_parser"
path = "fuzz_targets/goal_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false
