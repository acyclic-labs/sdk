[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
notifications = ["acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[dependencies]
acyclic-harness = { path = ".." }
acyclic-stream = { path = "../../stream", default-features = false }
diffy = "=0.5.2"
libfuzzer-sys = "0.4"
prost = "0.14.4"
bytes = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=1.3.0", features = ["serialize"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
which = "=8.0.6"

[[bin]]
name = "protocol_identity"
path = "fuzz_targets/protocol_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_output"
path = "fuzz_targets/hook_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "goal_parser"
path = "fuzz_targets/goal_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_markdown"
path = "fuzz_targets/plan_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_diff"
path = "fuzz_targets/client_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_parser"
path = "fuzz_targets/command_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notification_scenario"
path = "fuzz_targets/notification_scenario.rs"
required-features = ["notifications"]
test = false
doc = false
bench = false

[[bin]]
name = "input_paths"
path = "fuzz_targets/input_paths.rs"
test = false
doc = false
bench = false
