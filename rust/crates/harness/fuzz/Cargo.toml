[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[features]
notifications = ["dep:acyclic-harness"]

[dependencies]
acyclic-harness = { path = "..", optional = true, features = ["test-support", "filesystem-local", "mcp-http"] }
libfuzzer-sys = "0.4"
bytes = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }
which = "=8.0.6"

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notification_scenario"
path = "fuzz_targets/notification_scenario.rs"
required-features = ["notifications"]
test = false
doc = false
bench = false
