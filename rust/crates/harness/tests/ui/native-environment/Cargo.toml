[package]
license.workspace = true
name = "hermetic-environment-ui"
version = "0.0.0"
edition = "2024"
publish = false

# Compile the real seam for the positive/negative compiler checks. Its unit
# tests belong to harness-core, whose dev-dependencies and crate context they use.
[lib]
test = false
bench = false
doctest = false

[features]
# Each `negative` control must fail clippy; check-hermetic-clippy.mjs expects
# exactly those rejections, and the passing clippy matrix never enables it.
negative = []
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true }
acyclic-host-platform = { version = "=0.2.0", path = "../../../../host-platform" }

[package.metadata.acyclic]
compiler-negative-features = ["negative"]

[package.metadata.bazel]
library-test-features = ["negative"]
library-test-variant = "negative"

[lints]
workspace = true
