[package]
license.workspace = true
name = "hermetic-environment-ui"
version = "0.0.0"
edition = "2024"
publish = false

# Compile the real seam for the positive/negative compiler checks. Its unit
# tests belong to harness-core, whose dev-dependencies and crate context they use.
[lib]
test = false
bench = false
doctest = false

[features]
negative = []
filesystem-local = ["dep:dirs"]
native-execution = ["dep:acyclic-host-platform"]
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true, optional = true }
acyclic-host-platform = { version = "=0.2.0", path = "../../../../host-platform", optional = true }
