[package]
name = "acyclic-fs-daemon"
publish = false
version = "0.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-authority daemon and native mount owner"

[[bin]]
name = "fsd"
path = "src/main.rs"

[dependencies]
acyclic-fs = { path = "../filesystem", features = ["native-mount"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
thiserror.workspace = true
bytes.workspace = true
hex.workspace = true
base64 = "0.22.1"

[lints]
workspace = true
