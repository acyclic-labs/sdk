[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "effect_certificate"
path = "fuzz_targets/effect_certificate.rs"
test = false
doc = false
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(acyclic_harness_loom)", "cfg(fuzzing)"] }

[features]
default = ["runtime"]
runtime = ["dep:acyclic-harness", "dep:diffy", "dep:serde-saphyr", "dep:prost", "dep:acyclic-fs", "dep:acyclic-stream", "dep:futures", "dep:tempfile", "dep:bytes", "dep:rmcp", "dep:uuid", "dep:tokio", "dep:tokio-util", "dep:which"]
filesystem-access = ["runtime", "acyclic-harness/test-support", "acyclic-harness/filesystem"]
notifications = ["runtime", "acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[dependencies]
blake3.workspace = true
acyclic-harness = { path = "../harness", features = ["terminal", "tui", "filesystem-local", "native-execution", "grpc", "test-support", "search-http", "objects"], optional = true }
diffy = { workspace = true, optional = true }
serde-saphyr = { version = "=1.3.0", features = ["serialize"], optional = true }
libfuzzer-sys = "0.4"
prost = { workspace = true, optional = true }
acyclic-fs = { path = "../filesystem", default-features = false, features = ["local"], optional = true }
acyclic-stream = { path = "../stream", default-features = false, optional = true }
futures = { workspace = true, optional = true }
serde_json.workspace = true
tempfile = { version = "3.27.0", optional = true }

bytes = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["client", "transport-async-rw"], optional = true }
serde.workspace = true
uuid = { workspace = true, optional = true }
tokio = { workspace = true, features = ["test-util"], optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
which = { version = "=8.0.6", optional = true }

