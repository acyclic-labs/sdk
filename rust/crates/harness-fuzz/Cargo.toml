[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(acyclic_harness_loom)"] }

[features]
notifications = ["acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[dependencies]
acyclic-harness = { path = "../harness", features = ["terminal", "filesystem-local", "native-execution", "grpc", "test-support", "search-http"] }
diffy.workspace = true
serde-saphyr = { version = "=1.3.0", features = ["serialize"] }
libfuzzer-sys = "0.4"
prost.workspace = true
acyclic-fs = { path = "../filesystem", default-features = false, features = ["local"] }
acyclic-stream = { path = "../stream", default-features = false }
futures.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"

bytes.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
serde.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true, features = ["codec"] }
which = "=8.0.6"

[[bin]]
name = "search_http_codec"
path = "fuzz_targets/search_http_codec.rs"
test = false
doc = false
bench = false

