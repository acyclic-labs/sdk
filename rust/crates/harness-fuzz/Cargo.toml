[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "local_state_directory"
path = "fuzz_targets/local_state_directory.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "effect_certificate"
path = "fuzz_targets/effect_certificate.rs"
test = false
doc = false
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(fuzzing)"] }

[features]
default = ["runtime"]
runtime = ["dep:acyclic-harness", "dep:acyclic-native-runtime", "dep:diffy", "dep:serde-saphyr", "dep:prost", "dep:acyclic-fs", "dep:acyclic-stream", "dep:futures", "dep:tempfile", "dep:bytes", "dep:rmcp", "dep:uuid", "dep:tokio", "dep:tokio-util", "dep:which"]
# Harness sources included by `#[path]` gate native helpers on these features;
# the fuzz runtime compiles them as the native harness it depends on does.
filesystem-access = ["runtime", "acyclic-harness/test-support", "acyclic-harness/filesystem"]


[dependencies]
acyclic-native-runtime = { path = "../native-runtime", optional = true }
harness-mock-model = { path = "../harness-mock-model" }
blake3.workspace = true
acyclic-harness = { path = "../harness", features = ["terminal", "tui", "filesystem-local", "native-execution", "grpc", "test-support", "search-http", "objects"], optional = true }
diffy = { workspace = true, optional = true }
serde-saphyr = { version = "=1.3.0", features = ["serialize"], optional = true }
libfuzzer-sys = "0.4"
prost = { workspace = true, optional = true }
acyclic-fs = { path = "../filesystem", default-features = false, features = ["local"], optional = true }
acyclic-stream = { path = "../stream", default-features = false, optional = true }
futures = { workspace = true, optional = true }
serde_json.workspace = true
tempfile = { version = "3.27.0", optional = true }

bytes = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["client", "transport-async-rw"], optional = true }
serde.workspace = true
uuid = { workspace = true, optional = true }
tokio = { workspace = true, features = ["test-util"], optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
which = { version = "=8.0.6", optional = true }

[[bin]]
name = "mock_model_script"
path = "fuzz_targets/mock_model_script.rs"
test = false
doc = false
bench = false

