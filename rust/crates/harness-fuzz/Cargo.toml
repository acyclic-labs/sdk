[package]
autotests = false
license.workspace = true
name = "acyclic-harness-fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

# Integration tests also build every enabled binary, even with test = false.
[lib]
path = "tests/lib.rs"
doc = false
doctest = false
bench = false

[[bin]]
name = "native_answer"
path = "fuzz_targets/native_answer.rs"
required-features = ["native-answer"]
test = false
doc = false
bench = false

[[bin]]
name = "native_host_admission"
path = "fuzz_targets/native_host_admission.rs"
required-features = ["core"]
test = false
doc = false
bench = false

[[bin]]
name = "native_session_log"
path = "fuzz_targets/native_session_log.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "native_workspace_endpoint"
path = "fuzz_targets/native_workspace_endpoint.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "native_workspace_request"
path = "fuzz_targets/native_workspace_request.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "command_result"
path = "fuzz_targets/command_result.rs"
required-features = ["core"]
test = false
doc = false
bench = false

[[bin]]
name = "retained_skill_records"
path = "fuzz_targets/retained_skill_records.rs"
required-features = ["native-skill-records"]
test = false
doc = false
bench = false

[[bin]]
name = "config_evaluation"
path = "fuzz_targets/config_evaluation.rs"
required-features = ["core"]
test = false
doc = false
bench = false

[[bin]]
name = "local_state_directory"
path = "fuzz_targets/local_state_directory.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(fuzzing)", 'cfg(feature, values("hooks", "wasm"))'] }

[features]
default = ["runtime"]
mcp-stdio-codec = ["dep:acyclic-mcp", "dep:bytes", "dep:rmcp", "dep:tokio-util"]
core = ["dep:acyclic-harness-core", "dep:futures"]
oidc = ["core", "acyclic-harness-core/oidc", "dep:bytes", "dep:acyclic-stream", "dep:p256", "dep:ed25519-dalek"]
native-answer = ["core", "dep:acyclic-native-runtime"]
code-mode = ["core", "acyclic-harness-core/filesystem", "dep:tokio"]
native-arguments = ["core", "acyclic-harness-core/filesystem"]
native-skill-records = ["core", "acyclic-harness-core/filesystem-local", "acyclic-harness-core/native-execution"]
native-settings = ["core", "dep:tempfile", "acyclic-harness-core/filesystem-local", "acyclic-harness-core/native-execution"]
client = ["dep:acyclic-harness-client", "dep:acyclic-stream"]
native-input = ["dep:acyclic-harness", "dep:tempfile", "acyclic-harness/filesystem-local", "acyclic-harness/native-execution"]
runtime = ["native-settings", "filesystem-local", "native-execution", "native-input", "acyclic-harness/terminal", "acyclic-harness/tui", "acyclic-harness/grpc", "acyclic-harness/test-support", "acyclic-harness/search-http", "acyclic-harness/objects", "dep:acyclic-native-runtime", "dep:diffy", "dep:serde-saphyr", "dep:prost", "dep:acyclic-fs", "dep:acyclic-stream", "dep:futures", "dep:bytes", "dep:rmcp", "dep:uuid", "dep:tokio", "dep:tokio-util", "dep:which"]
# Harness sources included by `#[path]` gate native helpers on these features;
# the fuzz runtime compiles them as the native harness it depends on does.
filesystem-access = ["runtime", "acyclic-harness/test-support", "acyclic-harness/filesystem"]
filesystem-local = []
native-execution = []

[dependencies]
acyclic-mcp = { path = "../mcp", features = ["stdio"], optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"], optional = true }
acyclic-harness-core = { path = "../harness-core", default-features = false, features = ["hooks", "test-support"], optional = true }
acyclic-native-runtime = { path = "../native-runtime", optional = true }
harness-mock-model = { path = "../harness-mock-model" }
blake3.workspace = true
base64 = "=0.22.1"
clap.workspace = true
acyclic-harness-client = { path = "../harness-client", features = ["agents"], optional = true }
acyclic-harness = { path = "../harness", default-features = false, optional = true }
diffy = { workspace = true, optional = true }
serde-saphyr = { version = "=2.0.0", features = ["serialize"], optional = true }
libfuzzer-sys = "0.4"
prost = { workspace = true, optional = true }
acyclic-fs = { path = "../filesystem", default-features = false, features = ["local"], optional = true }
acyclic-stream = { path = "../stream", default-features = false, optional = true }
futures = { workspace = true, optional = true }
serde_json.workspace = true
toml.workspace = true
tempfile = { version = "3.27.0", optional = true }

bytes = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["client", "transport-async-rw"], optional = true }
serde.workspace = true
uuid = { workspace = true, optional = true }
tokio = { workspace = true, features = ["test-util"], optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
which = { version = "=8.0.6", optional = true }

