[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
acyclic-harness = { path = "../harness", features = ["terminal", "filesystem-local", "grpc", "native-execution", "test-support"] }
libfuzzer-sys = "0.4"
prost.workspace = true
acyclic-stream = { path = "../stream", default-features = false }
futures.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
bytes.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
serde.workspace = true
serde-saphyr = { version = "=1.3.0", features = ["serialize"] }
diffy = "=0.5.2"
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true, features = ["codec"] }
which = "=8.0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
notifications = ["acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[[bin]]
name = "client_recovery"
path = "fuzz_targets/client_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_files"
path = "fuzz_targets/client_files.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command"
path = "fuzz_targets/command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_identity"
path = "fuzz_targets/protocol_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_output"
path = "fuzz_targets/hook_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "goal_parser"
path = "fuzz_targets/goal_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notification_scenario"
path = "fuzz_targets/notification_scenario.rs"
required-features = ["notifications"]
test = false
