[package]
name = "acyclic-harness-providers-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "native_image"
path = "fuzz_targets/native_image.rs"
test = false
doc = false
bench = false

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
acyclic-harness-providers = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "provider_stream"
path = "fuzz_targets/provider_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_sequence"
path = "fuzz_targets/response_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "turns"
path = "fuzz_targets/turns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_arguments"
path = "fuzz_targets/tool_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog"
path = "fuzz_targets/catalog.rs"
test = false
doc = false
bench = false

# Match the workspace debug profile while preserving assertions and ASAN.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
