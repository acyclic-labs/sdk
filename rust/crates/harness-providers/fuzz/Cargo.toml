[package]
name = "acyclic-harness-providers-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
acyclic-harness-providers = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "provider_stream"
path = "fuzz_targets/provider_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_sequence"
path = "fuzz_targets/response_sequence.rs"
test = false
doc = false
bench = false
