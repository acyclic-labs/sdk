[package]
name = "acyclic-workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cloud Worker deployment through Objects and Actors"
readme = "README.md"

[dependencies]
acyclic-manifest = { version = "=0.2.0", path = "../manifest" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["http"] }
bytes.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["http"] }
axum.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
