[package]
name = "acyclic-workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cloud Worker deployment through Objects and Actors"
readme = "README.md"

[dependencies]
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-manifest = { version = "=0.2.0", path = "../manifest" }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["http"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["http", "conformance"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["conformance", "test-support"] }
hex.workspace = true
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[lints]
workspace = true
