[package]
name = "acyclic-machines-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authenticated gRPC transport for the public Machines provider seam"

[features]
javascript = ["dep:js-sys", "dep:wasm-bindgen-futures"]
test-support = []

[dependencies]
acyclic-auth = { path = "../auth", version = "=0.2.0", features = ["grpc"] }
acyclic-machines = { path = "../machines", version = "=0.2.0", default-features = false }
acyclic-observability = { path = "../observability", version = "=0.2.0" }
acyclic-stream = { path = "../stream", version = "=0.2.0", default-features = false }
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-native-runtime = { path = "../native-runtime", version = "=0.2.0" }
hyper-util.workspace = true
rustix = { workspace = true, features = ["fs"] }
tower.workspace = true
tonic = { workspace = true, default-features = true, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { workspace = true, features = ["net", "time", "rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
acyclic-grpc-observability = { path = "../grpc-observability", version = "=0.2.0", default-features = false, features = ["test-support"] }
acyclic-machines-simulation = { path = "../machines-simulation", version = "=0.2.0", features = ["test-support"] }
proptest.workspace = true
rcgen = "0.14.10"
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tokio-stream.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
