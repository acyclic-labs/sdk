[package]
autotests = false
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "build/**", "vendor/**"]
name = "acyclic-stream-contract-engine"
version = "0.2.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
description = "Hierarchical append-only Streams engine: providers, tracing, synchronization and runtime"
readme = "README.md"
documentation = "https://docs.rs/acyclic-stream-contract-engine"
keywords = ["streams", "events", "grpc"]
categories = ["api-bindings", "data-structures"]
build = "build.rs"

[package.metadata.bazel]
build-script-inputs = []
unit-test-only-sources = [
    "src/pull_tests.rs",
]

[lib]
crate-type = ["rlib"]

[features]
conformance = ["acyclic-stream-contract-core/conformance"]
model-checking = ["conformance", "acyclic-stream-contract-core/model-checking", "dep:loom", "dep:tempfile"]
test-support = ["conformance", "acyclic-stream-contract-core/test-support", "acyclic-native-runtime/test-support", "acyclic-auth/test-support", "acyclic-stream-contract-bytes/test-support"]
# Shared byte-array encoding; decoding alone never authenticates native custody.
serde = ["acyclic-stream-contract-core/serde", "dep:serde"]
# Admitted JavaScript byte ownership without a provider or transport.
js-bytes = ["acyclic-stream-contract-core/js-bytes", "dep:wasm-bindgen", "acyclic-stream-contract-bytes/js-bytes"]
wasm-journal = ["acyclic-stream-contract-core/wasm-journal", "dep:wasm-bindgen"]
wasm = ["js-bytes", "serde", "acyclic-auth/js-credential", "dep:wasm-bindgen", "dep:web-sys", "tokio/macros"]

[dependencies]
acyclic-stream-contract-core = { version = "=0.2.0", path = "../stream-contract-core" }
acyclic-decimal-u64 = { version = "=0.2.0", path = "../decimal-u64" }
acyclic-stream-wire = { version = "=0.2.0", path = "../stream-wire" }
acyclic-observability = { version = "=0.2.0", path = "../observability" }
acyclic-collections = { version = "=0.2.0", path = "../collections" }
web-time = { version = "1.1.0" }
loom = { version = "0.7.3", features = ["futures"], optional = true }
tempfile = { version = "3.27.0", optional = true }
acyclic-contract-derive = { version = "=0.2.0", path = "../contract-derive" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
acyclic-stream-contract-bytes = { version = "=0.2.0", path = "../stream-contract-bytes" }
async-trait.workspace = true
blake3 = "1.8.2"
bytes.workspace = true
futures.workspace = true
pin-project-lite = "0.2.17"
http.workspace = true
prost.workspace = true
ruzstd.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
sha2.workspace = true
smallvec = "1.16.2"
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time", "rt", "macros"] }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost = { workspace = true }
uuid.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
web-sys = { workspace = true, features = ["MessageChannel", "MessageEvent"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["grpc"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }

[dev-dependencies]
proptest.workspace = true
acyclic-stream-contract-bytes = { path = "../stream-contract-bytes", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
tokio = { version = "1.48.0", features = ["macros", "rt", "test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
wasm-bindgen-test = "=0.3.67"
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
web-sys = { workspace = true, features = ["Performance"] }

[lints]
workspace = true
