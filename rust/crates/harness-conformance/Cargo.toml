[package]
name = "acyclic-harness-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal Harness report qualification command"
default-run = "harness-conformance"

[lib]
doctest = false

[[bin]]
name = "scenarios"
path = "src/scenarios.rs"
test = false

[[bin]]
name = "harness-conformance"
path = "src/main.rs"
test = false

[dependencies]
acyclic-harness = { version = "=0.2.0", path = "../harness", features = ["test-support", "filesystem-local"] }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", features = ["memory"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", features = ["local"] }
futures.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile = "3.27.0"
reqwest.workspace = true
acyclic-conformance = { version = "=0.2.0", path = "../conformance" }
blake3.workspace = true
serde_json.workspace = true

[[test]]
name = "provider-integration"
path = "tests/provider-integration/main.rs"

[dev-dependencies]
acyclic-harness = { version = "=0.2.0", path = "../harness", features = ["test-support", "filesystem-local", "native-execution", "mcp-http", "mcp-stdio", "search-http"] }
acyclic-harness-providers = { version = "=0.2.0", path = "../harness-providers" }
acyclic-test-support = { path = "../test-support" }
bytes.workspace = true
prost.workspace = true
proptest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
async-trait.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "test-util"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
serde.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
