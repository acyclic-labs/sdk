[package]
autotests = false
name = "acyclic-harness-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal Harness scenario substrates and parity oracles"
default-run = "scenarios"

[lib]
doctest = false

[[bin]]
name = "scenarios"
path = "src/scenarios.rs"
test = false

[dependencies]
acyclic-fs-format = { version = "=0.2.0", path = "../filesystem-format" }
acyclic-fs-work = { version = "=0.2.0", path = "../filesystem-work" }
acyclic-test-support = { path = "../test-support" }
acyclic-harness = { version = "=0.2.0", path = "../harness", features = ["test-support"] }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-fs = { version = "=0.2.0", path = "../filesystem" }
acyclic-stream = { version = "=0.2.0", path = "../stream" }
futures.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json.workspace = true

[dev-dependencies]
acyclic-actors = { version = "=0.2.0", path = "../actors", features = ["conformance"] }
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["test-support"] }
acyclic-fs-merge = { version = "=0.2.0", path = "../filesystem-merge" }
acyclic-host-platform = { version = "=0.2.0", path = "../host-platform" }
acyclic-machines = { version = "=0.2.0", path = "../machines", default-features = false, features = ["test-support"] }
base64 = "=0.23.1"
blake3.workspace = true
bytes.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["test-util", "process", "io-util"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
async-trait.workspace = true
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
serde.workspace = true
tempfile = "3.27.0"

[package.metadata.bazel]
# The git facade cases are their own test binary: one group's generic
# instantiation never pays for another's, and the two compile in parallel.
linked-unit-tests = ["main", "git_executor"]

[package.metadata.bazel.test-dependencies]
# The example is a compile-time probe of the public provider owners; it needs only
# the crates it names, not the suite's whole dev-dependency closure.
shared_provider_layout = ["acyclic_harness_conformance", "acyclic_fs", "acyclic_objects", "acyclic_stream", "serde_json"]

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "git_executor"
path = "tests/git_executor.rs"
