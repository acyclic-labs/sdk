[package]
autotests = false
name = "acyclic-harness-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal Harness scenario substrates and parity oracles"
default-run = "scenarios"

[lib]
doctest = false

[[bin]]
name = "scenarios"
path = "src/scenarios.rs"
test = false

[dependencies]
acyclic-fs-work = { version = "=0.2.0", path = "../filesystem-work" }
acyclic-test-support = { path = "../test-support" }
acyclic-harness = { version = "=0.2.0", path = "../harness", features = ["test-support"] }
acyclic-harness-core = { version = "=0.2.0", path = "../harness-core" }
acyclic-fs = { version = "=0.2.0", path = "../filesystem" }
acyclic-stream = { version = "=0.2.0", path = "../stream" }
futures.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
async-trait.workspace = true
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
serde.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
