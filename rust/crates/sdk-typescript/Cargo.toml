[package]
name = "sdk-typescript"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Standalone Rust-owned SDK-family TypeScript metadata generator"

# Deliberately remains an independent workspace while the Rust-owned model is
# reviewed. It must not become a root-workspace generation dependency yet.
[workspace]

[dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "deny"
