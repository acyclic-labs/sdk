[package]
name = "acyclic-markdown-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
acyclic-markdown = { path = ".." }
libfuzzer-sys = "0.4"
unicode-width = "0.2"
syntect = { package = "acyclic-syntect", version = "=0.2.0", path = "../../../vendor/syntect-5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "test-support"] }

[[bin]]
name = "streaming"
path = "fuzz_targets/streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "table_width"
path = "fuzz_targets/table_width.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "2"

[[bin]]
name = "syntax_data"
path = "fuzz_targets/syntax_data.rs"
test = false
doc = false
bench = false
