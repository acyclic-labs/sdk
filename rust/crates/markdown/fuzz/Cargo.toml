[package]
name = "acyclic-markdown-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
acyclic-markdown = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "streaming"
path = "fuzz_targets/streaming.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "2"
