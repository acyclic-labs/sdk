[package]
autotests = false
name = "acyclic-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Incremental Markdown presentation as renderer-independent styled lines"

[[test]]
name = "streaming"
path = "tests/streaming.rs"

[[test]]
name = "streaming_properties"
path = "tests/streaming_properties.rs"

[[bench]]
name = "audit"
harness = false

[dependencies]
acyclic-markdown-work = { path = "../markdown-work", version = "0.2.0" }
pulldown-cmark.workspace = true
syntect = { package = "acyclic-syntect", version = "=0.2.0", path = "../../vendor/syntect-5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
unicase = "2.10"

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
# Feature unification enables instrumentation in the parser for tests/benches,
# without a dependency cycle or counters in ordinary consumers.
acyclic-markdown-work = { path = "../markdown-work", version = "0.2.0", features = ["enabled"] }
proptest.workspace = true
serde = "1.0"
serde_json = "1.0"

[lints]
workspace = true
