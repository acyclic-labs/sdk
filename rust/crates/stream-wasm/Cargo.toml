[package]
name = "acyclic-stream-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly memory provider for acyclic-stream"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-stream = { version = "=0.1.5", path = "../stream", default-features = false }
bytes.workspace = true
futures.workspace = true
prost.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
