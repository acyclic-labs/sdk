description = "A Rust-first protobuf framework to generate packages from rust code, with validation included"
readme = "README.md"
keywords = [
    "protobuf",
    "validation",
    "schema",
    "generation",
    "no_std",
]
categories = [
    "no-std",
    "development-tools",
]
license = "MPL-2.0"
repository = "https://github.com/Rick-Phoenix/protify"

[package.metadata.release]
