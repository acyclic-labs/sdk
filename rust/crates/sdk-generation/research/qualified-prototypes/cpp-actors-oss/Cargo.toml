[package]
name = "cpp-actors-oss-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["staticlib"]

[workspace]

[dependencies]
acyclic-actors = { version = "0.2.0", path = "../../../../actors" }
cxx = "=1.0.202"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[build-dependencies]
cxx-build = "=1.0.202"
