[workspace]
members = ["rust/crates/actors"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/sdk"
publish = true

[workspace.dependencies]
prost = "0.14.4"
prost-reflect = "0.16.3"
protoc-bin-vendored = "3.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
match_same_arms = "warn"
single_match_else = "warn"
if_not_else = "warn"
cast_possible_truncation = "warn"
string_slice = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
redundant_clone = "warn"

[profile.dev]
incremental = false
