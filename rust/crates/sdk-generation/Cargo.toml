[package]
name = "sdk-generation"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Fixed Rust-owned SDK documentation generation and drift entrypoint"
default-run = "sdk-generation"

[workspace]

[dependencies]
acyclic-actors = { path = "../actors", default-features = false }
depinfo = "=0.7.10"
protoc-bin-vendored = "=3.2.0"
protify = { version = "=0.1.4", default-features = false, features = ["std"] }
sdk-docs = { path = "../sdk-docs" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tonic-prost-build = "=0.14.6"
ts-rs = "=12.0.1"
