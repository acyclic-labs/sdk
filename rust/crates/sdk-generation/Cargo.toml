[package]
name = "sdk-generation"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Fixed Rust-owned SDK documentation generation and drift entrypoint"
default-run = "sdk-generation"

[build-dependencies]
sha2 = "=0.10.9"

[workspace]

[dependencies]
acyclic-actors = { path = "../actors", default-features = false }
