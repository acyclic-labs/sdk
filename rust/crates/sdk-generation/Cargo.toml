[package]
name = "acyclic-sdk-generation"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Deterministic orchestration and qualification for Rust-owned SDK generation"

# This bootstrap CLI is intentionally standalone until the parent workspace
# integrates it. Keeping an empty workspace here makes direct locked builds
# reproducible without editing the root workspace manifest.
[workspace]

[dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
flate2 = "=1.1.10"
tar = "=0.4.46"

[[bin]]
name = "sdk-generation"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
