[package]
name = "acyclic-sdk-generation"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Deterministic orchestration and qualification for Rust-owned SDK generation"
default-run = "sdk-generation"

# Keep the orchestration crate standalone so locked builds remain reproducible
# without editing the root workspace manifest.
[workspace]

[dependencies]
acyclic-sdk-contract-wire = { path = "../sdk-contract-wire" }
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
flate2 = "=1.1.10"
tar = "=0.4.46"

[[bin]]
name = "sdk-generation"
path = "src/main.rs"

[[bin]]
name = "sdk-platform-receipt"
path = "src/bin/sdk-platform-receipt.rs"

[[bin]]
name = "sdk-stream-native-receipt"
path = "src/bin/sdk-stream-native-receipt.rs"

[[bin]]
name = "verify-rpc-observations"
path = "src/bin/verify-rpc-observations.rs"

[[bin]]
name = "verify-observations"
path = "src/bin/verify-observations.rs"

[[bin]]
name = "sdk-runtime-consumer"
path = "src/bin/sdk-runtime-consumer.rs"

[lints.rust]
unsafe_code = "deny"
