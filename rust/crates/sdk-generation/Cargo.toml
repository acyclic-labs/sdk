[package]
license.workspace = true
autotests = false
name = "sdk-generation"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
default-run = "sdk-generation"

[package.metadata.bazel]
# Every case is an independent real-binary end-to-end run with its own private
# fixture, CARGO_HOME and temporary directory, so the suite uses the whole CPU
# reservation its isolated_test declares instead of running one case at a time.
test-workers = 2
# The cli_regressions harness selects the pinned rustup toolchains and their
# installed targets; these are the host facts the package's tests read.
test-env-inherit = ["PATH", "RUSTUP_HOME", "CARGO_HOME"]

[package.metadata.bazel.test-tools.sdk_generation_test]
CARGO = "@sdk_compilers//:cargo"
rustc = "@sdk_compilers//:rustc"
rustup = "@sdk_compilers//:rustup"

[package.metadata.bazel.test-tools.main]
CARGO = "@sdk_compilers//:cargo"
rustc = "@sdk_compilers//:rustc"
rustup = "@sdk_compilers//:rustup"

[package.metadata.bazel.test-data.main]
rustdoc-fixtures = "//rust/proofs/sdk-rustdoc-fixtures:feature_profiles"

[dependencies]
sdk-docs = { path = "../sdk-docs" }
sdk-file-identity = { path = "../sdk-docs/file-identity" }
cargo_metadata = "=0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "=0.17.14"
tar = "0.4"
flate2 = "1"
tempfile = "=3.27.0"

[dev-dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
acyclic-test-support = { path = "../test-support" }
hex.workspace = true
sha2 = "0.11"
sdk-docs = { path = "../sdk-docs", features = ["test-support"] }
proptest = "1.11.0"
toml = "=1.1.6"

[[bin]]
name = "registry-transport-fixture"
path = "tests/support/registry_transport.rs"
test = false
bench = false
doc = false

[[bin]]
name = "sdk-generation"
test = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
model-checking = []

[[test]]
name = "main"
path = "tests/main.rs"
