[package]
name = "acyclic-auth-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly holder API for the shared capability verifier"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth" }
js-sys.workspace = true
prost.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Headers", "Request", "RequestInit", "AbortController", "AbortSignal", "RequestRedirect", "RequestCredentials", "RequestCache", "ReferrerPolicy", "Response"] }
url = "=2.5.8"
zeroize.workspace = true

[dev-dependencies]
ed25519-dalek = "=3.0.0"
proptest.workspace = true

[lints]
workspace = true
