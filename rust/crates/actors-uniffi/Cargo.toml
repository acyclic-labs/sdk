[package]
name = "acyclic-actors-uniffi"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "UniFFI facade over the Rust-owned Actors semantic client"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "actors-uniffi-bindgen"
path = "src/bin/actors-uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
acyclic-actors = { path = "../actors", features = ["uniffi"] }
thiserror = "2.0.17"
tokio-util = "=0.7.19"
uniffi = { version = "=0.31.0", features = ["tokio", "scaffolding-ffi-buffer-fns"] }

