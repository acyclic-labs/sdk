[bindings.kotlin]
generate_immutable_records = true

[bindings.kotlin.custom_types.ActorId]
nominal = true
validator = "validateActorId"
imports = ["uniffi.acyclic_actors_uniffi.validateActorId"]

[bindings.kotlin.custom_types.CodeSha256]
nominal = true
validator = "validateCodeSha256"
imports = ["uniffi.acyclic_actors_uniffi.validateCodeSha256"]

[bindings.kotlin.custom_types.PositiveU64]
nominal = true
validator = "validatePositiveU64"
imports = ["uniffi.acyclic_actors_uniffi.validatePositiveU64"]

# The marker keeps the bool wire representation but cannot forge false in a
# foreign constructor; validation is delegated to the Rust conversion.
[bindings.kotlin.custom_types.CurrentHeadMarker]
nominal = true
validator = "validateCurrentHead"
imports = ["uniffi.acyclic_actors_uniffi.validateCurrentHead"]

[bindings.python.custom_types.ActorId]
nominal = true
validator = "acyclic_actors_uniffi.validate_actor_id"

[bindings.python.custom_types.CodeSha256]
nominal = true
validator = "acyclic_actors_uniffi.validate_code_sha256"

[bindings.python.custom_types.PositiveU64]
nominal = true
validator = "acyclic_actors_uniffi.validate_positive_u64"

# Other bindings may opt into nominal wrappers only after their generator
# exposes the same Rust-backed validator hook. Semantic predicates must remain
# in the Rust domain and must not be repeated in this config.

[bindings.dart]
readonly_collections = true

[bindings.dart.custom_types.ActorId]
nominal = true
validator = "validateActorId"
imports = ["acyclic_actors_uniffi.dart"]

[bindings.dart.custom_types.CodeSha256]
nominal = true
validator = "validateCodeSha256"
imports = ["acyclic_actors_uniffi.dart"]

[bindings.dart.custom_types.PositiveU64]
nominal = true
validator = "validatePositiveU64"
imports = ["acyclic_actors_uniffi.dart"]

# CurrentHead remains a Rust-owned true-only oneof payload. The generated Dart
# enum retains the Rust shape; invalid false is rejected by Rust projection.
