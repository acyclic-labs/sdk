[package]
name = "acyclic-native-file"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Native file primitives shared by Acyclic host consumers"
documentation = "https://docs.rs/acyclic-native-file"
keywords = ["filesystem", "io", "runtime"]
categories = ["filesystem"]

[features]
model-checking = ["dep:loom"]
test-support = []

[dependencies]
loom = { version = "=0.7.3", optional = true }
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = { version = "0.2.5", features = ["std"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
tempfile = "3.27.0"

[lints]
workspace = true
