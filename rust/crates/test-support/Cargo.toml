[package]
name = "acyclic-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
acyclic-differential = { path = "../differential" }
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "time"] }

