[package]
name = "acyclic-sdk-examples"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
description = "Rust-owned executable scenarios and SDK snippet renderers"
build = "build.rs"

[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"

[[example]]
name = "render"
path = "examples/render.rs"

[[bin]]
name = "sdk-examples"
path = "src/main.rs"

[[bin]]
name = "inference-rsa-fixture"
path = "src/bin/inference-rsa-fixture.rs"

[dependencies]
acyclic-actors = { path = "../actors" }
acyclic-fs = { package = "acyclic-fs", path = "../filesystem" }
acyclic-harness = { path = "../harness" }
acyclic-inference = { path = "../inference" }
acyclic-machines = { path = "../machines" }
acyclic-objects = { path = "../objects" }
acyclic-stream = { path = "../stream", features = ["grpc"] }
acyclic-workers = { path = "../workers" }
sdk-source-identity = { path = "../sdk-source-identity" }
bytes = "1.10.1"
futures = "0.3.31"
hex = "0.4.3"
prost = "0.14.4"
prost-reflect = { version = "0.16.3", features = ["serde"] }
rcgen = { version = "0.14.10", features = ["aws_lc_rs"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "test-util"] }

[build-dependencies]
sha2 = "0.10.9"
serde_json = "1.0.145"
sdk-source-identity = { path = "../sdk-source-identity" }
