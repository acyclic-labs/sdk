[package]
name = "acyclic-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared Model Context Protocol framing and native tool serving"
documentation = "https://docs.rs/acyclic-mcp"

[features]
stdio = ["dep:bytes", "dep:futures", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio-util"]

[dependencies]
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["client", "transport-async-rw"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }

[target.'cfg(loom)'.dependencies]
loom = "=0.7.2"

[lints]
workspace = true
