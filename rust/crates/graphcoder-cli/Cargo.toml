[package]
name = "acyclic-graphcoder-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Native JSON-lines host for the local GraphCoder swarm"

[[bin]]
name = "graphcoder-runtime"
path = "src/main.rs"

[dependencies]
acyclic-harness = { version = "=0.2.0", path = "../harness", features = ["filesystem-local", "native-process-tree"] }
acyclic-fs = { version = "=0.2.0", path = "../filesystem", features = ["local", "native-mount"] }
blake3.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
