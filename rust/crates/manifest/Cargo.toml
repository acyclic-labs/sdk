[package]
name = "acyclic-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded deployment manifest admission shared by Cloud and SDK tooling"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
acyclic-actors = { version = "=0.2.0", path = "../actors" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
schemars = "=1.2.3"
ts-rs = "=12.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
acyclic-objects = { version = "=0.2.0", path = "../objects", default-features = false, features = ["javascript"] }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["js-bytes"] }
futures.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false, features = ["test-support"] }
proptest.workspace = true
bytes.workspace = true
futures.workspace = true
tokio.workspace = true

[lints]
workspace = true
