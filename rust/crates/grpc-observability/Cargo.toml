[package]
name = "acyclic-grpc-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared terminal observability for first-party gRPC clients"

[features]
task-context = ["dep:tracing", "dep:tokio"]
default = ["runtime"]
runtime = ["dep:http-body", "dep:pin-project-lite", "dep:tonic", "dep:tracing"]
codegen = ["dep:syn", "dep:prettyplease"]
test-support = ["dep:http-body", "dep:tonic", "dep:tracing", "dep:tracing-subscriber", "dep:tokio", "tokio/time", "dep:rcgen", "dep:tempfile"]

[dependencies]
tracing = { workspace = true, optional = true }
syn = { version = "=3.0.6", features = ["full", "visit"], optional = true }
prettyplease = { version = "=0.3.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync"], optional = true }
tracing-subscriber = { workspace = true, optional = true }
rcgen = { version = "0.14.10", optional = true }
tempfile = { version = "3.27.0", optional = true }
http-body = { version = "1.1.0", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
tonic = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ctor = { version = "=1.0.13", default-features = false }
acyclic-test-support = { path = "../test-support", features = ["capture"] }
futures.workspace = true
http-body = "1.1.0"
tonic.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
rcgen = "0.14.10"
tempfile = "3.27.0"
tracing-subscriber.workspace = true
tracing.workspace = true

[lints]
workspace = true
