[package]
name = "acyclic-grpc-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared terminal observability for first-party gRPC clients"

[features]
default = ["runtime"]
runtime = ["dep:http-body", "dep:pin-project-lite", "dep:tonic", "dep:tracing"]
codegen = ["dep:syn", "dep:prettyplease"]

[dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"], optional = true }
prettyplease = { version = "=0.2.37", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
http-body = { version = "1.1.0", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
