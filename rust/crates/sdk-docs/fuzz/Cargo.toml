[package]
name = "sdk-docs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[features]
default = ["test-support"]
test-support = []

[dependencies]
acyclic-fuzz-support = { path = "../../../fuzz/support" }
cargo_metadata = "=0.23.1"
libfuzzer-sys = "0.4"
rustdoc-types = "=0.60.0"
serde_json = "1"

[[bin]]
name = "rustdoc_adapter"
path = "fuzz_targets/rustdoc_adapter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_output"
path = "fuzz_targets/metadata_output.rs"
test = false
doc = false
bench = false
