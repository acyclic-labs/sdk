[package]
license.workspace = true
name = "sdk-docs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Deterministic Rust-owned versioned SDK documentation data"

[package.metadata.bazel]
test-workers = 1
# The rustdoc-profile tests select the host rustup toolchains.
test-env-inherit = ["PATH", "RUSTUP_HOME", "CARGO_HOME"]

[package.metadata.bazel.test-tools.sdk_docs_test]
CARGO = "//:toolchain_cargo"
rustc = "//:rustc"
rustup = "@sdk_compilers//:rustup"

[package.metadata.bazel.test-data.sdk_docs_test]
workspace-manifests = "//:workspace-manifests"

[features]
model-checking = []
test-support = ["acyclic-native-runtime/test-support"]

[dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
sdk-file-identity = { path = "file-identity" }
cargo_metadata = "=0.23.1"
public-api = "=0.52.2"
rustdoc-types = "=0.61.0"
schemars = { workspace = true }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ring = "=0.17.14"
tempfile = "=3.27.0"

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
hex.workspace = true
sha2 = "0.11.1"
proptest = "1.11.0"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
