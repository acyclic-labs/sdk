[package]
name = "sdk-docs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Deterministic Rust-owned versioned SDK documentation data"

[workspace]

[features]
test-support = []

[dependencies]
sdk-file-identity = { path = "file-identity" }
cargo_metadata = "=0.23.1"
public-api = "=0.52.2"
rustdoc-types = "=0.60.0"
schemars = "=1.2.2"
semver = "=1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
ring = "=0.17.14"
tempfile = "=3.27.0"

[dev-dependencies]
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(acyclic_sdk_docs_loom)'] }
