[package]
name = "sdk-docs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
publish = false
description = "Reproducible Rust-owned SDK and documentation bundle prototype"
readme = "README.md"

[workspace]

[dependencies]
blake3 = "1.8.2"
sdk-source-identity = { path = "../sdk-source-identity" }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints.rust]
unsafe_code = "deny"
