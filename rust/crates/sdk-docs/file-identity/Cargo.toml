[package]
name = "sdk-file-identity"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
