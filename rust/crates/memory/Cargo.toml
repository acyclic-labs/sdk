[package]
name = "acyclic-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Deterministic in-memory provider profile for the Acyclic SDK"
readme = "README.md"
documentation = "https://docs.rs/acyclic-memory"
keywords = ["sdk", "testing", "memory"]
categories = ["development-tools::testing"]

[dependencies]
acyclic-fs = { version = "=0.1.0", path = "../filesystem" }
acyclic-machines = { version = "=0.1.0", path = "../machines" }
acyclic-objects = { version = "=0.1.0", path = "../objects" }
acyclic-stream = { version = "=0.1.0", path = "../stream" }

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
