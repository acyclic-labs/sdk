[package]
autotests = false
name = "acyclic-harness-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer-independent prompt editor and ratatui input widget"

[features]
model-checking = ["dep:loom"]

[build-dependencies]
serde_json.workspace = true

[dependencies]
loom = { version = "0.7.3", optional = true }
acyclic-markdown = { version = "=0.2.0", path = "../markdown" }
serde = { workspace = true }
vte = { version = "0.15" }
caseless = { version = "0.2.2" }
arrayvec = { version = "0.7" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
zeroize = { workspace = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
serde_json = { workspace = true }
shell-words = { version = "1.1" }
tempfile = { version = "3.27" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
proptest.workspace = true
alacritty_terminal = "0.26"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "termios"] }
signal-hook = { version = "0.4" }

[target.'cfg(target_vendor = "apple")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["event"] }


[target.'cfg(unix)'.dev-dependencies]
futures.workspace = true
rustix = { workspace = true, features = ["process"] }
rustix-openpty = "0.2"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

# These suites acquire the process-wide terminal owner, including asserted
# real-device costs. Keep them isolated from the ordinary tests.

[[test]]
name = "terminal_negotiation"
path = "tests/terminal_negotiation.rs"

[[test]]
name = "terminal_frames"
path = "tests/terminal_frames.rs"
