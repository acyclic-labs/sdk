[package]
name = "acyclic-harness-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer-independent prompt editor and ratatui input widget"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:serde_json", "dep:image", "dep:shell-words", "dep:tempfile", "dep:arrayvec", "dep:caseless"]

[dependencies]
caseless = { version = "0.2.2", optional = true }
arrayvec = { version = "0.7", optional = true }
unicode-segmentation = "1.12"
unicode-width = "0.2"
ratatui = { version = "0.30", default-features = false, optional = true }
crossterm = { version = "0.28", optional = true }
serde_json = { workspace = true, optional = true }
shell-words = { version = "1.1", optional = true }
tempfile = { version = "3.27", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }

[dev-dependencies]
allocation-counter = "=0.8.1"
proptest.workspace = true

[lints]
workspace = true
