[package]
autotests = false
name = "acyclic-harness-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer-independent prompt editor and ratatui input widget"

[features]
model-checking = ["dep:loom"]

[dependencies]
acyclic-harness-tui-core = { version = "=0.2.0", path = "../harness-tui-core" }
acyclic-harness-tui-editor-io = { version = "=0.2.0", path = "../harness-tui-editor-io" }
acyclic-harness-tui-terminal = { version = "=0.2.0", path = "../harness-tui-terminal" }
futures.workspace = true
loom = { version = "0.7.3", optional = true }
acyclic-markdown = { version = "=0.2.0", path = "../markdown" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
zeroize = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }

[dev-dependencies]
acyclic-test-support = { path = "../test-support" }
proptest.workspace = true
alacritty_terminal = "0.26"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
shell-words = "1.1"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "termios"] }
signal-hook = { version = "0.4" }

[target.'cfg(target_vendor = "apple")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["event"] }


[target.'cfg(unix)'.dev-dependencies]
futures.workspace = true
rustix = { workspace = true, features = ["process"] }
rustix-openpty = "0.2"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
