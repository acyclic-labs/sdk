[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "conformance/**"]
name = "acyclic-objects"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Content-addressed blob contract with gRPC, HTTP, memory, local and S3 providers"
readme = "README.md"
documentation = "https://docs.rs/acyclic-objects"
keywords = ["objects", "storage", "grpc"]
categories = ["api-bindings", "filesystem"]


[[bench]]
name = "objects"
harness = false
required-features = ["local"]

[features]
# Request accounting over `acyclic_stream::testing::Counted`.
conformance = ["acyclic-stream/conformance"]
test-support = ["acyclic-native-runtime/test-support", "acyclic-stream/test-support"]
default = ["grpc"]
grpc = ["acyclic-auth/grpc", "dep:tonic", "dep:tonic-prost", "dep:rustls", "tokio/time"]
json = ["dep:acyclic-protobuf-json", "dep:prost-reflect", "dep:serde_json"]
http = ["json", "dep:reqwest", "reqwest/http2", "tokio/time"]
local = ["dep:libc", "tokio/rt"]
s3 = ["dep:object_store", "dep:reqwest-s3", "dep:quick-xml", "dep:rustls", "tokio/rt", "tokio/macros"]

[dependencies]
acyclic-protobuf-json = { version = "=0.2.0", path = "../protobuf-json", optional = true }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
pin-project-lite = "0.2.16"
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
async-trait.workspace = true
blake3 = "1.8.2"
bytes.workspace = true
futures.workspace = true
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
hex.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2.175", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"], optional = true }
quick-xml = { version = "0.41.0", optional = true }
# object_store uses reqwest 0.13; keep its TLS provider aligned with the SDK.
reqwest-s3 = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
tonic = { version = "0.14.6", features = ["tls-ring"], optional = true }
tonic-prost = { workspace = true, optional = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true, optional = true }
tracing.workspace = true
rustls = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
divan.workspace = true
hyper-util.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "macros", "rt", "time", "test-util"] }
tower = { workspace = true, features = ["util"] }

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
