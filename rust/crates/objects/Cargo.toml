[package]
name = "acyclic-objects"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Immutable Objects contract, gRPC client, and bounded in-memory provider"

[features]
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost"]

[dependencies]
async-trait.workspace = true
blake3 = "1.8.2"
bytes.workspace = true
futures.workspace = true
prost.workspace = true
prost-types = "0.14.4"
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { workspace = true, optional = true }

[lints]
workspace = true
