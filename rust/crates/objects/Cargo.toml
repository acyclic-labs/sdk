[package]
name = "acyclic-objects"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Immutable Objects contract with gRPC, memory, and durable local providers"

[features]
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost"]
local = ["dep:fs2", "dep:libc", "tokio/rt-multi-thread"]

[dependencies]
async-trait.workspace = true
blake3 = "1.8.2"
bytes.workspace = true
futures.workspace = true
fs2 = { workspace = true, optional = true }
prost.workspace = true
prost-types = "0.14.4"
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2.175", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }
