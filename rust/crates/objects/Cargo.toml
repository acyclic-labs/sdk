[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "conformance/**"]
name = "acyclic-objects"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Content-addressed blob contract with gRPC, HTTP, memory, local and S3 providers"
readme = "README.md"
documentation = "https://docs.rs/acyclic-objects"
keywords = ["objects", "storage", "grpc"]
categories = ["api-bindings", "filesystem"]


[[bench]]
name = "objects"
harness = false

[[bin]]
name = "objects-rpc-inventory"
path = "src/bin/objects-rpc-inventory.rs"
test = false
[features]
# The original JavaScript request owner over canonical binary messages.
javascript = ["acyclic-auth/javascript", "acyclic-stream/js-bytes", "dep:wasm-bindgen"]
# Request accounting over `acyclic_stream::testing::Counted`.
conformance = ["acyclic-stream/conformance"]
test-support = ["acyclic-auth/test-support", "acyclic-native-runtime/test-support", "acyclic-stream/test-support"]

[dependencies]
acyclic-observability = { version = "=0.2.0", path = "../observability" }
acyclic-contract-derive = { version = "=0.2.0", path = "../contract-derive" }
acyclic-protobuf-json = { version = "=0.2.0", path = "../protobuf-json" }
acyclic-auth = { version = "=0.2.0", path = "../auth" }
pin-project-lite = "0.2.16"
http-body = { version = "1" }
acyclic-stream = { version = "=0.2.0", path = "../stream", default-features = false }
async-trait.workspace = true
blake3 = "1.8.2"
bytes.workspace = true
futures.workspace = true
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
hex.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
thiserror.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync", "time", "rt", "macros"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2.175" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", features = ["grpc"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
quick-xml = { version = "0.41.0" }
# object_store uses reqwest 0.13; keep its TLS provider aligned with the SDK.
reqwest-s3 = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
tonic = { workspace = true, default-features = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime" }
reqwest = { workspace = true, features = ["http2"] }
tracing.workspace = true
rustls = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
acyclic-native-runtime = { version = "=0.2.0", path = "../native-runtime", features = ["test-support"] }
acyclic-test-support = { path = "../test-support" }
tempfile = "3.27.0"
http-body-util = "0.1"
axum.workspace = true
divan.workspace = true
hyper-util.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[dev-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "macros", "rt", "time", "test-util"] }

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
