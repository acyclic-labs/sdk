syntax = "proto3";

package acyclic.objects.v1;

import "validation/v1/options.proto";

option go_package = "github.com/acyclic-labs/sdk/go/gen/objects/v1;objectsv1";

// Account-scoped, content-addressed blobs. The caller's verified account is the
// whole namespace: equal bytes in two accounts are two blobs, and no operation
// discloses existence outside the caller's account.

// BLAKE3-256 of a blob's stored bytes. For a manifest those bytes are its
// canonical encoding; for a plain blob they are the logical bytes themselves.
message Digest {
  bytes blake3 = 1 [(acyclic.validation.v1.nonzero_fixed_bytes) = 32];
}
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_BLOB = 1;
  KIND_MANIFEST = 2;
}
// The envelope: everything the store knows besides the payload. Outgoing
// references live here, outside the payload, so collection never decodes it.
message BlobInfo {
  Digest digest = 1;
  Kind kind = 2;
  // Logical length: the payload for a blob, the sum of parts for a manifest.
  uint64 length = 3;
  repeated Digest references = 4;
}
// A verified acknowledgement. Its length was compared with the stored envelope
// in the caller's own account under the caller's current grant.
message Verified {
  Digest digest = 1;
  uint64 length = 2;
}
// Created and AlreadyExists are durable. Unknown means the outcome could not be
// determined; repeating the identical put is always safe.
message PutResponse {
  oneof outcome {
    Verified created = 1;
    Verified already_exists = 2;
    bool unknown = 3;
  }
}
message PutBlobRequest {
  // Expected digest; the service rejects a body hashing to anything else.
  Digest digest = 1;
  bytes body = 2;
  // Typed edges recorded in the envelope. Every target must already exist.
  repeated Digest references = 3;
}
message Part {
  Digest digest = 1;
  uint64 length = 2;
}
// Ordered parts concatenate to the logical bytes. Edges are extra references
// the manifest keeps alive without contributing bytes.
message Manifest {
  repeated Part parts = 1 [(acyclic.validation.v1.min_items) = 1];
  repeated Digest edges = 2;
}
message PutManifestRequest {
  Manifest manifest = 1;
}
// Half-open logical range [start, end). An absent end selects to the last byte.
message ByteRange {
  uint64 start = 1;
  optional uint64 end = 2;
}
message GetBlobRequest {
  Digest digest = 1;
  ByteRange range = 2;
  // Largest selection the caller accepts; larger is QUOTA_EXCEEDED.
  uint64 maximum_bytes = 3;
}
message GetBlobResponse {
  BlobInfo info = 1;
  uint64 start = 2;
  bytes body = 3;
}
message HeadBlobRequest {
  Digest digest = 1;
}
message DeleteBlobRequest {
  Digest digest = 1;
}
enum DeleteStatus {
  DELETE_STATUS_UNSPECIFIED = 0;
  DELETE_STATUS_DELETED = 1;
  DELETE_STATUS_ABSENT = 2;
  // A retained root or another blob still references it; nothing changed.
  DELETE_STATUS_REFERENCED = 3;
}
message DeleteBlobResponse {
  DeleteStatus status = 1;
}
// Ascending digest order strictly after `after`. A blob present for the whole
// traversal is returned exactly once; one put or deleted meanwhile may or may
// not appear. A short page is not the end: only an absent `next` is.
message ListBlobsRequest {
  Digest after = 1;
  uint32 limit = 2;
}
message ListBlobsResponse {
  repeated Digest digests = 1;
  Digest next = 2;
}
// A retained root, typically one stream's retained records. Retaining appends
// one exact reference batch atomically; releasing drops every batch.
message RetainRequest {
  bytes root = 1 [(acyclic.validation.v1.nonempty_max_bytes) = 1024];
  repeated Digest references = 2 [(acyclic.validation.v1.min_items) = 1];
}
message RetainResponse {
  uint64 references = 1;
}
message ReleaseRequest {
  bytes root = 1 [(acyclic.validation.v1.nonempty_max_bytes) = 1024];
}
message ReleaseResponse {
  bool existed = 1;
}
message CollectRequest {}
message CollectResponse {
  uint64 epoch = 1;
  uint64 marked = 2;
  uint64 swept = 3;
  uint64 swept_bytes = 4;
}
message UsageRequest {}
// Unique stored bytes in the caller's account; each digest counts once.
message UsageResponse {
  uint64 blobs = 1;
  uint64 unique_bytes = 2;
}
service BlobsService {
  rpc PutBlob(PutBlobRequest) returns (PutResponse) { option (acyclic.validation.v1.auth) = { action: "objects/put" resource: "objects:/blobs" }; }
  rpc PutManifest(PutManifestRequest) returns (PutResponse) { option (acyclic.validation.v1.auth) = { action: "objects/put" resource: "objects:/blobs" }; }
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse) { option (acyclic.validation.v1.auth) = { action: "objects/get" resource: "objects:/blobs" }; }
  rpc HeadBlob(HeadBlobRequest) returns (BlobInfo) { option (acyclic.validation.v1.auth) = { action: "objects/head" resource: "objects:/blobs" }; }
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse) { option (acyclic.validation.v1.auth) = { action: "objects/delete" resource: "objects:/blobs" }; }
  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse) { option (acyclic.validation.v1.auth) = { action: "objects/list" resource: "objects:/blobs" }; }
  rpc Retain(RetainRequest) returns (RetainResponse) { option (acyclic.validation.v1.auth) = { action: "objects/retain" resource: "objects:/blobs" }; }
  rpc Release(ReleaseRequest) returns (ReleaseResponse) { option (acyclic.validation.v1.auth) = { action: "objects/retain" resource: "objects:/blobs" }; }
  rpc Collect(CollectRequest) returns (CollectResponse) { option (acyclic.validation.v1.auth) = { action: "objects/collect" resource: "objects:/blobs" }; }
  rpc Usage(UsageRequest) returns (UsageResponse) { option (acyclic.validation.v1.auth) = { action: "objects/list" resource: "objects:/blobs" }; }
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  // A body hashed to another digest than the one supplied.
  ERROR_CODE_DIGEST_MISMATCH = 3;
  // A reference, part or retained digest does not exist in this account.
  ERROR_CODE_MISSING_REFERENCE = 4;
  // An existing blob has other envelope references than this put.
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_QUOTA_EXCEEDED = 6;
  ERROR_CODE_UNSUPPORTED = 7;
  ERROR_CODE_UNAVAILABLE = 8;
  ERROR_CODE_ACCESS_DENIED = 9;
  ERROR_CODE_RANGE_NOT_SATISFIABLE = 10;
  // Stored bytes no longer hash to their digest.
  ERROR_CODE_CORRUPT = 11;
  // A retained-root scan was incomplete; nothing was swept.
  ERROR_CODE_SUSPENDED = 12;
  // A retain or release could not be confirmed; repeating it is safe.
  ERROR_CODE_OUTCOME_UNKNOWN = 13;
}
// Customer diagnostic identity; operator topology stays in protected evidence.
message ErrorDetail {
  ErrorCode code = 1;
  string request_id = 2;
}
