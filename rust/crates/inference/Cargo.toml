[package]
name = "acyclic-inference"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for immutable Inference Contexts, recoverable Runs, and warm commitments"
readme = "README.md"
documentation = "https://docs.rs/acyclic-inference"
keywords = ["inference", "context", "grpc"]
categories = ["api-bindings"]
publish = true
build = "build.rs"

[features]
default = ["host", "http-client"]
host = ["dep:thiserror", "dep:tonic", "dep:tonic-prost", "dep:uuid", "dep:zeroize"]
http-codec = ["dep:prost-reflect", "dep:serde_json"]
http-client = ["http-codec", "dep:futures", "dep:reqwest", "dep:thiserror"]

[dependencies]
prost.workspace = true
futures = { workspace = true, optional = true }
sha2.workspace = true
prost-reflect = { workspace = true, features = ["serde"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"], optional = true }

[build-dependencies]
prost.workspace = true
prost-build.workspace = true
prost-types.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
prost-reflect.workspace = true
prost-types.workspace = true
rcgen = "0.14.10"
tokio.workspace = true
tokio-stream.workspace = true

[lints]
workspace = true
