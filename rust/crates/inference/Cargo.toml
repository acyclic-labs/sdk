[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "build/**", "vendor/**", "examples/**", "tests/**", "benches/**", "conformance/**", "fixtures/**", "fuzz/corpus/**"]
name = "acyclic-inference"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for immutable Inference Contexts, recoverable Runs, and warm commitments"
readme = "README.md"
documentation = "https://docs.rs/acyclic-inference"
keywords = ["inference", "context", "grpc"]
categories = ["api-bindings"]
publish = true
build = "build.rs"


[features]
default = ["host"]
host = ["dep:acyclic-auth", "dep:thiserror", "dep:tonic", "dep:tonic-prost", "dep:uuid", "dep:zeroize"]
http-codec = ["dep:prost-reflect", "dep:serde_json"]

[dependencies]
acyclic-auth = { version = "=0.2.0", path = "../auth", optional = true }
prost.workspace = true
sha2.workspace = true
prost-reflect = { workspace = true, features = ["serde"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }

[dev-dependencies]
proptest.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
tokio.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-stream.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
