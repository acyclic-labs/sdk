[package]
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "proto/**", "examples/**", "tests/**", "benches/**", "fuzz/corpus/**"]
name = "acyclic-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared capability chain contract and verification"


[features]
js-credential = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
grpc = ["dep:tonic", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio"]
test-support = ["dep:acyclic-differential"]

[dependencies]
acyclic-differential = { version = "=0.2.0", path = "../differential", optional = true }
acyclic-contract-derive = { version = "=0.2.0", path = "../contract-derive" }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
futures.workspace = true
prost.workspace = true
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url = "=2.5.8"
zeroize.workspace = true
ts-rs = "=12.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
arc-swap = "=1.9.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["AbortController", "AbortSignal", "Event", "EventTarget"], optional = true }

[dev-dependencies]
acyclic-differential = { version = "=0.2.0", path = "../differential" }
serde_json.workspace = true
acyclic-test-support = { path = "../test-support" }
syn = { version = "3", features = ["full"] }
proptest.workspace = true
prost-reflect.workspace = true
tempfile = "3.27.0"
prost-types.workspace = true
tonic-prost.workspace = true
protoc-bin-vendored = "=3.3.0"

[lints]
workspace = true

[[bench]]
name = "verify"
harness = false

[[bench]]
name = "revocation"
harness = false

[[bench]]
name = "credential"
harness = false

[build-dependencies]
acyclic-proto-build = { version = "=0.2.0", path = "../../../compatibility" }
