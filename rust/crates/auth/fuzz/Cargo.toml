[package]
name = "acyclic-auth-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
syn = { version = "3", features = ["full"] }
libfuzzer-sys = "0.4"
prost = "0.14.4"
acyclic-auth = { path = ".." }

[[bin]]
name = "capability"
path = "fuzz_targets/capability.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorization"
path = "fuzz_targets/authorization.rs"
test = false
doc = false
bench = false

[workspace]
